.tagline{display:flex;align-items:center;gap:4px;margin-top:3px;flex-wrap:wrap}
.tag{font-size:10px;padding:2px 8px;border-radius:99px;white-space:nowrap}
.tag.ops{background:var(--card-2);color:var(--ink-3)}
.tag.goal{background:var(--ok-soft);color:var(--ok)}
.tag.inv{background:var(--accent-soft);color:var(--accent)}
.tag.cat{background:var(--gold-soft);color:var(--gold)}
/* عقد الالتزام */
.creditor{font-size:13px;font-weight:600;color:var(--ink-2)}
.dprog{padding:6px 0 2px}
.dbar{display:block;height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.dbar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.dtx{display:block;font-size:11px;color:var(--ink-3);margin-top:5px}
.dtx b{font-family:"IBM Plex Mono",monospace;color:var(--ink-2);font-weight:600}
.dtx b.rem{color:var(--warn)}
.apanel{background:var(--card-2);border-bottom:1px solid var(--line);padding:8px 16px 12px}
.apanel .lab{margin-bottom:6px}
.arow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0}
.arow .al{flex:none;min-width:44px;font-size:11px;color:var(--ink-3)}
.arow .chips{gap:4px}
.arow .chip.sm{padding:2px 8px;font-size:11px;border-width:1px}
.arow .ni.s{width:80px;font-size:13px;padding:4px 4px}
.ahint{font-size:10px;color:var(--ink-3);padding:0 0 4px;line-height:1.6}
.salpill{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--ok-soft);
  color:var(--ok);font-weight:600;white-space:nowrap}
.spentpill{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;color:var(--warn)}
.abtns{display:flex;gap:4px;flex-wrap:wrap;margin-top:9px}
.srcpick{margin-top:10px;padding-top:12px;border-top:1px dashed var(--line)}
.srcpick .lab{margin-bottom:6px}
.itemacct{font-family:"IBM Plex Mono",monospace;font-size:10px;padding:2px 4px;
  border-radius:99px;background:var(--card-2);color:var(--ink-3);margin-inline-start:6px}

/* ══ تبويب السنة ══ */
.yrow{display:grid;grid-template-columns:64px minmax(0,1fr) 78px;gap:12px;align-items:center;
  padding:8px 16px;border-bottom:1px solid var(--line)}
.yrow:last-child{border-bottom:0}
.yrow.now{background:var(--accent-soft)}
.yrow .ym{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-2)}
.yrow.now .ym{color:var(--accent);font-weight:600}
.ybars{display:flex;flex-direction:column;gap:2px}
.ybar{height:7px;border-radius:99px;background:var(--track);overflow:hidden;display:block}
.ybar i{display:block;height:100%;border-radius:99px}
.yrow .ys{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;text-align:left}
.yrow .ys s{display:block;text-decoration:none;font-size:10px;color:var(--ink-3);font-weight:400}
.yrow.empty{opacity:.4}
.ylegend{display:flex;gap:16px;flex-wrap:wrap;padding:12px 16px;font-size:11px;
  color:var(--ink-3);background:var(--card-2);border-bottom:1px solid var(--line)}
.ylegend span{display:flex;align-items:center;gap:4px}
.ylegend i{width:14px;height:6px;border-radius:99px;display:block}

.ygrid{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ygrid table{border-collapse:collapse;font-size:13px;width:100%;min-width:560px}
.ygrid th,.ygrid td{padding:8px 8px;text-align:center;white-space:nowrap;
  border-bottom:1px solid var(--line)}
.ygrid thead th{font-size:10px;color:var(--ink-3);font-weight:500;background:var(--card-2);
  position:sticky;top:0}
.ygrid .cn{text-align:right;position:sticky;inset-inline-start:0;background:var(--card);
  z-index:2;min-width:104px;max-width:104px;overflow:hidden;text-overflow:ellipsis;
  font-size:13px}
.ygrid thead .cn{background:var(--card-2);z-index:3}
.ygrid tbody tr:hover .cn{background:var(--card-2)}
.ygrid .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.ygrid .z{color:var(--ink-3);opacity:.4}
.ygrid .tot{font-weight:600;background:var(--card-2)}
.ygrid tfoot td{font-weight:600;background:var(--card-2);border-bottom:0}
.ygrid .hot{color:var(--warn);font-weight:600}
.yhint{padding:8px 16px;font-size:11px;color:var(--ink-3);background:var(--card-2);
  border-bottom:1px solid var(--line)}
.tl{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.tl:last-child{border-bottom:0}
.tl .tm{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);
  flex:none;min-width:62px}
.tl .tn{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl .tv{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;color:var(--warn)}

/* ══ جدول الخطة ══ */
.ptab{display:grid;grid-template-columns:minmax(0,1fr) 58px 58px 60px;gap:4px;
  align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.ptab.head{background:var(--card-2);padding:8px 12px;font-size:10px;color:var(--ink-3);
  position:sticky;top:0;z-index:2}
.ptab.head span{text-align:center}
.ptab.head span:first-child{text-align:right}
.ptab .pn{display:flex;align-items:center;gap:8px;min-width:0}
.ptab .pn .pi{width:26px;height:26px;border-radius:10px;flex:none;display:flex;
  align-items:center;justify-content:center;font-size:13px}
.ptab .pnm{min-width:0;flex:1}
.ptab .pnm b{font-size:13px;font-weight:500;display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.ptab .pnm s{text-decoration:none;font-size:10px;color:var(--ink-3);display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptab .ptrack{display:block;height:3px;border-radius:99px;background:var(--track);
  overflow:hidden;margin-top:4px}
.ptab .ptrack i{display:block;height:100%;border-radius:99px}
.ptab .pv{font-family:"IBM Plex Mono",monospace;font-size:13px;text-align:center;
  font-variant-numeric:tabular-nums;color:var(--ink-2)}
.ptab .pv.plan{font-weight:600;color:var(--ink)}
.ptab .pv.neg{color:var(--warn);font-weight:600}
.ptab .pv.dim{opacity:.35}
.ptab.foot{background:var(--card-2);border-bottom:0;font-weight:600}
.ptab.foot .pv{color:var(--ink);font-weight:600}
.ptab.tap{cursor:pointer}
.ptab.tap:hover{background:var(--card-2)}
.ptab.zero .pnm b{color:var(--ink-3);font-weight:400}
.carrybtn{border:0;background:var(--ok-soft);color:var(--ok);border-radius:99px;
  font-size:10px;padding:2px 8px;cursor:pointer;margin-inline-start:5px;
  font-family:"IBM Plex Mono",monospace;white-space:nowrap}
.carrybtn.neg{background:var(--warn-soft);color:var(--warn)}
.carrybtn:hover{filter:brightness(1.15)}
/* شريط الترتيب — يعلو الجدول */
.sortbar{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:8px 12px;
  background:var(--card-2);border-bottom:1px solid var(--line)}
.sortbar .sl{font-size:11px;color:var(--ink-3);margin-inline-end:4px}
.sortbar .chip{padding:2px 12px;font-size:11px;border-width:1px}
/* صفّ البنود غير المستعملة */

/* ══ الإدخال السريع ══ */
.modesw{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:4px;margin-bottom:14px;box-shadow:var(--shadow)}
.modesw button{flex:1;border:0;background:transparent;color:var(--ink-3);cursor:pointer;
  border-radius:10px;padding:8px 8px;font-size:13px;font-family:inherit}

.fitbar{border-radius:16px;padding:16px 16px;margin-bottom:14px;border:1px solid var(--line)}
.fitbar.down{background:var(--warn-soft);border-color:var(--warn)}
.fitbar.up{background:var(--ok-soft);border-color:var(--ok)}
.fitbar .ft b{font-size:15px;font-weight:600;display:block}
.fitbar.down .ft b{color:var(--warn)}
.fitbar.up .ft b{color:var(--ok)}
.fitbar .ft s{text-decoration:none;font-size:13px;color:var(--ink-2);display:block;margin-top:3px}
.fitbar .ft s b{font-family:"IBM Plex Mono",monospace;display:inline;font-size:13px;color:var(--ink)}
.fitbar .fh{font-size:11px;color:var(--ink-3);margin-top:10px;line-height:1.75}
.fitbar .fh b{color:var(--ink-2);font-weight:600}
.hintnote.gcard{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
margin:0 15px 12px;line-height:1.7}
.hintnote.gcard b{color:var(--ink)}
.mrow.subh{padding-top:14px;margin-top:5px;border-top:1px solid var(--line)}
.mrow.subh .mn{font-weight:700;color:var(--ink)}
.card>.mrow.subh:first-child{border-top:0;margin-top:0;padding-top:0}
.qok{width:22px;height:22px;flex:none;margin-inline-end:7px;border-radius:99px;
border:1px solid var(--line);background:transparent;color:var(--ink-3);
font-size:12px;line-height:1;cursor:pointer;display:inline-flex;
align-items:center;justify-content:center;transition:.12s}
.qok:hover{border-color:var(--ok);color:var(--ok)}
.qok.on{background:var(--ok);border-color:var(--ok);color:#fff}
.qtab.qsub .qok{width:19px;height:19px;font-size:11px}
/* حبّةُ الفروع: عددُها ظاهرٌ وعلامتُها تدور حين تُفتح */
.qtab .qsx{display:inline-flex;align-items:center;gap:4px;margin-inline-start:7px;
border:1px solid var(--line);background:transparent;color:var(--ink-3);
font:600 10px/1 inherit;padding:4px 8px;border-radius:99px;cursor:pointer;
vertical-align:middle;transition:.14s}
.qtab .qsx>i{font-style:normal;font-size:8px;line-height:1;display:inline-block;
transition:transform .18s}
/* الصفُّ كلُّه بابٌ: الاسمُ والوصفُ وما بينهما — لا العددُ وحدَه */
.qtab .qt.has{cursor:pointer;border-radius:10px;margin-inline-start:-6px;
padding:3px 6px;transition:background .14s}
.qtab .qt.has:hover{background:var(--card-2)}
.qtab .qt.has:hover .qsx{border-color:var(--accent);color:var(--accent);
background:var(--accent-soft)}
/* والسهمُ حبّةٌ كحبّات التطبيق — يدور فيُعلم أنّه فُتح */
.qtab .qsx{gap:5px;padding:3px 7px 3px 5px}
.qtab .qsx>em{font-style:normal;font-family:"IBM Plex Mono",monospace;
font-size:10px;opacity:.75}
.qtab .qsx.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.qtab .qsx.on>i{transform:rotate(-180deg)}
/* لوحُ الفروع: مُزاحٌ عن أبيه، له عمودٌ في جهة الاسم يجمعه */
.qtab.qsub{background:var(--card-2);font-size:12px;
border-inline-start:2px solid var(--accent);
animation:qsubIn .18s ease-out both}
.qtab.qsub .qn{padding-inline-start:22px}
.qtab.qsub .qt b{font-weight:600;color:var(--ink-2)}
.qtab.qsub.rest{border-top:1px dashed var(--line);background:transparent}
.qtab.qsub.rest .qt b{color:var(--ink-3);font-weight:500}
.qtab.qsub.rest .qv{color:var(--ink-3);opacity:1}
@keyframes qsubIn{from{opacity:0;transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){
  .qtab.qsub{animation:none}
  .qtab .qsx>i{transition:none} }

/* سجلُّ التعديلات: كم كان · وكم صار · ومتى */

  align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}

      /* المبلغ الكامل مقسوماً على دورته — كالموسميّ ودورتُه مختارة */
      var o2 = key ? planOvr(mk) : null;
      if(o2 && o2[key] !== undefined) return num(o2[key]);
      var ev = Math.max(1, Math.round(num(x.every) || 12));
      return Math.round(num(x.full) / ev);
    }
    return rawP(x, mk, key);
  }
  function typePill(x, mk){
    var t = typeOf(x);
    /* المدّة تُقال قبل النوع: من رأى «هذا الشهر» عرف لماذا يختفي غداً */
    if(x.off) return '<span class="tpill tp-done">موقوف</span>';
    if(x.until && x.from && x.from === x.until)
      return '<span class="tpill tp-inst">' + esc(mName(x.until)) + ' وحده</span>';
    if(t === "cycle")
      return '<span class="tpill tp-seas">كلّ ' + (num(x.every) || 12) + ' شهر'
        + (x.due ? (' · ' + esc(mName(x.due))) : "") + '</span>';
    if(t === "pct")
      return '<span class="tpill tp-fix">' + esc(String(num(x.pct))) + '٪ من دخلك</span>';
    if(t === "cap")
      return '<span class="tpill tp-var">سقف ' + fmt(capOf(x)) + '</span>';
    if(t === "var") return "";
    if(t === "inst" && instDone(x, mk))
      return '<span class="tpill tp-done">انتهى</span>';
    if(t === "inst")
      return '<span class="tpill tp-inst">قسط · '
        + (x.end ? instLeft(x, mk) : "حدّد المدة") + '</span>';
    return '<span class="tpill tp-' + t + '">' + typeInfo(t).n + '</span>';
  }
  function visibleCats(){ return state.cats.filter(function(c){ return !c.hidden; }); }

  /* ── ترتيب البنود ──
     «ترتيبك» هو ترتيبك اليدوي من الإعدادات ويبقى الافتراضي.
     البقية تُعيد الترتيب للعرض فقط — لا تمسّ ترتيبك المحفوظ. */
  var SORTS = [{ k: "manual", n: "ترتيبك" }, { k: "amount", n: "الأكبر" },
               { k: "left", n: "الأقلّ تبقّياً" }, { k: "cls", n: "التصنيف" }];
  var CLS_ORDER = { need: 0, duty: 1, want: 2 };
  function sortMode(){ return ui.sort || "manual"; }
  function orderedCats(mk){
    var list = visibleCats().slice(), m = sortMode();
    if(m === "manual") return list;
    var A = actuals(mk), av = {}, lf = {};
    list.forEach(function(c){
      av[c.k] = catPlan(c, mk) + carryOf(c, mk);
      lf[c.k] = av[c.k] - (A.by[c.k] || 0);
    });
    list.sort(function(a, b){
      if(m === "amount") return av[b.k] - av[a.k];
      if(m === "left") return lf[a.k] - lf[b.k];
      var d = (CLS_ORDER[clsOf(a)] || 0) - (CLS_ORDER[clsOf(b)] || 0);
      return d || (av[b.k] - av[a.k]);
    });
    return list;
  }
  function sortBar(extra){
    return '<div class="sortbar"><span class="sl">الترتيب</span>'
      + SORTS.map(function(x){
          return '<button class="chip sm' + (sortMode() === x.k ? " on" : "")
            + '" data-sort="' + x.k + '">' + x.n + '</button>';
        }).join("")
      + (extra || "") + '</div>';
  }
  /* بند غير مستعمل: لا خطة ولا مُرحَّل ولا صرف */
  function splitZero(list, mk){
    var A = actuals(mk), live = [], zero = [];
    list.forEach(function(c){
      var av = catPlan(c, mk) + carryOf(c, mk);
      (av || (A.by[c.k] || 0) ? live : zero).push(c);
    });
    return { live: live, zero: zero };
  }
  function zeroToggle(n){
    if(!n) return "";
    return '<div class="ptab zrow" data-zopen="1"><span class="pn">'
      + '<span class="zt">' + (ui.zopen ? "▾ " : "▸ ") + n + ' '
      + (n === 1 ? "بند غير مستعمل" : (n === 2 ? "بندان غير مستعملين" :
         (n <= 10 ? "بنود غير مستعملة" : "بنداً غير مستعمل")))
      + '</span></span></div>';
  }

  /* ── بند الاستثمار: فروعه هي المحافظ ── */
  var INVK = "invest";
  function isInvCat(c){ return c && c.k === INVK; }
  function invCat(){
    for(var i=0;i<state.cats.length;i++) if(state.cats[i].k === INVK) return state.cats[i];
    return null;
  }
  function invMonthly(){
    var t = 0;
    state.invest.forEach(function(v){ t += num(v.m); });
    return t;
  }
  function invCap(mk){
    var c = invCat();
    return c ? catCap(c, mk || ui.month) : Infinity;
  }
  function invFree(mk, exceptId){
    var c = invCat();
    if(!c) return Infinity;
    var others = 0;
    state.invest.forEach(function(v){ if(v.id !== exceptId) others += num(v.m); });
    return Math.max(0, catCap(c, mk || ui.month) - others);
  }
  /* يمنع تجاوز سقف الاستثمار الشهري */
  function clampInv(v){
    var c = invCat(), room = invFree(ui.month, v.id);
    if(!c || room === Infinity || num(v.m) <= room) return false;
    var cap = catCap(c, ui.month), want = num(v.m);
    overCapDlg({
      catName: c.n, lineName: v.n, cap: cap, others: cap - room, room: room, want: want,
      raise: function(){
        if(hasOvr(ui.month)) setP(ui.month, c.k, (cap - room) + want);
        else c.p = (cap - room) + want;
      },
      clampIt: function(){ v.m = room; }
    });
    return true;
  }
  /* فروع البند: محافظ للاستثمار، وبنود فرعية لغيره */
  function catBranches(c){ return isInvCat(c) ? state.invest : (c.subs || []); }

  /* ميزانية البند سقف — الفروع تقتسمها ولا تتجاوزها */
  function subsSum(c, mk){
    if(isInvCat(c)) return invMonthly();
    var s = 0;
    (c.subs || []).forEach(function(x){ s += linePlan(x, mk, lineKey(c.k, x.id)); });
    return s;
  }
  function catCap(c, mk){ return linePlan(c, mk, c.k); }
  function catFree(c, mk){ return Math.max(0, catCap(c, mk) - subsSum(c, mk)); }
  function capOver(c, mk){ return Math.max(0, subsSum(c, mk) - catCap(c, mk)); }
  function catPlan(c, mk){
    mk = mk || ui.month;
    return Math.max(catCap(c, mk), subsSum(c, mk));
  }

  /* ── مواءمة الخطة مع راتب الشهر ── */
  /* الأرقام الأساسية: من البند نفسه لا من تعديل الشهر */
  function baseCat(c){
    var sm = 0;
    if(isInvCat(c)) sm = invMonthly();
    else (c.subs || []).forEach(function(x){ sm += num(x.p); });
    return Math.max(num(c.p), sm);
  }
  function baseCost(){
    var t = 0;
    visibleCats().forEach(function(c){ t += baseCat(c); });
    activeGoals().forEach(function(g){ t += (isDone(g) ? 0 : num(g.m)); });
    return t;
  }
  /* البنود التي لا تُقلَّص: ثابت · قسط · موسمي — التزامات لا تتفاوض */
  function isRigid(c){
    var t = typeOf(c);
    return !isInvCat(c) && (t === "fix" || t === "inst" || t === "seas");
  }
  function rigidCost(){
    var t = 0;
    visibleCats().forEach(function(c){ if(isRigid(c)) t += baseCat(c); });
    return t;
  }
  /* نسبة المواءمة المقترحة */
  function fitRatio(mk, mode){
    var inc = income(mk), base = baseCost();
    if(base <= 0) return 1;
    if(mode !== "smart") return inc / base;
    var rig = rigidCost(), flex = base - rig;
    if(flex <= 0) return 1;
    return Math.max(0, (inc - rig) / flex);
  }
  /* يكتب أرقام هذا الشهر وحده — الخطة الأساسية تبقى كما هي */
  function fitPlan(mk, mode){
    var m = month(mk), r = fitRatio(mk, mode), touched = 0;
    m.plan = {};
    if(!m.gm) m.gm = {}; else m.gm = {};
    visibleCats().forEach(function(c){
      if(mode === "smart" && isRigid(c)) return;      /* يبقى كما هو */
      var f = Math.max(0, Math.round(num(c.p) * r));
      m.plan[c.k] = f;
      (c.subs || []).forEach(function(x){
        m.plan[lineKey(c.k, x.id)] = Math.max(0, Math.round(num(x.p) * r));
      });
      touched++;
    });
    activeGoals().forEach(function(g){
      if(isDone(g)) return;
      m.gm[g.id] = Math.max(0, Math.round(num(g.m) * r));
      touched++;
    });
    return { ratio: r, n: touched };
  }

  /* ── ترحيل الفائض (المرحلة ٤) ── */
  /* كل بند ظرف مستقل: ما لم يُصرف ينتقل للشهر التالي دائماً */
  /* all الكل · neg السالب وحده · none لا شيء */
  function carryMode(){
    var m = state.carryMode;
    return (m === "neg" || m === "none") ? m : "all";
  }
  function carryOf(c, mk){
    var mode = carryMode();
    if(mode === "none") return 0;
    var keys = Object.keys(state.months).sort(), carry = 0;
    for(var i=0;i<keys.length;i++){
      var k = keys[i];
      if(k >= mk) break;
      var m = state.months[k];
      if(!m || !m.items || !m.items.length) continue;   /* شهر بلا حركة لا يُرحِّل */
      var act = 0;
      m.items.forEach(function(it){ if(it.c === c.k) act += num(it.a); });
      carry = (catPlan(c, k) + carry) - act;
      /* «السالب وحده» يُقصّ في كل خطوة لا في النهاية — وإلا تراكم
         الفائض في الطريق ثم قُصّ، فأعطى رقماً لا معنى له. */
      if(mode === "neg" && carry > 0) carry = 0;
    }
    return Math.round(carry);
  }
  function effPlan(c, mk){ return catPlan(c, mk) + carryOf(c, mk); }

  /* ══ أمان الأثر الرجعي ══
     أيّ تعديل على شهر ماضٍ ينزلق إلى كل شهر بعده عبر الترحيل.
     carryImpact تُرجع الأشهر التي سيتغيّر رصيدها ومقدار التغيّر — تُحسب
     بمقارنة الرصيد الحالي بالرصيد بعد تطبيق التعديل مؤقّتاً ثم التراجع. */
  function laterMonths(mk){
    return Object.keys(state.months).sort().filter(function(k){ return k > mk; });
  }
  function carryImpact(c, mk, apply, undo){
    var later = laterMonths(mk);
    if(!later.length) return [];
    var before = later.map(function(k){ return carryOf(c, k); });
    apply();
    var after = later.map(function(k){ return carryOf(c, k); });
    undo();
    var out = [];
    later.forEach(function(k, i){
      if(after[i] !== before[i]) out.push({ mk: k, d: after[i] - before[i], to: after[i] });
    });
    return out;
  }
  function impactHTML(list){
    if(!list.length) return "";
    var show = list.slice(0, 4), rest = list.length - show.length;
    return '<div class="dlab">أشهر سيتغيّر رصيدها</div><ul class="dlist">'
      + show.map(function(x){
          return '<li><span>' + esc(mName(x.mk)) + '</span><span class="dv '
            + (x.d > 0 ? "up" : "dn") + '">' + (x.d > 0 ? "+" : "−") + fmt(Math.abs(x.d))
            + '</span></li>';
        }).join("")
      + (rest > 0 ? '<li><span>و' + arMonths(rest) + ' أخرى</span><span class="dv"></span></li>' : "")
      + '</ul>';
  }
  /* ── الشهر المُقفَل ── */
  function isLocked(mk){ var m = state.months[mk]; return !!(m && m.locked); }
  function isPast(mk){ return mk < todayKey(); }
  function lockMonth(mk, on){
    var m = month(mk);
    if(on){ m.locked = true; }
    else {
      delete m.locked;
      if(!m.reopened) m.reopened = [];
      m.reopened.push(new Date().toISOString().slice(0, 10));
    }
  }
  /* حارس مشترك: يُنفَّذ fn بعد موافقتك إن كان الشهر ماضياً أو مُقفَلاً */
  function guardEdit(mk, title, impact, fn){
    if(isLocked(mk)){
      confirmDlg("«" + mName(mk) + "» مُقفَل",
        "أقفلتَ هذا الشهر بعد أن طابقت أرصدته. فتحه يسمح بتعديله، ويُسجَّل أنه فُتح بأثر رجعي.",
        "افتحه وعدّله", function(){ lockMonth(mk, false); save(); fn(); }, true);
      return;
    }
    if(!isPast(mk) || !impact.length){ fn(); return; }
    ask({ title: title,
      msg: "هذا شهر مضى، والترحيل يجعل تعديله ينتقل إلى ما بعده.",
      fields: [],
      html: impactHTML(impact),
      ok: "نفّذ التعديل", onOk: fn });
  }
  /* من أين جاء الرصيد المرحَّل: صفّ لكل شهر سابق فيه حركة */
  function carryTrail(c, mk){
    var keys = Object.keys(state.months).sort(), out = [], carry = 0;
    for(var i=0;i<keys.length;i++){
      var k = keys[i];
      if(k >= mk) break;
      var m = state.months[k];
      if(!m || !m.items || !m.items.length) continue;
      var act = 0;
      m.items.forEach(function(it){ if(it.c === c.k) act += num(it.a); });
      var pl = catPlan(c, k), inC = Math.round(carry);
      carry = (pl + carry) - act;
      out.push({ k: k, plan: pl, spent: act, inC: inC,
                 diff: Math.round(pl - act), bal: Math.round(carry) });
    }
    return out;
  }
  /* الحساب المخصَّص للبند إن وُجد */
  function catAcct(c){ return c && c.acct ? acctOf(c.acct) : null; }
  /* كشف البند لآخر n شهراً: المخطط · صُرف · الرصيد */
  function envLedger(c, mk, n){
    var keys = Object.keys(state.months).sort().filter(function(x){ return x <= mk; });
    var carry = 0, out = [];
    for(var i=0;i<keys.length;i++){
      var kk = keys[i], m = state.months[kk], sp = 0;
      if(m && m.items) m.items.forEach(function(it){ if(it.c === c.k) sp += num(it.a); });
      var used = !!(m && m.items && m.items.length);
      var pl = catPlan(c, kk), inC = carry;
      /* شهر بلا حركة لا يراكم ميزانيته — رصيده يبقى كما دخل */
      var bal = used ? (pl + inC - sp) : inC;
      if(used) carry = bal;
      out.push({ k: kk, plan: pl, spent: sp, inC: inC, bal: bal, used: used });
    }
    return out.slice(-(n || 6));
  }
  /* نسبة تغيّر الصرف عن الشهر السابق */
  function envChange(c, mk){
    var pk = shift(mk, -1), pm = state.months[pk];
    if(!pm || !pm.items || !pm.items.length) return null;
    var prev = 0, now = 0, m = state.months[mk];
    pm.items.forEach(function(it){ if(it.c === c.k) prev += num(it.a); });
    if(m && m.items) m.items.forEach(function(it){ if(it.c === c.k) now += num(it.a); });
    if(prev === 0) return now === 0 ? { pct: 0, prev: 0, now: 0 } : null;
    return { pct: (now - prev) / prev * 100, prev: prev, now: now };
  }

  /* كل بند ظرف: ما بقي فيه = (خطة الشهر + المرحَّل) − ما صُرف */
  function envelopes(mk){
    var A = actuals(mk);
    return visibleCats().map(function(c){
      var cry = carryOf(c, mk), avail = catPlan(c, mk) + cry, sp = A.by[c.k] || 0;
      return { c: c, carry: cry, avail: avail, spent: sp, left: avail - sp,
               trail: carryTrail(c, mk) };
    }).filter(function(x){ return x.avail > 0 || x.spent > 0; });
  }

  /* ── الأقساط: كل التزام بمدّته ── */
  function allInst(mk){
    var out = [];
    state.cats.forEach(function(c){
      if(c.hidden) return;
      /* بند فيه فروع = حاوٍ وسقف، لا قسط بذاته */
      if(!(c.subs || []).length && typeOf(c) === "inst" && !instDone(c, mk) && instLeft(c, mk) > 0)
        out.push({ n: c.n, c: c, x: c, p: linePlan(c, mk, c.k), left: instLeft(c, mk), end: c.end });
      (c.subs || []).forEach(function(x){
        if(typeOf(x) === "inst" && !instDone(x, mk) && instLeft(x, mk) > 0)
          out.push({ n: c.n + " · " + x.n, c: c, x: x,
                     p: linePlan(x, mk, lineKey(c.k, x.id)), left: instLeft(x, mk), end: x.end });
      });
    });
    out.sort(function(a, b){ return a.end < b.end ? -1 : (a.end > b.end ? 1 : 0); });
    return out;
  }
  function instMonthly(mk){ var s = 0; allInst(mk).forEach(function(i){ s += i.p; }); return s; }
  function instRemain(mk){ var s = 0; allInst(mk).forEach(function(i){ s += i.p * i.left; }); return s; }
  function instFreeMonth(mk){
    var a = allInst(mk);
    if(!a.length) return null;
    var last = a[a.length - 1].end;
    return shift(last, 1);
  }
  function instBar(i, mk){
    var total = i.x.mo ? num(i.x.mo) : i.left;      /* عدد الأقساط الأصلي إن عُرف */
    if(total < i.left) total = i.left;
    var paid = total - i.left, out = "";
    for(var j = 0; j < total && j < 24; j++)
      out += '<i class="' + (j < paid ? "paid" : "left") + '"></i>';
    return '<div class="instbar">' + out + '</div>';
  }

  /* ── تحليل (المرحلة ٥) ── */
  function monthsWithData(){
    return Object.keys(state.months).filter(function(k){
      return state.months[k].items && state.months[k].items.length;
    }).sort();
  }
  function catHistory(ck, n){
    var keys = monthsWithData().slice(-(n || 6));
    return keys.map(function(k){
      var v = 0;
      state.months[k].items.forEach(function(it){ if(it.c === ck) v += num(it.a); });
      return { k: k, v: v };
    });
  }
  function catAvg(ck, n){
    var h = catHistory(ck, n || 3).filter(function(x){ return x.v > 0; });
    if(!h.length) return 0;
    var s = 0; h.forEach(function(x){ s += x.v; });
    return Math.round(s / h.length);
  }
  function sparkline(ck){
    var h = catHistory(ck, 6);
    if(h.length < 2) return "";
    var mx = 1; h.forEach(function(x){ if(x.v > mx) mx = x.v; });
    var H = 46;
    return '<div class="spark">' + h.map(function(x, i){
      return '<span class="sb"><i class="' + (i === h.length - 1 ? "last" : "") + '" style="height:'
        + Math.max(5, Math.round(x.v / mx * H)) + 'px" title="' + fmt(x.v) + '"></i>'
        + '<em>' + x.k.slice(5) + '</em></span>';
    }).join("") + '</div>';
  }
  function prevDataMonth(mk){
    var keys = monthsWithData(), out = null;
    keys.forEach(function(k){ if(k < mk) out = k; });
    return out;
  }
  function clsTotals(mk){
    var a = actuals(mk), o = { need: 0, want: 0, duty: 0 }, sum = 0;
    state.cats.forEach(function(c){
      var v = a.by[c.k] || 0;
      if(v){ o[clsOf(c)] += v; sum += v; }
    });
    o.sum = sum;
    return o;
  }
  function planByType(mk){
    mk = mk || ui.month;
    var o = { var: 0, fix: 0, seas: 0, inst: 0 };
    state.cats.forEach(function(c){
      if(c.hidden) return;
      var subs = c.subs || [];
      o[typeOf(c)] += subs.length ? catFree(c, mk) : linePlan(c, mk, c.k);
      subs.forEach(function(x){ o[typeOf(x)] += linePlan(x, mk, lineKey(c.k, x.id)); });
    });
    return o;
  }

  /* ── التسجيل التلقائي للثابت والأقساط ── */
  function autoLines(mk){
    var out = [];
    state.cats.forEach(function(c){
      if(c.hidden) return;
      var t = typeOf(c);
      var own = (c.subs || []).length ? catFree(c, mk) : linePlan(c, mk, c.k);
      if((t === "fix" || t === "inst") && own > 0)
        out.push({ c: c, s: null, a: own, n: c.n });
      (c.subs || []).forEach(function(x){
        var t2 = typeOf(x), kk = lineKey(c.k, x.id);
        if((t2 === "fix" || t2 === "inst") && linePlan(x, mk, kk) > 0)
          out.push({ c: c, s: x, a: linePlan(x, mk, kk), n: c.n + " · " + x.n });
      });
    });
    return out;
  }
  function autoDone(mk, ck, sid){
    var m = state.months[mk];
    if(!m) return false;
    for(var i=0;i<m.items.length;i++){
      var it = m.items[i];
      if(it.auto && it.c === ck && (it.s || null) === (sid || null)) return true;
    }
    return false;
  }
  function autoPending(mk){
    return autoLines(mk).filter(function(x){ return !autoDone(mk, x.c.k, x.s ? x.s.id : null); });
  }
  function autoRecord(mk){
    var p = autoPending(mk), m = month(mk), n = 0;
    p.forEach(function(x){
      var rec = { id: uid(), c: x.c.k, a: x.a, t: "سُجّل تلقائياً",
                  d: mk + "-" + pad(autoDay()), auto: true };
      if(x.s) rec.s = x.s.id;

  /* ── طبقات الخطة ──
     التزام: ثابت وأقساط وموسمي — لا تتفاوض عليها هذا الشهر.
     ادخار: بند الاستثمار (والأهداف تُحسب معه خارج الجدول).
     مرن:   ما تبقّى — وهو وحده ما تملك خفضه فعلاً. */
  function layerOf(c, mk){
    if(invCat() && c.k === INVK) return "save";
    mk = mk || ui.month;
    /* بند كـ«أقساط» نوعه متغيّر وفروعه أقساط — فالعبرة
       بموضع المال لا باسم الأب. وهو المنطق نفسه في planByType،
       فيطابق الترشيح مجاميع المراحل حرفاً. */
    var subs = c.subs || [], duty = 0, flex = 0;
    function add(t, v){
      if(t === "fix" || t === "inst" || t === "seas") duty += v; else flex += v;
    }
    add(typeOf(c), subs.length ? catFree(c, mk) : linePlan(c, mk, c.k));
    subs.forEach(function(x){ add(typeOf(x), linePlan(x, mk, lineKey(c.k, x.id))); });
    return duty > flex ? "duty" : "flex";
  }
  var LAYERS = [
    { k: "inc",  n: "دخلك" },
    { k: "duty", n: "ما لا يتفاوض" },
    { k: "save", n: "ادفع لنفسك" },
    { k: "flex", n: "ما تصرفه" }

  function layerSums(mk){
    /* تُبنى بـ layerOf نفسه الذي يرشّح الجدول، لا بـ planByType — وإلا
       دخل بند «الاستثمار» (نوعه ثابت) في الالتزامات ثم أُضيف ثانيةً في
       الادخار عبر planInv، فانتقص المرن بقدره مرّتين. */
    var duty = 0, flex = 0;
    state.cats.forEach(function(c){
      if(c.hidden) return;
      var L = layerOf(c, mk);
      if(L === "save") return;          /* بند الاستثمار يُحسب في الادخار وحده */
      if(L === "duty") duty += catPlan(c, mk); else flex += catPlan(c, mk);
    });
    return { inc: income(mk), duty: duty, save: planGoals() + planInv(), flex: flex };
  }
  function planExp(){ var s = 0; state.cats.forEach(function(c){ s += catPlan(c); }); return s; }
  function activeGoals(){ return state.goals.filter(function(g){ return !g.arch; }); }
  function planGoals(){ var s = 0; activeGoals().forEach(function(g){ s += goalMonthly(g); }); return s; }
  function planInv(){ return invMonthly(); }
  /* الاستثمار بند داخل planExp \u2014 لا يُجمع مرتين */
  function allocated(){ return planExp() + planGoals() + (invCat() ? 0 : planInv()); }
  function savedTotal(){ var s = 0; state.goals.forEach(function(g){ s += goalSaved(g); }); return s; }
  function investVal(){ var s = 0; state.invest.forEach(function(v){ s += invVal(v); }); return s; }

  /* مسار القيمة عبر الأشهر — الرقم وحده لا يقول أصاعدٌ أم هابط */

  /* صافي ما وضعتَه في محفظةٍ حتى شهرٍ ما — يُرجَع بالحركات من اليوم

  function invNetAt(v, mk){

      if(String(x.m || "") <= mk) return;      /* ما قبلَه أو فيه محسوبٌ */
      if(x.k === "in") net -= num(x.a);
      else if(x.k === "inx" || x.k === "out") net += num(x.a);

    var t = 0;

  function invVsChart(){

  /* قسمةُ مالك — تقول ما هو ولا تنصح */
  function invSplitChart(){

  /* ══ قياس الاستثمار ══

  var INVTYPES = [

  function invMngOf(v){

  /* طريقةُ المتابعة: قيمةٌ إجماليّة أو ممتلكاتٌ بكمّيّةٍ وسعر */
  function invTrack(v){ return (v && v.track === "hold") ? "hold" : "total"; }
  /* ═══ الممتلكات: كمّيّةٌ وسعرٌ وكلفة ═══
     `q` كمّيّتُك · `p` آخرُ سعرٍ كتبتَه · `c` ما دفعتَه في هذه الكمّيّة.

  /* نقدُ المحفظة: ما أودعتَه ولمّا تشترِ به */

  /* بعد كلّ تغييرٍ في الممتلكات تُكتب قيمةُ الشهر من المشتقّ لا باليد */

  /* النوعُ يُخمَّن من الاسم مرّةً — ولا يُخترع لما لا يدلّ */
  var INVGUESS = [

  /* ═══ دفترُ حركات المحفظة ═══

  /* تصحيحُ الإيداع ليس سحباً: من كتب ٧٠ ثمّ صحّحها صفراً لم يُخرج

  var INVMV = { in: "أودعت", inx: "صحّحتَ الإيداع",

  function invMoves(v){

  function invNet(v){ return money(num(v && v["in"])); }
  function invProfit(v){ return money(invVal(v) - invNet(v)); }
  function invMove(v, kind, amt, mk, note){
    if(!v) return;
    var a = money(amt);

    var L = invMoves(v);
    L.push({ t: Date.now(), m: mk || ui.month, k: kind, a: a,
             n: note ? String(note).slice(0, 40) : "" });

  }
  function invAccts(v){ return linkedTo("i:" + v.id); }
  function invValAt(v, mk){

      return any ? t : null;
    }
    var h = v.hist || {}, keys = Object.keys(h).sort(), out = null;
    for(var i=0;i<keys.length;i++){ if(keys[i] <= mk) out = num(h[keys[i]]); else break; }
    return out;
  }
  /* شراء: النقدُ يخرج والكمّيّةُ والكلفةُ تزيدان */
  function holdBuy(v, name, q, price){
    q = num(q); price = money(price);
    if(!(q > 0) || !(price > 0)) return false;
    var cost = money(q * price);
    if(cost > invCash(v)) return "cash";
    var L = invHolds(v), x = null;
    L.forEach(function(y){ if(arNorm(y.n) === arNorm(name)) x = y; });
    if(!x){ x = { id: uid(), n: String(name).trim(), q: 0, p: price, c: 0 }; L.push(x); }
    x.q = num(x.q) + q;
    x.c = money(num(x.c) + cost);
    x.p = price;
    v.cash = money(invCash(v) - cost);
    invMove(v, "buy", cost, ui.month, x.n + " × " + q);
    invSyncHold(v, ui.month);
    return true;
  }
  /* بيع: الكلفةُ تخرج بنسبة الكمّيّة المباعة، والنقدُ يعود للمحفظة */
  function holdSell(v, id, q, price){
    var x = byId(invHolds(v), id);
    if(!x) return false;
    q = num(q); price = money(price);
    if(!(q > 0) || q > num(x.q) + 1e-9) return "qty";
    var part = money(num(x.c) * q / num(x.q));   /* كلفةُ ما بِعت */
    var got = money(q * price);
    x.q = num(x.q) - q;
    x.c = money(num(x.c) - part);

    if(num(x.q) <= 1e-9) v.hold = invHolds(v).filter(function(y){ return y.id !== id; });
    v.cash = money(invCash(v) + got);
    invMove(v, "sell", got, ui.month, x.n + " × " + q);
    invSyncHold(v, ui.month);

  }
  function invPut(v, mk){ return num(distMap(mk)["i:" + v.id]); }
  /* ما سُحب من محفظةٍ في شهر — يُقرأ من دفترها */
  function invOutOf(v, mk){
    var t = 0;
    invMoves(v).forEach(function(x){
      if(x.k === "out" && x.m === mk) t += num(x.a); });
    return money(t);
  }
  function invOutAll(v){
    var t = 0;

  }
  /* السحبُ: القيمةُ تنقص وصافي ما وضعتَ ينقص — فالربحُ لا يتحرّك */
  function invWithdraw(v, amt, mk){
    var a = money(amt);
    if(!(a > 0)) return false;
    if(invFromAccts(v)) return false;      /* مالُها رصيدُ حسابها */
    if(invTrack(v) === "hold"){
      /* يُسحب من النقد — وما زاد عليه يحتاج بيعَ ممتلكٍ أوّلاً */
      if(a > invCash(v)) return "cash";

  }
  function invGainOf(v, mk){
    var now = invValAt(v, mk);
    if(now === null) return null;
    var prev = invValAt(v, shift(mk, -1));
    if(prev === null) prev = 0;
    return Math.round(now - prev - invPut(v, mk));
  }
  function invMonthsOf(v){
    var set = {}, as = invAccts(v);
    if(as.length) as.forEach(function(a){ var sn = snapOf(a); for(var k in sn) set[k] = 1; });
    else { var h = v.hist || {}; for(var k2 in h) set[k2] = 1; }
    return Object.keys(set).sort();
  }
  /* عائد مرجَّح بالزمن: يقيس المحفظة لا توقيت إيداعاتك.
     القاعدة = قيمة أول الشهر + ما أودعتَه فيه — لأن الإيداع يقع في الأول
     من الشهر فيعمل طوال الشهر مثله مثل الرصيد القديم. */
  function monthFactor(v, mk){
    var now = invValAt(v, mk);
    if(now === null) return null;
    var prev = invValAt(v, shift(mk, -1));
    if(prev === null) prev = 0;
    var base = prev + invPut(v, mk);
    if(base <= 0) return null;
    return now / base;                      /* = 1 + r · لا يكون سالباً */
  }
  function invReturn(v){
    var chain = 1, n = 0;
    invMonthsOf(v).forEach(function(mk){
      var f = monthFactor(v, mk);
      if(f === null) return;
      chain *= f; n++;
    });
    return { r: chain - 1, n: n };
  }
  function investReturn(){                    /* المحفظة كلها */
    var ms = {}, chain = 1, n = 0;
    state.invest.forEach(function(v){ invMonthsOf(v).forEach(function(k){ ms[k] = 1; }); });
    Object.keys(ms).sort().forEach(function(mk){
      var now = 0, prev = 0, put = 0, any = false;
      state.invest.forEach(function(v){
        var a = invValAt(v, mk); if(a === null) return;
        any = true; now += a;
        var b = invValAt(v, shift(mk, -1)); prev += (b === null ? 0 : b);
        put += invPut(v, mk);
      });
      if(!any) return;
      var base = prev + put;

  }
  function pctTxt(x){ return (x * 100).toFixed(1).replace(/\.0$/, "").replace("-", "−") + "٪"; }
  /* الكتابة: القيمة هي ما يُخزَّن دائماً */
  function setInvValue(v, mk, val){
    var as = invAccts(v), t = Math.max(0, num(val));
    if(as.length > 1) return false;           /* عدة حسابات: يُحدَّث كل حساب وحده */
    if(as.length === 1){
      var a = as[0];
      snapOf(a)[mk] = t;
      if(mk >= todayKey()) a.bal = t;
    } else {
      if(!v.hist) v.hist = {};
      v.hist[mk] = t;
      if(mk >= todayKey()) v.val = t;
    }
    return true;
  }
  /* صافي ما وضعتَ في محافظك كلِّها — يُسمح بالسلب */
  function investIn(){ var s = 0; state.invest.forEach(function(v){ s += num(v["in"]); }); return s; }
  /* أقربُ هدفٍ في محافظك: هدفُ المحفظة نفسِها أو هدفٌ يقرأ منها */
  function invNearGoal(){
    var best = null;
    (state.invest || []).forEach(function(v){
      var tg = num(v.tgt), now = invVal(v), per = num(v.m), g = invGoal(v);
      var nm = v.n, src = "محفظة";
      if(!(tg > 0) && g && goalTarget(g) > 0){
        tg = goalTarget(g); now = goalSaved(g); per = goalMonthly(g);
        nm = g.n; src = "هدف";
      }
      if(!(tg > 0)) return;
      var rest = Math.max(0, tg - now);
      var n = per > 0 ? Math.ceil(rest / per) : null;
      var cand = { n: nm, src: src, tgt: tg, now: now, rest: rest, months: n };
      if(!best) best = cand;
      else if(n !== null && (best.months === null || n < best.months)) best = cand;
    });
    return best;
  }
  /* ── الحسابات المصرفية ── */
  function accts(){ if(!state.accts) state.accts = []; return state.accts; }
  function acctOf(id){ var a = accts(); for(var i=0;i<a.length;i++) if(a[i].id === id) return a[i]; return null; }
  function acctTotal(){ var s2 = 0; accts().forEach(function(a){ s2 += num(a.bal); }); return s2; }
  function linkedTo(link){
    return accts().filter(function(a){ return a.link === link; });
  }
  function linkedSum(link){ var s2 = 0; linkedTo(link).forEach(function(a){ s2 += num(a.bal); }); return s2; }
  /* ── المرحلة ٣: نوع الحساب · الأصل مقابل الالتزام ── */
  var KINDS = [
    { k: "bank",   n: "\u062d\u0633\u0627\u0628 \u0628\u0646\u0643\u064a" },
    { k: "wallet", n: "\u0645\u062d\u0641\u0638\u0629" },
    { k: "card",   n: "\u0628\u0637\u0627\u0642\u0629" },
    { k: "debt",   n: "\u0627\u0644\u062a\u0632\u0627\u0645 \u0639\u0644\u064a\u0643" }
  ];
  function kindOf(a){ return a && a.kind ? a.kind : "bank"; }
  function kindName(k){
    for(var i=0;i<KINDS.length;i++) if(KINDS[i].k === k) return KINDS[i].n;
    return KINDS[0].n;
  }
  function isDebt(a){ return kindOf(a) === "debt"; }

  /* ══ الالتزام عقد ══
     المتبقي هو الرصيد (مصدر الحقيقة الوحيد، تحرّكه حركات السداد).
     الأصل والقسط شرطان تكتبهما مرة، وما عداهما مشتقّ. */
  function debtLeft(a){ return Math.max(0, Math.abs(num(a.bal))); }
  function debtPrinc(a){                     /* أصل المبلغ — لا يقلّ عن المتبقي */
    var p = num(a.princ);
    return p > 0 ? Math.max(p, debtLeft(a)) : debtLeft(a);
  }
  function debtPaid(a){ return Math.max(0, debtPrinc(a) - debtLeft(a)); }
  function debtPct(a){
    var t = debtPrinc(a);
    return t > 0 ? Math.min(1, debtPaid(a) / t) : 0;
  }
  function debtMonthly(a){ return Math.max(0, num(a.mpay)); }
  function debtMonthsLeft(a){                /* null = لا قسط محدَّد فلا موعد */
    var m = debtMonthly(a);
    return m > 0 ? Math.ceil(debtLeft(a) / m) : null;
  }
  function debtEnd(a){
    var n = debtMonthsLeft(a);
    return n === null ? null : shift(todayKey(), Math.max(0, n - 1));
  }
  function debtAccts(){ return accts().filter(isDebt); }
  /* مجموع أقساط الالتزامات الشهرية — منفصل عن أقساط الخطة عمداً */
  function debtMonthlyTotal(){
    var t = 0;
    debtAccts().forEach(function(a){ t += debtMonthly(a); });
    return t;
  }
  function assetTotal(){
    var s2 = 0;
    accts().forEach(function(a){ if(!isDebt(a)) s2 += num(a.bal); });
    return s2;
  }
  function debtAcctTotal(){
    var s2 = 0;
    accts().forEach(function(a){ if(isDebt(a)) s2 += Math.abs(num(a.bal)); });
    return s2;
  }
  /* الأقساط تُقرأ من الخطة \u2014 بلا إدخال مزدوج */
  function instDebt(mk){ return instRemain(mk || ui.month); }
  function liabTotal(mk){ return debtAcctTotal() + instDebt(mk); }
  function netWorth(mk){ return assetTotal() - liabTotal(mk); }
  function opsAssets(){
    var s2 = 0;
    accts().forEach(function(a){ if(!isDebt(a) && a.link === "ops") s2 += num(a.bal); });
    return s2;
  }

  /* ── المرحلة ١: التحويل \u2014 حركة واحدة بطرفين ── */
  /* رصيد حساب الالتزام يحمل «ما عليك» لا «ما تملك» — فإشارته معكوسة:
     السداد يُنقصه، والاقتراض يزيده. وفي الحالتين صافي ثروتك لا يتحرّك،
     لأنك تبدّل أصلاً بالتزام لا تكسب ولا تخسر. */
  function transferKind(f, t){
    if(isDebt(t) && !isDebt(f)) return "pay";      /* سداد   */
    if(isDebt(f) && !isDebt(t)) return "borrow";   /* اقتراض */
    return "move";                                  /* تحويل  */
  }
  /* أقصى ما يُسدَّد: ما تبقّى من الدَّين. null = بلا سقف */
  function transferCap(f, t){
    return (isDebt(t) && !isDebt(f)) ? Math.max(0, Math.abs(num(t.bal))) : null;
  }
  function doTransfer(fromId, toId, amt, note){
    var f = acctOf(fromId), t = acctOf(toId);
    if(!f || !t || f.id === t.id || num(amt) <= 0) return false;
    var a2 = num(amt), tid = uid(), d = new Date().toISOString().slice(0,10);
    var cap = transferCap(f, t);
    if(cap !== null && a2 > cap) return false;      /* لا تسدّد أكثر ممّا عليك */
    if(!f.log) f.log = [];
    if(!t.log) t.log = [];
    var K = transferKind(f, t);
    f.bal = num(f.bal) + (isDebt(f) ? a2 : -a2);
    t.bal = num(t.bal) + (isDebt(t) ? -a2 : a2);
    stampSnap(f); stampSnap(t);
    var nf = K === "pay" ? "سداد" : (K === "borrow" ? "اقتراض" : "تحويل");
    f.log.push({ id: uid(), a: a2, kind: K === "borrow" ? "borrow" : "out",
                 tid: tid, to: t.id, t: note || nf, d: d });
    t.log.push({ id: uid(), a: a2, kind: K === "pay" ? "pay" : "in",

  }
  function acctName(id){

  }
  function acctOptions(exceptId){
    var o = [];

  }

  /* ══ رؤية السنة ══ */
  function yearMonths(y){
    var o = [];
    for(var i = 1; i <= 12; i++) o.push(y + "-" + pad(i));
    return o;
  }
  /* شهر «حيّ»: فيه عمليات أو دخل خاص \u2014 لا نفترض دخلاً لأشهر لم تصل بعد */
  function monthLive(k){
    var m = state.months[k];
    if(!m) return false;
    return (m.items && m.items.length > 0) || !!m.inc;
  }
  function yearRows(y){
    var now = todayKey();
    return yearMonths(y).map(function(k){
      var live = monthLive(k), ahead = k > now;
      var inc = live ? income(k) : 0;
      var exp = live ? actuals(k).sum : 0;

    });
  }
  function yearSum(y){
    /* الأشهر القادمة تُعرض ولا تُجمَع — دخلٌ لم يُصرف بعد ليس فائضاً */
    var r = yearRows(y), inc = 0, exp = 0, n = 0, ah = 0;
    r.forEach(function(x){
      if(!x.live) return;
      if(x.ahead){ ah++; return; }
      inc += x.inc; exp += x.exp; n++;
    });
    return { rows: r, inc: inc, exp: exp, net: inc - exp, months: n, ahead: ah,

  }
  function catYear(ck, y){
    var now = todayKey();
    return yearMonths(y).map(function(k){
      var m = (k > now) ? null : state.months[k], v = 0;
      if(m) m.items.forEach(function(it){ if(it.c === ck) v += num(it.a); });
      return v;
    });
  }
  function curYear(){ return ui.year || (ui.month || todayKey()).slice(0,4); }

  /* ── الإدخال السريع: مبلغ واحد لكل بند ── */
  function quickItem(mk, ck){
    var m = state.months[mk], q = null;
    if(m && m.items) m.items.forEach(function(it){ if(it.q && it.c === ck && !it.s) q = it; });
    return q;
  }
  /* ما سُجّل عملية بعملية — لا يمسّه الإدخال السريع */
  function detailSum(mk, ck){
    var m = state.months[mk], t = 0;
    if(m && m.items) m.items.forEach(function(it){ if(it.c === ck && !it.q) t += num(it.a); });
    return t;
  }
  function detailCount(mk, ck){

    return n;
  }
  /* يضبط إجمالي البند على المبلغ المكتوب، ويمتصّ الفرق في عملية «سريعة» واحدة */
  /* ── سجلُّ التعديلات ──
     يُقاس بمجموع البند قبلَ التغيير وبعده — فيصحّ الفرقُ مهما كانت
     آلةُ التغيير: إدخالٌ سريعٌ أو عمليةٌ تُضاف أو تُحذف. */
  var LOGCAP = 200;
  function catTotal(mk, ck){ return actuals(mk).by[ck] || 0; }
  function subTotal(mk, sid){ return actuals(mk).bySub[sid] || 0; }
  function logAmt(mk, ck, sid, before, after, kind){
    if(!mk || !ck) return;

    var m = month(mk);
    if(!Array.isArray(m.log)) m.log = [];
    m.log.push({ t: Date.now(), c: ck, s: sid || "",
                 f: money(before), o: money(after),
                 k: kind || "" });
    if(m.log.length > LOGCAP) m.log = m.log.slice(-LOGCAP);
  }
  /* يُلفّ تغييرٌ بقيدِه: يُقرأ المجموعُ قبلَه وبعده */
  function withLog(mk, ck, sid, kind, fn){
    var b = sid ? subTotal(mk, sid) : catTotal(mk, ck);
    var r = fn();
    logAmt(mk, ck, sid, b, sid ? subTotal(mk, sid) : catTotal(mk, ck), kind);
    return r;
  }

  function setQuick(mk, ck, total){
    return withLog(mk, ck, "", "q", function(){ return setQuickRaw(mk, ck, total); });
  }
  function setQuickRaw(mk, ck, total){
    var det = detailSum(mk, ck), q = quickItem(mk, ck), m = month(mk);
    var t = Math.max(0, money(total));
    if(t < det){

    }
    var rest = money(t - det);
    if(q) unlinkSpend(q);
    if(rest <= 0){
      if(q) m.items = m.items.filter(function(x){ return x.id !== q.id; });

  /* كم وضعتَ فعلاً في هذا الهدف هذا الشهر — قد يقلّ عن المخطط */
  /* ── صرفُ الفرع ──

     سُجّل عمليةً عمليةً لا يُمسّ، فلا يُحسب المبلغ مرّتين. */
  function quickSubItem(mk, ck, sid){
    var m = state.months[mk], q = null;
    if(m && m.items) m.items.forEach(function(it){

  function detailSubSum(mk, ck, sid){

  function setQuickSub(mk, ck, sid, total){

  function setQuickSubRaw(mk, ck, sid, total){

    var t = Math.max(0, money(total));
    if(t < det){

      t = det;
    }
    var rest = money(t - det);
    if(q) unlinkSpend(q);
    if(rest <= 0){

      q.a = rest;
    }
