    return t;
  }

  function goalOf(id){
    for(var i=0;i<state.goals.length;i++) if(state.goals[i].id === id) return state.goals[i];
    return null;
  }
  /* إيداع الاستثمار: يُسجَّل في التوزيع وحده — قيمة المحفظة تُقرأ
     من إقفالها الشهري لا من الإيداع، فلا يُضاف هنا شيء إلى قيمة. */
  /* الإيداعُ يصل إلى المحفظة كما يصل إلى الهدف: بالفرق لا بالمجموع،
     فتصحيحُ الرقم لا يُضاعفه. ويزيد ما ساهمتَ به وقيمتَها معاً —
     فالمالُ الذي وضعتَه فيها منها، والربحُ يُقاس على ما ساهمت. */
  function setInvQuick(mk, vid, total){
    var v = byId(state.invest, vid);
    var d = distMap(mk), key = "i:" + vid;
    var prev = num(d[key]), t = Math.max(0, money(total));
    d[key] = t;
    if(v && !invFromAccts(v)){
      var dif = t - prev;
      /* صافي ما وضعتَ يتحرّك بالفرق — ويُسمح بالسلب في السحب لا هنا */
      v["in"] = money(num(v["in"]) + dif);
      if(invTrack(v) === "hold"){
        /* محفظةُ ممتلكات: المالُ يدخل نقداً ينتظر الشراء */
        v.cash = money(Math.max(0, invCash(v) + dif));
      } else {
        /* والقيمةُ كذلك: تُقدَّر بما وضعتَ حتى تكتب الحقيقيّةَ آخر الشهر */
        v.val = money(Math.max(0, num(v.val) + dif));
      }
      /* وتُثبَّت لقطةُ الشهر: خانةُ «قيمتها اليوم» تعرض اللقطةَ لا
         القيمةَ الجارية، فبدونها تبقى فارغةً ويبقى الرسمُ بلا نقطة —
         فيُقرأ كأنّ الإيداعَ لم يصل. والربحُ يبقى صفراً لأنّ القيمةَ
         زادت بمقدار ما أودعتَ لا أكثر. */
      if(invTrack(v) === "hold"){
        invSyncHold(v, mk);
      } else {
        var _pv = invValAt(v, shift(mk, -1));
        if(_pv === null) _pv = 0;
        /* والقيمةُ لا تنسى ما سُحب في الشهر نفسِه */
        setInvValue(v, mk, money(_pv + t - invOutOf(v, mk)));
      }
      if(dif) invMove(v, dif > 0 ? "in" : "inx", Math.abs(dif), mk, "من المصروف");
    }
    return t;
  }
  function setGoalQuick(mk, gid, total){
    var g = goalOf(gid);
    if(!g) return 0;
    var d = distMap(mk), key = "g:" + gid;
    var prev = num(d[key]), t = Math.max(0, money(total));
    d[key] = t;
    /* الهدف بلا حساب مرتبط: مُدَّخره رقم يدوي، فنحرّكه بالفرق */
    if(!goalFromAccts(g)) g.saved = money(num(g.saved) + (t - prev));
    return t;
  }

  /* ── المرحلة ٦: من أي حساب دُفع ── */
  function trackSrc(){ return state.trackSrc !== false; }
  function acctPickOptions(){
    var o = [{ v: "", n: "\u0628\u0644\u0627 \u062a\u062d\u062f\u064a\u062f" }];
    accts().forEach(function(a){
      if(isDebt(a) || a.arch) return;
      o.push({ v: a.id, n: a.bank + " \u00b7 " + a.n });
    });
    return o;
  }
  /* ── أنواع الحركة ──
     المبلغ يُخزَّن موجباً دائماً، والنوع يحدّد اتجاهه.
     «ربح» و«خسارة» لا تحرّكان الرصيد — هما تفسير لتغيّره، تُكتبان
     عند إقفال شهر الاستثمار حتى يقول السجلّ لماذا ارتفعت المحفظة. */
  var LKINDS = {
    "in":   { n: "إيداع",  s: "+", c: "ok",   d: "مال دخل الحساب" },
    "gain": { n: "ربح",    s: "+", c: "ok",   d: "نموّ المحفظة نفسها" },
    "out":  { n: "سحب",    s: "−", c: "warn", d: "مال خرج الحساب" },
    "loss": { n: "خسارة",  s: "−", c: "warn", d: "انخفاض المحفظة" },
    "fee":  { n: "رسوم",   s: "−", c: "warn", d: "عمولة الجهة" },
    "pay":  { n: "سداد",   s: "−", c: "ok",   d: "نقص ممّا عليك" },
    "borrow": { n: "اقتراض", s: "+", c: "warn", d: "زاد ما عليك" },
    "adjup": { n: "تسوية", s: "+", c: "ok",   d: "تصحيح بالزيادة" },
    "adjdn": { n: "تسوية", s: "−", c: "warn", d: "تصحيح بالنقص" }
  };
  function lkind(k){ return LKINDS[k] || LKINDS["out"]; }
  function acctLog(a){ if(!a.log) a.log = []; return a.log; }
  function acctLogAdd(a, rec){
    if(!a.log) a.log = [];
    a.log.push({ id: uid(), a: num(rec.a), kind: "out", item: rec.id,
                 t: "\u0645\u0635\u0631\u0648\u0641 \u00b7 " + catOf(rec.c).n, d: rec.d });
  }
  function acctLogDrop(a, itemId){
    if(a.log) a.log = a.log.filter(function(x){ return x.item !== itemId; });
  }
  /* يخصم المصروف من حسابه ويكتبه في سجله */
  function linkSpend(rec){
    if(!rec.acct) return;
    var a = acctOf(rec.acct);
    if(!a){ delete rec.acct; return; }
    a.bal = num(a.bal) - num(rec.a);
    stampSnap(a);
    acctLogAdd(a, rec);
  }
  /* يتراجع عن الخصم \u2014 يُستدعى قبل أي تعديل أو حذف */
  function unlinkSpend(rec){
    if(!rec.acct) return;
    var a = acctOf(rec.acct);
    if(!a) return;
    a.bal = num(a.bal) + num(rec.a);
    stampSnap(a);
    acctLogDrop(a, rec.id);
  }
  function spentFrom(aid, mk){
    var m = state.months[mk || ui.month], t = 0;
    if(m) m.items.forEach(function(it){ if(it.acct === aid) t += num(it.a); });
    return t;
  }
  function untracked(mk){
    var m = state.months[mk || ui.month], t = 0;
    if(m) m.items.forEach(function(it){ if(!it.acct) t += num(it.a); });
    return t;
  }

  /* ── المرحلة ٥: اللقطة الشهرية ── */
  function snapOf(a){ if(!a.snap) a.snap = {}; return a.snap; }
  function stampSnap(a, mk){ snapOf(a)[mk || ui.month] = num(a.bal); }
  function stampAll(mk){
    accts().forEach(function(a){ stampSnap(a, mk); });
  }
  /* أحدث لقطة عند هذا الشهر أو قبله \u2014 null إن لم توجد */
  function snapAt(a, mk){
    var sn = snapOf(a), keys = Object.keys(sn).sort(), out = null;
    for(var i=0;i<keys.length;i++){
      if(keys[i] <= mk) out = num(sn[keys[i]]); else break;
    }
    return out;
  }
  function assetsAt(mk){
    var t = 0, any = false;
    accts().forEach(function(a){
      if(isDebt(a)) return;
      var v = snapAt(a, mk);
      if(v !== null){ t += v; any = true; }
    });
    return any ? t : null;
  }
  function netAt(mk){
    var A = assetsAt(mk);
    if(A === null) return null;
    var d = 0;
    accts().forEach(function(a){
      if(!isDebt(a)) return;
      var v = snapAt(a, mk);
      if(v !== null) d += Math.abs(v);
    });
    return A - d - instRemain(mk);
  }
  function snapMonths(){
    var set = {};
    accts().forEach(function(a){
      var sn = snapOf(a);
      for(var k in sn) set[k] = 1;
    });
    return Object.keys(set).sort();
  }
  /* التسوية: هل يفسّر دخلُك ومصروفُك تغيُّرَ رصيدك؟ */
  /* قيمة حسابات الاستثمار في شهر ما */
  function invAssetsAt(mk){
    var t = 0;
    accts().forEach(function(a){
      if(String(a.link || "").charAt(0) !== "i") return;
      var v = snapAt(a, mk);
      if(v !== null) t += v;
    });
    return t;
  }
  /* مكسب المحافظ = تغيّر قيمتها ناقص ما ساهمت به */
  function invGain(mk){
    var prev = shift(mk, -1);
    var d = distMap(mk), put = 0;
    for(var key in d){ if(key.charAt(0) === "i") put += num(d[key]); }
    return Math.round(invAssetsAt(mk) - invAssetsAt(prev) - put);
  }
  function reconcile(mk){
    /* شهر لم يأتِ بعد، أو لم تُحفظ له لقطة — لا تسوية له */
    if(mk > todayKey()) return null;
    if(snapMonths().indexOf(mk) < 0) return null;
    var prev = shift(mk, -1);
    var a1 = assetsAt(mk), a0 = assetsAt(prev);
    if(a1 === null || a0 === null) return null;
    var inc = income(mk), sp = actuals(mk).sum, gain = invGain(mk);
    var expected = inc - sp + gain, actual = a1 - a0;
    return { prev: prev, inc: inc, sp: sp, gain: gain, a0: a0, a1: a1,
             expected: expected, actual: actual, gap: actual - expected };
  }
  function netSpark(){
    var ms = snapMonths();
    if(ms.length < 2) return "";
    var last = ms.slice(-6), vals = last.map(function(k){ return netAt(k); });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    if(hi === lo) hi = lo + 1;
    /* القاعدة عند الأدنى لإبراز الفروق — والمدى مكتوب أسفله بصراحة */
    var H = 46;
    return '<div class="spark">' + last.map(function(k, i){
      var v = vals[i], hgt = Math.max(5, Math.round((v - lo) / (hi - lo) * H));
      return '<span class="sb"><i class="' + (v < 0 ? "neg " : "")
        + (i === last.length - 1 ? "last" : "") + '" style="height:' + hgt + 'px"'
        + ' title="' + fmt(v) + '"></i><em>' + k.slice(5) + '</em></span>';
    }).join("") + '</div>'
      + '<div class="foot"><span>الأعمدة مقيسة بين <b>' + fmt(lo) + '</b> و<b>' + fmt(hi) + '</b>'
      + ' — لا من الصفر</span><span>'
      + (vals[vals.length-1] - vals[0] >= 0 ? "+" : "−")
      + fmt(Math.abs(vals[vals.length-1] - vals[0])) + ' خلال ' + arMonths(last.length) + '</span></div>';
  }

  /* ── المرحلة ٤: ترشيح القائمة ── */
  function acctQuery(){ return (ui.acctQ || "").trim().toLowerCase(); }
  function acctMatch(a){
    var qy = acctQuery();
    if(!qy) return true;
    return ((a.bank || "") + " " + (a.n || "")).toLowerCase().indexOf(qy) >= 0;
  }
  function acctKeep(a){
    /* لا يُخفى أبداً: المثبَّت \u00b7 حساب الراتب \u00b7 الحساب المفتوح */
    return !!a.pin || state.salaryAcct === a.id || !!ui.openAcct[a.id];
  }
  function acctVisible(a){
    if(!acctMatch(a)) return false;
    if(acctQuery()) return true;                       /* البحث يشمل المؤرشف */
    if(a.arch) return false;
    if(ui.hideZero && num(a.bal) === 0 && !acctKeep(a)) return false;
    return true;
  }
  function pinnedAccts(){ return accts().filter(function(a){ return a.pin && acctVisible(a); }); }
  function archAccts(){ return accts().filter(function(a){ return a.arch && acctMatch(a); }); }
  function hiddenCount(){
    var n = 0;
    accts().forEach(function(a){ if(!acctVisible(a)) n++; });
    return n;
  }

  /* ترتيب عربي للتسمية التلقائية */
  var ORD = ["الأساسي","الثاني","الثالث","الرابع","الخامس","السادس","السابع","الثامن",
             "التاسع","العاشر","الحادي عشر","الثاني عشر"];
  function ordName(base, n){
    return base + " " + (ORD[n] || ("رقم " + (n + 1)));
  }
  /* اسم الحساب التالي داخل جهة \u2014 لا يكرّر اسم الجهة */
  function nextAcctName(bank){
    var n = accts().filter(function(a){ return a.bank === bank; }).length;
    return ordName("الحساب", n);
  }
  function nextWalletName(invId){
    var n = linkedTo("i:" + invId).length;
    return ordName("المحفظة", n);
  }

  function banks(){
    var out = [];
    accts().forEach(function(a){ if(out.indexOf(a.bank) < 0) out.push(a.bank); });
    return out;
  }
  /* البند الذي خُصّص له هذا الحساب — العلاقة مخزَّنة على البند لا على الحساب */
  function catOfAcct(a){
    if(!a) return null;
    var out = null;
    state.cats.forEach(function(c){ if(c.acct === a.id) out = c; });
    return out;
  }
  /* غرض الحساب كما يُعرض: البند يسبق «تشغيلي» لأنه أدقّ منه */
  function acctPurpose(a){
    if(!a) return { t: "تشغيلي", cls: "ops" };
    if(!a.link || a.link === "ops"){
      var c = catOfAcct(a);
      if(c) return { t: c.e + " " + c.n, cls: "cat" };
    }
    return linkLabel(a.link);
  }
  function linkLabel(link){
    if(!link || link === "ops") return { t: "تشغيلي", cls: "ops" };
    var id = link.slice(2), i;
    if(link.charAt(0) === "g"){
      for(i=0;i<state.goals.length;i++) if(state.goals[i].id === id)
        return { t: state.goals[i].n, cls: "goal" };
      return { t: "هدف محذوف", cls: "ops" };
    }
    for(i=0;i<state.invest.length;i++) if(state.invest[i].id === id)
      return { t: state.invest[i].n, cls: "inv" };
    return { t: "جهة محذوفة", cls: "ops" };
  }
  /* المُدَّخر يُشتق من الحسابات المرتبطة إن وُجدت */
  function goalSaved(g){
    var l = linkedTo("g:" + g.id);
    if(l.length) return linkedSum("g:" + g.id);
    /* مالُه يقعد في محفظة: قيمتُها هي مُدَّخرُه — رقمٌ واحدٌ لا رقمان */
    var v = goalInv(g);
    if(v) return invVal(v);
    return num(g.saved);
  }
  function goalFromAccts(g){ return linkedTo("g:" + g.id).length > 0; }
  /* المحفظةُ التي يقعد فيها مالُ الهدف — إن وُصل بواحدة */
  function goalInv(g){
    if(!g || !g.inv) return null;
    return byId(state.invest, g.inv);
  }
  /* والعكس: أيُّ هدفٍ تحمله هذه المحفظة */
  function invGoal(v){
    if(!v) return null;
    var out = null;
    (state.goals || []).forEach(function(g){
      if(!g.arch && g.inv === v.id) out = g; });
    return out;
  }
  function goalHeld(g){ return goalFromAccts(g) || !!goalInv(g); }
  function invVal(v){
    var l = linkedTo("i:" + v.id);
    if(l.length) return linkedSum("i:" + v.id);
    /* محفظةُ الممتلكات قيمتُها محسوبةٌ لا مكتوبة */
    if(invTrack(v) === "hold") return invHoldVal(v);
    return num(v.val);
  }
  function invFromAccts(v){ return linkedTo("i:" + v.id).length > 0; }

  /* ── أنواع الأهداف ──
     fixed   : مبلغ تكتبه بنفسك، ينتهي عند بلوغه
     salary  : مستهدفه = مضاعف الراتب  (يُعاد حسابه إن تغيّر دخلك)
     months  : مستهدفه = مضاعف متوسط مصروفك الشهري
     endless : بلا مستهدف — يقتطع حتى توقفه أنت */
  var GMODES = [
    { k: "fixed",   n: "مبلغ محدَّد" },
    { k: "salary",  n: "مضاعف الراتب" },
    { k: "months",  n: "أشهر من مصروفك" },
    { k: "endless", n: "بلا نهاية" }
  ];
  function gMode(g){ return g && g.mode ? g.mode : "fixed"; }
  function gModeName(k){
    for(var i=0;i<GMODES.length;i++) if(GMODES[i].k === k) return GMODES[i].n;
    return GMODES[0].n;
  }
  /* متوسط مصروفك الشهري الفعلي — وإلا فخطة المصروف */
  /* مصروف المعيشة: بلا أقساط (تنتهي) ولا استثمار (ادخار لا صرف) */
  function livingSpend(mk){
    var m = state.months[mk], t = 0;
    if(!m || !m.items) return 0;
    m.items.forEach(function(it){
      var c = catOf(it.c);
      if(isInvCat(c)) return;
      var line = it.s ? subOf(c, it.s) : c;
      if(typeOf(line || c) === "inst") return;
      t += num(it.a);
    });
    return t;
  }
  function avgSpend(){
    var ks = Object.keys(state.months).filter(function(k){
      return state.months[k].items && state.months[k].items.length;
    }).sort().slice(-3);
    if(!ks.length) return planExp() || baseSalary();
    var t = 0;
    ks.forEach(function(k){ t += livingSpend(k); });
    return Math.round(t / ks.length);
  }
  /* الراتب المعتمد: راتب الشهر المعروض، وإلا الافتراضي، وإلا آخر شهر سُجّل فيه */
  function baseSalary(){
    var o = incObj(ui.month || todayKey());
    if(o.salary > 0) return o.salary;
    if(num(state.income.salary) > 0) return num(state.income.salary);
    var ks = Object.keys(state.months).sort(), last = 0;
    ks.forEach(function(k){
      var m = state.months[k];
      if(m && m.inc && num(m.inc.salary) > 0) last = num(m.inc.salary);
    });
    return last;
  }
  function goalTarget(g){
    var m = gMode(g), mu = num(g.mult) || 1;
    if(m === "endless") return 0;
    if(m === "salary") return Math.round(baseSalary() * mu);
    if(m === "months") return Math.round(avgSpend() * mu);
    return num(g.target);
  }
  function goalWhy(g){
    var m = gMode(g), mu = num(g.mult) || 1;
    if(m === "salary")
      return mu + " × راتبك (" + fmt(baseSalary()) + ") = <b>" + fmt(goalTarget(g)) + "</b>";
    if(m === "months")
      return arMonths(mu) + " × متوسط مصروف معيشتك (" + fmt(avgSpend()) + ") = <b>"
        + fmt(goalTarget(g)) + "</b><br><span style=\"opacity:.75\">بلا أقساط ولا استثمار — "
        + "هذه تنتهي أو تتوقف عند الأزمة</span>";
    if(m === "endless") return "بلا مستهدف — يقتطع كل شهر حتى توقفه بنفسك";
    return "";
  }
  function isDone(g){
    if(gMode(g) === "endless") return false;
    var t = goalTarget(g);
    return t > 0 && goalSaved(g) >= t;
  }
  /* المكتمل يتوقّف اقتطاعه تلقائياً، ويستأنف إن نقص رصيده */
  function goalMonthly(g, mk){
    if(isDone(g)) return 0;
    var m = state.months[mk || ui.month];
    if(m && m.gm && m.gm[g.id] !== undefined) return num(m.gm[g.id]);
    return num(g.m);
  }
  /* ما حُوِّل فعلاً لهذا الهدف في شهر معيّن (من سجلّ التوزيع) */
  function goalMoved(g, mk){
    var m = state.months[mk];
    return (m && m.dist) ? num(m.dist["g:" + g.id]) : 0;
  }
  /* كشف الهدف: ما أُضيف له شهراً بشهر */
  function goalLedger(g, mk, n){
    var keys = Object.keys(state.months).sort().filter(function(k){ return k <= mk; });
    var cum = 0, out = [];
    keys.forEach(function(k){
      var add = goalMoved(g, k);
      cum += add;
      out.push({ k: k, plan: k === mk ? goalMonthly(g) : 0, add: add, cum: cum });
    });
    return out.slice(-(n || 6));
  }
  /* قسطٌ مقترَح: الباقي على اثني عشر شهراً — رقمٌ يُقبل أو يُعدَّل */
  /* نصُّ حذف البند — كان في موضعين بنصٍّ واحدٍ موجزٍ بلا رقم */
  function catDelMsg(c){
    var nit = 0, tot = 0;
    for(var mk in (state.months || {}))
      ((state.months[mk] || {}).items || []).forEach(function(it){
        if(it.c === c.k){ nit++; tot += num(it.a); }
      });
    var subs = (c.subs || []).length;
    return "خطّتُه <b>" + fmt(catPlan(c, ui.month)) + "</b> شهرياً تعود إلى "
      + "الباقي من دخلك"
      + (subs ? (" · و<b>" + subs + "</b> من فروعه تذهب معه") : "")
      + "."
      + (nit ? ("<br>و<b>" + nit + " عملية</b> بمجموع <b>" + fmt(tot)
               + "</b> تبقى في شهورها <b>بلا اسمِ بند</b> — فتُقرأ تقاريرُك "
               + "ناقصةً.") : "")
      + "<br><br><b>«أخفِه» أرفق</b>: يرفعه من الشاشات ويبقي أرقامَه "
      + "وتقاريرَه كما هي.";
  }
  function goalSuggest(g){
    var rem = Math.max(0, goalTarget(g) - goalSaved(g));
    if(rem <= 0) return 0;
    return Math.max(1, Math.ceil(rem / 12));
  }
  /* هدفٌ له مستهدفٌ ولا يقتطع شيئاً: موجودٌ في القائمة، غائبٌ عن الخطة */
  function goalIdle(g){
    return !isDone(g) && gMode(g) !== "endless"
        && goalMonthly(g) <= 0 && goalTarget(g) > 0;
  }
  function goalEta(g){
    if(gMode(g) === "endless") return { done: false, months: null, when: "", endless: true };
    if(isDone(g)) return { done: true, months: 0, when: "" };
    var rem = Math.max(0, goalTarget(g) - goalSaved(g));
    if(num(g.m) <= 0) return { done: false, months: null, when: "" };
    var n = Math.ceil(rem / num(g.m));
    return { done: false, months: n, when: shift(todayKey(), n) };
  }
  function freshDone(){ return state.goals.filter(function(g){ return isDone(g) && !g.arch; }); }

  /* ═══ حفظ ═══ */
  /* ── الحفظ المحلّي: خارج مسار التفاعل ──
     كان يُسلسل الحالة كلها في كل تعديل. والقياس أراه ٥ms من أصل ١٦
     عند عشر سنوات — وهو الشيء الوحيد الذي ينمو مع تاريخك.
     صار يؤجَّل ٤٠٠ms: عشرة حقول تُملأ متتابعةً تُكتب مرّة لا عشراً.
     ويُفرَغ فوراً عند مغادرة الصفحة، فلا يضيع تعديلٌ أخير. */
  /* ═══ الوسم والدمج ═══ */
  var DEVKEY = "kh_dev_demo";
  function deviceId(){
    var d = null;
    try{ d = localStorage.getItem(DEVKEY); }catch(e){}
    if(d) return d;
    d = "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    try{ localStorage.setItem(DEVKEY, d); }catch(e){}
    return d;
  }
  var GONE_DAYS = 60;

  /* كل ما يُدمج وحدةً وحدة. المفتاح يحمل نوعه فلا يختلط هدفٌ بمحفظة. */
  function units(st){
    var u = {}, mk, i;
    (st.cats || []).forEach(function(c){ u["c:" + c.k] = c; });
    (st.goals || []).forEach(function(g){ u["g:" + g.id] = g; });
    (st.invest || []).forEach(function(x){ u["v:" + x.id] = x; });
    (st.accts || []).forEach(function(a){ u["a:" + a.id] = a; });
    for(mk in (st.months || {})){
      var m = st.months[mk];
      (m.items || []).forEach(function(it){ u["i:" + mk + ":" + it.id] = it; });
    }
    return u;
  }
  /* بصمةٌ تتجاهل الوسم نفسه — وإلا وُسم السجلّ لأنه وُسم */
  function unitSig(o){
    var c = {}, k;
    for(k in o) if(k !== "at") c[k] = o[k];
    return JSON.stringify(c);
  }

  var _stampPrev = null;
  function stampChanges(){
    var now = Date.now(), cur = units(state), k;
    if(!state.gone) state.gone = {};

    if(_stampPrev === null){
      /* أوّل كتابة في هذه الجلسة: يُوسَم ما لا وسم له فقط */
      _stampPrev = {};
      for(k in cur){
        _stampPrev[k] = unitSig(cur[k]);
        if(!cur[k].at) cur[k].at = now;
      }
    } else {
      for(k in cur){
        var sig = unitSig(cur[k]);
        if(_stampPrev[k] !== sig){ cur[k].at = now; _stampPrev[k] = sig; }
        if(!cur[k].at) cur[k].at = now;
      }
      /* ما اختفى: شاهدُ حذف */
      for(k in _stampPrev){
        if(!(k in cur)){
          state.gone[k] = now;
          delete _stampPrev[k];
        }
      }
    }

    /* التوزيع والإعدادات وحدتان لهما وسمهما */
    for(var mk in (state.months || {})){
      var m = state.months[mk];
      var ds = JSON.stringify(m.dist || {});
      if(m._ds !== ds){ m._ds = ds; m.distAt = now; }
    }
    var setSig = JSON.stringify({
      income: state.income, cur: state.cur, monthStart: state.monthStart,
      arDigits: state.arDigits, startTab: state.startTab, startMonth: state.startMonth,
      salaryAcct: state.salaryAcct, hijri: state.hijri, rules: state.rules,
      trackSrc: state.trackSrc, onboard: state.onboard });
    if(state._ss !== setSig){ state._ss = setSig; state.setAt = now; }

    /* الشواهد تُنسى بعد ستّين يوماً */
    var cut = now - GONE_DAYS * 86400000;
    for(k in state.gone) if(state.gone[k] < cut) delete state.gone[k];

    state.dev = deviceId();
  }

  /* ═══ الدمج ═══
     يأخذ حالتين ويُرجع ثالثة. لا يعرف من أين جاءتا ولا إلى أين تذهبان. */
  function mergeStates(a, b){
    a = a || {}; b = b || {};
    var out = JSON.parse(JSON.stringify((+b.savedAt || 0) > (+a.savedAt || 0) ? b : a));
    var older = ((+b.savedAt || 0) > (+a.savedAt || 0)) ? a : b;

    /* الإعدادات: الأحدث وسماً — لا الأحدث حفظاً */
    if((+older.setAt || 0) > (+out.setAt || 0)){
      ["income", "cur", "monthStart", "arDigits", "startTab", "startMonth",
       "salaryAcct", "hijri", "rules", "trackSrc", "onboard"].forEach(function(k){
        if(k in older) out[k] = older[k];
      });
      out.setAt = older.setAt;
    }

    /* شواهد الحذف تجتمع، والأحدث يبقى */
    out.gone = out.gone || {};
    var g = older.gone || {}, k;
    for(k in g) if(!out.gone[k] || g[k] < out.gone[k]) out.gone[k] = Math.max(out.gone[k] || 0, g[k]);

    /* السجلّات: اتّحادٌ بالمعرّف، والأحدث وسماً يغلب */
    var A = units(out), B = units(older);
    for(k in B){
      var mine = A[k], theirs = B[k];
      if(!mine){ addUnit(out, k, theirs); continue; }
      if((+theirs.at || 0) > (+mine.at || 0)) replaceUnit(out, k, theirs);
    }
    /* ثم يُطرح ما حُذف بعد آخر تعديلٍ له */
    A = units(out);
    for(k in out.gone){
      var u = A[k];
      if(u && (+u.at || 0) <= out.gone[k]) removeUnit(out, k);
    }

    /* التوزيع لكل شهر: الأحدث وسماً */
    for(var mk in (older.months || {})){
      var om = older.months[mk];
      if(!out.months[mk]){ out.months[mk] = om; continue; }
      if((+om.distAt || 0) > (+out.months[mk].distAt || 0)){
        out.months[mk].dist = om.dist;
        out.months[mk].distAt = om.distAt;
      }
      if(om.setup) out.months[mk].setup = true;
    }

    out.savedAt = Math.max(+a.savedAt || 0, +b.savedAt || 0);
    return out;
  }

  function unitParts(k){
    var i = k.indexOf(":");
    return { t: k.slice(0, i), rest: k.slice(i + 1) };
  }
  function addUnit(st, k, u){
    var p = unitParts(k);
    if(p.t === "c"){ (st.cats = st.cats || []).push(u); return; }
    if(p.t === "g"){ (st.goals = st.goals || []).push(u); return; }
    if(p.t === "v"){ (st.invest = st.invest || []).push(u); return; }
    if(p.t === "a"){ (st.accts = st.accts || []).push(u); return; }
    if(p.t === "i"){
      var mk = p.rest.slice(0, p.rest.indexOf(":"));
      st.months = st.months || {};
      if(!st.months[mk]) st.months[mk] = { items: [], dist: {}, setup: true };
      (st.months[mk].items = st.months[mk].items || []).push(u);
    }
  }
  function eachList(st, t, fn){
    var L = t === "c" ? st.cats : t === "g" ? st.goals
          : t === "v" ? st.invest : t === "a" ? st.accts : null;
    if(L) fn(L);
  }
  function replaceUnit(st, k, u){
    var p = unitParts(k);
    if(p.t === "i"){
      var mk = p.rest.slice(0, p.rest.indexOf(":")), id = p.rest.slice(mk.length + 1);
      var m = (st.months || {})[mk]; if(!m) return;
      for(var i = 0; i < (m.items || []).length; i++)
        if(String(m.items[i].id) === id){ m.items[i] = u; return; }
      return;
    }
    eachList(st, p.t, function(L){
      for(var i = 0; i < L.length; i++){
        var key = (p.t === "c") ? L[i].k : L[i].id;
        if(String(key) === p.rest){ L[i] = u; return; }
      }
    });
  }
  function removeUnit(st, k){
    var p = unitParts(k);
    if(p.t === "i"){
      var mk = p.rest.slice(0, p.rest.indexOf(":")), id = p.rest.slice(mk.length + 1);
      var m = (st.months || {})[mk]; if(!m || !m.items) return;
      m.items = m.items.filter(function(x){ return String(x.id) !== id; });
      return;
    }
    eachList(st, p.t, function(L){
      for(var i = 0; i < L.length; i++){
        var key = (p.t === "c") ? L[i].k : L[i].id;
        if(String(key) === p.rest){ L.splice(i, 1); return; }
      }
    });
  }

  /* منفذُ اختبار — لا يوجد إلا بطلبٍ صريح في العنوان */
  try{
    if(location.search.indexOf("selftest") >= 0){
      window.__mt = { merge: mergeStates, units: units, stamp: stampChanges };
    }
  }catch(e){}

  /* ═══ المخزن ═══
     IndexedDB أصلاً، وlocalStorage مرآةً للإقلاع السريع وللارتداد. */
  var IDB_NAME = "masrouf_demo", IDB_VER = 1, IDB_STORE = "kv";
  var idb = null, idbState = "?";      /* ? · ok · off */
  var idbLast = {};                    /* ما كُتب فعلاً، لئلا يُعاد */

  function idbOpen(then){
    if(idb) return then(idb);
    if(idbState === "off") return then(null);
    var req;
    try{ req = indexedDB.open(IDB_NAME, IDB_VER); }
    catch(e){ idbState = "off"; return then(null); }
    req.onupgradeneeded = function(){
      var d = req.result;
      if(!d.objectStoreNames.contains(IDB_STORE)) d.createObjectStore(IDB_STORE);
    };
    req.onsuccess = function(){ idb = req.result; idbState = "ok"; then(idb); };
    req.onerror = function(){ idbState = "off"; then(null); };
    req.onblocked = function(){ idbState = "off"; then(null); };
  }

  /* الحالة تُقسَّم: نواةٌ بلا أشهر، وسجلٌّ لكل شهر. فتعديل شهرٍ يكتب
     سجلّه وحده — لا أربعمئة كيلوبايت في كل ضغطة. */
  function idbSplit(){
    var core = {}, k;
    for(k in state) if(k !== "months") core[k] = state[k];
    var out = [["core", core]];
    for(k in (state.months || {})) out.push(["m:" + k, state.months[k]]);
    return out;
  }

  function idbWrite(then){
    idbOpen(function(d){
      if(!d) return then && then(false);
      var parts = idbSplit(), seen = {};
      var tx, st;
      try{
        tx = d.transaction(IDB_STORE, "readwrite");
        st = tx.objectStore(IDB_STORE);
      }catch(e){ idbState = "off"; return then && then(false); }

      parts.forEach(function(p){
        seen[p[0]] = 1;
        var sig = JSON.stringify(p[1]);
        if(idbLast[p[0]] === sig) return;      /* لم يتغيّر: لا يُكتب */
        idbLast[p[0]] = sig;
        try{ st.put(p[1], p[0]); }catch(e){}
      });
      /* شهرٌ حُذف من الحالة يُحذف سجلّه — وإلا عاد عند القراءة */
      for(var key in idbLast){
        if(key !== "core" && !seen[key]){
          delete idbLast[key];
          try{ st["delete"](key); }catch(e){}
        }
      }
      tx.oncomplete = function(){ then && then(true); };
      tx.onerror = function(){ then && then(false); };
      tx.onabort = function(){ then && then(false); };
    });
  }

  function idbRead(then){
    idbOpen(function(d){
      if(!d) return then(null);
      var out = null, tx, st;
      try{
        tx = d.transaction(IDB_STORE, "readonly");
        st = tx.objectStore(IDB_STORE);
      }catch(e){ return then(null); }
      var keys = st.getAllKeys ? st.getAllKeys() : null;
      var vals = st.getAll ? st.getAll() : null;
      if(!keys || !vals) return then(null);     /* متصفّحٌ قديم: المرآة تكفي */
      tx.oncomplete = function(){
        var K = keys.result || [], V = vals.result || [];
        if(!K.length) return then(null);
        out = { months: {} };
        for(var i = 0; i < K.length; i++){
          var k = String(K[i]);
          idbLast[k] = JSON.stringify(V[i]);
          if(k === "core"){ for(var c in V[i]) out[c] = V[i][c]; }
          else if(k.indexOf("m:") === 0) out.months[k.slice(2)] = V[i];
        }
        then(out);
      };
      tx.onerror = function(){ then(null); };
    });
  }

  /* الديمومة: يُطلب من المتصفّح ألّا يمحو البيانات عند ضيق المساحة.
     يُمنح غالباً لمن ثبّت التطبيق أو أكثر زيارته. */
  var persisted = null, quota = null;
  function storageFacts(){
    try{
      if(navigator.storage && navigator.storage.persisted)
        navigator.storage.persisted().then(function(p){
          if(p) { persisted = true; return; }
          if(navigator.storage.persist)
            navigator.storage.persist().then(function(g){ persisted = !!g; });
          else persisted = false;
        })["catch"](function(){});
      if(navigator.storage && navigator.storage.estimate)
        navigator.storage.estimate().then(function(e){
          quota = { used: e.usage || 0, all: e.quota || 0 };
        })["catch"](function(){});
    }catch(e){}
  }

  var _lsT = null, _lsDirty = false;
  /* سببُ تعذّر الحفظ، إن تعذّر. "" يعني أنّه يعمل. */
  var saveBlocked = "";
  var lastSave = 0, lastSize = 0;
  function localWrite(){
    diag("حفظ", "إلى مخزن الجهاز");
    _lsDirty = false;
    try{
      stampChanges();          /* ما تغيّر يُوسَم، وما اختفى يُشهَد عليه */
      state.savedAt = Date.now();
      var blob = JSON.stringify(state);
      localStorage.setItem(LSKEY, blob);
      /* بعد الكتابة لا قبلها: الدليل يُسجَّل حين يقع الفعل */
      lastSave = state.savedAt; lastSize = blob.length;
      /* الأسفل وحده يُحدَّث لا الشاشة كلّها: رسمٌ كامل بعد كل ضغطة
         يسرق التركيز من الحقل الذي تكتب فيه. */
      footProof();
      if(saveBlocked === "store"){ saveBlocked = ""; render(); }
      idbWrite();                        /* المخزن الأصل — غير حاجزٍ للخيط */
    }catch(e){
      /* قد تكون المساحة امتلأت، وقد يكون التخزين ممنوعاً أصلاً.
         الفرق يهمّ المستخدم: الأولى يعالجها، والثانية ليست بيده. */
      var full = /quota|exceed/i.test(String(e && (e.name + " " + e.message)));
      var was = saveBlocked;
      /* امتلأت المرآة أو مُنعت: القاعدة قد تقبل، فتُجرَّب قبل الحكم */
      idbWrite(function(ok){
        var now = ok ? "" : (full ? "full" : "store");
        if(saveBlocked !== now){ saveBlocked = now; render(); }
      });
      saveBlocked = full ? "full" : "store";
      if(was !== saveBlocked) render();
    }
  }
  /* فحصٌ عند الإقلاع: لا ننتظر أوّل تعديلٍ ليكتشف أن عمله يضيع */
  function storeProbe(){
    try{
      localStorage.setItem("kh_probe_demo", "1");
      if(localStorage.getItem("kh_probe_demo") !== "1") throw new Error("no readback");
      localStorage.removeItem("kh_probe_demo");
    }catch(e){ saveBlocked = "store"; }
  }
  function localSave(){
    _lsDirty = true;
    clearTimeout(_lsT);
    _lsT = setTimeout(localWrite, 400);
  }
  function localFlush(){ if(_lsDirty){ clearTimeout(_lsT); localWrite(); } }
  try{
    window.addEventListener("pagehide", localFlush);
    window.addEventListener("beforeunload", localFlush);
    document.addEventListener("visibilitychange", function(){
      if(document.visibilityState === "hidden") localFlush();
    });
  }catch(e){}
  function countItems(ms){ var n=0; for(var k in ms){ if(ms[k]&&ms[k].items) n += ms[k].items.length; } return n; }
  function localLoad(){
    try{
      var raw = localStorage.getItem(LSKEY); if(!raw) return;
      var d = JSON.parse(raw);
      if(!d || typeof d !== "object" || !d.months) return;

      /* أيّهما أحدث: ما في الجهاز أم ما جاء مضمَّناً في الصفحة؟
         الختم يحسم حين يوجد. وإلا فالعدّ — و«أكبر أو يساوي» لا «أكبر»،
         وإلا لم تُحمَّل حالةٌ بلا حركاتٍ بعد. */
      var mine = +d.savedAt || 0, emb = +state.savedAt || 0;
      var take = (mine || emb)
               ? (mine >= emb)
               : (countItems(d.months) >= countItems(state.months));
      if(!take) return;

      /* الحالة كلّها لا ستّة مفاتيح منها — الإعدادات جزءٌ من عمل صاحبها */
      for(var k in d) state[k] = d[k];
    }catch(e){}
  }
  function buildDoc(){
    var css = document.getElementById("app-style").textContent;
    var js = document.getElementById("app-script").textContent;
    var json = JSON.stringify(state).replace(/</g, "\\u003c");
    return '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">'
      + '<meta name="viewport" content="width=device-width, initial-scale=1">'
      + '<title>خطتي الشهرية</title>'
      + '<link rel="preconnect" href="https://fonts.googleapis.com">'
      + '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
      + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700'
      + '&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">'
      + '<style id="app-style">' + css + '<' + '/style></head><body><div id="root"></div>'
      + '<script id="app-state" type="application/json">' + json + '<' + '/script>'
      + '<script id="app-script">' + js + '<' + '/script></body></html>';
  }
  var _wasWide = window.innerWidth >= 1180;
  window.addEventListener("resize", function(){
    var wide = window.innerWidth >= 1180;
    if(wide === _wasWide) return;
    _wasWide = wide; render();
  });
  function toast(msg){
    var t = document.getElementById("toast");
    if(!t){ t = document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); }
    t.textContent = msg; t.classList.add("on");
    clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove("on"); }, 1800);
  }
  function save(){
    localSave(); dirty = true;
    cloudQueue();
    try{ sessionStorage.setItem("kh_tab", ui.tab); sessionStorage.setItem("kh_month", ui.month); }catch(e){}
    if(!pubApi) return;
    clearTimeout(pending);
    pending = setTimeout(function(){
      if(!dirty) return;
      dirty = false; toast("جارٍ الحفظ…");
      pubApi.publish(buildDoc()).then(function(){ toast("تم الحفظ"); })
      ["catch"](function(err){
        var c = err && err.code;
        if(c === "conflict") toast("حُفظت نسخة أحدث من جهاز آخر");
        else if(c === "not_granted" || c === "not_writer"){
          /* عرضٌ للقراءة: لو كان التخزين المحلّي يعمل لبقي عمله فيه،
             وإلا فهو يضيع مع كل تحديثٍ للصفحة. شتّان. */
          saveBlocked = (saveBlocked === "store") ? "store" : "readonly";
          render();
        }
        else toast("تعذّر الحفظ — محفوظ على هذا الجهاز");
      });
    }, 2200);
  }


  /* ═══ قائمة اختيار الحساب (مجمَّعة حسب الجهة) ═══ */
  function acctSelect(attr, id, link){
    var A = accts();
    if(!A.length) return '<span class="pill">أضف حساباتك من تبويب «الحسابات»</span>';
    var h = '<select class="sel" ' + attr + '="' + id + '">'
      + '<option value="">— اختر حساباً لإضافته —</option>';
    banks().forEach(function(b){
      h += '<optgroup label="' + esc(b) + '">';
      A.filter(function(a){ return a.bank === b; }).forEach(function(a){
        var busy = a.link !== "ops" && a.link !== link;
        h += '<option value="' + a.id + '">' + esc(a.n)
          + (busy ? " — مرتبط بـ " + esc(linkLabel(a.link).t) : "")
          + " · " + fmt(a.bal) + '</option>';
      });
      h += '</optgroup>';
    });
    return h + '</select>';
  }
  /* قائمة الحساب المرتبط: الحساب الحالي هو الخيار المختار داخلها.
     تُستعمل حين تحمل الجهةَ محفظةٌ واحدة — وهو الحال الطبيعي. */
  function acctSelectOne(attr, id, link){
    var A = accts(), cur = linkedTo(link)[0];
    if(!A.length) return '<span class="pill">أضف حساباتك من تبويب «الحسابات»</span>';
    var h = '<select class="sel" ' + attr + '="' + id + '">'
      + '<option value=""' + (cur ? "" : " selected") + '>— بلا حساب · القيمة تُكتب يدوياً —</option>';
    banks().forEach(function(b){
      h += '<optgroup label="' + esc(b) + '">';
      A.filter(function(a){ return a.bank === b; }).forEach(function(a){
        var mine = cur && a.id === cur.id;
        var busy = !mine && a.link !== "ops" && a.link !== link;
        h += '<option value="' + a.id + '"' + (mine ? " selected" : "") + '>'
          + esc(a.n) + (busy ? " — مرتبط بـ " + esc(linkLabel(a.link).t) : "")
          + " · " + fmt(a.bal) + '</option>';
      });
      h += '</optgroup>';
    });
    return h + '</select>';

  /* ═══ نافذة داخلية — بديل prompt/confirm المحجوبين داخل الإطار ═══ */
  var dlg = null;

  /* ── لوحة الأفعال داخل نافذة التعديل ──
     كانت هذه الأزرار مكشوفة في كل صفّ من صفوف الإعدادات — ١٥٦ زراً محتملاً.
     صارت خلف زرّ «تعديل» واحد، والفعل الخطر آخرها ومعزول. */
  function dgroup(label, inner){
    return '<div class="dgrp"><div class="dlab">' + esc(label) + '</div>'
      + '<div class="dbtns">' + inner + '</div></div>';
  }
  function catPanel(k){

        '<button class="mini' + (c.hidden ? " on" : "") + '" data-hidecat="' + k + '">'

    + '<div class="dgrp danger"><div class="dlab">خطر</div><div class="dbtns">'
    + '<button class="mini bad" data-rmcat="' + k + '">احذف البند نهائياً</button>'

    (function(){

    if(reEl) reEl.onchange = function(){
      var v = vals();
      (dlg.fields || []).forEach(function(x, i){ x.value = v[i]; });
      /* الطقمُ نفسه يتغيّر لا قيمُه: حقلٌ يخصّ نوعاً يظهر ويغيب معه */

    /* أقساطُ الأمنيات ذواتِ الخطط خُصمت من الفائض وهي لهنّ — فتُردّ */
    var back = 0;
    W.forEach(function(x){ back += wishOwn(x, k); });
    for(j = 0; j < O.length && i < W.length; j++){
      var add = Math.max(0, O[j].sur) + back;
      if(cap > 0) add = Math.min(add, cap);
      if(j === 0) add = Math.max(0, Math.min(add, wishRoom(k).now + back));
      pool += add;
      while(i < W.length && pool >= wishNeed(W[i])){
        pool -= wishNeed(W[i]);
        out.push({ w: W[i], k: O[j].k });
        i++;
      }
    }
    for(; i < W.length; i++) out.push({ w: W[i], k: "" });
    return out;
  }

  /* ── أبوابُ الأمنيات ──
     ليُقال لكلٍّ موسمُه: لا يُبشَّر صاحبُ الثلّاجة بموسم الملابس. */
  var WKINDS = [
    { k: "elec", n: "إلكترونيات", d: "الإلكترونيات" },
    { k: "cloth", n: "ملابس", d: "الملابس" },
    { k: "home", n: "أثاث ومنزل", d: "الأثاث والمنزل" },
    { k: "trip", n: "سفر", d: "السفر" },
    { k: "school", n: "دراسة", d: "الدراسة" },
    { k: "other", n: "غير ذلك", d: "" }
  ];
  /* اسمٌ معرَّفٌ للجملة واسمٌ مجرَّدٌ للقائمة — «أسعارُ سفر» نكرةٌ في
     موضع تعريف. */
  function kindName(k, def){
    for(var i = 0; i < WKINDS.length; i++) if(WKINDS[i].k === k)
      return def ? WKINDS[i].d : WKINDS[i].n;

  }
  /* ── مواسمُ السوق ──
     عرفٌ لا وعد: يُقال متى يكون الموسمُ وما بابُه، ولا يُقدَّر توفيرٌ
     برقمٍ مخترع. والرقمُ الوحيدُ الصادق هنا ما سجّله بيده في دفتر السعر. */
  var SEASONS = [
    { n: "اليوم الوطنيّ", m: 9,  ks: ["elec", "home", "other"], up: false },
    { n: "الجمعة البيضاء", m: 11, ks: ["elec", "cloth", "home", "other"], up: false },

  /* رمضانُ والعيدُ من التقويم لا من جدول */
  function hijriSeason(mk){

  function nextSeason(k, kind){

          return { n: S.n, k: mk, i: i, up: S.up };

      var H = hijriSeason(mk);
      if(H && (!kind || H.ks.indexOf(kind) >= 0))
        return { n: H.n, k: mk, i: i, up: H.up };
    }
    return null;
  }

  /* خطةُ الشراء: هدفٌ مرتبطٌ بالأمنية — الالتزامُ الذي لا يُرى لا يُتابَع */
  function wishGoal(x){
    if(!x || !x.goal) return null;

  }
  function wishPaused(g){ return !!g && num(g.m) <= 0 && num(g.pm) > 0; }
  /* ما اجتمع لها في خطّتها — يُطرح من ثمنها في كلّ حساب */
  /* حقولُ الأمنية: قائمةٌ واحدةٌ للإضافة والتعديل. `more` يُطوى في
     الإضافة وحدَها — فمن سجّل سريعاً لم يُطلب منه إلّا الاسمُ والثمن،
     ومن أراد التفصيل وجده في الحوار نفسِه لا في حوارٍ ثانٍ.
     والقراءةُ بالمفاتيح لا بالمواضع: حقلٌ يُزاد يزحزح ما بعده. */
  function wishDlgFields(w){

        w: "wide", guess: true, ph: "شنطة · جوّال · رحلة" },
      /* الثمنان نصفان متجاوران: مدىً واحدٌ يُقرأ دفعةً */
      { key: "price", label: "أدنى ثمنٍ متوقَّع", type: "number", w: "half",

  }
  function wishApply(w, by){
    w.n = String(by.n || "").trim();
    w.e = String(by.e || "🎁");
    w.img = String(by.img || "");
    w.price = Math.max(0, money(by.price));
    w.price2 = Math.max(0, money(by.price2));
    w.url = String(by.url || "");
    w.kind = String(by.kind || "");
    w.cat = String(by.cat || "");
    w.by = Math.max(0, Math.round(num(by.by)));
    w.run = Math.max(0, money(by.run));
    w.wait = Math.max(0, money(by.wait));
    w.note = String(by.note || "");
  }
  function wishGot(x){ var g = wishGoal(x); return g ? goalSaved(g) : 0; }
  /* وقسطُها: خُصم من الفائض لأنّه هدفٌ نشط، فيُردّ في حسابها وحدَها
     لئلّا يُحسب المالُ مرّتين ضدّها. */
  function wishOwn(x, mk){ var g = wishGoal(x); return g ? goalMonthly(g, mk) : 0; }
  /* الثمنُ المعتمَد: متوسّطُ المدى إن كان له مدى، وإلا فرقمُه.
     رقمٌ واحدٌ تُبنى عليه كلُّ الحسابات، فلا يختلف حسابان. */
  function wishPrice(x){
    if(!x) return 0;
    var a = num(x.price || 0), b = num(x.price2 || 0);
    if(b > 0 && b !== a) return money((a + b) / 2);
    return a;
  }
  function wishRange(x){
    if(!x) return null;
    var a = num(x.price || 0), b = num(x.price2 || 0);
    if(!(b > 0) || b === a) return null;
    return { lo: Math.min(a, b), hi: Math.max(a, b) };
  }
  function wishNeed(x){ return Math.max(0, wishPrice(x) - wishGot(x)); }
  /* ما صار في متناوله اليوم: بالباقي أو باكتمال خطّته */
  /* تُحسب معاً لا كلٌّ على حدة: ثلاثٌ بأربعمئةٍ لا تكون كلُّها في
     متناولك وباقيك خمسمئة. فينقص الباقي بقدر ما تأخذه كلُّ واحدة. */
  function wishActive(x){ return !x.bought && !x.snooze; }
  function wishReady(k){
    var R = wishRoom(k), pool = R.now, out = [];
    wishList().filter(function(x){
      return wishActive(x) && wishPrice(x) > 0;
    }).sort(wishOrder).forEach(function(x){
      var p = wishPrice(x), got = wishGot(x);
      if(pool + got < p) return;
      pool -= Math.max(0, p - got);
      out.push(x);
    });
    return out;
  }

  /* ما لا يُصرف من البنود: بمتوسّط ستّة أشهرٍ مضت لا بالظنّ. فمن قيل له
     «قلّص مطاعمك» وهو لا يصرفها أصلاً لم يُفَد. */
  function wishSlack(k){
    var keys = Object.keys(state.months || {}).sort().filter(function(x){
      return x < k && actuals(x).sum > 0;
    }).slice(-6);
    if(!keys.length) return [];
    var out = [];
    visibleCats().forEach(function(c){
      if(isCap(c) || c.off) return;
      var t = 0, spent = 0;
      keys.forEach(function(mk){
        var sp = actuals(mk).by[c.k] || 0;
        spent += sp;
        t += Math.max(0, catPlan(c, mk) - sp);
      });
      /* بندٌ لم يُصرف منه شيءٌ قطُّ ليس متروكاً — إنّما هو غير مسجَّل */
      if(spent <= 0) return;
      var avg = Math.round(t / keys.length);
      if(avg >= 25) out.push({ c: c, avg: avg, cls: clsOf(c) });
    });
    /* الكماليّ أوّلاً: هناك يملك الخفضَ بلا ألم */
    out.sort(function(a, b){
      var ka = (a.cls === "want" ? 1 : 0), kb = (b.cls === "want" ? 1 : 0);
      if(ka !== kb) return kb - ka;
      return b.avg - a.avg;
    });
    return out.slice(0, 3);
  }

  /* ── لو اشتريتَها اليوم ──
     ثلاثةُ مصادرَ للمال تبدو في الرصيد سواءً وليست سواءً: فائضٌ حرّ،
     ومالٌ محجوزٌ لبندٍ لم يُصرف، وادّخارٌ لهدف. فيُقال من أيّها تُؤخذ. */
  function wishSim(x, k){
    var R = wishRoom(k), p = wishPrice(x);
    /* المُدَّخرُ لها يُنفَق عليها أوّلاً — فهو مالٌ حُجز لها بعينها */
    var fromGoal = Math.min(p, wishGot(x));
    p -= fromGoal;
    var fromFree = Math.min(p, Math.max(0, R.now));
    var rest = p - fromFree;
    var fromPlan = Math.min(rest, Math.max(0, R.left));
    var fromSave = Math.max(0, rest - fromPlan);
    var lvl = fromSave > 0 ? 2 : (fromPlan > 0 ? 1 : 0);
    var o = { p: wishPrice(x), now: R.now, after: R.now - p, lvl: lvl,
              goal: fromGoal, free: fromFree, plan: fromPlan, save: fromSave,
              cat: null };
    /* وإن عيّن لها بنداً: تجاوزُه يُقال باسمه */
    if(x.cat){
      var pr = String(x.cat).split("|"), c = catOf(pr[0]);
      if(c){
        var av = catPlan(c, k) + carryOf(c, k);
        var sp = (actuals(k).by[c.k] || 0), pay = wishPrice(x);
        o.cat = { n: c.n, plan: av, spent: sp,
                  after: sp + pay, over: Math.max(0, sp + pay - av) };
      }
    }
    return o;
  }
  var SIMLVL = [
    { n: "لا يمسّ شيئاً", c: "ok" },
    { n: "يأكل المحجوز", c: "warn" },
    { n: "يكسر ادّخارك", c: "cost" }
  ];
  function simHTML(x, k){
    var o = wishSim(x, k);
    if(o.p <= 0) return "";
    /* لا يُعرض إلّا إذا كان فيه تحذير — وإلّا فهو خبرٌ قالته الطرقُ قبله */
    var worth = (o.lvl >= 1) || (o.cat && o.cat.over > 0) || num(x.run) > 0;
    if(!worth) return "";
    var L = SIMLVL[o.lvl];
    var h = '<div class="wsim"><s class="wlab">أثرُ شرائها اليوم</s>'
      + '<div class="simhead"><span class="simchip ' + L.c + '">' + L.n + '</span>'
      + '<span class="simnum">' + fmt(o.now) + ' <b>←</b> '
      + '<b class="' + (o.after < 0 ? "wno" : "wok") + '">' + fmt(o.after) + '</b>'
      + '<s>الباقي الآن قبلَها وبعدَها</s></span></div><div class="simrows">';
    if(o.goal > 0)
      h += '<div class="simr"><b>' + fmt(o.goal) + '</b>'
         + '<s>من خطّتها — مالٌ حُجز لها بعينها</s></div>';
    if(o.free > 0)
      h += '<div class="simr"><b>' + fmt(o.free) + '</b>'
         + '<s>من فائضٍ حرٍّ — لا خطّةَ فيه ولا ادّخار</s></div>';
    if(o.plan > 0)
      h += '<div class="simr warn"><b>' + fmt(o.plan) + '</b>'
         + '<s>من مالٍ محجوزٍ لبنودٍ لم تصرفها بعد — فتضيق آخرَ الشهر</s></div>';
    if(o.save > 0)
      h += '<div class="simr cost"><b>' + fmt(o.save) + '</b>'
         + '<s>من ادّخارك — وهو نقضٌ لما نويتَه لا تأجيلٌ له</s></div>';
    if(o.cat)
      h += '<div class="simr' + (o.cat.over > 0 ? " warn" : "") + '"><b>'
         + esc(o.cat.n) + '</b><s>خطّتُه ' + fmt(o.cat.plan) + ' · صُرف '
         + fmt(o.cat.spent) + ' · بعدها ' + fmt(o.cat.after)
         + (o.cat.over > 0 ? (' — تجاوزٌ ' + fmt(o.cat.over)) : ' — يتّسع')
         + '</s></div>';
    if(num(x.run) > 0)
      h += '<div class="simr"><b>' + fmt(o.p + num(x.run) * 12) + '</b>'
         + '<s>كلفتُها في سنتها الأولى — ثمنُها و' + fmt(num(x.run))

    return h + '</div></div>';
  }

  /* طرقُك إليها — مرتَّبةً: ما لا يهزّ شيئاً أوّلاً، وما له ثمنٌ آخراً */
  function wishWays(x, k){
    var R = wishRoom(k), p = wishPrice(x), W = [];
    /* حسابُ الأمنية يعرف خطّتها: المُدَّخرُ يُطرح، والقسطُ يُردّ */
    var got = wishGot(x), own = wishOwn(x, k), gl = wishGoal(x);
    var need = Math.max(0, p - got);
    var now = Math.max(0, R.now) + got;              /* ما تستطيع دفعه اليوم */
    var sur = Math.max(0, R.surplus + own);          /* فائضٌ لا يُخصم منه قسطُها */
    var want = Math.max(0, Math.round(num(x.by)));   /* خلال كم شهر — إن حدّده */
    if(p <= 0){
      W.push({ t: "ask", i: "؟", n: "ضع لها ثمناً",
               d: "بلا ثمنٍ لا تُحسب طريق. قدِّره تقريباً — يكفي." });
      return W;
    }

    if(now >= p){
      W.push({ t: "ok", i: "✓", n: "اشترِها اليوم",
        d: (got > 0
             ? ("مع " + fmt(got) + " " + esc(cur()) + " اجتمعت في خطّتها، ما تستطيع"
                + " دفعه اليوم " + fmt(now) + " — تسعها ويبقى " + fmt(now - p) + ".")
             : ("ما بقي الآن " + fmt(now) + " " + esc(cur()) + " — تسعها ويبقى "
                + fmt(now - p) + "، ولا تمسّ خطّةً ولا ادّخاراً.")),
        b: "سجّلها مصروفاً", a: 'data-wbuy="' + x.id + '"' });
    } else if(sur >= need){
      W.push({ t: "ok", i: "◷", n: "انتظر آخر " + esc(mName(k)),
        d: "ينقصك اليوم " + fmt(p - now) + "، لكنّ فائض الشهر " + fmt(sur)
           + " يسعه — فإن مضى شهرك على خطّته اشتريتَها بلا اقتطاعٍ من شيء." });
    }

    /* ── الوقت ── */
    var O = outlook(k, 12);

    /* أوّلُ شهرٍ يتّسع فائضُه لثمنها كلِّه — تُشترى فيه بلا ادّخار */
    var solo = null;
    for(var a = 1; a < O.length; a++){
      if(O[a].sur + own >= need){ solo = O[a]; break; }
    }
    if(p > now && need > sur && solo){
      var cz = whyMonth(k, solo.k, false);
      W.push({ t: "ok", i: "◈", n: "اشترِها في " + esc(mName(solo.k)) + " بلا ادّخار",
        d: "فائضُ ذلك الشهر " + fmt(solo.sur + own) + " " + esc(cur())
           + (got > 0 ? " — يسعُ ما بقي منها وحدَه." : " — يسعها وحدَه.")
           + (cz ? (" و" + esc(cz.why) + " فيتحرّر " + fmt(cz.amt) + ".") : "") });
    }

    /* بلوغُها بتراكم الفوائض — لا بقسمةِ الثمن على فائض شهرٍ واحد */
    var reach = null;
    for(var b2 = 0; b2 < O.length; b2++){
      if(O[b2].cum + own * (b2 + 1) >= need){ reach = O[b2]; break; }
    }
    if(p > now && (sur > 0 || reach)){
      var n = reach ? (reach.i + 1) : 0;
      if(want > 0) n = Math.max(1, want);
      var per = n ? Math.ceil(need / n) : 0;
      var fits = !!reach && (want <= 0 || want >= (reach.i + 1));
      /* أضيقُ شهرٍ في المدّة: القسطُ المتساوي قد لا يمرّ فيه */
      var lean = null;
      if(n) for(var d2 = 0; d2 < n && d2 < O.length; d2++){
        /* بفائضٍ رُدَّ إليه قسطُها — وإلّا قيل «لا يحتمل» ما يحتمله */
        var room2 = O[d2].sur + own;
        if(!lean || room2 < lean.room) lean = { k: O[d2].k, room: room2 };
      }
      var uneven = (fits && lean && per > lean.room + 0.5);
      W.push({ t: (fits ? "ok" : "warn"), i: "▤",
        n: n ? (gl ? ("ارفع قسطها إلى " + fmt(per))
                   : ("ادّخرها على " + arMonths(n)))
             : "لا تبلغُها في سنة",
        d: n
            ? ((gl ? ("بدل " + fmt(num(gl.m) || num(gl.pm)) + " اليوم")
                   : (fmt(per) + " " + esc(cur()) + " شهرياً"))
               + " — تكتمل في " + esc(mName(shift(k, n - 1))) + "."
               + (fits
                   ? (uneven
                       ? (" غير أنّ " + esc(mName(lean.k)) + " فائضُه " + fmt(lean.room)
                          + " لا يحتمل هذا القسط — فادّخر فائض كلّ شهرٍ كما هو،"
                          + " يبلغ المجموعُ ثمنَها.")
                       : " وفوائضُ تلك الأشهر تحتملها كما هي مخطَّطة.")
                   : (" وفوائضُ تلك الأشهر لا تبلغ ذلك — أقربُ ما تبلغها "
                      + (reach ? esc(mName(reach.k)) : "بعد سنة") + ".")))
            : ("مجموعُ فوائض اثني عشر شهراً " + fmt(O[O.length - 1].cum + own * 12)
               + " — دون " + (got > 0 ? "ما بقي منها" : "ثمنها")
               + ". تحتاج خفضاً في الخطة أو دخلاً زائداً."),
        b: (!n ? "" : (gl ? "عدّل القسط" : "اجعلها هدفاً")),
        a: (gl ? ('data-wrate="' + x.id + '"')
               : ('data-wgoal="' + x.id + '|' + n + '"')) });
    }

    /* وأضيقُ شهرٍ في الطريق يُتجنّب — بسببه */
    if(p > now && reach && reach.i >= 1){
      var tight = null;
      for(var c2 = 1; c2 <= reach.i; c2++){
        if(!tight || O[c2].sur < tight.sur) tight = O[c2];
      }
      if(tight && tight.sur < sur * 0.75){
        var tz = whyMonth(k, tight.k, true);
        W.push({ t: "warn", i: "▲", n: "تجنّب " + esc(mName(tight.k)),
          d: "فائضُه " + fmt(tight.sur) + " " + esc(cur()) + " لا غير"
             + (tz ? (" — " + esc(tz.why) + " بـ " + fmt(tz.amt) + ".") : ".")
             + " فلا تُثقله بها." });
      }
    }

    var S = wishSlack(k);
    if(p > now && S.length){
      var gain = 0;
      S.forEach(function(o){ gain += o.avg; });
      var n2 = Math.max(1, Math.ceil(p / (sur + gain)));
      W.push({ t: "ok", i: "✂",
        n: "قلّص ما لا تصرفه أصلاً",
        d: "تترك في " + S.map(function(o){
             return "«" + esc(o.c.n) + "» " + fmt(o.avg);
           }).join(" · ") + " شهرياً في المتوسّط. لو حوّلتَها إليها جمعتَها في "
           + arMonths(n2) + " — وخطّتك كما هي، إنّما نُقل ما لم يُصرف." });
    }

    /* سجلُّه يشهد عليه — لا وعظاً بل سطرٌ من دفتره */
    var REC = wishRecord(), agT = wishAgeTag(x);
    if(agT && agT.c === "warn" && REC.fast.n >= 3 && REC.fast.re * 2 > REC.fast.n){
      W.push({ t: "cost", i: "◑", n: "سجلُّك يشهد",
        d: "من " + REC.fast.n + " أمنيةٍ اشتريتَها في أسبوعها، " + REC.fast.re
           + " لا تستعملها اليوم. وهذه سُجّلت قبل " + wishAge(x)
           + " يوماً — هذا دفترُك لا نصيحتي." });
    }

    /* الموسم: عرفٌ لا وعد — ومعه فائضُ شهره من الخريطة */
    var sea = nextSeason(k, x.kind || "");
    if(sea){
      var so = O[sea.i] || null, nowSea = (sea.i === 0);
      /* موسمُ شهرِه أولى بأن يُقال — لا أن يُسكت عنه لأنّه فيه */
      if(sea.up){
        W.push({ t: "warn", i: "◔",
          n: nowSea ? ("شهرُك موسمُ ارتفاع · " + esc(sea.n))
                    : ("تجنّب شراءها في " + esc(sea.n)),
          d: (nowSea ? "أسعارُ " : ("في " + esc(mName(sea.k)) + " — وأسعارُ "))
             + esc(kindName(x.kind, true) || "بابها") + " ترتفع فيه عرفاً لا وعداً."
             + (nowSea ? " فأخّرها عنه إن استطعت." : " فقدّمها عليه أو أخّرها عنه.") });
      } else {
        W.push({ t: "ok", i: "◷",
          n: nowSea ? ("موسمُها شهرُك هذا · " + esc(sea.n))
                    : ("انتظر " + esc(sea.n)),
          d: (nowSea ? "هو موسمُ " : ("في " + esc(mName(sea.k)) + " — بعد "
                                       + arMonths(sea.i) + "، وهو موسمُ "))
             + esc(kindName(x.kind, true) || "التخفيضات")
             + " عرفاً لا وعداً"
             + (so ? (". وفائضُ " + (nowSea ? "شهرك " : "ذلك الشهر ")
                      + fmt(so.sur + own) + " " + esc(cur())
                      + (so.sur + own >= need ? " يسعها وحدَه." : ".")) : ".")
             + " ولا يُقدَّر لك توفيرٌ برقمٍ مخترع — سجّل السعرَ حين تراه"
             + " فيُقال لك بالرقم." });
      }
    }

    /* وليس كلُّ تأجيلٍ مجّانياً */
    if(num(x.wait) > 0 && reach && reach.i > 0){
      var wm = reach.i + 1;
      W.push({ t: "cost", i: "⧗", n: "تأجيلُها ليس مجّاناً",
        d: "قدّرتَ كلفةَ انتظارها " + fmt(num(x.wait)) + " " + esc(cur())
           + " شهرياً — فتأخيرُها " + arMonths(wm) + " يكلّفك "
           + fmt(num(x.wait) * wm) + ". احسبها في ثمنها." });
    }

    /* التقسيطُ يبلغها اليوم — بمقابلِ التزامٍ لا يُؤجَّل حين يضيق شهر */
    if(p > now){
      var per4 = Math.ceil(need / 4), hard = null;
      for(var e2 = 0; e2 < 4 && e2 < O.length; e2++){
        /* من قسّطها لم يعد يدّخر لها — فقسطُ خطّتها متاحٌ لدفعاته */
        var room = (e2 === 0) ? now : (O[e2].sur + own);
        if(room < per4 && (!hard || room < hard.room))
          hard = { k: O[e2].k, room: room };
      }
      W.push({ t: "cost", i: "▦", n: "قسّمها على أربع دفعات",
        d: fmt(per4) + " " + esc(cur()) + " اليوم ثمّ ثلاثٌ مثلُها — تبلغها الآن"
           + " لا بعد أشهر."
           + (hard
               ? (" لكنّها التزامٌ لا يُؤجَّل: " + esc(mName(hard.k)) + " يتّسع لـ"
                  + fmt(Math.max(0, hard.room)) + " لا غير.")
               : " وأشهرُها الأربعةُ تتّسع لها كما هي مخطَّطة.")
           + " وهذا بلا رسوم — فإن كانت فيه رسومٌ فزِدها على ثمنها." });
    }

    var g = null;
    (state.goals || []).forEach(function(o){
      /* لا يُقترح إيقافُ ادّخارها لتُشترى */
      if(o.id === x.goal) return;
      if(!o.arch && num(o.m) > 0 && (!g || num(o.m) > num(g.m))) g = o;
    });
    var n3 = g ? Math.max(1, Math.ceil((p - now) / num(g.m))) : 0;
    /* وما ينقص بعد المُدَّخر هو ما يُوازَن به */
    /* إيقافُ هدفٍ تسعةً وثلاثين شهراً ليس تأجيلاً بل هدمٌ — فلا يُعرض */
    if(p > now && g && n3 <= 6){
      W.push({ t: "cost", i: "⏸",
        n: "أوقف «" + esc(g.n) + "» " + arMonths(n3),
        d: "يوفّر " + fmt(num(g.m) * n3) + " " + esc(cur())
           + " فتبلغها — بمقابل: هدفُك يتأخّر " + arMonths(n3)
           + ". آخرُ الطرق لا أوّلُها." });
    }

    if(p > now && sur <= 0){
      var need = Math.ceil(p / 6);
      W.push({ t: "warn", i: "!", n: "شهرُك لا فائض فيه",
        d: "خطّتُك وادّخارُك يستوعبان دخلك كلَّه. لتبلغها في ستّة أشهر يلزمك "
           + fmt(need) + " " + esc(cur())
           + " شهرياً — إمّا من خفض بندٍ بقدرها أو من دخلٍ زائد." });
    }
    return W;
  }

      out.push({ key: "extra", label: "النسبة من دخل الشهر (٪)", type: "number",
                 value: (cur !== undefined && cur !== "") ? cur : (num(x.pct) || "") });
      return out;
    }
    if(t === "cap"){
      out.push({ key: "extra", label: "السقف الشهريّ — حدٌّ لا يُحجز من دخلك",
                 type: "number",
                 value: (cur !== undefined && cur !== "") ? cur : (capOf(x) || "") });
      return out;
    }
    if(t === "seas")
      out.push({ key: "extra", label: "المبلغ السنويّ (يُقسَّم على اثني عشر)",
                 type: "number",
                 value: (cur !== undefined && cur !== "") ? cur
                        : (num(x.yr) || num(x.p) * 12 || "") });
    else if(t === "inst"){
      out.push({ key: "extra", label: "عدد الأشهر المتبقّية", type: "number",
                 value: (cur !== undefined && cur !== "") ? cur
                        : (instLeft(x, ui.month) || "") });
    }
    return out;
  }

  function typeFields(x){
    var t = typeOf(x), f = [];
    if(t === "seas") f.push({ label: "المبلغ السنوي (يُقسَّم على ١٢)", type: "number", value: num(x.yr) || num(x.p) * 12 });
    else if(t === "inst") f.push({ label: "عدد الأشهر المتبقّية", type: "number", value: instLeft(x, ui.month) || "" });
    return f;
  }
  function applyType(x, t, extra){
    x.t = t;
    if(t === "seas"){
      var yr = num(extra);
      if(yr > 0){ x.yr = yr; x.p = Math.round(yr / 12); }
      delete x.end;
    } else if(t === "inst"){
      var n = Math.round(num(extra));
      if(n > 0){ x.end = shift(ui.month, n - 1); if(!x.mo || n > num(x.mo)) x.mo = n; }
      delete x.yr;
    } else if(t === "cycle"){
      var full = num(extra);
      if(full > 0) x.full = full;
      if(!x.every) x.every = 12;
      delete x.yr; delete x.end;
    } else if(t === "pct"){
      var pc = num(extra);
      if(pc > 0) x.pct = pc;
      delete x.yr; delete x.end; delete x.mo;
    } else if(t === "cap"){
      var cp = num(extra);
      if(cp > 0) x.cap = cp;
      delete x.yr; delete x.end; delete x.mo;
    } else {
      delete x.yr; delete x.end; delete x.mo;
      delete x.full; delete x.pct; delete x.cap; delete x.every; delete x.due;
    }
  }
  /* لا يتجاوز مجموع الفروع ميزانية البند */
  /* تنبيه موحّد عند تجاوز سقف أي بند — يخيّرك بين رفع السقف والضبط على المتبقي */
  function overCapDlg(o){
    ask({
      title: "تجاوزت سقف «" + o.catName + "»",
      msg: 'السقف الشهري <b>' + fmt(o.cap) + '</b> ريال.<br>'

         + 'وأنت كتبت <b>' + fmt(o.want) + '</b> لـ «' + esc(o.lineName) + '».',
      html: '<ul class="dlist">'
          + '<li><span>لو رفعت السقف</span><span class="dv">' + fmt(o.others + o.want) + '</span></li>'
          + '<li><span>لو ضبطته على المتبقي</span><span class="dv">' + fmt(o.room) + '</span></li>'
          + '</ul>',
      ok: "ارفع السقف إلى " + fmt(o.others + o.want),
      cancel: "اضبطه على " + fmt(o.room),
      onOk: function(){ o.raise(); save(); },
      onCancel: function(){ o.clampIt(); save(); }
    });
  }
  function clampSub(c, x){
    var mk = ui.month, cap = catCap(c, mk), others = 0;
    (c.subs || []).forEach(function(y){
      if(y.id !== x.id) others += linePlan(y, mk, lineKey(c.k, y.id));
    });
    var key = lineKey(c.k, x.id), cur = rawP(x, mk, key);
    if(cap <= 0){
      /* لم تُحدَّد ميزانية للبند بعد — نرفع السقف ليسع الفروع بدل تصفيرها */
      if(hasOvr(mk)) setP(mk, c.k, cur + others); else c.p = cur + others;
      return false;
    }
    var room = Math.max(0, cap - others);
    if(cur > room){
      overCapDlg({
        catName: c.n, lineName: x.n, cap: cap, others: others, room: room, want: cur,
        raise: function(){
          if(hasOvr(mk)) setP(mk, c.k, others + cur); else c.p = others + cur;
        },
        clampIt: function(){
          if(hasOvr(mk)) setP(mk, key, room); else x.p = room;
        }
      });
      return true;
    }
    return false;
  }
  /* خصائص البند الأساسي: تصنيف · نوع · ترحيل */

  /* ═══ معالج بداية الشهر ═══ */
  function monthSetup(){ var m = month(ui.month); return m.setup; }
  function autoSplit(){
    var out = [];
    /* بنود لها حساب مخصَّص: تُموَّل تلقائياً مثل الأهداف */
    visibleCats().forEach(function(c){
      var a = catAcct(c), amt = catPlan(c, ui.month);
      if(a && amt > 0)
        out.push({ kind: "c", id: c.k, n: c.n, a: amt, acct: a });
    });
    activeGoals().forEach(function(g){
      if(goalMonthly(g) > 0) out.push({ kind: "g", id: g.id, n: g.n, a: goalMonthly(g),
                                        acct: linkedTo("g:" + g.id)[0] || null });
    });
    state.invest.forEach(function(v){
      if(num(v.m) > 0) out.push({ kind: "i", id: v.id, n: v.n, a: num(v.m),
                                  acct: linkedTo("i:" + v.id)[0] || null });
    });
    return out;
  }
  /* ── المرحلة ٢: تنفيذ التوزيع ── */
  function salaryAcct(){
    var a = state.salaryAcct ? acctOf(state.salaryAcct) : null;
    if(a) return a;
    var f = null;
    accts().forEach(function(x){ if(!f && x.link === "ops" && !isDebt(x)) f = x; });
    return f;
  }
  function distMap(mk){
    var m = state.months[mk];
    if(!m) return {};
    if(!m.dist) m.dist = {};
    return m.dist;
  }
  function distKey(x){ return x.kind + ":" + x.id; }
  function distDone(mk, x){ return num(distMap(mk)[distKey(x)]) > 0; }
  function distMoved(mk){
    var d = distMap(mk), s2 = 0;
    for(var k in d) s2 += num(d[k]);
    return s2;
  }
  function distPlanned(){
    var s2 = 0;
    autoSplit().forEach(function(x){ s2 += x.a; });
    return s2;
  }
  function runDist(mk){
    var src = salaryAcct();
    if(!src) return { done: 0, miss: 0, nosrc: true };
    var d = distMap(mk), done = 0, miss = 0;
    autoSplit().forEach(function(x){
      var key = distKey(x), already = num(d[key]), rest = x.a - already;
      if(rest <= 0) return;                       /* اكتمل — أو سجّلتَ أكثر منه */
      if(!x.acct){ miss++; return; }
      if(doTransfer(src.id, x.acct.id, rest,
                    "\u062a\u0648\u0632\u064a\u0639 " + mName(mk) + " \u2014 " + x.n)){
        d[key] = x.a;
        done++;
      }
    });
    return { done: done, miss: miss, nosrc: false };
  }
  /* بطاقة التوزيع \u2014 تُعرض في تبويب الحسابات وفي المعالج */

    h2 += sp.map(function(x){

        + fmt(left - num(src.bal)) + '</b>. اكتب رصيدك الفعلي أولاً.</div>';
    if(left > 0)

          + (src ? "" : " disabled") + '>\u0646\u0641\u0651\u0630 \u0627\u0644\u062a\u062d\u0648\u064a\u0644\u0627\u062a \u0627\u0644\u0645\u062a\u0628\u0642\u064a\u0629 (' + fmt(left) + ')</button></div>';
    else
      h2 += '<div class="flag ok" style="margin:12px 15px 14px">\u0627\u0643\u062a\u0645\u0644 \u062a\u0648\u0632\u064a\u0639 \u0647\u0630\u0627 \u0627\u0644\u0634\u0647\u0631.</div>';

  /* شاشاتٌ لم تستقرّ بعد. والقائمةُ واحدةٌ: لو وُسمت في موضعين

  function navbar(){

  /* مؤشّر: أيقونة · تسمية · رقم · مقارنة بالشهر الماضي */
  function kpi(icon, tone, lab, val, delta, note){
    return '<div class="kpi"><div class="kl">'
      + '<span class="ki" style="background:var(--' + tone + '-soft);color:var(--' + tone + ')">'
      + icon + '</span>' + esc(lab) + '</div>'

  /* فرق النسبة عن الشهر الماضي — «أعلى» ليس دائماً سيئاً، فالاتجاه يُمرَّر */
  function deltaTxt(now, prev, badUp){
    if(!prev) return "";
    var d = now - prev, p = Math.round(d / prev * 100);
    if(!p) return '<b>بلا تغيّر</b> عن الشهر الماضي';
    var bad = badUp ? d > 0 : d < 0;
    return '<b class="' + (bad ? "kup" : "kdn") + '">' + (d > 0 ? "+" : "−")
      + Math.abs(p) + '٪</b> عن ' + fmt(prev);
  }
  /* ما يطلب فعلاً الآن — بترتيب الأهمية */
  function alertList(k){
    var out = [], A = actuals(k), inc = income(k), un = inc - allocated();
    if(un < 0)
      out.push({ i: "!", t: "warn", h: "خطتك تتجاوز دخل الشهر",
        b: "بـ <b>" + fmt(-un) + "</b> ريال. راجع «الخطة» وقلّص بنداً." });
    else if(un > 0)
      out.push({ i: "◔", t: "gold", h: fmt(un) + " " + cur() + " بلا وجهة",
        b: "افتح «الخطة» وأعطِ كل ريال بنداً أو هدفاً." });
    /* بنود تجاوزت ما أُتيح لها */
    var over = [];
    visibleCats().forEach(function(c){
      var av = catPlan(c, k) + carryOf(c, k), sp = A.by[c.k] || 0;
      if(sp > av && av >= 0) over.push({ n: c.n, d: sp - av });
    });
    if(over.length){
      over.sort(function(x, y){ return y.d - x.d; });
      var tot = 0; over.forEach(function(x){ tot += x.d; });
      out.push({ i: "↑", t: "warn",
        h: over.length === 1 ? "بند تجاوز ما أُتيح له"
           : (over.length === 2 ? "بندان تجاوزا ما أُتيح لهما"
              : over.length + " بنود تجاوزت ما أُتيح لها"),
        b: over.slice(0, 3).map(function(x){
             return esc(x.n) + " <b>+" + fmt(x.d) + "</b>"; }).join(" · ")
           + (over.length > 3 ? " …" : "")
           + " — مجموعها <b>" + fmt(tot) + "</b> ريالاً." });
    }
    /* استثمار مخطط ولم يُنفَّذ */
    var pi = planInv();
    if(pi > 0){
      var d = distMap(k), put = 0;
      for(var key in d){ if(key.charAt(0) === "i") put += num(d[key]); }
      if(!put) out.push({ i: "◺", t: "gold", h: "الاستثمار لم يُموَّل هذا الشهر",
        b: "خطتك <b>" + fmt(pi) + "</b> ريال ولم يخرج منها شيء بعد." });
    }
    /* هبوط حادّ في محفظة — غالباً خطأ إدخال */
    state.invest.forEach(function(v){
      var g = invGainOf(v, k), prev = invValAt(v, shift(k, -1));
      if(g === null || prev === null || prev <= 0) return;
      if(g < 0 && Math.abs(g) > prev / 2)
        out.push({ i: "!", t: "warn", h: esc(v.n) + " هبطت هبوطاً حادّاً",
          b: "من <b>" + fmt(prev) + "</b> إلى <b>" + fmt(invValAt(v, k))
             + "</b>. راجع إن كان الرقم قيمة المحفظة أم مبلغ الإيداع." });
    });
    return out;
  }
  function alertPanel(k){

  function topCat(mk){

  function viewDash(){
