      h += '<div class="mstrip" style="background:var(--card-2);border-bottom:0">'
        + '<span class="mm">المجموع</span>'
        + '<span style="font-size:11.5px;color:var(--ink-3)">دخل ' + fmt(tI) + ' · مصروف ' + fmt(tE) + '</span>'
        + '<span class="mv2" style="color:' + (tI - tE < 0 ? "var(--warn)" : "var(--ok)") + '">'
        + (tI - tE >= 0 ? "+" : "−") + fmt(Math.abs(tI - tE)) + '</span></div>';
      h += '</div>';
      h += '<div class="acts"><button class="act" data-tab="year">'
        + 'افتح السنة كاملة</button></div>';
    }

    cut("months");

    /* ── طريقك في الاستثمار ── */
    if(state.invest.length || invCat()){
      var iv = investVal(), ii = investIn(), ipr = iv - ii;
      var im2 = invMonthly(), icap2 = invCat() ? catCap(invCat(), k) : 0;
      h += '<div class="sec"><h2>طريقك في الاستثمار</h2>'
        + '<span class="hint">' + state.invest.length + ' جهة</span></div>'
        + '<div class="card"><div class="invpath">'
        + '<div class="ip"><span>قيمة محافظك اليوم</span><b>' + fmt(iv) + '</b></div>'
        + '<div class="ip"><span>ما ساهمت به إجمالاً</span><b>' + fmt(ii) + '</b></div>'
        + '<div class="ip"><span>' + (ipr >= 0 ? "ربح" : "خسارة") + '</span>'
        + '<b class="' + (ipr >= 0 ? "up" : "dn") + '">' + (ipr >= 0 ? "+" : "−") + fmt(Math.abs(ipr))
        + (ii ? " · " + (ipr / ii * 100).toFixed(1) + "٪" : "") + '</b></div>'
        + '<div class="ip"><span>مساهمتك الشهرية</span><b>' + fmt(im2)
        + (icap2 ? ' <span style="color:var(--ink-3);font-weight:400">من سقف ' + fmt(icap2) + '</span>' : "")
        + '</b></div>'
        + (im2 > 0
            ? '<div class="ip"><span>بهذا المعدل بعد سنة</span><b>' + fmt(iv + im2 * 12) + '</b></div>'
            : '<div class="ip"><span>لم تبدأ بعد</span><b>—</b></div>')
        + '</div>'
        + (im2 > 0
            ? '<div class="hintnote" data-note="n13dadb0" style="margin:0 15px 15px">الرقم أعلاه مساهماتك فقط — '
              + 'بلا افتراض أي عائد. العائد الحقيقي يظهر حين تحدّث قيمة محافظك شهرياً.</div>'
            : "")
        + '</div>';
    }

    cut("inv");

    /* ── أظرف البنود: الحساب الوهمي لكل بند ── */
    var ENV = envelopes(k);
    if(ENV.length){
      var tAv = 0, tSp = 0, tCr = 0;
      ENV.forEach(function(x){ tAv += x.avail; tSp += x.spent; tCr += x.carry; });
      h += '<div class="sec"><h2>حسابات بنودك</h2>'
        + '<span class="hint">ما بقي في كلّ بندٍ من خطّة الشهر</span></div><div class="card">';
      /* المكشوفة أولاً — الأشدّ كشفاً فالأقلّ — ثم الأكبر رصيداً */
      var ENVtop = ENV.slice().sort(function(p, q){
        if((p.left < 0) !== (q.left < 0)) return p.left < 0 ? -1 : 1;
        return p.left < 0 ? p.left - q.left : q.left - p.left;
      }).slice(0, 6);
      h += ENVtop.map(function(x){
        var l = x.left;
        return '<div class="env" data-carry="' + x.c.k + '">'
          + '<span class="ei" style="background:' + x.c.c + '22;color:' + x.c.c + '">' + iconOf(x.c) + '</span>'
          + '<span><span class="en">' + esc(x.c.n)
          + (x.carry ? ' <span class="carry' + (x.carry < 0 ? " neg" : "") + '">'
              + (x.carry > 0 ? "سابق +" : "سابق −") + fmt(Math.abs(x.carry)) + '</span>' : "")
          + '</span>'
          + '<span class="es">دخل ' + fmt(catPlan(x.c, k)) + ' − صُرف ' + fmt(x.spent) + '</span>'
          + '<span class="track"><i style="width:'
          + (x.avail > 0 ? Math.min(100, x.spent / x.avail * 100) : (x.spent ? 100 : 0))
          + '%;background:' + (x.spent > x.avail ? "var(--warn)" : x.c.c) + '"></i></span></span>'
          + '<span class="ev ' + (l > 0 ? "pos" : (l < 0 ? "neg" : "")) + '">' + fmt(l) + '</span>'
          + '</div>';
      }).join("");
      h += '<div class="env" style="cursor:default">'
        + '<span class="ei" style="background:var(--card-2)">Σ</span>'
        + '<span><span class="en">مجموع الأرصدة'
        + (ENV.length > ENVtop.length
            ? ' <span class="carry">و' + arBand(ENV.length - ENVtop.length) + ' لم تظهر</span>' : "")
        + '</span>'
        + '<span class="es">متاح ' + fmt(tAv) + ' · صُرف ' + fmt(tSp)
        + (tCr ? ' · منه سابق ' + fmt(tCr) : "") + '</span></span>'
        + '<span class="ev ' + (tAv - tSp >= 0 ? "pos" : "neg") + '">' + fmt(tAv - tSp) + '</span></div>';
      h += '</div>';
      h += '<div class="hintnote" data-note="nf2eb3bc">كل بند حساب مستقل: يدخله مبلغ خطته كل شهر، ويخرج منه ما تصرفه، '
        + 'والباقي يبقى فيه. اضغط أي بند لترى كشف حسابه.'
        + '<div class="acts"><button class="act" data-tab="env">افتح حسابات البنود</button></div></div>';
    }

    cut("env");

    var rows = visibleCats().filter(function(c){ return (a.by[c.k]||0) > 0 || effPlan(c, k) > 0; })
      .sort(function(x,y){ return (a.by[y.k]||0) - (a.by[x.k]||0); }).slice(0,6);
    if(rows.length){
      h += '<div class="sec"><h2>المصروف مقابل الخطة</h2><span class="hint">أعلى البنود</span></div><div class="card">';
      h += rows.map(function(c){
        var v = a.by[c.k] || 0, p = effPlan(c, k);
        var w = p ? Math.min(1, v / p) : (v ? 1 : 0);
        var over = p && v > p, near = p && !over && v / p >= nearRatio();
        return '<div class="row"><span class="ic" style="background:' + c.c + '22;color:' + c.c + '">' + c.e + '</span>'
          + '<span><span class="nm">' + esc(c.n) + '</span>'
          + '<span class="sub">' + (p ? "المخطط " + fmt(p) : "بلا خطة")
          + (over ? " · تجاوزت" : (near ? " · اقتربت" : "")) + '</span>'
          + '<span class="track"><i style="width:' + (w*100) + '%;background:'
          + (over ? "var(--warn)" : (near ? "var(--gold)" : c.c)) + '"></i></span></span>'
          + '<span class="rt"><span class="a" style="color:'
          + (over ? "var(--warn)" : (near ? "var(--gold)" : "var(--ink)")) + '">'
          + fmt(v) + '</span><span class="b">' + (p ? Math.round(v/p*100) + '٪' : "—") + '</span></span></div>';
      }).join("") + '</div>';
    }
    cut("plan");

    /* ── التحليل (المرحلة ٥) ── */
    h += viewTrends(k);
    cut("trend");

    /* ══ الترتيب بالأهمية ══
       ما يُطلب منك فعله · أرقامك · ما يحتاج انتباهك · أين ذهب المال ·
       ثم هل أنت على خطتك · ثم أرصدتك وأهدافك · ثم الصورة الأوسع ·
       والأرشيف أخيراً. */
    PART.mig = migCard();
    return ["mig","act","kpi","spend","recon","alert","plan","env",
            "goals","net","own","inv","months","trend","arch"]
      .map(function(nm){ return PART[nm] || ""; }).join("");
  }

  function viewTrends(k){
    var h = "", ct = clsTotals(k);
    if(ct.sum > 0){
      h += '<div class="sec"><h2>تصنيف مصروفك</h2><span class="hint">من الفعلي هذا الشهر</span></div>'
        + '<div class="card p"><div class="clsbar">'
        + CLASSES.map(function(y){
            return ct[y.k] ? '<i style="width:' + (ct[y.k]/ct.sum*100) + '%;background:' + y.c + '"></i>' : "";
          }).join("")
        + '</div><div class="clsleg">'
        + CLASSES.map(function(y){
            return '<span><span class="d" style="background:' + y.c + '"></span>' + y.n + ' '
              + fmt(ct[y.k]) + ' · ' + Math.round(ct[y.k]/ct.sum*100) + '٪</span>';
          }).join("")
        + '</div></div>';
    }

    var prev = prevDataMonth(k);
    if(prev){
      var a1 = actuals(k), a0 = actuals(prev), rows = [];
      state.cats.forEach(function(c){
        var v1 = a1.by[c.k] || 0, v0 = a0.by[c.k] || 0;
        if(v1 || v0) rows.push({ c: c, d: v1 - v0, v1: v1, v0: v0 });
      });
      rows.sort(function(x, y){ return Math.abs(y.d) - Math.abs(x.d); });
      rows = rows.slice(0, 6).filter(function(r){ return r.d !== 0; });
      if(rows.length){
        h += '<div class="sec"><h2>مقابل ' + esc(mName(prev)) + '</h2>'
          + '<span class="hint">أكبر التغيّرات</span></div><div class="card">';
        h += rows.map(function(r){
          return '<div class="cmp"><span class="cn">' + esc(r.c.e + " " + r.c.n) + '</span>'
            + '<span class="cv">' + fmt(r.v0) + ' ← ' + fmt(r.v1) + '</span>'
            + '<span class="cd ' + (r.d > 0 ? "up" : "dn") + '">'
            + (r.d > 0 ? "▲ +" : "▼ ") + fmt(r.d) + '</span></div>';
        }).join("") + '</div>';
      }
    }
    return h;
  }

  /* ═══ ٢ · الخطة ═══ */
  /* مسار الخطة — أربع مراحل، كل واحدة تُغلق برقم «يبقى بعدها» */
  function planSteps(mk){
    var L = layerSums(mk), left = L.inc, cur = ui.planLayer;
    var out = LAYERS.map(function(x, i){
      var amt, rest, sub;
      if(x.k === "inc"){
        amt = L.inc; rest = L.inc;
        sub = "الراتب والدخل الإضافي";
      } else {
        amt = L[x.k]; left -= amt; rest = left;
        sub = x.k === "duty" ? "ثابت وأقساط وموسمي"
            : x.k === "save" ? "أهداف واستثمار"
            : "البنود المرنة";
      }
      /* العلامة للختام وحده: الخطة أُغلقت أم لا — لا على كل مرحلة */
      var shut = x.k === "flex" && Math.abs(rest) < 1;
      var bad  = rest < 0;
      return '<button class="pstep l-' + x.k + (cur === x.k ? " on" : "")
        + (bad ? " bad" : (shut ? " shut" : "")) + '" data-player="' + x.k + '">'
        + '<s class="sn"><i>' + (i + 1) + '</i>' + x.n + (shut ? ' ✓' : "") + '</s>'
        + '<b>' + (x.k === "inc" ? "" : "−") + fmt(amt) + '</b>'
        + '<em>' + (x.k === "flex"
            ? (Math.abs(rest) < 1 ? "موزّع بالكامل"
               : rest > 0 ? "بقي " + fmt(rest) + " بلا وجهة"
                          : "تجاوزت بـ " + fmt(-rest))
            : "يبقى " + fmt(rest)) + '</em>'
        + '<i class="ss">' + esc(sub) + '</i></button>';
    }).join("");
    return '<div class="card psteps nospan">' + out + '</div>';
  }

  /* ── توزيع المتبقّي ──
     bumpTo يضيف مبلغاً إلى وجهة واحدة · spreadOver يوزّع بالتناسب.
     الوجهة نصّ: "c:<مفتاح>" لبند مصروف · "g:<معرّف>" لهدف. */
  /* خطة واحدة لكل الشهور: تُكتب التعديلات في الأساسية لا في الشهر.
     والماضي يبقى محفوظاً في شهره — كتابة رقم اليوم في خطة الأساس تعيد
     كتابة تاريخٍ لم يحدث هكذا، فتفسد تقاريرك. */
  function onePlan(){ return state.onePlan !== false; }
  function planOwn(mk){
    if(onePlan() && !isPast(mk)) return false;
    return hasOvr(mk) || isPast(mk);
  }
  /* كم شهراً يخالف العامّ؟ */
  function ownMonths(){
    var out = [];
    for(var mk in state.months){
      var m = state.months[mk], what = [];
      if(m.inc) what.push("دخل");
      if(m.plan && Object.keys(m.plan).length) what.push("خطة");
      if(m.gm && Object.keys(m.gm).length) what.push("ادخار");
      if(what.length) out.push({ k: mk, w: what });
    }
    out.sort(function(a, b){ return a.k < b.k ? -1 : 1; });
    return out;
  }
  function bumpTo(dest, add, mk){
    add = Math.round(num(add));
    if(!dest || !add) return false;
    mk = mk || ui.month;
    var own = planOwn(mk);
    if(dest.charAt(0) === "c"){
      var ck = dest.slice(2), c = catOf(ck);
      if(!c) return false;
      var cur = own ? rawP(c, mk, ck) : num(c.p);
      var nv = Math.max(subsSum(c, mk), cur + add);
      if(own) setP(mk, ck, nv); else c.p = nv;
      return true;
    }
    var g = null;
    state.goals.forEach(function(x){ if("g:" + x.id === dest) g = x; });
    if(!g) return false;
    var cg = goalMonthly(g, mk), ng = Math.max(0, cg + add);
    if(own){ var m = month(mk); if(!m.gm) m.gm = {}; m.gm[g.id] = ng; }
    else g.m = ng;
    return true;
  }
  /* التوزيع بالتناسب — والكسر للأكبر نصيباً فلا يضيع ريال */
  function spreadOver(list, total, mk){
    total = Math.round(num(total));
    if(!list.length || total <= 0) return 0;
    var base = list.map(function(x){ return Math.max(0, x.w); });
    var sum = 0; base.forEach(function(v){ sum += v; });
    var share = base.map(function(v){
      return sum > 0 ? Math.floor(total * v / sum) : Math.floor(total / list.length);
    });
    var got = 0; share.forEach(function(v){ got += v; });
    var rest = total - got;
    if(rest > 0){
      var bi = 0;
      base.forEach(function(v, i){ if(v > base[bi]) bi = i; });
      share[bi] += rest;
    }
    var done = 0;
    list.forEach(function(x, i){ if(share[i] && bumpTo(x.d, share[i], mk)) done += share[i]; });
    return done;
  }
  function flexTargets(mk){
    var out = [];
    visibleCats().forEach(function(c){
      if(layerOf(c, mk) !== "flex") return;
      if((c.subs || []).length) return;      /* ذو فروع يُوزّع من داخله */
      out.push({ d: "c:" + c.k, n: c.n, w: catPlan(c, mk) });
    });
    return out;
  }
  function goalTargets(mk){
    return activeGoals().map(function(g){
      return { d: "g:" + g.id, n: g.n, w: goalMonthly(g, mk) || 1 };
    });
  }
  function allocDlg(){
    var mk = ui.month, un = income(mk) - allocated();
    if(un <= 0){ toast("كلُّ دخلِك موزَّعٌ على بنودك وأهدافك — لا شيءَ بلا وجهةٍ ليُوزَّع"); return; }
    var FT = flexTargets(mk), GT = goalTargets(mk);
    var opts = [];
    FT.forEach(function(x){ opts.push({ v: x.d, n: x.n + " · الآن " + fmt(x.w) }); });
    GT.forEach(function(x){ opts.push({ v: x.d, n: x.n + " · هدف · الآن " + fmt(x.w) }); });
    ask({ title: "وزّع " + fmt(un) + " " + cur(),
      msg: "هذا ما لم تُعطِه وجهة بعد في <b>" + esc(mName(mk)) + "</b>.",
      fields: [
        { label: "إلى أين", type: "select", value: opts.length ? opts[0].v : "",
          options: opts },
        { label: "كم", type: "number", value: un }
      ],
      html: function(){
        return dgroup("أو وزّعه دفعة واحدة",
          (FT.length ? '<button class="mini" data-spread="flex">بالتناسب على البنود المرنة</button>' : "")
        + (GT.length ? '<button class="mini" data-spread="goals">بالتناسب على أهدافك</button>' : ""));
      },
      ok: "أضِف",
      onOk: function(v){
        if(bumpTo(v[0], v[1], mk)){ toast("وُزّع " + fmt(num(v[1]))); save(); }
      } });
  }

  /* ── ابْنِ خطتي ── */
  function buildRows(mk){
    var out = [];
    visibleCats().forEach(function(c){
      if(layerOf(c, mk) !== "flex") return;
      if((c.subs || []).length) return;
      var sug = catAvg(c.k, 3);
      if(!sug) return;
      out.push({ k: c.k, n: c.n, e: c.e, c: c.c, now: catPlan(c, mk), sug: sug });
    });
    return out;
  }
  function buildPlanDlg(){
    var mk = ui.month, R = buildRows(mk);
    if(!R.length){
      toast("لا تاريخ صرف كافٍ بعد — سجّل شهراً أو اثنين");
      return;
    }
    var L = layerSums(mk), curFlex = 0, newFlex = 0;
    R.forEach(function(x){ curFlex += x.now; newFlex += x.sug; });
    /* المرن الذي لا مقترح له يبقى كما هو */
    var rest = L.flex - curFlex;
    var after = L.duty + L.save + newFlex + rest;
    var gap = L.inc - after;
    ask({ title: "ابْنِ خطتي من صرفي الفعلي",
      msg: "المقترح متوسط صرفك في آخر ثلاثة أشهر. "
         + "الثابت والأقساط والادخار لا تُمسّ — ليست محلّ تخمين.",
      fields: [],
      html: function(){
        return '<div class="blist">' + R.map(function(x){
          var d = x.sug - x.now;
          return '<div class="brow"><span class="bi" style="background:' + x.c + '22;color:' + x.c + '">'
            + x.e + '</span><span class="bn">' + esc(x.n) + '</span>'
            + '<span class="bv dim">' + fmt(x.now) + '</span>'
            + '<span class="ba">←</span>'
            + '<span class="bv">' + fmt(x.sug) + '</span>'
            + '<span class="bd ' + (d > 0 ? "up" : (d < 0 ? "dn" : "")) + '">'
            + (d > 0 ? "+" : (d < 0 ? "−" : "")) + fmt(Math.abs(d)) + '</span></div>';
        }).join("")
        + '<div class="brow tot"><span class="bi" style="background:var(--card-2)">Σ</span>'
        + '<span class="bn">المرن بعد البناء</span>'
        + '<span class="bv dim">' + fmt(curFlex) + '</span><span class="ba">←</span>'
        + '<span class="bv">' + fmt(newFlex) + '</span><span class="bd"></span></div>'
        + '</div>'
        + '<div class="bsum ' + (gap < 0 ? "bad" : (gap > 0 ? "warn" : "ok")) + '">'
        + 'المخصّص بعد البناء <b>' + fmt(after) + '</b> من دخل <b>' + fmt(L.inc) + '</b> — '
        + (gap === 0 ? "يطابق دخلك تماماً."
           : gap > 0 ? "يبقى <b>" + fmt(gap) + "</b> بلا وجهة توزّعه بعدها."
           : "يتجاوز دخلك بـ <b>" + fmt(-gap) + "</b> — صرفك الفعلي أعلى ممّا يحتمل دخلك.")
        + '</div>';
      },
      ok: "اعتمد المقترح",
      onOk: function(){
        var own = planOwn(mk), n = 0;
        R.forEach(function(x){
          var c = catOf(x.k); if(!c) return;
          if(own) setP(mk, x.k, x.sug); else c.p = x.sug;
          n++;
        });
        toast("بُنيت خطة " + n + " بنداً من صرفك الفعلي");
        save();
      } });
  }

  /* ── قواعدك النسبية ──
     تُولد فارغة عمداً: النظام لا يقترح نسبة، بل يقيس على ما تكتبه.
     t: "L:duty|save|flex" لمرحلة · "C:<مفتاح>" لبند
     op: "min" لا يقلّ عن · "max" لا يتجاوز — pct من دخل الشهر. */
  function rules(){ if(!state.rules) state.rules = []; return state.rules; }
  function ruleName(r){
    if(r.t.charAt(0) === "L"){
      var kk = r.t.slice(2), nm = "";
      LAYERS.forEach(function(x){ if(x.k === kk) nm = x.n; });
      return nm || kk;
    }
    var c = catOf(r.t.slice(2));
    return c ? c.n : "بند محذوف";
  }
  function ruleValue(r, mk){
    if(r.t.charAt(0) === "L"){ var L = layerSums(mk); return num(L[r.t.slice(2)]); }
    var c = catOf(r.t.slice(2));
    return c ? catPlan(c, mk) : 0;
  }
  /* الحكم: { r, val, pct, cap, gap } — gap موجب يعني خالفت */
  function ruleCheck(r, mk){
    var inc = income(mk);
    if(!inc) return null;
    var val = ruleValue(r, mk), pct = val / inc * 100;
    var cap = Math.round(inc * num(r.pct) / 100);
    var gap = r.op === "max" ? val - cap : cap - val;
    return { r: r, val: val, pct: pct, cap: cap, gap: Math.round(gap) };
  }
  function ruleBreaks(mk){
    var out = [];
    rules().forEach(function(r){
      var v = ruleCheck(r, mk);
      if(v && v.gap > 0) out.push(v);
    });
    return out;
  }
  function ruleOfCat(ck){
    var found = null;
    rules().forEach(function(r){ if(r.t === "C:" + ck) found = r; });
    return found;
  }
  function ruleLine(v){
    var r = v.r;

  /* ── ماذا لو تغيّر دخلي ──
     الالتزامات والادخار لا تتغيّر — التزامٌ وقرار. والمرن وحده يتمدّد
     أو ينكمش بالنسبة، فهو الوحيد الذي تملك خفضه فعلاً. */
  function whatIfRows(mk){
    var out = [];
    visibleCats().forEach(function(c){
      if(layerOf(c, mk) !== "flex") return;
      if((c.subs || []).length) return;
      out.push({ k: c.k, n: c.n, e: c.e, c: c.c, now: catPlan(c, mk) });
    });
    return out;
  }
  function whatIfDlg(){
    var mk = ui.month, cur = income(mk), L = layerSums(mk);
    var R = whatIfRows(mk), base = 0;
    R.forEach(function(x){ base += x.now; });
    ask({ title: "ماذا لو تغيّر دخلي",
      msg: "جرّب دخلاً آخر وانظر أثره قبل أن تلتزم به. "
         + "الالتزامات والادخار لا تتغيّر — المرن وحده يتمدّد أو ينكمش.",
      live: true,
      fields: [{ label: "الدخل المفترض", type: "number", value: cur }],
      html: function(v){
        var inc2 = num(v && v[0]);
        if(inc2 <= 0) return '<div class="wsum bad">اكتب دخلاً أكبر من صفر.</div>';
        var room = inc2 - L.duty - L.save;
        if(room < 0){
          return '<div class="wsum bad">بدخل <b>' + fmt(inc2) + '</b> لا يكفيك شيء للمعيشة: '
            + 'التزاماتك <b>' + fmt(L.duty) + '</b> وادخارك <b>' + fmt(L.save) + '</b> '
            + 'يتجاوزان الدخل بـ <b>' + fmt(-room) + '</b>. '
            + 'خفّض الادخار أو أنهِ قسطاً قبل أن تفكّر في المرن.</div>';
        }
        var f = base > 0 ? room / base : 0;
        var pctTxt2 = Math.round((f - 1) * 100);
        var head = '<div class="wsum ' + (inc2 >= cur ? "ok" : "bad") + '">'
          + 'يبقى للمعيشة <b>' + fmt(room) + '</b> بدل <b>' + fmt(base) + '</b> — '
          + (base > 0
              ? 'كل بند مرن ' + (pctTxt2 >= 0 ? "يتّسع" : "ينكمش") + ' بـ <b>'
                + Math.abs(pctTxt2) + '٪</b>.'
              : 'لا بنود مرنة لتوزيعه عليها.')
          + '</div>';
        return head + '<div class="blist">' + R.map(function(x){
          var nv = Math.round(x.now * f), d = nv - x.now;
          return '<div class="brow"><span class="bi" style="background:' + x.c + '22;color:' + x.c + '">'
            + x.e + '</span><span class="bn">' + esc(x.n) + '</span>'
            + '<span class="bv dim">' + fmt(x.now) + '</span><span class="ba">←</span>'
            + '<span class="bv">' + fmt(nv) + '</span>'
            + '<span class="bd ' + (d > 0 ? "dn" : (d < 0 ? "up" : "")) + '">'
            + (d > 0 ? "+" : (d < 0 ? "−" : "")) + fmt(Math.abs(d)) + '</span></div>';
        }).join("") + '</div>';
      },
      ok: "طبّقه على " + mName(mk),
      onOk: function(v){
        var inc2 = num(v[0]);
        if(inc2 <= 0){ toast("اكتب دخلاً أكبر من صفر"); return; }
        var room = inc2 - L.duty - L.save;
        if(room < 0){ toast("الدخل لا يكفي التزاماتك وادخارك — لم يُطبَّق"); return; }
        var f = base > 0 ? room / base : 0;
        var m = month(mk), o = incObj(mk);
        m.inc = { salary: inc2 - o.extra, extra: o.extra };
        if(m.inc.salary < 0){ m.inc = { salary: inc2, extra: 0 }; }
        var own = planOwn(mk);
        R.forEach(function(x){
          var c = catOf(x.k); if(!c) return;
          var nv = Math.max(subsSum(c, mk), Math.round(x.now * f));
          if(own) setP(mk, x.k, nv); else c.p = nv;
        });
        toast("طُبِّق سيناريو دخل " + fmt(inc2));
        save();
      } });
  }

     و«اشتراكات» ثابتٌ لكنه كمالي. فإن لم يُعرف الاسم رجعنا إلى النوع. */
  var CLS_HINTS = [
    { c: "need", w: ["بقال", "سوبر", "تموين", "فاتور", "كهرب", "ماء", "جوال", "إنترنت",
                     "اتصال", "إيجار", "سكن", "بنزين", "وقود", "مواصل", "نقل",
                     "صحة", "علاج", "دواء", "طب", "تعليم", "مدرس", "جامع", "رسوم"] },
    { c: "want", w: ["مطعم", "مطاعم", "قهوة", "كافي", "شخصي", "ترفيه", "لعب", "هداي",
                     "عائل", "اشتراك", "سفر", "رحل", "ملابس", "تسوق", "حلوي", "دخان"] },
    { c: "duty", w: ["قسط", "أقساط", "دين", "قرض", "تمويل", "صدق", "زكا", "وقف",
                     "استثمار", "ادخار", "تأمين", "ضريب"] }
  ];
  function clsSuggest(c){
    if(c.cls) return c.cls;                       /* ما صنّفتَه لا يُمسّ */
    if(invCat() && c.k === INVK) return "duty";
    var n = String(c.n || "");
    for(var i = 0; i < CLS_HINTS.length; i++){
      var h = CLS_HINTS[i];
      for(var j = 0; j < h.w.length; j++){
        if(n.indexOf(h.w[j]) >= 0) return h.c;
      }
    }
    var t = typeOf(c);
    if(t === "inst") return "duty";
    if(t === "fix") return "need";
    return "want";
  }
  function clsCount(){
    var n = 0;
    visibleCats().forEach(function(c){ if(!c.cls) n++; });

    var CS = visibleCats();

      onCancel: function(){ clsDraft = null; } });

      h: ["«الفعلي مقابل المخطط» يقول أيّ بندٍ خالف خطّته وبكم.",
          "و«احتياج · كماليّ · التزام» يقول أين تملك الخفض فعلاً."] },
    { k: "year", i: "📅", n: "السنة",
      w: "سنتُك كلُّها في جدول: شهرٌ في كلّ عمود، وبندٌ في كلّ صفّ.",
      h: ["«الدفتر» فيه وجهان: خطّتُك وصرفُك — بدّل بينهما من أعلاه.",
          "وما قبل شهرِ وضعِ خطّتك فارغٌ عمداً: الدفترُ يقول ما كان."] },
    { k: "accts", i: "🏦", n: "الحسابات",
      w: "أرصدةُ حساباتك وبطاقاتك، وما عليك من التزامات.",
      h: ["اربط البند بحسابٍ فيُخصم منه تلقائياً عند الصرف.",
          "و«صافي ثروتك» = ما تملك ناقص ما عليك."] },
    { k: "inv", i: "📈", n: "الاستثمار",
      w: "ما تضعه في محافظك ونموّه — منفصلاً عن مصروفك.",
      h: ["لكلّ محفظةٍ ما وضعتَه فيها وقيمتُها اليوم، فيظهر الربح.",
          "و«سقف الاستثمار الشهري» يمنعك أن تتجاوز ما تحتمله."] }
  ];

  /* الأنواع والمدّة: يُقرآن مع الدليل ومع حوار البند سواء */
  var GUIDE_TYPES = [
    ["~ متغيّر", "لا سلوك خاصّ — رقمُك كما هو، وتتابعه بالمقارنة."],
    ["⟳ ثابت", "مبلغٌ يتكرّر، يُسجَّل تلقائياً أوّل الشهر فلا تكتبه."],
    ["◷ موسمي", "تُدخل المبلغ السنويّ فيُقسَّم على اثني عشر ويُحجز شهرياً."],
    ["▤ قسط", "مبلغٌ × أشهر — يعدّ تنازلياً، وحين ينتهي يختفي وحده."],
    ["↻ دوريّ", "كلّ ن شهر: يُحجز مقسوماً على دورته، ويقول متى يُدفع."],
    ["٪ نسبة", "نسبةٌ من دخل الشهر — تتغيّر مع راتبك بلا تعديل."],
    ["⌐ سقف", "حدٌّ لا تتجاوزه — ولا يُحجز من دخلك ولا يدخل مجموعَ خطّتك."]
  ];
  var GUIDE_SPAN = [
    ["مستمرّ", "يظهر كلّ شهر."],
    ["هذا الشهر وحده", "فاتورةٌ عابرة: تُسجَّل في شهرها ولا تلاحقك بعده."],
    ["موقوف مؤقّتاً", "يخرج من خطّة الشهر ويبقى تاريخُه في التقارير."]
  ];

  function guideOf(tab){
    for(var i = 0; i < GUIDE.length; i++) if(GUIDE[i].k === tab) return GUIDE[i];
    return null;
  }
  /* بطاقةُ الشاشة: سطرٌ واحد وزرٌّ إلى الدليل. وتُغلق كسائر الشروح. */
  function guideCard(){
    var g = guideOf(ui.tab || "dash");
    if(!g) return "";
    return '<div class="hintnote gcard" data-note="guide-' + g.k + '">'
      + '<b>' + g.i + ' ' + esc(g.n) + '</b> — ' + esc(g.w)
      + ' <button class="mini" data-guide="1">الدليل الكامل</button></div>';
  }

  var NOTES = {};
  function seenMap(){ if(!state.seen) state.seen = {}; return state.seen; }
  function applyNotes(){
    var tab = ui.tab || "dash", S = seenMap();
    Array.prototype.slice.call(document.querySelectorAll("[data-note]")).forEach(function(el){
      var k = el.getAttribute("data-note");
      NOTES[k] = tab;
      if(S[k]){ if(el.parentNode) el.parentNode.removeChild(el); return; }
      if(el.querySelector(".nx")) return;
      var b = document.createElement("button");
      b.className = "nx";
      b.setAttribute("data-seen", k);
      b.setAttribute("title", "\u0641\u0647\u0645\u062a \u2014 \u0644\u0627 \u062a\u064f\u0638\u0647\u0650\u0631\u0647 \u062b\u0627\u0646\u064a\u0629");
      b.textContent = "\u2715";
      el.insertBefore(b, el.firstChild);
      el.classList.add("dsm");
    });
  }
  function hiddenNotes(tab){
    var n = 0, S = seenMap();
    for(var k in S){ if(S[k] && (!tab || NOTES[k] === tab)) n++; }
    return n;
  }
  function hiddenHere(){
    var n = 0, S = seenMap(), tab = ui.tab || "dash";
    for(var k in NOTES){ if(NOTES[k] === tab && S[k]) n++; }
    return n;
  }

  /* ═══ التقارير ═══ */
  /* الأشهر التي فيها حركة فعلاً، منتهيةً بالشهر المعروض */
  function repMonths(){
    var out = [], k = ui.month, n = num(ui.repN) || 6;
    for(var i = 0; i < 36 && out.length < n; i++){
      var mk = shift(k, -i);
      var m = state.months[mk];
      if(m && m.items && m.items.length) out.push(mk);
      if(mk < "2000-01") break;
    }
    return out.reverse();
  }
  /* الطبقة الفعلية لبند من صرفه — لا من خطته */
  function repTotals(MS){
    var T = { inc: 0, spent: 0, duty: 0, flex: 0, saveMoved: 0, savePlan: 0,
              byCat: {}, months: MS.length };
    MS.forEach(function(mk){
      T.inc += income(mk);
      var a = actuals(mk);
      T.spent += a.sum;
      state.cats.forEach(function(c){
        var v = a.by[c.k] || 0;
        if(!v) return;
        T.byCat[c.k] = (T.byCat[c.k] || 0) + v;
        if(invCat() && c.k === INVK) return;      /* الاستثمار يُعدّ ادخاراً */
        if(layerOf(c, mk) === "duty") T.duty += v; else T.flex += v;
      });
      T.savePlan += planGoals() + planInv();
      var d = state.months[mk] && state.months[mk].dist;
      if(d) for(var key in d){
        if(key.charAt(0) === "g" || key.charAt(0) === "i") T.saveMoved += num(d[key]);
      }
    });
    return T;
  }
  /* دقّة الخطة: لكل بند، انحرافه عن خطته شهراً بشهر */
  function repAccuracy(MS){
    var out = [];
    visibleCats().forEach(function(c){
      /* مال الاستثمار توزيعٌ لا مصروف — مقارنته بخطته هنا تقارن صفراً
         بألف، ومكانه محور الادخار. */
      if(invCat() && c.k === INVK) return;
      var n = 0, sumPlan = 0, sumAct = 0, absDev = 0, over = 0, under = 0;
      MS.forEach(function(mk){
        var p = catPlan(c, mk), v = actuals(mk).by[c.k] || 0;
        if(!p && !v) return;
        n++; sumPlan += p; sumAct += v;
        absDev += Math.abs(v - p);
        if(v > p) over++; else if(v < p) under++;
      });
      if(!n || sumPlan <= 0) return;      /* لا خطة تُقاس عليها */
      out.push({ c: c, n: n, plan: sumPlan, act: sumAct,
                 dev: absDev / sumPlan, bias: (sumAct - sumPlan) / sumPlan,
                 over: over, under: under });
    });
    out.sort(function(a, b){ return b.dev - a.dev; });
    return out;
  }
  function repBar(pct, color){
    return '<span class="rbar"><i style="width:' + Math.max(0, Math.min(100, pct))
      + '%;background:' + color + '"></i></span>';
  }
  function viewRep(){
    var MS = repMonths(), h = "";
    var PICKS = [3, 6, 12];
    h += '<div class="card repbar nospan"><span class="rl">الفترة</span>'
      + PICKS.map(function(n){
          return '<button class="chip sm' + (num(ui.repN) === n ? " on" : "")
            + '" data-repn="' + n + '">آخر ' + arMonths(n) + '</button>';
        }).join("")
      + '<span class="rh">' + (MS.length
          ? esc(mName(MS[0])) + " ← " + esc(mName(MS[MS.length - 1])) + " · "
            + arMonths(MS.length) + " فيها حركة"
          : "لا أشهر فيها حركة بعد") + '</span></div>';

    if(!MS.length){
      h += '<div class="card"><div class="empty"><b>لا شيءَ يُقاس بعد</b>'
        + 'هنا تُقرأ أرقامُك: أين يذهب راتبُك · ودقّةُ خطّتك · وما تغيّر بين '
        + 'شهرٍ وشهر. ويكفي مصروفُ شهرٍ واحدٍ لتبدأ الصورةُ بالظهور.'
        + '<div class="acts"><button class="act solid" data-tab="spend">'
        + 'سجّل مصروفَ هذا الشهر</button></div></div></div>';
      return h;
    }

    var T = repTotals(MS), left = T.inc - T.spent;
    var per = function(v){ return T.inc > 0 ? Math.round(v / T.inc * 100) : 0; };

    /* ── مؤشّرات الفترة ── */
    h += '<div class="kpis">'
      + kpi("◈", "accent", "دخلك في الفترة", fmt(T.inc), "",
            fmt(Math.round(T.inc / MS.length)) + " شهرياً في المتوسط")
      + kpi("↓", "warn", "ما صرفته", fmt(T.spent), "",
            per(T.spent) + "٪ من دخلك · " + fmt(Math.round(T.spent / MS.length)) + " شهرياً")
      + kpi("▲", "ok", "ما ادّخرته فعلاً", fmt(T.saveMoved), "",
            per(T.saveMoved) + "٪ من دخلك")
      + kpi(left < 0 ? "!" : "◇", left < 0 ? "warn" : "gold",
            left < 0 ? "صرفت فوق دخلك" : "لم يُصرف", fmt(Math.abs(left)), "",
            left < 0 ? "الفرق من رصيد سابق" : per(left) + "٪ بقي في حسابك")
      + '</div>';

    /* ── ١ · مسار الريال ── */
    var FLOW = [
      { n: "التزامات ثابتة وأقساط", v: T.duty, c: "var(--warn)",
        s: "فواتير وأقساط وما لا يتفاوض" },
      { n: "معيشة مرنة", v: T.flex, c: "var(--ink-2)", s: "ما تملك خفضه" },
      { n: "ادخار وصل فعلاً", v: T.saveMoved, c: "var(--ok)", s: "أهداف واستثمار" },
      { n: left >= 0 ? "بقي بلا صرف" : "صُرف من رصيد سابق", v: Math.abs(left),
        c: "var(--line-2)", s: left >= 0 ? "لم يخرج من حسابك" : "صرفتَ فوق دخل الفترة" }
    ];
    h += '<div class="sec"><h2>مسار الريال</h2>'
      + '<span class="hint">من ' + fmt(T.inc) + ' إلى أين انتهت</span></div><div class="card">';
    h += '<div class="flowbar">' + FLOW.map(function(x){
      return x.v > 0 ? '<i style="flex:' + x.v + ';background:' + x.c + '" title="'
        + esc(x.n) + '"></i>' : "";
    }).join("") + '</div>';
    h += FLOW.map(function(x){
      return '<div class="frow"><span class="fd" style="background:' + x.c + '"></span>'
        + '<span class="fn"><b>' + esc(x.n) + '</b><s>' + esc(x.s) + '</s></span>'
        + '<span class="fv">' + fmt(x.v) + '<s>' + per(x.v) + '٪</s></span></div>';
    }).join("") + '</div>';

    /* ── البنود التي تلتهم أكبر نصيب ── */
    var TOP = [];
    for(var ck in T.byCat){
      var c2 = catOf(ck);
      if(c2) TOP.push({ c: c2, v: T.byCat[ck] });
    }
    TOP.sort(function(a, b){ return b.v - a.v; });
    var mx = TOP.length ? TOP[0].v : 1;
    h += '<div class="sec"><h2>أين يذهب راتبك</h2>'
      + '<span class="hint">' + TOP.length + ' بنداً · مرتّبة بالنصيب</span></div><div class="card">';
    h += TOP.map(function(x){
      var cl = clsOf(x.c), CO = null;
      CLASSES.forEach(function(y){ if(y.k === cl) CO = y; });
      return '<div class="trow"><span class="ti" style="background:' + x.c.c
        + '22;color:' + x.c.c + '">' + x.c.e + '</span>'
        + '<span class="tn"><b>' + esc(x.c.n) + '</b>'
        + (CO ? '<span class="tc" style="color:' + CO.c
            + ';background:color-mix(in srgb,' + CO.c + ' 13%,transparent)">'
            + CO.n + '</span>' : "")
        + repBar(x.v / mx * 100, x.c.c) + '</span>'
        + '<span class="tv">' + fmt(x.v) + '<s>' + per(x.v) + '٪ من دخلك · '
        + fmt(Math.round(x.v / MS.length)) + ' شهرياً</s></span></div>';
    }).join("") + '</div>';

    /* ── التصنيف: احتياج · كمالي · التزام ── */
    /* الشارة والملخّص يقرآن clsOf نفسه — وإلا تناقض رقمان في شاشة واحدة.
       و«غير مؤكَّد» يعدّ ما يقوم على افتراض لم تؤكّده، لا ما لا تصنيف له. */
    var CT = {}, unsure = 0;
    CLASSES.forEach(function(y){ CT[y.k] = 0; });
    TOP.forEach(function(x){
      CT[clsOf(x.c)] = (CT[clsOf(x.c)] || 0) + x.v;
      if(!x.c.cls) unsure += x.v;
    });
    h += '<div class="sec"><h2>احتياج · كمالي · التزام</h2>'
      + '<span class="hint">نسبةُ كلّ نوعٍ من مجموع ما صرفتَه</span></div><div class="card">';
    if(unsure > 0){
      h += '<div class="clsnag"><b>' + fmt(unsure) + ' ريال (' + per(unsure)
        + '٪) على تصنيف افتراضي لم تؤكّده</b>'
        + '<s>الأرقام أدناه تفترض تصنيفاً استنتجه التطبيق من اسم كل بند ونوعه. '
        + 'أكّدها مرة واحدة فتصير هذه القسمة قولك أنت، وتبقى مضبوطة لكل شهر قادم.</s>'
        + '<div class="acts"><button class="act solid" data-classify="1">راجع التصنيف</button></div></div>';
    }
    h += '<div class="flowbar">' + CLASSES.map(function(y){
      return CT[y.k] > 0 ? '<i style="flex:' + CT[y.k] + ';background:' + y.c + '"></i>' : "";
    }).join("") + '</div>';
    h += CLASSES.map(function(y){
      return '<div class="frow"><span class="fd" style="background:' + y.c + '"></span>'
        + '<span class="fn"><b>' + esc(y.n) + '</b></span>'
        + '<span class="fv">' + fmt(CT[y.k] || 0) + '<s>' + per(CT[y.k] || 0) + '٪ من دخلك</s></span></div>';
    }).join("") + '</div>';

    /* ── ٢ · دقّة خطتك ── */
    var AC = repAccuracy(MS);
    h += '<div class="sec"><h2>دقّة خطتك</h2>'
      + '<span class="hint">الخطة مقابل الواقع في ' + arMonths(MS.length) + '</span></div>'
      + '<div class="card">';
    if(!AC.length){
      h += '<div class="empty"><b>لا شهرَ سابقاً يُقارن به</b>'
        + 'يقيس هذا القسمُ فرقَ ما خطّطتَه عمّا صرفتَه، ليقول أيَّ بنودك '
        + 'تُقدّرها بدقّةٍ وأيَّها تُخطئ فيها. يظهر بعد شهرٍ كاملٍ مسجَّل.</div>';
    } else {
      h += AC.map(function(x){
        var b = Math.round(x.bias * 100), d = Math.round(x.dev * 100);
        var verdict = Math.abs(b) < 8 ? "تقديرك دقيق"
          : (b > 0 ? "تصرف فوق خطتك دائماً" : "تبالغ في تقديره");
        return '<div class="arow"><span class="ai" style="background:' + x.c.c
          + '22;color:' + x.c.c + '">' + x.c.e + '</span>'
          + '<span class="an"><b>' + esc(x.c.n) + '</b>'
          + '<s>' + esc(verdict) + ' · تجاوزتَه ' + x.over + ' من ' + x.n + ' شهراً</s></span>'
          + '<span class="av"><b class="' + (b > 0 ? "up" : (b < 0 ? "dn" : "")) + '">'
          + (b > 0 ? "+" : (b < 0 ? "−" : "")) + Math.abs(b) + '٪</b>'
          + '<s>خطة ' + fmt(x.plan) + ' · فعلي ' + fmt(x.act) + '</s></span></div>';
      }).join("");
      var worst = AC[0];
      h += '<div class="yhint" data-note="ne45cdcf" style="border-bottom:0"><b>الأبعد عن خطته:</b> '
        + esc(worst.c.n) + ' — ينحرف ' + Math.round(worst.dev * 100)
        + '٪ عن المخطط في المتوسط. البند الذي يتذبذب هكذا لا يُخطَّط له برقم '
        + 'ثابت؛ ارفع خطته إلى متوسط صرفك الفعلي، أو قسّمه فروعاً.</div>';
    }
    h += '</div>';

    /* ── ٣ · ادخارك الحقيقي والتسريب ── */
    h += '<div class="sec"><h2>ادخارك الحقيقي</h2>'
      + '<span class="hint">ما خطّطتَ لادّخاره مقابل ما وضعتَه فعلاً</span></div><div class="card">';
    h += MS.map(function(mk){
      var d = state.months[mk] && state.months[mk].dist, mv = 0;
      if(d) for(var key in d){
        if(key.charAt(0) === "g" || key.charAt(0) === "i") mv += num(d[key]);
      }
      var inc = income(mk), rate = inc > 0 ? Math.round(mv / inc * 100) : 0;
      return '<div class="srow"><span class="sm">' + esc(mName(mk)) + '</span>'
        + repBar(rate * 3, mv > 0 ? "var(--ok)" : "var(--line-2)")
        + '<span class="sv">' + fmt(mv) + '<s>' + rate + '٪ من ' + fmt(inc) + '</s></span></div>';
    }).join("");
    var rateAll = T.inc > 0 ? Math.round(T.saveMoved / T.inc * 100) : 0;
    h += '<div class="srow tot"><span class="sm">المتوسط</span>'
      + repBar(rateAll * 3, "var(--ok)")
      + '<span class="sv">' + fmt(Math.round(T.saveMoved / MS.length))
      + '<s>' + rateAll + '٪ من دخلك</s></span></div></div>';

    /* التسريب */
    var LEAK = [], leakSum = 0;
    MS.forEach(function(mk){
      var R = reconcile(mk);
      if(R && Math.abs(R.gap) >= 1){ LEAK.push({ k: mk, g: R.gap }); leakSum += R.gap; }
    });
    h += '<div class="sec"><h2>الفرق غير المفسَّر</h2>'
      + '<span class="hint">' + (LEAK.length ? LEAK.length + " شهراً" : "لا فروق") + '</span></div>'
      + '<div class="card">';
    if(!LEAK.length){
      h += '<div class="empty"><b>لا فرقَ غير مفسَّر ✓</b>'
        + 'كلُّ ريالٍ في أرصدتك يُفسّره ما سجّلتَه — وهذا ما ينبغي.'
        + '<br>وإن كنتَ تتوقّع فرقاً ولا تراه، فقد لا تكون حفظتَ لقطاتِ '
        + 'الأرصدة: التسويةُ تحتاج لقطةَ أوّل الشهر وآخره.</div>';
    } else {
      h += LEAK.map(function(x){
        return '<div class="srow"><span class="sm">' + esc(mName(x.k)) + '</span>'
          + '<span class="sn2">' + (x.g < 0 ? "نقص رصيدك أكثر مما تفسّره خطتك"
                                            : "زاد رصيدك فوق المتوقَّع") + '</span>'
          + '<span class="sv ' + (x.g < 0 ? "neg" : "") + '">'
          + (x.g > 0 ? "+" : "−") + fmt(Math.abs(x.g)) + '</span></div>';
      }).join("");
      h += '<div class="yhint" data-note="n7c3c42b" style="border-bottom:0">مجموع الفروق <b>'
        + (leakSum >= 0 ? "+" : "−") + fmt(Math.abs(leakSum)) + '</b> ريال على '
        + arMonths(MS.length) + '. الفرق السالب مصروف لم تسجّله، والموجب دخل لم تسجّله '
        + '— كلاهما يُصلَح من تبويب الحسابات.</div>';
    }
    h += '</div>';

    /* الأمنيات: ما أُنفق عليها، وما وفّره الانتظار — من دفتر السعر وحدَه */
    var inR = {}, WB = [], wpaid = 0;
    MS.forEach(function(mk){ inR[mk] = 1; });
    wishList().forEach(function(x){
      if(!x.bought || !inR[x.bm]) return;
      WB.push(x);
      wpaid += (num(x.paid) || wishPrice(x));
    });
    var REC = wishRecord();
    h += '<div class="sec"><h2>الأمنيات</h2><span class="hint">'
      + (WB.length ? (WB.length + " في المدّة") : "لا شيء") + '</span></div>'
      + '<div class="card">';
    if(!WB.length){
      h += '<div class="empty"><b>لم تشترِ أمنيةً في هذه المدّة</b>'
        + 'يقول هذا القسمُ كم أنفقتَ على ما اشتهيتَه، وكم وفّر عليك '
        + 'الانتظار. سجّل ما تريده في «أمنياتك» — ويوم تشتريه يُحسب هنا.'
        + '<div class="acts"><button class="act solid" data-tab="wish">'
        + 'افتح أمنياتك</button></div></div>';
    } else {
      h += '<div class="srow"><span class="sm">أنفقتَ عليها</span>'
        + '<span class="sn2">' + WB.length + ' أمنيةً في '
        + arMonths(MS.length) + '</span>'
        + '<span class="sv">' + fmt(wpaid) + '</span></div>';
      if(REC.fast.n + REC.slow.n >= 3){
        h += '<div class="yhint" style="border-bottom:0">من سجلّك: '
          + (REC.fast.n ? ('ما اشتريتَه في أسبوعه <b>' + REC.fast.n + '</b> منها <b>'
                           + REC.fast.re + '</b> لا تستعملها. ') : "")
          + (REC.slow.n ? ('وما انتظرتَه شهراً <b>' + REC.slow.n + '</b> منها <b>'
                           + REC.slow.re + '</b> لا تستعملها.') : "")
          + '</div>';
      }
    }
    h += '</div>';
    return h;
  }

  /* ── شاشةُ الأمنيات: استديو ──
     شبكةُ بطاقاتٍ صغيرة، تتمدّد الواحدةُ في مكانها إذا فُتحت. */
  var WFIL = [["live", "نشطة"], ["snooze", "مؤجَّلة"],
              ["bought", "مشتراة"], ["all", "الكلّ"]];

  function wishChip(x, k, R){
    var p = wishPrice(x), got = wishGot(x);
    if(x.bought)
      return { n: x.bm ? ("اشتُريت في " + mName(x.bm)) : "مشتراة", c: "" };
    if(x.snooze) return { n: "مؤجَّلة", c: "" };
    if(p <= 0) return { n: "بلا ثمن", c: "warn" };
    if(R.now + got >= p) return { n: "يسعها ما بقي", c: "ok" };
    var g = wishGoal(x);
    if(g){
      var rest = Math.max(0, p - got), rate = num(g.m) || num(g.pm);
      if(rate > 0)
        return { n: "تكتمل في " + mName(shift(k, Math.max(0, Math.ceil(rest / rate) - 1))),
                 c: "acc" };
    }
    return { n: "ينقصك " + fmt(p - (R.now + got)), c: "warn" };
  }

  function wishTile(x, k, R, open){
    var p = wishPrice(x), got = wishGot(x), planned = !!wishGoal(x);
    var base = planned ? got : Math.min(Math.max(0, R.now), p);
    var pct = p > 0 ? Math.max(0, Math.min(100, Math.round(base / p * 100))) : 0;
    var ch = wishChip(x, k, R), tg = x.bought ? null : wishAgeTag(x);
    var u = String(x.url || "").trim();
    var lnk = /^https?:\/\//i.test(u);
    var link = lnk ? ('<a class="wlink" href="' + esc(u) + '" target="_blank" '
                      + 'rel="noopener noreferrer" title="افتح رابطها">↗</a>') : "";
    var icon = x.img
      ? ('<span class="wcov"><img src="' + esc(x.img) + '" alt=""></span>')
      : ('<span class="wbig">' + (x.e ? esc(x.e) : "🎁") + '</span>');
    var chips = '<span class="wchips">'
      + '<span class="wchip ' + ch.c + '">' + esc(ch.n) + '</span>'
      + (tg ? ('<span class="wtag ' + tg.c + '" title="' + esc(tg.t) + '">'
               + esc(tg.n) + '</span>') : "")
      + '</span>';
    var bar = x.bought ? ""
      : ('<div class="track wtrack"><i style="width:' + pct + '%;background:'
         + (pct >= 100 ? "var(--ok)" : "var(--accent)") + '"></i></div>');
    var rng = wishRange(x);
    var price = fmt(x.bought ? num(x.paid || p) : p) + ' ' + esc(cur());
    var rngTx = (rng && !x.bought)
      ? ('<s class="wrng" title="' + esc("المعتمدُ متوسّطُ المدى") + '">'
         + fmt(rng.lo) + '–' + fmt(rng.hi) + '</s>') : "";
    /* مفتوحةً: صفٌّ كصفوف التطبيق — العمودُ يعلو نصفَ الشاشة بلا داعٍ */
    if(open)
      return '<div class="wtile open" data-wsel="' + x.id + '">' + link
        + '<span class="wsm">' + icon + '</span>'
        + '<span class="wtx"><b class="wnm3">' + esc(x.n) + '</b>' + chips + '</span>'
        + '<span class="rt"><b class="a">' + price + '</b>'
        + '<b class="b">' + (rng && !x.bought ? (fmt(rng.lo) + '–' + fmt(rng.hi))
                             : (x.bought ? "مدفوع" : (pct + '٪'))) + '</b></span>'
        + bar + '</div>';
    return '<div class="wtile' + (x.img ? " cov" : "") + '" data-wsel="' + x.id + '">'
      + link + icon
      + '<b class="wnm3">' + esc(x.n) + '</b>'
      + '<s class="wpr">' + price + '</s>' + rngTx
      + chips + bar + '</div>';
  }

  function wishHTML(k){
    var W = wishList(), R = wishRoom(k);
    var live = W.filter(wishActive);
    var slept = W.filter(function(x){ return !x.bought && x.snooze; });
    var done = W.filter(function(x){ return x.bought && !x.arch; });
    var hid = W.filter(function(x){ return x.bought && x.arch; });
    live.sort(wishOrder);
    slept.sort(wishOrder);
    var h = "";

    /* ١ · رقمان لا أكثر */
    h += '<div class="kpis wtwo">'
      + kpi("◈", "accent", "فائض الشهر", fmt(R.surplus), "", "لو مضى كما خُطّط")
      + kpi("◇", "ok", "ما بقي الآن", fmt(R.now), "", "وبه تشتري اليوم")
      + '</div>';

    var rdy = wishReady(k);
    if(rdy.length){
      h += '<div class="card wrdy"><div class="row">'
        + '<span class="ic" style="background:var(--ok-soft);color:var(--ok)">✓</span>'
        + '<span><b class="nm">صارت في متناولك</b><s class="sub">'
        + rdy.map(function(w){
            return (w.e || "🎁") + " " + esc(w.n) + " · " + fmt(wishPrice(w));
          }).join(" · ") + '</s></span></div></div>';
    }

    var ASK = wishAsk();
    if(ASK.length){
      h += '<div class="sec"><h2>سؤالٌ بعد شهر</h2>'
        + '<span class="hint">' + ASK.length + '</span></div><div class="card">'
        + '<div class="whint">مضى شهرٌ على شرائها — أتستعملها؟ سؤالٌ واحدٌ '
        + 'يبني سجلَّك، ولا يُسأل مرّتين.</div>'
        + ASK.map(function(w){
            return '<div class="askr"><b>' + (w.e || "🎁") + ' ' + esc(w.n) + '</b>'
              + '<span class="cmodes">'
              + '<button class="mini on" data-wuse="' + w.id + '|2">أستعملها</button>'
              + '<button class="mini" data-wuse="' + w.id + '|1">قليلاً</button>'
              + '<button class="mini" data-wuse="' + w.id + '|0">لا</button>'
              + '</span></div>';
          }).join("")
        + '</div>';
    }

    /* ٢ · الفلاتر */
    var CNT = { live: live.length, snooze: slept.length,
                bought: done.length, all: W.length };
    var fil = ui.wfil || "live";
    if(!CNT[fil] && CNT.live) fil = "live";
    var SET = { live: live, snooze: slept, bought: done,
                all: live.concat(slept, done, hid) };
    var show = SET[fil] || live;

    h += '<div class="sec"><h2>أمنياتك</h2><span class="hint">'
      + (wishCap() ? ("سقفُ الكماليّات " + fmt(wishSpent(k)) + " من " + fmt(wishCap()))
                   : "بلا سقف")
      + ' · <a class="lnk" data-wcap="1">عدّله</a></span></div>'
      + '<div class="wfil">'
      + WFIL.map(function(f){
          return '<button class="chip sm' + (fil === f[0] ? " on" : "")
            + '" data-wfil="' + f[0] + '">' + f[1]
            + '<i>' + (CNT[f[0]] || 0) + '</i></button>';
        }).join("")
      + '</div>';

    /* ٣ · الشبكة */
    var sel = ui.wsel;
    if(!sel || !show.some(function(x){ return x.id === sel; })) sel = "";
    if(!show.length){
      h += '<div class="card"><div class="empty"><b>'
        + (fil === "live" ? "لا أمنياتٍ نشطة" : "لا شيء هنا")
        + '</b>' + (fil === "live"
            ? "سجّل ما تريده بثمنه، فيُقال لك من أين يأتي ومتى تبلغه."
            : "لا شيءَ في هذا الباب — والأبوابُ فوقَه تقلّب بين النشطة "
              + "والمؤجَّلة والمشتراة.")
        + (fil === "live" || fil === "all"
            ? '<div class="acts"><button class="act solid" data-addwish="1">'
              + '+ أمنيةٌ جديدة</button></div>' : "")
        + '</div></div>';
    } else {
      h += '<div class="wgrid">';
      /* موضعُ الإضافة في الشبكة نفسِها — لا في زاويةٍ تُغفَل */
      if(fil === "live" || fil === "all")
        h += '<button class="wadd2" data-addwish="1">'
          + '<span class="wplus">+</span><b>أمنيةٌ جديدة</b>'
          + '<s>اسمُها وثمنُها يكفيان</s></button>';
      show.forEach(function(x){
        var open = (x.id === sel);
        var p = wishPrice(x), can = (R.now + wishGot(x)) >= p;
        h += '<div class="card wcard' + (open ? " open" : "")
           + (x.bought ? " won" : "") + '">'
          + wishTile(x, k, R, open);
        if(open){
          h += '<div class="wbody"><div class="wcol">';
          h += wishNoteHTML(x);
          h += wishPlanHTML(x, k);
          h += simHTML(x, k);
          h += outStripHTML(k, p);
          h += '</div><div class="wcol">';
          if(!x.bought){
            h += '<div class="wways"><s class="wlab">طرقُك إليها</s>';
            wishWays(x, k).forEach(function(o){
              h += '<div class="wway ' + o.t + '"><span class="ic wwi">' + o.i + '</span>'
                + '<span class="wwt"><b class="nm">' + o.n + '</b>'
                + '<s class="sub">' + o.d + '</s></span>'
                + (o.b ? ('<button class="mini" ' + o.a + '>' + o.b + '</button>') : "")
                + '</div>';
            });
            h += '</div>';
          }
          h += '</div></div>';
          h += '<div class="wfoot">'
            + (function(){
                var r = '<span class="impx"><s>أهمّيّتها</s><span class="dots">';
                for(var q = 1; q <= 5; q++)
                  r += '<button class="dot' + (q <= wishImp(x) ? " on" : "")
                     + '" data-wimp="' + x.id + '|' + q + '" title="' + q + ' من ٥"></button>';
                return r + '</span></span>';
              })()
            + (x.bought
                ? ('<button class="mini" data-wundo="' + x.id + '">تراجع عن الشراء</button>'
                   + '<button class="mini" data-wdel="' + x.id + '">احذف</button>')
                : ('<button class="mini' + (can ? " on" : "") + '" data-wbuy="' + x.id
                   + '">اشتريتها</button>'
                   + '<button class="mini" data-wsnooze="' + x.id + '">'
                   + (x.snooze ? "أعِدها" : "أجّلها") + '</button>'
                   + '<button class="mini" data-wedit="' + x.id + '">عدّلها</button>'
                   + '<button class="mini" data-wdel="' + x.id + '">احذف</button>'))
            + '</div>';
        }
        h += '</div>';
      });
      h += '</div>';
    }

    if(fil === "bought" && hid.length){
      h += '<div class="card"><div class="mrow"><span class="mn">'
        + hid.length + ' مخفيّة<span class="ms">أُخفيت من القائمة وهي باقيةٌ '
        + 'في سجلّك وتقاريرك — تجدها في «الكلّ».</span></span></div></div>';
    }
    if(fil === "bought" && done.length){
      h += '<div class="card"><div class="wact">'
        + '<button class="mini" data-wclear="1">أخفِ المشتراة من القائمة</button>'
        + '</div></div>';
    }

    /* ٤ · جدولُ الشراء */
    if(live.length > 1){
      var SC = wishSchedule(k);
      h += '<div class="sec"><h2>جدولُ الشراء</h2>'
        + '<span class="hint">'
        + (wishSortMode() === "price" ? "بالأرخص" : "بالأهمّ") + '</span></div>'
        + '<div class="card"><div class="whint">أمنياتُك موزَّعةً على أشهرك: '
        + 'يُجمع فائضُ كلّ شهر' + (wishCap() ? " (مقصوصاً بسقف الكماليّات)" : "")
        + '، فكلّما بلغ ثمنَ الأولى حُجزت لذلك الشهر.</div>'
        + '<div class="wsch">'
        + SC.map(function(o){
            return '<div class="schr' + (o.k ? "" : " no") + '">'
              + '<b>' + (o.w.e || "🎁") + ' ' + esc(o.w.n) + '</b>'
              + '<s>' + fmt(wishPrice(o.w)) + ' ' + esc(cur())
              + (wishGot(o.w) > 0 ? (' · بقي ' + fmt(wishNeed(o.w))) : "")
              + ' · أهمّيّة ' + wishImp(o.w) + '/٥</s>'
              + '<i>' + (o.k ? esc(mName(o.k)) : "لا تبلغها هذه السنة") + '</i></div>';
          }).join("")
        + '</div>'
        + '<div class="wact">'
        + '<button class="mini' + (wishSortMode() === "value" ? " on" : "")
        + '" data-wsort="value">رتّب بالأهمّ</button>'
        + '<button class="mini' + (wishSortMode() === "price" ? " on" : "")
        + '" data-wsort="price">رتّب بالأرخص</button></div></div>';
    }

    /* ٥ · سجلُّك */
    var REC2 = wishRecord();
    if(REC2.fast.n + REC2.slow.n >= 3){
      h += '<div class="sec"><h2>سجلُّك</h2>'
        + '<span class="hint">' + (REC2.fast.n + REC2.slow.n) + ' إجابة</span></div>'
        + '<div class="card"><div class="wsch">'
        + (REC2.fast.n
            ? ('<div class="schr"><b>اشتريتَها في أسبوعها</b>'
               + '<s>' + REC2.fast.n + ' أمنية</s><i class="'
               + (REC2.fast.re * 2 > REC2.fast.n ? "bad" : "")
               + '">' + REC2.fast.re + ' لا تستعملها</i></div>')
            : "")
        + (REC2.slow.n
            ? ('<div class="schr"><b>انتظرتَها شهراً فأكثر</b>'
               + '<s>' + REC2.slow.n + ' أمنية</s><i class="'
               + (REC2.slow.re * 2 > REC2.slow.n ? "bad" : "")
               + '">' + REC2.slow.re + ' لا تستعملها</i></div>')
            : "")
        + '</div><div class="whint">بالعدد لا بالنسبة — والعددُ أصدقُ حين '
        + 'تكون العيّنةُ صغيرة. وهذا دفترُك عن نفسك.</div></div>';
    }

    /* ٦ · زرٌّ عائم */
    h += '<button class="wfab" data-addwish="1" title="أمنيةٌ جديدة">+</button>';
    return h;
  }

  /* ملاحظتُها ورابطُها: مقاسٌ ولونٌ ومتجرٌ رأيتَها فيه */
  function wishNoteHTML(x){
    var nt = String(x.note || "").trim(), u = String(x.url || "").trim();
    var ok = /^https?:\/\//i.test(u);          /* لا يُفتح إلّا رابطٌ صريح */
    if(!nt && !ok) return "";
    return '<div class="wnote"><s class="wlab">ملاحظتُك</s>'
      + '<div class="pxr one"><s>' + (nt ? esc(nt) : "رابطٌ محفوظ") + '</s>'
      + (ok ? ('<a class="mini" href="' + esc(u) + '" target="_blank" '
               + 'rel="noopener noreferrer">افتح الرابط</a>') : "")
      + '</div></div>';
  }

  /* خطةُ شرائها: ما اجتمع · وما بقي · ومتى تكتمل · وتُوقف وتُستأنف */
  function wishPlanHTML(x, k){
    var g = wishGoal(x);
    if(!g) return "";
    var p = wishPrice(x), got = goalSaved(g), rest = Math.max(0, p - got);
    var rate = num(g.m) || num(g.pm), paused = wishPaused(g);
    var pct = p > 0 ? Math.max(0, Math.min(100, Math.round(got / p * 100))) : 0;
    var when = (rest > 0 && rate > 0)
             ? mName(shift(k, Math.max(0, Math.ceil(rest / rate) - 1))) : "";
    return '<div class="wplan' + (paused ? " off" : "") + '">'
      + '<s class="wlab">خطةُ الشراء' + (paused ? " · موقوفة" : "") + '</s>'
      + '<div class="wpnum"><b>' + fmt(got) + '</b> من ' + fmt(p) + ' '
      + esc(cur()) + '<s>' + (rest <= 0
          ? "اكتملت — اشترِها متى شئت"
          : (paused
              ? ("موقوفةٌ عند هذا الحدّ — قسطُها " + fmt(rate) + " محفوظ")
              : (fmt(rate) + " شهرياً · بقي " + fmt(rest)
                 + (when ? (" · تكتمل في " + esc(when)) : ""))))
      + '</s></div>'
      + '<div class="track"><i style="width:' + pct + '%;background:'
      + (rest <= 0 ? "var(--ok)" : "var(--accent)") + '"></i></div>'
      + '<div class="wact">'
      + (paused
          ? ('<button class="mini on" data-wresume="' + x.id + '">استأنفها</button>')
          : ('<button class="mini" data-wpause="' + x.id + '">أوقفها شهراً</button>'))
      + '<button class="mini" data-wrate="' + x.id + '">عدّل القسط</button>'
      + '<button class="mini" data-wunplan="' + x.id + '">فُكّ الارتباط</button>'
      + '</div></div>';
  }

  /* شريطُ السنة: الفائضُ ارتفاعاً، وشهرُ بلوغها معلَّم. يُقرأ الطريقُ
     بالنظر قبل أن يُقرأ بالرقم. */
  function outStripHTML(k, price){
    var O = outlook(k, 12), mx = 1, hit = -1;
    O.forEach(function(o){ if(o.sur > mx) mx = o.sur; });
    if(price > 0) for(var i = 0; i < O.length; i++){
      if(O[i].cum >= price){ hit = i; break; }
    }
    return '<div class="wout"><s class="wlab">فائضُ الأشهر القادمة</s>'
      + '<div class="wstrip">'
      + O.map(function(o, i){
          var hh = Math.max(3, Math.round(Math.min(1, Math.abs(o.sur) / mx) * 32));
          var cl = (o.sur <= 0) ? " neg" : (i === hit ? " hit" : "");
          return '<span class="wb' + cl + '" title="' + esc(mName(o.k)) + ' · '
            + fmt(o.sur) + '"><i style="height:' + hh + 'px"></i>'
            + '<s>' + esc(AR_M[+o.k.slice(5) - 1].slice(0, 3)) + '</s></span>';
        }).join("")
      + '</div>'
      + '<s class="whint">' + (hit >= 0
          ? ('العمودُ المعلَّم ' + esc(mName(O[hit].k))
             + ' — عنده يبلغ تراكمُ فوائضك ثمنَها.')
          : 'لا يبلغ تراكمُ فوائض السنة ثمنَها.') + '</s></div>';
  }

  /* شاشتُها: الخطةُ ما عزمتَ عليه، والأمنيةُ ما لم تعزم عليه بعد —
     فلا يُجمعان في شاشةٍ واحدة. */
  function viewWish(){
    return wishHTML(ui.month);
  }

  function viewPlan(){
    var k = ui.month, o = incObj(k), inc = income(k);
    var al = allocated(), un = inc - al;
    var h = "";

    /* الدخل — لهذا الشهر */
    h += '<div class="card incard"><div class="increr">'
      + '<span class="inclab">دخل ' + esc(mName(k)) + '</span>'
      + '<span class="f"><label>الراتب</label><input class="ni w" type="number" inputmode="numeric" data-minc="salary" value="' + o.salary + '"></span>'
      + '<span class="f"><label>دخل إضافي</label><input class="ni w" type="number" inputmode="numeric" data-minc="extra" value="' + o.extra + '"></span>'
      + '<span class="incacts">'
      + (o.own
          ? '<button class="act" data-incdef="1">اجعله الافتراضي لكل شهر</button>'
            + '<button class="act" data-increset="1">إرجاع للافتراضي</button>'
          : '<span class="pill">من الافتراضي — عدّله ليخصّ هذا الشهر</span>')
      + '</span></div>'
      + '<div class="bar" style="margin-top:12px">'
      + '<i style="width:' + (inc ? Math.min(100, planExp()/inc*100) : 0) + '%;background:var(--ink-3)"></i>'
      + '<i style="width:' + (inc ? Math.min(100, planGoals()/inc*100) : 0) + '%;background:var(--ok)"></i>'
      + '<i style="width:' + (inc ? Math.min(100, planInv()/inc*100) : 0) + '%;background:var(--ok-2)"></i>'
      + '</div>'
      + '<div class="foot"><span>مصروف ' + fmt(planExp()) + ' · أهداف ' + fmt(planGoals()) + ' · استثمار ' + fmt(planInv()) + '</span>'
      + '<span>' + fmt(al) + ' / ' + fmt(inc) + '</span></div></div>';

    h += planSteps(k);

    var RB = ruleBreaks(k);

    h += '<div style="padding:0 15px 15px"><button class="addbtn" data-addgoal="1">+ أضف هدفاً</button></div></div>';


    /* أفعال هذا الشهر — كانت في «الإعدادات» وهي شاشة عامّة، فعادت إلى

  /* ═══ ٣ · المصروف — الإدخال السريع ═══ */
  function viewQuick(){

    h += '<div class="qinc nospan">'

      + (canFill ? '<button class="chip sm" data-qfill="1" title="'

    var TA = 0, TS = 0;
    h += CS.map(function(c){
      var cry = carryOf(c, k), avail = catPlan(c, k) + cry;
      /* السقف يُقاس عليه الصرف ولا يدخل المجاميع: خطّته صفرٌ عمداً،
         فلو عُرض صفراً لظنّ صاحبُه أنّه بلا حدّ. */
      var capRow = isCap(c);
      if(capRow) avail = capOf(c);
      var tk = typeOf(c);
      /* بندُ الاستثمار خطّتُه مجموعُ محافظه — فلا يُكتب هنا رقمٌ ثانٍ
         يخالفها. وسقفُه يُكتب في شاشة الاستثمار حيث يُقرأ مع محافظه. */
      var roCalc = capRow || c.off || tk === "cycle" || tk === "pct" || isInvCat(c);
      var roWhy = c.off ? "موقوف مؤقّتاً"
                : capRow ? "سقفٌ لا يُحجز من دخلك"
                : tk === "cycle" ? ("المبلغ الكامل ÷ " + (num(c.every) || 12) + " شهراً")
                : isInvCat(c) ? "مجموعُ ما تضعه في محافظك — وسقفُه في شاشة الاستثمار"
                : ("نسبةٌ من دخل الشهر: " + num(c.pct) + "٪");
      var sp = A.by[c.k] || 0, left = avail - sp;
      var det = detailSum(k, c.k), dn = detailCount(k, c.k);
      var pv = PA.by[c.k] || 0;
      /* بندُ الاستثمار فروعُه محافظُك — والنموذجُ يقولها من قبل:
         subsSum له هي مجموعُ ما تضعه في المحافظ. */
      var isI = isInvCat(c);
      var subs = isI ? (state.invest || []).length : (c.subs || []).length;
      /* لا يُجمع السقف: مالٌ لم يُحجز */
      if(!capRow) TA += avail;
      TS += sp;
      return '<div class="qtab' + (ui.flash === c.k ? " flash" : "") + '">'
        + '<span class="qn">'
        + (capRow || c.off ? ""
            : ('<button class="qok' + ((avail > 0 && sp >= avail) ? " on" : "")
               + '" data-qfull="' + c.k + '" title="'
               + esc((avail > 0 && sp >= avail) ? "تراجع عن الدفع" : "دفعتُه كاملاً")
               + '">✓</button>'))
        + '<button class="qi" data-calcq="' + c.k
        + '" title="احسب في ' + esc(c.n) + '" style="background:' + c.c + '22;color:' + c.c + '">'
        + iconOf(c) + '</button>'
        + '<span class="qt' + (subs ? " has" : "") + '"'
        + (subs ? (' data-qsub="' + c.k + '" title="'
                   + esc(subs + " فروع — اضغط الصفّ لتفتحها")) + '"' : "")
        + '><b>' + esc(c.n)
        + (subs
            ? ('<span class="qsx' + (ui.openQ[c.k] ? " on" : "") + '">'
               + '<i>▾</i><em>' + subs + '</em></span>')
            : "")
        + '</b>'
        + '<s>' + (capRow ? ('سقفٌ لا يُحجز · ' + fmt(Math.max(0, left)) + ' قبل بلوغه')
              : dn ? dn + ' عملية مفصّلة (' + fmt(det) + ')'
              : (cry ? (cry > 0 ? "مُرحَّل +" : "مُرحَّل −") + fmt(Math.abs(cry))
                       + ' · المتاح ' + fmt(avail)
                 : (avail ? 'بلا رصيد مُرحَّل' : 'بلا خطة'))) + '</s></span></span>'
        /* الأنواع المحسوبة لا تُكتب: رقمُها يُشتقّ من دورةٍ أو نسبةٍ أو
           سقف. فلو عُرض حقلاً يُكتب فيه لظنّ صاحبُه أنّ ما يكتبه يُؤخذ. */
        + (roCalc ? ('<span class="qin plan ro" title="' + esc(roWhy) + '">'
                 + fmt(avail) + '</span>')
             : ('<input class="qin plan" type="number" inputmode="decimal" step="any" '
                + 'data-plan="' + c.k + '" value="' + rawP(c, k, c.k) + '"'
                + (subs ? ' title="' + esc("سقف البند — مجموع فروعه " + fmt(subsSum(c, k))) + '"' : "")
                + '>'))
        + '<input class="qin' + (sp ? " has" : "") + '" type="number" inputmode="decimal" step="any" '
        + 'data-quick="' + c.k + '" value="' + (sp || "") + '" placeholder="'
        + (pv ? fmt(pv) : "0") + '">'
        + '<span class="qv' + (left < 0 ? " neg" : (left ? "" : " dim")) + '">' + fmt(left) + '</span>'
        + '</div>'
        /* الفروع بالأعمدة نفسها: خطّة · صُرف · باقٍ. ومعها ما بقي من
           السقف بلا فرع، فتجتمع الأرقام ولا يبقى فرقٌ لا يُفسَّر. */
        + ((subs && ui.openQ[c.k] && isI)
            ? ((state.invest || []).map(function(v){
                var mo2 = num(v.m), pu2 = invPut(v, k), lf3 = mo2 - pu2;

                  + (pu2 ? (' · أودعتَ فيها ' + fmt(pu2) + ' هذا الشهر') : "")
                  + (invGoal(v) ? (' · تحمل هدف «' + esc(invGoal(v).n) + '»') : "")
                  + '</s></span></span>'
                  + '<span class="qv' + (mo2 ? "" : " dim") + '">' + fmt(mo2) + '</span>'
                  + '<input class="qin' + (pu2 ? " has" : "") + '" type="text" '
                  + 'inputmode="decimal" data-iquick="' + v.id + '" value="'
                  + (pu2 || "") + '" placeholder="0">'
                  + '<span class="qv' + (lf3 > 0 ? "" : " dim") + '">'
                  + fmt(lf3) + '</span></div>';
              }).join("")
              + '<div class="qtab qsub rest"><span class="qn"><span class="qt">'
              + '<b>القيمةُ تُحدَّث من تبويب الاستثمار</b>'
              + '<s>هنا ما تودعه · وهناك ما صار إليه</s></span></span>'
              + '<span class="qv"></span><span class="qv"></span>'
              + '<span class="qv"></span></div>')
            : "")
        + ((subs && ui.openQ[c.k] && !isI)
            ? ((c.subs || []).map(function(x){
                var sp2 = linePlan(x, k, lineKey(c.k, x.id));
                var sv2 = A.bySub[x.id] || 0;
                var lf2 = sp2 - sv2;
                var paid2 = (sp2 > 0 && sv2 >= sp2);
                return '<div class="qtab qsub">'
                  + '<span class="qn">'
                  /* ضغطةٌ تعني «دفعتُها كاملةً»، وثانيةٌ تتراجع */
                  + '<button class="qok' + (paid2 ? " on" : "") + '" data-qfull="'
                  + c.k + '|' + x.id + '" title="'
                  + esc(paid2 ? "تراجع عن الدفع" : "دفعتُها كاملةً") + '">✓</button>'
                  + '<span class="qt"><b>'
                  + (iconOf(x) ? (iconOf(x) + ' ') : "") + esc(x.n) + '</b>'
                  + '<s>' + (typeOf(x) === "inst" && x.end
                              ? ('قسط · ' + instLeft(x, k) + ' متبقّية')
                              : (typeInfo(typeOf(x)) || {}).n || "") + '</s></span></span>'
                  + '<input class="qin plan" type="number" inputmode="decimal" step="any" '
                  + 'data-sub="' + c.k + '|' + x.id + '" value="' + sp2 + '">'
                  + '<input class="qin' + (sv2 ? " has" : "") + '" type="number" '
                  + 'inputmode="decimal" step="any" data-qsubspend="' + c.k + '|' + x.id
                  + '" value="' + (sv2 || "") + '" placeholder="0">'
                  + '<span class="qv' + (lf2 < 0 ? " neg" : (lf2 ? "" : " dim")) + '">'

              + '<span class="qv"></span><span class="qv"></span></div>')
            : "");
    }).join("");
    h += '<div class="qtab foot"><span class="qn">'
      + '<span class="qi" style="background:var(--card-2)">Σ</span>'
      + '<span class="qt"><b>المجموع</b><s>' + CS.length + ' بنداً</s></span></span>'
      + '<span class="qv">' + fmt(TA) + '</span>'
      + '<span class="qv" style="font-size:15px">' + fmt(TS) + '</span>'
      + '<span class="qv' + (TA - TS < 0 ? " neg" : "") + '">' + fmt(TA - TS) + '</span></div>';
    h += '<div class="qadd"><button class="addbtn sm" data-addcat="1">'
      + '+ بند جديد</button></div>';
    h += '</div>';
    /* ── الأهداف: كم وضعتَ فيها فعلاً هذا الشهر ── */
    var QG = activeGoals();
    if(QG.length){
      var GT = 0, GD = 0;
      h += '<div class="sec"><h2>الأهداف والادخار</h2>'
        + '<span class="hint">المخطّطُ من دخلك مقابل ما حوّلتَه فعلاً</span></div><div class="card">';
      h += '<div class="qtab head"><span>الهدف</span><span>المخطط</span>'

          + '<s>' + (dn ? "مكتمل — لا اقتطاع"
              : "المُدَّخر " + fmt(sv) + (tg ? " من " + fmt(tg) : " · بلا سقف")) + '</s></span></span>'
          + '<span class="qv' + (mo ? "" : " dim") + '">' + fmt(mo) + '</span>'
          + '<input class="qin' + (mv ? " has" : "") + '" type="number" inputmode="decimal" step="any" '
          + 'data-gquick="' + g.id + '" value="' + (mv || "") + '" placeholder="0">'
          + '<span class="qv' + (left > 0 ? "" : " dim") + '">' + fmt(left) + '</span></div>';

      h += '<div class="qtab foot"><span class="qn">'
        + '<span class="qi" style="background:var(--card-2)">Σ</span>'
        + '<span class="qt"><b>مجموع الادخار</b><s>' + QG.length + ' هدفاً</s></span></span>'
        + '<span class="qv">' + fmt(GT) + '</span>'

        + '<span class="qv">' + fmt(GT - GD) + '</span></div></div>';

        + 'ويبقى الفرق في «المتبقي». والمبلغ يُضاف لمُدَّخر الهدف مباشرة إن لم يكن مربوطاً بحساب بنكي، '
        + 'وإلا فارصده يُقرأ من الحساب.</div>';
    }

    /* قسمُ الاستثمار المستقلُّ رُفع: صار بندُ «استثمار» في الجدول
       يتفرّع إلى محافظه، فلا يُقرأ الشيءُ في مكانين. */

    return h;
  }

  /* ═══ ٣ · المصروف ═══ */
  function viewSpend(){

      h += '<div class="flag ok">آخر عملية حُفظت في <b>' + esc(mName(ui.jumpTo))

       لتصحيحه أو حذفه. */
    h += viewQuick();
    var _tailAt = h.length;

    /* الذيلُ يُبنى قطعاً ثمّ يُصفّ في عمودين. وقائمةُ العمليات
       رُفعت من هنا: صارت داخل سجلّ المتابعة في قائمةٍ زمنيّةٍ واحدة. */
    var TAIL = [];

    var keys = Object.keys(state.months).filter(function(x){ return actuals(x).sum > 0; }).sort().slice(-6);
    if(keys.length > 1){
      var mx = Math.max.apply(null, keys.map(function(x){ return actuals(x).sum; }));
      h += '<div class="sec"><h2>الأشهر السابقة</h2></div><div class="card" style="padding:6px 15px">'

            var s2 = actuals(x).sum;

  /* سجلُّ التعديلات: مجموعاً باليوم، ولكلّ سطرٍ وقتُه ومقدارُه */

                  edit: "تعديلُ عملية", del: "حذفُ عملية", buy: "شراءُ أمنية",

  /* اسمُ ما جرى عليه القيد: بندٌ أو هدفٌ أو محفظةٌ أو دخلٌ أو خطّة */
  function logSubject(e){
    var c = String(e.c || "");
    if(c.indexOf("g:") === 0){
      var g = goalOf(c.slice(2));
      return { e: (g && g.e) || "◎", n: g ? g.n : "هدفٌ محذوف" };
    }
    if(c.indexOf("i:") === 0){
      var v = null;
      (state.invest || []).forEach(function(x){ if(x.id === c.slice(2)) v = x; });
      return { e: (v && v.e) || "◺", n: v ? v.n : "محفظةٌ محذوفة" };
    }
    if(c.indexOf("inc:") === 0)
      return { e: "◈", n: c.slice(4) === "extra" ? "دخل إضافيّ" : "الراتب" };
    var ct = catOf(c), sb = e.s ? subOf(ct, e.s) : null;
    return { e: (ct && ct.e) || "•",
             n: ((ct && ct.n) || "بندٌ محذوف") + (sb ? (" · " + sb.n) : "") };

  function clockAr(ts){
    var d = new Date(ts), hh = d.getHours(), mm = d.getMinutes();
    var am = hh < 12 ? "ص" : "م";
    var h12 = hh % 12; if(!h12) h12 = 12;
    return h12 + ":" + pad(mm) + " " + am;
  }
  function dayLabel(ts){
    var d = new Date(ts), t = new Date();
    var same = function(a, b){
      return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth()
          && a.getDate() === b.getDate();
    };
    if(same(d, t)) return "اليوم";
    var y = new Date(t.getTime() - 86400000);
    if(same(d, y)) return "أمس";
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  /* وقتُ العمليّة: طابعُها إن وُجد، وإلا ظهرُ يومها */

  /* ═══ مرشدُ الترقية: ما بُني بأدواتٍ أقدم يجد بيته ═══ */
  var MIGGOAL = "زواج زفاف عرس طوارئ طواري احتياطي حج عمرة بيت شقة ارض سيارة "
              + "دفعة مقدم ادخار توفير مدخرات هدف حلم مشروع دراسة جامعة سفر";
  /* ما لا يحتمل غيرَ الاستثمار. و«صندوق» ليست منها: «صندوق الطوارئ»
     أشهرُ ما تُقال بها في لسان أهل البلد — وقد أوقعت الخطأ. */
  var MIGINV  = "استثمار استثماري اسهم سهم محفظة تداول مؤشر كريبتو "
              + "بيتكوين ريت صكوك تمويل جماعي";
  function migWordHit(name, bag){
    var t = arNorm(name), keys = arNorm(bag).split(" ");
    for(var i = 0; i < keys.length; i++)
      if(keys[i].length > 2 && t.indexOf(keys[i]) >= 0) return keys[i];
    return "";
  }
  /* كم صُرف من بندٍ في كلّ ما مضى، وفي كم شهرٍ خُطّط له */
  function migCatStat(c){
    var spent = 0, planned = 0, months = 0;
    for(var mk in (state.months || {})){
      var m = state.months[mk];
      if(!m) continue;
      var p = catPlan(c, mk);
      if(p > 0){ planned += p; months++; }
      (m.items || []).forEach(function(it){ if(it.c === c.k) spent += num(it.a); });
    }
    return { spent: money(spent), planned: money(planned), months: months };
  }
  /* ما يستحقّ العرض — بالبنية أوّلاً ثمّ الاسم */
  function migFind(){
    var out = [];
    (state.cats || []).forEach(function(c){
      if(isInvCat(c) || c.hidden) return;
      if((c.subs || []).length) return;        /* بندٌ بفروعٍ مصروفٌ حقّاً */
      var st = migCatStat(c);
      if(st.months < 2 || st.planned <= 0) return;
      var word = migWordHit(c.n, MIGGOAL);
      /* حُجز ولم يُصرف: ادّخارٌ سُمّي مصروفاً. والاسمُ يُقوّي لا يَحكم. */
      var idle = st.spent <= st.planned * 0.15;
      if(!idle && !word) return;
      if(!idle && word && st.spent > st.planned * 0.5) return;
      out.push({ t: "c2g", id: c.k, n: c.n, e: c.e || "🎯",
                 m: catPlan(c, ui.month), saved: st.spent,
                 why: idle
                   ? ("خُطّط له " + fmt(st.planned) + " في " + arMonths(st.months)
                      + " ولم يُصرف منه إلّا " + fmt(st.spent))
                   : ("اسمُه يقول إنّه ادّخار") });
    });
    (state.goals || []).forEach(function(g){
      if(g.arch) return;
      /* وُصل بوعائه من قبلُ — فلا يُعرض ثانيةً، وإلا أُنشئ له وعاءٌ
         في كلّ مرّة. (التقطه migtest: ستّةُ أوعيةٍ لهدفٍ واحد.) */
      if(g.inv) return;
      var word = migWordHit(g.n, MIGINV);
      /* دليلٌ صريحٌ لا غير: «بلا نهاية» وحدَها ليست استثماراً —
         فادّخارٌ مفتوحٌ بلا سقفٍ ادّخار. */
      if(!word) return;
      /* واسمٌ من كلمات الأهداف ينقض العرضَ مهما وافق غيرَه:
         «صندوق الطوارئ» لا يصير محفظةً ولو سُمّي صندوقاً. */
      var veto = migWordHit(g.n, MIGGOAL);
      if(veto) return;
      out.push({ t: "g2i", id: g.id, n: g.n, e: g.e || "📈",
                 m: num(g.m), saved: goalSaved(g),
                 why: "اسمُه يقول «" + veto0(word) + "» — وهو بابُ الاستثمار" });
    });
    return out;
  }
  function veto0(w){ return String(w || ""); }
  function migSkipped(){
    var o = state.migSkip;

  /* النقلُ نفسُه — لا يُحذف شيء: البندُ يُخفى والهدفُ يُؤرشف */
  function migApply(x){

      /* لا يُنقل: يُنشأ له وعاءٌ ويُوصل به. فالهدفُ يبقى هدفاً في خطّتك،
         والمحفظةُ تقول أين يقعد مالُه — سؤالان لا يُلغي أحدُهما الآخر. */
      var gg = goalOf(x.id);

  /* ما نُقل يُردّ: لا شيءَ حُذف — البندُ مخفيٌّ والهدفُ مؤرشف */

  function migUndo(t, id){
