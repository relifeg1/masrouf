  /* ═══ ٤ · الاستثمار ═══ */
  function viewInv(){
    var auto = state.invest.filter(function(v){ return v.kind === "auto"; });
    var self = state.invest.filter(function(v){ return v.kind === "self"; });
    var sum = function(arr, f){ var s=0; arr.forEach(function(x){ s += num(x[f]); }); return s; };
    var sumVal = function(arr){ var s=0; arr.forEach(function(x){ s += invVal(x); }); return s; };
    var h = "";
    var PART = {}, _cut = 0;
    function cut(nm){ PART[nm] = h.slice(_cut); _cut = h.length; }

    var RR = investReturn(), GG = invGain(ui.month);
    var dm = distMap(ui.month), putI = 0;
    for(var ky in dm){ if(ky.charAt(0) === "i") putI += num(dm[ky]); }
    var unfunded = Math.max(0, planInv() - putI);
    var NET = investIn(), VAL = investVal(), PRF = money(VAL - NET);
    var NG = invNearGoal();
    var nAuto = 0;
    state.invest.forEach(function(v){ if(invMngOf(v).k === "auto") nAuto++; });
    /* أربعةُ أرقامٍ — أسئلتُك الأربعةُ حين تفتح الشاشة */
    h += '<div class="kpis k4">'
      /* ١ · كم عندي الآن؟ */
      + kpi("◺", "accent", "قيمة محافظك", fmt(VAL), "",
            state.invest.length + " محفظة · " + nAuto + " بتطبيقٍ آليّ")
      /* ٢ · أربحتُ أم خسرت؟ — على صافي ما وضعتَ لا على ما ساهمت */
      + kpi(PRF >= 0 ? "↑" : "↓", PRF >= 0 ? "ok" : "warn", "ربحُك",
            (VAL || NET) ? ((PRF >= 0 ? "+" : "−") + fmt(Math.abs(PRF))) : "—", "",
            NET > 0 ? ("على " + fmt(NET) + " صافي ما وضعت · " + pctTxt(PRF / NET))
                    : (NET < 0 ? ("استرجعتَ " + fmt(Math.abs(NET))
                                  + " أكثرَ ممّا وضعت")
                               : "لم تضع شيئاً بعد"))
      /* ٣ · أأمشي على خطتي؟ */
      + kpi(unfunded ? "◔" : "✓", unfunded ? "gold" : "ok", "أودعتَ هذا الشهر",
            fmt(putI), "",
            planInv() ? (unfunded ? ("من خطّتك " + fmt(planInv()) + " — بقي "
                                    + fmt(unfunded))
                                  : ("خطّتُك " + fmt(planInv()) + " · مموَّلةٌ كاملةً"))
                      : "لم تضع خطّةً شهريّةً بعد")
      /* ٤ · متى أبلغ ما أريد؟ */
      + kpi("◈", NG ? "accent" : "ok", "أقربُ هدف",
            NG ? (NG.months === null ? "—" : arMonths(NG.months)) : "—", "",
            NG ? (esc(NG.n) + " · بقي " + fmt(NG.rest) + " من " + fmt(NG.tgt)
                  + (NG.months === null ? " · لا قسطَ شهريّ" : ""))
               : "لا هدفَ على محافظك بعد")
      + '</div>'
      + invSparkAll();

    cut("kpi");

    /* الشرحُ الطويلُ مكانُه الدليل — وهنا سطرٌ وبابٌ إليه */
    h += '<div class="hintnote" data-note="n497ed1e">'
      + '<b>المحفظة</b> وعاءٌ فيه مالُك: أسهمٌ أو كريبتو أو صندوق. '
      + 'تكتب قيمتَها كلَّ شهر، فيُعرف ربحُك ونموُّ مالك.'
      + '<div class="acts"><button class="act sm" data-guide="inv">'
      + 'اشرح لي أكثر</button></div></div>';

    cut("edu");

    cut("cap");

    /* جدولٌ كجدول المصروف: صفٌّ لكلّ محفظةٍ وحقلٌ تكتب فيه قيمةَ الشهر.
       والتفصيلُ خلف ضغطةٍ على الصفّ — لا مبسوطاً في كلّ بطاقة. */
    h += '<div class="sec"><h2>محافظك</h2>'
      + '<span class="hint">قيمتُها تتغيّر وحدَها — اكتبها كلَّ شهرٍ '
      + 'ليُعرف ربحُك</span>'
      + '</div><div class="card">';
    h += '<div class="qtab head"><span>المحفظة</span><span>قيمتها اليوم</span>'
      + '<span>الربح</span><span>شهرياً</span></div>';
    var TV = 0, TI = 0, TM = 0;
    h += state.invest.map(function(v){
      var val = invVal(v), inn = num(v["in"]), pr = money(val - inn);
      var open = !!ui.openInv[v.id], many = invAccts(v).length > 1;
      var idle = !val && !inn && !num(v.m);
      var gl = invGoal(v);
      TV += val; TI += inn; TM += num(v.m);
      var mode = invEntry(v), now = invValAt(v, ui.month);
      var prev = invValAt(v, shift(ui.month, -1)); if(prev === null) prev = 0;
      var put = invPut(v, ui.month);
      var gain = now === null ? null : Math.round(now - prev - put);
      return '<div class="qtab' + (idle ? " zero" : "") + '">'
        + '<span class="qt has" data-invopen="' + v.id + '" title="'
        + esc("اضغط الصفَّ لتفتح تفاصيلَها") + '">'
        + '<b>' + esc(v.n)
        + '<span class="qsx' + (open ? " on" : "") + '"><i>▾</i></span></b>'
        + '<s>' + (gl ? ('تحمل هدف «' + esc(gl.n) + '» · ') : "")
        + esc(invTypeOf(v).n) + ' · ' + esc(invMngOf(v).n)
        + ' · مخاطرةٌ ' + esc(invRiskOf(v).n)
        + (inn > 0 ? (' · صافي ما وضعت ' + fmt(inn))
             : inn < 0 ? (' · استرجعتَ ' + fmt(Math.abs(inn)) + ' أكثرَ ممّا وضعت')
                       : " · اكتب قيمتها لتبدأ متابعتَها")
        /* قيمةُ الشهر الماضي بجانبها: الرقمُ يُقارَن لا يُقرأ وحدَه */
        + (prev ? (' · كانت ' + fmt(prev) + ' الشهرَ الماضي') : "") + '</s></span>'
        /* الفعلُ الشهريُّ في متناول اليد: قيمةُ اليوم */
        + (many
            ? ('<span class="qv dim" title="' + esc("محافظُها في تبويب الحسابات")
               + '">' + fmt(val) + '</span>')
            : ('<input class="qin' + (now !== null ? " has" : "") + '" type="number" '
               + 'inputmode="decimal" step="any" data-invclose="' + v.id
               + '" placeholder="' + fmt(val) + '" value="'
               + (mode === "val" ? (now === null ? "" : now)
                                 : (gain === null ? "" : gain)) + '">'))
        + '<span class="qv ' + (pr > 0 ? "up" : pr < 0 ? "dn" : "dim") + '">'
        + ((inn || val) ? ((pr >= 0 ? "+" : "−") + fmt(Math.abs(pr))) : "—")
        /* والنسبةُ تحته: المبلغُ وحدَه لا يقول أكثيرٌ هو أم قليل */
        + (inn > 0 ? ('<em class="qpc">' + pctTxt(pr / inn) + '</em>') : "")
        + '</span>'
        + '<span class="qv' + (num(v.m) ? "" : " dim") + '">' + fmt(num(v.m)) + '</span>'
        + '</div>'
        + (open ? invPanel(v) : "");
    }).join("");
    h += '<div class="qtab foot"><span class="qn">'
      + '<span class="qi" style="background:var(--card-2)">Σ</span>'
      + '<span class="qt"><b>مجموع محافظك</b><s>' + state.invest.length + ' محفظة</s></span></span>'
      + '<span class="qv">' + fmt(TV) + '</span>'
      + '<span class="qv ' + (TV - TI > 0 ? "up" : TV - TI < 0 ? "dn" : "dim") + '">'
      + (TI ? ((TV - TI >= 0 ? "+" : "−") + fmt(Math.abs(TV - TI))) : "—") + '</span>'
      + '<span class="qv">' + fmt(TM) + '</span></div>';
    /* السقفُ حيث يُقرأ: تحت المجموع لا في قسمٍ قائمٍ بذاته */
    var IC = invCat();
    if(IC){
      var icap = catCap(IC, ui.month), iused = invMonthly();
      var iover = Math.max(0, iused - icap);
      h += '<div class="capline"><span>موزَّعٌ على محافظك <b>' + fmt(iused)
        + '</b> من سقفك الشهريّ</span>'
        + '<input class="ni s" type="number" inputmode="numeric" data-plan="' + INVK
        + '" value="' + rawP(IC, ui.month, INVK) + '">'
        + (iover ? ('<span class="capwarn">تجاوزتَه بـ ' + fmt(iover) + '</span>')
                 : ('<span>متبقٍ <b>' + fmt(Math.max(0, icap - iused)) + '</b></span>'))
        + '</div>'
        + '<div class="ahint" style="padding:0 15px 12px">هذا سقفُك أنت — '
        + 'تكتبه هنا ويُحجز في بند «استثمار» من خطتك.</div>';
    }
    h += '<div class="qadd"><button class="addbtn sm" data-addinv="1">'
      + '+ محفظةٌ جديدة</button></div></div>';

    cut("port");

    /* الأرقام · السقف · المحافظ · تصنيفها · ثم الشرح */
    /* الملخّصان (النوعان والسقف) قبل التفصيل (المحافظ)، والشرح أخيراً */
    PART.stale = invStaleCard();
    PART.charts = invVsChart() + invSplitChart() + invCompare() + zakCard();
    return ["stale", "kpi", "edu", "port", "charts"]
      .map(function(nm){ return PART[nm] || ""; }).join("");
  }

  /* ═══ ٥ · الحسابات المصرفية ═══ */
  /* ── المرحلة ٤: صفّ الحساب (مُعاد استعماله في كل القوائم) ── */
  function acctRow(a){
    var L = acctPurpose(a), openA = !!ui.openAcct[a.id];
        var r = '<div class="acct' + (isDebt(a) ? " debt" : "")
      + (a.pin ? " pinned" : "") + (a.arch ? " arch" : "") + '" data-acct="' + a.id + '">'
          + '<span><span class="an">' + esc(a.n) + '</span>'
          + '<span class="tagline"><span class="tag ' + L.cls + '">' + esc(L.t) + '</span>'
          + '<span class="kindtag">' + kindName(kindOf(a)) + '</span></span></span>'
          + '<span class="av">' + (isDebt(a) ? "−" : "") + fmt(Math.abs(num(a.bal))) + '</span></div>';
        if(openA){
          var sp6 = trackSrc() ? spentFrom(a.id, ui.month) : 0;
          r += '<div class="apanel">'
            + '<div class="arow"><span class="al">الرصيد</span>'
            + '<input class="ni s" type="number" inputmode="numeric" data-abal="' + a.id + '" value="' + num(a.bal) + '">'
            + (state.salaryAcct === a.id
                ? '<span class="salpill">💰 حساب الراتب</span>'
                : '<button class="mini" data-marksal="' + a.id + '">اجعله حساب الراتب</button>')
            + '<button class="mini" data-renacct="' + a.id + '" style="margin-inline-start:auto">✎ الاسم</button></div>'
            + (sp6 ? '<div class="arow"><span class="al">صُرف منه</span>'
                     + '<span class="spentpill">−' + fmt(sp6) + '</span>'
                     + '<span class="ahint" style="padding:0">هذا الشهر</span></div>' : "")
            + (isDebt(a) ? debtContract(a) : ""
            + '<div class="arow"><span class="al">الغرض</span><div class="chips">'
            + '<button class="chip sm' + (a.link === "ops" && !catOfAcct(a) ? " on" : "")
            + '" data-alink="' + a.id + '|ops">تشغيلي</button>'
            + visibleCats().map(function(c){
                return '<button class="chip sm' + (c.acct === a.id ? " on" : "")
                  + '" data-acat="' + a.id + '|' + c.k + '">' + c.e + ' ' + esc(c.n) + '</button>';
              }).join("")
            + state.goals.map(function(g){
                return '<button class="chip sm' + (a.link === "g:" + g.id ? " on" : "") + '" data-alink="'
                  + a.id + '|g:' + g.id + '">' + g.e + ' ' + esc(g.n) + '</button>';
              }).join("")
            + state.invest.map(function(v){
                return '<button class="chip sm' + (a.link === "i:" + v.id ? " on" : "") + '" data-alink="'
                  + a.id + '|i:' + v.id + '">' + (v.kind === "auto" ? "🤖" : "📊") + ' ' + esc(v.n) + '</button>';
              }).join("")
            + '</div></div>'
            + '<div class="ahint">«تشغيلي» = مال المصروف اليومي بلا تخصيص. '
            + 'واختيار <b>بند</b> يجعل هذا الحساب وعاءه: يُموَّل بمبلغ خطته أول الشهر ويُخصم منه صرفه — '
            + 'والمال يبقى مالك التشغيلي. أمّا <b>الهدف</b> أو <b>المحفظة</b> فيغيّران ملكية المال نفسه: '
            + 'يصير رصيد هذا الحساب هو مُدَّخر ذلك الهدف أو قيمة تلك المحفظة.</div>')
            + '<div class="arow"><span class="al">النوع</span><div class="chips">'
            + KINDS.map(function(K){
                return '<button class="chip sm' + (kindOf(a) === K.k ? " on" : "") + '" data-akind="'
                  + a.id + '|' + K.k + '">' + K.n + '</button>';
              }).join("")
            + '</div></div>'
            + balanceProof(a)
            + logPanel(a)
            + '<div class="mv"><button class="in" data-mv="' + a.id + '|in">+ إيداع</button>'
            + '<button class="out" data-mv="' + a.id + '|out">− سحب</button>'
            + '<button class="tr" data-tr="' + a.id + '">↔ تحويل</button></div>'
            + '<div class="abtns">'
            + '<button class="mini' + (a.pin ? " on" : "") + '" data-apin="' + a.id + '">'
            + (a.pin ? "📌 مثبَّت" : "📌 ثبّت") + '</button>'
            + '<button class="mini' + (a.arch ? " on" : "") + '" data-aarch="' + a.id + '">'
            + (a.arch ? "أعِده" : "أرشف") + '</button>'
            + '<button class="mini bad" data-delacct="' + a.id + '" style="margin-inline-start:auto">حذف</button>'
            + '</div>';
          r += '</div>';
        }
    return r;
  }

  /* هل تفسّر حركاتُ الحساب رصيدَه؟ */
  function balanceProof(a){
    var gap = ledgerGap(a), n = logRows(a).length;
    if(!n && !num(a.open)) return "";
    return '<div class="proof' + (gap ? " bad" : "") + '">'
      + '<span class="pk">' + (gap ? "فجوة" : "متّزن") + '</span>'
      + '<span class="pt">افتتاحي <b>' + fmt(openBal(a)) + '</b>'
      + ' ' + (ledgerSum(a) < 0 ? "−" : "+") + ' حركات <b>' + fmt(Math.abs(ledgerSum(a))) + '</b>'
      + ' = <b>' + fmt(ledgerBal(a)) + '</b>'
      + (gap ? ' · الرصيد <b>' + fmt(a.bal) + '</b> — فرق <b class="g">' + fmt(gap) + '</b>' : "")
      + '</span></div>';
  }

  /* الجهة الاستثمارية التي يحملها هذا الحساب — إن كان وحده يحملها */
  function invOfAcct(a){
    var k = String(a.link || "");
    if(k.charAt(0) !== "i") return null;
    var id = k.slice(2), out = null;
    out = byId(state.invest, id);
    if(!out || invAccts(out).length !== 1) return null;   /* عدة محافظ: لا نسب الربح لواحدة */
    return out;
  }
  /* صفوف السجلّ = الحركات المخزَّنة + الأرباح المشتقّة من اللقطات.
     الربح ليس حركة نقدية، فلا يُخزَّن ولا يُحرّك رصيداً — يُحسب لحظة العرض. */
  function logRows(a){
    var L = acctLog(a).slice();
    var v = invOfAcct(a);
    if(v) invMonthsOf(v).forEach(function(mk){
      var g = invGainOf(v, mk);
      if(!g) return;
      L.push({ id: "d" + mk, a: Math.abs(g), kind: g > 0 ? "gain" : "loss",
               t: "إقفال " + mName(mk), d: mk + "-28" });
    });
    return L;
  }

  /* ══ الميزان: هل يفسّر الدفترُ الرصيدَ؟ ══
     إشارة كل قيد من نوعه — تصلح للأصل وللالتزام معاً، لأن رصيد
     الالتزام يحمل «ما عليك» فيزيده الاقتراض ويُنقصه السداد. */
  function entryDelta(x){
    var k = x.kind, v = num(x.a);
    return (k === "in" || k === "gain" || k === "borrow" || k === "adjup") ? v : -v;
  }
  function ledgerSum(a){
    var t = 0;
    logRows(a).forEach(function(x){ t += entryDelta(x); });
    return t;
  }
  function openBal(a){ return num(a.open); }
  function ledgerBal(a){ return Math.round(openBal(a) + ledgerSum(a)); }
  function ledgerGap(a){ return Math.round(num(a.bal) - ledgerBal(a)); }
  /* يُختم الرصيد الافتتاحي مرة واحدة لكل حساب: الدفتر يتّزن من يومه */
  function stampOpen(a){
    if(a.open === undefined) a.open = Math.round(num(a.bal) - ledgerSum(a));
    return a;
  }
  /* قيد تسوية: التغيير اليدوي صار حركة لها سبب */
  function adjustBal(a, to, note){
    var d = Math.round(num(to) - num(a.bal));
    if(!d) return false;
    acctLog(a).push({ id: uid(), a: Math.abs(d), kind: d > 0 ? "adjup" : "adjdn",
                      t: note || "تسوية يدوية", d: new Date().toISOString().slice(0, 10) });
    a.bal = num(to);
    stampSnap(a);
    return true;
  }

  /* سجلّ حركة الحساب — أحدث أولاً */
  function logPanel(a){
    var L = logRows(a);
    if(!L.length)
      return '<div class="ahint" style="padding:8px 0 0">لا حركات مسجّلة على هذا الحساب بعد.</div>';
    L.sort(function(x, y){ return String(y.d || "").localeCompare(String(x.d || "")); });
    var open = !!ui.openLog[a.id], show = open ? L : L.slice(0, 5);
    return '<div class="lgw"><div class="lab">الحركة</div>'
      + show.map(function(x){
          var K = lkind(x.kind);
          return '<div class="lg"><span class="lk ' + K.c + '">' + K.n + '</span>'
            + '<span class="lt">' + esc(x.t || K.d) + '</span>'
            + '<span class="ld">' + esc(String(x.d || "").slice(0, 10)) + '</span>'
            + '<span class="la ' + K.c + '">' + K.s + fmt(num(x.a)) + '</span></div>';
        }).join("")
      + (L.length > 5
          ? '<button class="mini" data-openlog="' + a.id + '" style="margin-top:8px">'
            + (open ? "اعرض الأحدث فقط" : "كل الحركات (" + L.length + ")") + '</button>'
          : "")
      + '</div>';
  }

  /* شروط الالتزام + تقدّمه */
  function debtContract(a){
    var left = debtLeft(a), princ = debtPrinc(a), paid = debtPaid(a);
    var n = debtMonthsLeft(a), end = debtEnd(a);
    return '<div class="arow"><span class="al">الدائن</span>'
      + '<span class="creditor">' + esc(a.bank) + '</span></div>'
      + '<div class="arow"><span class="al">أصل المبلغ</span>'
      + '<input class="ni s" type="number" inputmode="numeric" data-dprinc="' + a.id + '" value="'
      + (num(a.princ) || "") + '" placeholder="' + left + '">'
      + '<span class="al" style="min-width:52px">القسط</span>'
      + '<input class="ni s" type="number" inputmode="numeric" data-dpay="' + a.id + '" value="'
      + (num(a.mpay) || "") + '" placeholder="شهرياً"></div>'
      + '<div class="dprog"><span class="dbar"><i style="width:' + (debtPct(a) * 100) + '%"></i></span>'
      + '<span class="dtx">سدّدت <b>' + fmt(paid) + '</b> من <b>' + fmt(princ) + '</b>'
      + ' · باقٍ <b class="rem">' + fmt(left) + '</b></span></div>'
      + '<div class="ahint">'
      + (n === null
          ? 'اكتب القسط الشهري ليُحسب موعد انتهائه.'
          : 'على هذا القسط ينتهي بعد <b>' + arMonths(n) + '</b> — في <b>' + esc(mName(end)) + '</b>.')
      + ' والسداد يكون بتحويل من حساب إلى هذا الالتزام.</div>';
  }

  function viewAccts(){
    var A = accts(), h = "";
    var ops = opsAssets();
    var goalsSum = 0, invSum = 0;
    state.goals.forEach(function(g){ goalsSum += linkedSum("g:" + g.id); });
    state.invest.forEach(function(v){ invSum += linkedSum("i:" + v.id); });

    var AS = assetTotal(), LB = liabTotal(ui.month), NW = AS - LB;

      + kpi("↓", "warn", "التزاماتك", fmt(LB), "", "قروض وأقساط متبقّية")

          : "")
      + '</div>'
      + '<div class="foot"><span>تشغيلي ' + fmt(ops) + ' · أهداف ' + fmt(goalsSum) + ' · استثمار ' + fmt(invSum) + '</span>'
      + '<span>' + banks().length + ' جهة</span></div>'
      + '<div class="netrow">'
      + '<div><span class="nl">الأصول</span><span class="nv" style="color:var(--ok)">' + fmt(AS) + '</span></div>'
      + '<div><span class="nl">الالتزامات</span><span class="nv" style="color:var(--warn)">'
      + (LB ? "−" + fmt(LB) : "0") + '</span></div>'
      + '<div><span class="nl">الصافي</span><span class="nv">' + fmt(NW) + '</span></div>'
      + '</div></div>';

    /* حركة الثروة والتسوية (المرحلة ٥) */
    var SM = snapMonths(), REC = reconcile(ui.month);
    h += '<div class="sec"><h2>حركة ثروتك</h2><span class="hint">'
      + (SM.length > 1 ? "لقطة كل شهر" : "تحت التكوين") + '</span></div><div class="card">';
    if(SM.length > 1){
      h += '<div class="wspark">'
        + '<div class="lab">صافي ثروتك شهراً بشهر</div>' + netSpark() + '</div>';
    }
    if(REC){

  /* ═══ ٥ · السنة ═══ */
  /* ══ الدفتر ══
     طبقتان على نفس الشبكة: «الخطة» تكتب سقف البند في ذلك الشهر،
     و«الصرف» تكتب إجمالي ما صُرف فيه (عبر الإدخال السريع نفسه).
     تعديل شهر ماضٍ يُكتب في خطة ذلك الشهر وحده — لا في الأساس. */
  function ledgerMode(){ return ui.ledger || "plan"; }
  function ledgerVal(c, mk){
    return ledgerMode() === "plan" ? catPlan(c, mk) : (actuals(mk).by[c.k] || 0);
  }
  function ledgerSet(c, mk, v){
    if(ledgerMode() === "plan"){
      var need = subsSum(c, mk);
      if(v < need){ toast("لا يقل عن مجموع الفروع (" + fmt(need) + ")"); v = need; }
      setP(mk, c.k, v);                    /* دائماً خطة ذلك الشهر وحده */
    } else {
      setQuick(mk, c.k, v);
    }
  }
  function ledgerGrid(y){
    var months = yearMonths(y), now = todayKey(), mode = ledgerMode();
    var cats = visibleCats();
    var h = '<div class="sec"><h2>الدفتر</h2>'
      + '<span class="hint">دخلُك وصرفُك شهراً بشهر — تُصحّح أيَّ خانةٍ في مكانها</span></div>'
      + '<div class="card">'
      + '<div class="ledbar"><div class="chips">'
      + '<button class="chip sm' + (mode === "plan" ? " on" : "") + '" data-ledmode="plan">الخطة</button>'
      + '<button class="chip sm' + (mode === "spend" ? " on" : "") + '" data-ledmode="spend">الصرف</button>'
      + '</div><span class="lh">'
      + (mode === "plan" ? "السقف المخصَّص لكل بند في كل شهر"
                         : "إجمالي ما صُرف — يُسجَّل كإدخال سريع")
      + '</span></div>'
      + '<div class="ygrid ledger"><table><thead><tr><th class="cn">البند</th>'
      + months.map(function(mk){
          return '<th class="' + (mk === now ? "now" : "") + (isLocked(mk) ? " lk" : "") + '">'
            + AR_M3[+mk.slice(5) - 1] + (isLocked(mk) ? ' 🔒' : "") + '</th>';
        }).join("")
      + '<th>المجموع</th></tr></thead><tbody>';
    h += cats.map(function(c){
      var tot = 0;
      var tds = months.map(function(mk){
        var v = ledgerVal(c, mk); tot += v;
        var ro = isLocked(mk) || mk > now;
        return '<td class="' + (mk === now ? "now" : "") + '">'
          + (ro
              ? '<span class="lcell ro">' + (v ? fmt(v) : "·") + '</span>'
              : '<input class="lcell" type="number" inputmode="numeric" '
                + 'data-led="' + c.k + '|' + mk + '" value="' + (v || "") + '" placeholder="·">')
          + '</td>';
      }).join("");
      return '<tr><td class="cn">' + c.e + ' ' + esc(c.n) + '</td>' + tds
        + '<td class="v tot">' + fmt(tot) + '</td></tr>';
    }).join("");
    h += '</tbody></table></div>'
      + '<div class="lockbar">الأشهر القادمة والمُقفَلة للقراءة فقط. '
      + 'وتعديل شهر مضى يُكتب في خطته وحدها — لا يمسّ خطتك الأساسية.</div>'
      + '</div>';
    return h;
  }

  function viewYear(){
    var y = curYear(), Y = yearSum(y), h = "";
    var thisM = todayKey();

    /* ── ملخّص السنة ── */
    /* أفضل شهر: أكبر فائض */
    var bestM = null, bestV = null;
    Y.rows.forEach(function(r){
      if(!r.live || r.ahead) return;
      var d = r.inc - r.exp;
      if(bestV === null || d > bestV){ bestV = d; bestM = r; }
    });
    h += '<div class="kpis">'
      + kpi("◈", "accent", "دخل السنة", fmt(Y.inc), "",
            Y.months + " أشهر · متوسط " + fmt(Math.round(Y.inc / (Y.months || 1))))
      + kpi("↓", "warn", "صُرف", fmt(Y.exp), "",
            "متوسط شهري " + fmt(Math.round(Y.exp / (Y.months || 1))))
      + kpi("◇", "ok", "ما تبقّى", fmt(Y.net), "",
            (Y.inc > 0 ? Math.round(Y.rate * 100) + "٪ من دخل السنة" : "—"))
      + kpi("★", "gold", "أفضل شهر", bestM ? fmt(bestV) : "—", "",
            bestM ? esc(mName(bestM.k)).split(" ")[0] + " — دخله " + fmt(bestM.inc) : "لا بيانات")
      + '</div>';

    if(!Y.months){
      h += '<div class="empty"><b>لا شيءَ في ' + esc(y) + ' بعد</b>'
        + 'هذه الشاشةُ دفترُ سنتك: دخلُ كلّ شهرٍ وصرفُه، وكلُّ بندٍ عبر '
        + 'الاثني عشر شهراً. يكفي دخلُ شهرٍ أو مصروفٌ واحدٌ لتبدأ.'
        + '<div class="acts"><button class="act solid" data-tab="spend">'
        + 'سجّل مصروفَ هذا الشهر</button></div></div>';
      return h;
    }



    /* ── الشهور ── */
    var mx = 1;
    Y.rows.forEach(function(r){ mx = Math.max(mx, r.inc, r.exp); });
    h += '<div class="sec"><h2>شهور ' + esc(y) + '</h2><span class="hint">دخل ومصروف كل شهر</span></div>'
      + '<div class="card">'
      + '<div class="ylegend"><span><i style="background:var(--ok)"></i>الدخل</span>'
      + '<span><i style="background:var(--warn)"></i>المصروف</span></div>';
    h += Y.rows.map(function(r){
      if(!r.live || r.ahead)
        return '<div class="yrow empty"><span class="ym">' + esc(mName(r.k).split(" ")[0]) + '</span>'
          + '<span style="font-size:11.5px;color:var(--ink-3)">'
          + (r.live ? "قادم — دخل " + fmt(r.inc) + " محجوز ولا يُجمَع" : "لم يُسجَّل") + '</span>'
          + '<span class="ys">—</span></div>';
      return '<div class="yrow' + (r.k === thisM ? " now" : "") + '">'
        + '<span class="ym">' + esc(mName(r.k).split(" ")[0]) + '</span>'
        + '<span class="ybars">'
        + '<span class="ybar"><i style="width:' + (r.inc / mx * 100) + '%;background:var(--ok)"></i></span>'
        + '<span class="ybar"><i style="width:' + (r.exp / mx * 100) + '%;background:var(--warn)"></i></span>'
        + '</span>'
        + '<span class="ys" style="color:' + (r.net < 0 ? "var(--warn)" : "var(--ok)") + '">'
        + (r.net >= 0 ? "+" : "−") + fmt(Math.abs(r.net))
        + '<s>' + fmt(r.inc) + ' / ' + fmt(r.exp) + '</s></span></div>';
    }).join("");
    h += '</div>';

    h += ledgerGrid(y);

    /* ── البنود عبر الأشهر ── */
    var cats = visibleCats().map(function(c){
      var v = catYear(c.k, y), t = 0;
      v.forEach(function(x){ t += x; });
      return { c: c, v: v, t: t };
    }).filter(function(x){ return x.t > 0; })
      .sort(function(a, b){ return b.t - a.t; });

    if(cats.length){
      h += '<div class="sec"><h2>البنود عبر السنة</h2><span class="hint">اسحب أفقياً</span></div>'
        + '<div class="card"><div class="yhint" data-note="ne904238">أحمرُ الرقم = أعلى شهر في ذلك البند</div>'
        + '<div class="ygrid"><table><thead><tr><th class="cn">البند</th>'
        + yearMonths(y).map(function(k){ return '<th>' + k.slice(5) + '</th>'; }).join("")
        + '<th>المجموع</th><th>الشهري</th></tr></thead><tbody>';
      h += cats.map(function(x){
        var peak = Math.max.apply(null, x.v);
        var nz = x.v.filter(function(q){ return q > 0; }).length;
        return '<tr><td class="cn">' + x.c.e + ' ' + esc(x.c.n) + '</td>'
          + x.v.map(function(q){
              return '<td class="v ' + (q ? (q === peak && peak > 0 ? "hot" : "") : "z") + '">'
                + (q ? fmt(q) : "·") + '</td>';
            }).join("")
          + '<td class="v tot">' + fmt(x.t) + '</td>'
          + '<td class="v">' + fmt(nz ? Math.round(x.t / nz) : 0) + '</td></tr>';
      }).join("");
      h += '</tbody><tfoot><tr><td class="cn">المجموع</td>'
        + Y.rows.map(function(r){
            var e2 = r.ahead ? 0 : r.exp;
            return '<td class="v' + (e2 ? "" : " z") + '">' + (e2 ? fmt(e2) : "·") + '</td>';
          }).join("")
        + '<td class="v">' + fmt(Y.exp) + '</td>'
        + '<td class="v">' + fmt(Y.months ? Math.round(Y.exp / Y.months) : 0) + '</td>'
        + '</tr></tfoot></table></div></div>';
    }

    /* ── صافي الثروة خلال السنة ── */
    var SMy = snapMonths().filter(function(k){ return k.slice(0,4) === y; });
    if(SMy.length > 1){
      var v0 = netAt(SMy[0]), v1 = netAt(SMy[SMy.length - 1]), dv = v1 - v0;
      var lo = null, hi = null;
      SMy.forEach(function(k){
        var v = netAt(k);
        if(lo === null || v < lo) lo = v;
        if(hi === null || v > hi) hi = v;
      });
      if(hi === lo) hi = lo + 1;
      h += '<div class="sec"><h2>صافي ثروتك في ' + esc(y) + '</h2></div><div class="card">'
        + '<div class="wspark"><div class="spark">'
        + SMy.map(function(k, i){
            var v = netAt(k), hg = Math.max(5, Math.round((v - lo) / (hi - lo) * 46));
            return '<span class="sb"><i class="' + (v < 0 ? "neg " : "")
              + (i === SMy.length - 1 ? "last" : "") + '" style="height:' + hg + 'px"'
              + ' title="' + fmt(v) + '"></i><em>' + k.slice(5) + '</em></span>';
          }).join("")
        + '</div>'
        + '<div class="foot"><span>من <b>' + fmt(v0) + '</b> إلى <b>' + fmt(v1) + '</b></span>'
        + '<span style="color:' + (dv >= 0 ? "var(--ok)" : "var(--warn)") + '">'
        + (dv >= 0 ? "+" : "−") + fmt(Math.abs(dv)) + '</span></div></div></div>';
    }

    /* ── متى تتحرر: الالتزامات ── */
    var IL = allInst(thisM);
    if(IL.length){
      h += '<div class="sec"><h2>متى تتحرر</h2><span class="hint">آخر قسط لكل التزام</span></div>'
        + '<div class="card">';
      h += IL.map(function(i){
        return '<div class="tl"><span class="tm">' + esc(i.end) + '</span>'
          + '<span class="tn">' + esc(i.n) + ' <span class="tpill tp-inst">'
          + i.left + ' متبقٍ</span></span>'
          + '<span class="tv">−' + fmt(i.p * i.left) + '</span></div>';
      }).join("");
      var fm = instFreeMonth(thisM);
      if(fm)
        h += '<div class="tl"><span class="tm">' + esc(fm) + '</span>'
          + '<span class="tn"><b>بلا التزامات</b> — يعود لك ' + fmt(instMonthly(thisM)) + ' شهرياً</span>'
          + '<span class="tv" style="color:var(--ok)">✓</span></div>';
      h += '</div>';
    }

    /* ── الأهداف ── */
    var AG = activeGoals();
    if(AG.length){
      h += '<div class="sec"><h2>أهدافك</h2><span class="hint">أين وصلت</span></div><div class="card">';
      h += AG.map(function(g){
        var sv = goalSaved(g), tg = goalTarget(g);
        var p = tg ? Math.min(1, sv / tg) : 0, e = goalEta(g);
        return '<div class="row"><span class="ic" style="background:' + g.c + '22;color:' + g.c + '">'
          + g.e + '</span>'
          + '<span><span class="nm">' + esc(g.n) + '</span>'
          + '<span class="sub">' + (e.done ? "تحقّق"
              : (e.months ? "يكتمل في " + e.when + " (" + arMonths(e.months) + ")"
                          : "بلا مبلغ شهري")) + '</span>'
          + '<span class="track"><i style="width:' + (p * 100) + '%;background:' + g.c + '"></i></span></span>'
          + '<span class="rt"><span class="a">' + Math.round(p * 100) + '٪</span>'
          + '<span class="b">' + fmt(sv) + ' / ' + fmt(tg) + '</span></span></div>';
      }).join("");
      h += '</div>';
    }

    return h;
  }

  /* ═══ العرض والربط ═══ */

  var _scTab = null;
  function render(){

    wire(); if(!setNav()) colLayout(); wire(); dlgWire(); restoreFocus();

    /* الرسم يقع عشراتِ المرّات — فلا يُسجَّل إلا ما أبطأ منه، وإلا
       أغرق الأثرَ بما لا يدلّ. */
    try{
      var _rms = Date.now() - _rt0;
      if(_rms >= 60) diag("رسم", (ui.tab || "dash") + " · " + _rms + "مث");
    }catch(e){}

    _scTab = ui.tab;
    if(keepY > 0){
      /* مرّتين: مرّةً الآن، ومرّةً بعد أن يستقرّ طولُ الصفحة — إذ
         يعيد colLayout ترتيب العمودين فيتغيّر الطول، ووضعُ التمرير
         قبل استقراره يُقصّ إلى ما دونه. */
      try{ window.scrollTo(0, keepY); }catch(e){}

  /* ── عمودان بعد الرسم ──
     يعبر العمودين: الترويسة · شريط الشهور · المؤشرات · اللافتات
     · المعالج · الشبكات · الجداول العريضة.
     وما بقي يُقسَّم وحدات (عنوان + بطاقته) تُوضع كلٌّ في العمود الأقصر. */
  /* الأمنياتُ شبكةٌ تقسم نفسَها — فلا تُقسَّم بطاقاتُها على عمودين */
  var COLTABS = { dash:1, rep:1, year:1, plan:1, accts:1, inv:1, set:1 };
  function spansBoth(el){
    var c = el.className || "";
    if(ui.tab === "plan" && /(flag|mixline|wiz)/.test(c)) return false;
    if(/\bnospan\b/.test(c)) return false;
    /* جسد الصفحة: بطاقة الجهة وزرّ الإضافة وما أُعلِن عابراً */
    if(/\b(invcard|addbtn|spanall)\b/.test(c)) return true;
    /* wiz تمتدّ في اللوحة: تحتها صفُّ المؤشّرات الممتدّ، وضيقُها عنه
       يكسر الحافّة. وشاشةُ الخطة تستثنيها في السطر الأعلى. */
    if(/\b(topbar|mstrip2|kpis|spendbar|autobar|grid|dcols|modesw|wiz)\b/.test(c)) return true;
    if(el.tagName === "FOOTER") return true;
    if(el.classList.contains("card") &&
       (el.querySelector(".ygrid") || el.querySelector(".yrow") || el.querySelector(".qtab"))) return true;
    return false;
  }
  /* true = يحتاج العرض · false = يكفيه الضيّق · null = لا رأي */
  var WIDE_OF = ["ptab", "ecard", "mstrip", "own", "acct", "invpath", "yrow", "eled",
                 "instbox", "tl", "subrow", "distcard"];
  var NARROW_OF = ["alrt", "clsbar", "capline", "netrow", "esum"];
  function wantsWide(els){
    for(var i = 0; i < els.length; i++){
      var el = els[i];
      if(!el.querySelector) continue;
      for(var j = 0; j < NARROW_OF.length; j++)
        if(el.querySelector("." + NARROW_OF[j])) return false;
      for(var k = 0; k < WIDE_OF.length; k++)
        if(el.querySelector("." + WIDE_OF[k])) return true;
      /* قائمة من ستّة صفوف فأكثر تستفيد من العرض */
      var rows = el.querySelectorAll(".row, .grow, .cmp, .mrow, .item");
      if(rows.length >= 6) return true;
      if(rows.length && rows.length <= 3) return false;
    }
    return null;

  /* خمس عائلات. والترتيب داخل كلٍّ هو ترتيب ورودها في الشاشة. */
  var SET_FAM = [
    { n: "بياناتك", of: ["أين تُحفظ بياناتك", "اختر أين تُحفظ",
                        "إن تعذّر الدخول بجوجل", "النسخة الاحتياطية",
                        "لو ضاعت بياناتك", "منطقة الخطر"] },
    { n: "خطتك", of: ["الدخل الافتراضي", "بنود المصروف",
                      "الأهداف والاستثمار", "الحسابات", "قواعدك النسبية"] },
    { n: "شهرك", of: ["شهرك"] },
    { n: "العرض", of: ["العرض والتقويم"] },
    { n: "التطبيق", of: ["دليل التطبيق", "عن التطبيق", "مراقب الأخطاء",
                        /* DEV:NAME */ "أدوات التجربة",
                        "إعدادٌ للمطوّر"] }
  ];
  /* ما يُعرض معاً تحت مدخلٍ واحد. والجمعُ في الفهرس لا في المحتوى:
     الأقسام تُبنى كما هي، ثمّ تُعرض مجموعةً — فلا يُمسّ شرطٌ ولا
     بطاقة. وقد جُرّب الدمجُ في المصدر فكسر أقساماً لا تُرى. */
  var SET_GRP = [
    { n: "العرض والتقويم", of: ["العملة والأرقام", "التقويم والزكاة",
                               "المظهر والفتح", "التبويبات",
                               "التنبيه والتسجيل", "الشروح"] },
    { n: "شهرك", of: ["الشهر المالي", "الترحيل بين الشهور"] },
    { n: "الأهداف والاستثمار", of: ["الأهداف", "جهات الاستثمار",
                                   "سقف الاستثمار الشهري"] },
    { n: "عن التطبيق", of: ["عن التطبيق", "تثبيت التطبيق", "القناة",
                           "معالج البدء"] }
  ];
  function grpOf(name){
    for(var i = 0; i < SET_GRP.length; i++)
      if(SET_GRP[i].of.indexOf(name) >= 0) return SET_GRP[i];
    return null;
  }

  function famOf(name){
    for(var i = 0; i < SET_FAM.length; i++)
      if(SET_FAM[i].of.indexOf(name) >= 0) return i;
    return SET_FAM.length;          /* «أخرى» — لا يختفي قسمٌ صامتاً */
  }

  /* الإعدادات: قائمة أقسام + لوحة القسم المختار */
  function setNav(){
    var wrap = document.querySelector("#root > .wrap");
    if(!wrap || ui.tab !== "set" || window.innerWidth < 1180) return false;
    var kids = Array.prototype.slice.call(wrap.children);
    var lead = [], units = [], cur = null, tail = [];
    kids.forEach(function(el){
      if(el.tagName === "FOOTER"){ tail.push(el); return; }
      if(!units.length && !cur && !el.classList.contains("sec")){ lead.push(el); return; }
      if(el.classList.contains("sec")){ cur = { h: el, els: [el] }; units.push(cur); return; }
      if(cur) cur.els.push(el); else lead.push(el);
    });
    if(units.length < 3) return false;

    /* تُجمَع الوحدات: ما كان في مجموعةٍ انضمّ إلى أختها، وما لا فهو
       مجموعةٌ وحده. والترتيب ترتيبُ أوّل عضوٍ يظهر. */
    var groups = [], byName = {};
    units.forEach(function(u, i){
      var h2 = u.h.querySelector("h2");
      var nm = h2 ? h2.textContent.trim() : "قسم";
      var g = grpOf(nm);
      var key = g ? g.n : ("#" + i);
      if(!byName[key]){
        byName[key] = { name: g ? g.n : nm, idx: [], hint: "" };
        groups.push(byName[key]);
      }
      byName[key].idx.push(i);
      if(!g){
        var hn = u.h.querySelector(".hint");
        byName[key].hint = hn ? hn.textContent.trim() : "";
      }
    });

    var pick = Math.min(ui.setSec || 0, groups.length - 1);

    kids.forEach(function(el){ wrap.removeChild(el); });
    lead.forEach(function(el){ wrap.appendChild(el); });

    var box = document.createElement("div"); box.className = "colwrap setwrap";
    var a = document.createElement("div"); a.className = "colA";
    var b = document.createElement("div"); b.className = "colB";
    box.appendChild(a); box.appendChild(b);
    wrap.appendChild(box);

    /* القائمة في العمود الضيّق الأول (اليمين) والمحتوى في العريض */
    var nav = document.createElement("div");
    nav.className = "card setnav";
    /* تُصنَّف أوّلاً ثم تُرسم عائلةً عائلة — فالفهرس يُقرأ لا يُمسح */
    var bins = [];
    for(var f = 0; f <= SET_FAM.length; f++) bins.push([]);
    groups.forEach(function(g, i){
      var ht = g.hint;
      if(ht.length > 12 || !/[0-9٠-٩]/.test(ht)) ht = "";
      bins[famOf(g.name)].push({ i: i, name: g.name, ht: ht,
                                 bad: /خطر/.test(g.name) });
    });
    var html = "";
    bins.forEach(function(list, f){
      if(!list.length) return;
      var fam = SET_FAM[f] ? SET_FAM[f].n : "أخرى";
      html += '<div class="snvfam">' + esc(fam) + '</div>'
        + list.map(function(x){
            return '<button class="snv' + (x.i === pick ? " on" : "") + (x.bad ? " bad" : "")
              + '" data-setsec="' + x.i + '">' + esc(x.name)
              + (x.ht ? '<s>' + esc(x.ht) + '</s>' : "") + '</button>';

    a.appendChild(nav);

      units[ui2].els.forEach(function(el){ b.appendChild(el); });

    tail.forEach(function(el){ wrap.appendChild(el); });
    return true;
  }
  /* قسمةُ العمودين تُحفظ: الموازنة في كلّ رسمٍ تجعل الشاشة تقفز
     كلّما طال قسمٌ — وفتحُ بندٍ ليس طلباً لإعادة ترتيب الصفحة. */
  /* خريطةٌ لا ذاكرةٌ واحدة: البصمةُ فيها اسمُ الشاشة، فذاكرةٌ واحدة
     تُمحى كلَّما انتقلتَ ثمّ عدتَ — فتُحسب القسمة من جديد والبندُ
     مفتوحٌ هذه المرّة، فتنتقل القائمة. */
  var _colMem = {};
  function unitName(u, i){
    var el = u.els && u.els[0];
    var h2 = el && el.querySelector ? el.querySelector("h2") : null;
    if(h2) return h2.textContent.trim();
    return (el && el.className ? String(el.className).split(" ")[0] : "?") + "#" + i;
  }

  function colLayout(){
    var wrap = document.querySelector("#root > .wrap");
    if(!wrap) return;
    if(window.innerWidth < 1180 || !COLTABS[ui.tab || "dash"]) return;

    /* ١ · اقرأ الأبناء بالترتيب وقسّمهم: عابر · أو وحدة (عنوان + محتواه) */
    var kids = Array.prototype.slice.call(wrap.children);
    var seq = [], cur = null;
    kids.forEach(function(el, i){
      if(spansBoth(el)){ seq.push({ span: true, els: [el] }); cur = null; return; }
      /* عنوان يتبعه عنصر عابر يعبر معه — وإلا بقي يتيماً في عمود */
      if(el.classList.contains("sec") && kids[i + 1] && spansBoth(kids[i + 1])){
        seq.push({ span: true, els: [el] }); cur = null; return;
      }
      if(el.classList.contains("sec") || !cur){ cur = { span: false, els: [] }; seq.push(cur); }
      cur.els.push(el);
    });

    /* وحدة تحمل بطاقتين فأكثر ليست قسماً جانبياً بل جسد
       الصفحة — فلتعبر العمودين ولا تُفرِغ جارها. */
    seq.forEach(function(u){
      if(u.span) return;
      var n = 0;
      u.els.forEach(function(e){ if(e.classList.contains("card")) n++; });
      if(n >= 2) u.span = true;
    });

    /* ٢ · افصلهم عن الصفحة ثم أعِدهم بالترتيب نفسه */
    kids.forEach(function(el){ wrap.removeChild(el); });

    var box = null, colA = null, colB = null;
    function closeBox(){ box = colA = colB = null; }
    function openBox(){
      box = document.createElement("div"); box.className = "colwrap";
      colA = document.createElement("div"); colA.className = "colA";
      colB = document.createElement("div"); colB.className = "colB";
      box.appendChild(colA); box.appendChild(colB);
      wrap.appendChild(box);
    }
    /* كم وحدة متتالية غير عابرة؟ أقلّ من اثنتين لا تستحق عمودين */
    /* بصمةُ الطقم: الشاشة · وأسماء الأقسام · وعرض النافذة. فإن لم
       تتغيّر أُعيد كلُّ قسمٍ إلى عموده، وإلا وُزّع من جديد. */
    var _names = [];
    seq.forEach(function(u, i){ if(!u.span) _names.push(unitName(u, i)); });
    var _sig = (ui.tab || "") + "|" + _names.join("§") + "|"
             + (window.innerWidth < 1500 ? "s" : "w");
    var _tk = ui.tab || "dash";
    var _mem = _colMem[_tk];
    var _keep = !!(_mem && _mem.sig === _sig);
    if(!_keep){ _mem = _colMem[_tk] = { sig: _sig, side: {} }; }

    seq.forEach(function(u, i){
      if(u.span){
        closeBox();
        u.els.forEach(function(e){ wrap.appendChild(e); });
        return;
      }
      if(!box) openBox();

      var _nm = unitName(u, i);
      if(_keep && _mem.side[_nm]){
        var tt = (_mem.side[_nm] === "A") ? colA : colB;
        u.els.forEach(function(e){ tt.appendChild(e); });
        return;
      }

      /* الوجهة بالمعنى لا بالارتفاع:
         ما فيه جدول أو قائمة أعمدة يحتاج عرضاً · وما هو ملخّص أو تنبيه
         يكفيه الضيّق · وما لا يُعرف يذهب للعمود الأقصر. */
      var pref = wantsWide(u.els);
      var ha = colA.offsetHeight, hb = colB.offsetHeight, t;
      if(pref === true){
        /* العرض حقّه — إلا أن يطول العمود العريض حتّى يترك جاره
           فارغاً بمئات البكسلات. عندها الموازنة أولى من العرض. */
        t = (ha > hb + 420) ? colB : colA;
      } else if(pref === false){
        /* ملخّص أو تنبيه: الضيّق يكفيه — إلا أن يُفرِغ العريض */
        t = (hb > ha + 160) ? colA : colB;
      } else {
        t = (ha <= hb) ? colA : colB;
      }
      _mem.side[_nm] = (t === colA) ? "A" : "B";
      u.els.forEach(function(e){ t.appendChild(e); });
    });

  function restoreFocus(){
    if(!focusSel) return;
    var el = document.querySelector(focusSel);
    focusSel = null;

    on("[data-imgpick]", function(){
      var f = document.getElementById("emofile");
      if(!f) return;
      f.onchange = function(){
        var file = f.files && f.files[0];
        if(!file) return;
        var rd = new FileReader();
        rd.onload = function(){
          var im = new Image();
          im.onload = function(){
            try{
              /* ٦٤×٦٤ وwebp: بياناتك تُرفع في ملفٍّ واحد، وصورةُ الجوّال
                 ثلاثةُ ميغابايت. وتُقصّ مربّعةً لأنّ الأيقونة دائرة. */
              var side = Math.min(im.width, im.height);
              var cv = document.createElement("canvas");
              cv.width = cv.height = 64;
              var g = cv.getContext("2d");
              g.drawImage(im, (im.width - side) / 2, (im.height - side) / 2,
                          side, side, 0, 0, 64, 64);
              var url = cv.toDataURL("image/webp", 0.8);
              if(url.length > 12000) url = cv.toDataURL("image/webp", 0.5);
              var el = document.querySelector("[data-emofield]");
              if(el) el.value = url;
              var fc = document.querySelector(".emoface");
              if(fc) fc.innerHTML = '<img class="icimg" src="' + esc(url) + '" alt="">';
              toast("رُفعت الصورة · " + kb(url.length));
            }catch(e){ toast("تعذّرت معالجة الصورة"); }
          };
          im.onerror = function(){ toast("الملفّ ليس صورةً صالحة"); };
          im.src = rd.result;
        };
        rd.onerror = function(){ toast("تعذّرت قراءة الملفّ"); };
        rd.readAsDataURL(file);
      };
      f.click();
    });

  /* التاريخ الافتراضي: اليوم في الشهر الجاري · أوّل الشهر المفتوح فيما عداه */
  function defaultDate(){
    var now = new Date(), nk = todayKey();
    if(ui.month === nk){
      return nk + "-" + pad(now.getDate());
    }
    return ui.month + "-01";

  /* الشهر يُشتقّ من التاريخ — لا من الشاشة المفتوحة */
  /* ═══ التثبيت على الجهاز ═══
     يعمل في النسخة المستقلّة، ويصمت في غيرها بلا خطأ. */
  /* رقم النسخة يُحقن عند البناء — فتعرف ما الذي يشغّله الناس */
  var APP_VERSION = "1.5.0-beta+49-demo";
  /* يُعرض رقماً لا تاريخاً: التاريخ لا يميّز تحديثين في يوم، ولا يقول
     لصاحبه كم تحديثاً فاته. والرقم يُردّ إلى تحديثٍ بعينه. */
  function verLabel(){ return APP_VERSION; }
  /* القناة تُقرأ من الإصدار — البناءُ يُلحقها به، فلا يحتاج التطبيق
     إعداداً ثانياً يُنسى تحديثه. */
  function channel(){
    var m = /-([a-z]+)$/.exec(APP_VERSION || "");
    return m ? m[1] : "";
  }
  /* رقمُ قشرة سطح المكتب — فارغٌ في المتصفّح، ولا يُدَّعى ما ليس هناك */
  function deskVer(){
    try{ return (window.masrouf && window.masrouf.version) || ""; }
    catch(e){ return ""; }
  }
  /* بيت التطبيق. يُذكر حيث يحتاجه من فتحه في مكانٍ لا يُحفظ فيه. */
  var HOME = "relifeg1.github.io/masrouf";
  var installPrompt = null, swReady = false, swWaiting = null;
  function pwaInit(){
    try{
      /* isSecureContext هو المعيار: يشمل https وlocalhost و127.0.0.1
         معاً. وشرطُ الاسم نصّاً يسقط على 127.0.0.1 — وقد سقط. */
      if("serviceWorker" in navigator && window.isSecureContext){
        /* updateViaCache:"none" — وإلا أعاد المتصفّح استعمال sw.js من
             ذاكرة HTTP بلا طلبٍ أصلاً، فلا يعرف بنسخةٍ نُشرت. قِيس: في
             الزيارة الثانية لم يُطلب الملفّ ولا مرّة. */
        navigator.serviceWorker.register("sw.js", { updateViaCache: "none" })
          .then(function(reg){
          swReady = true;
          /* نسخة تنتظر: لا تُفرَض على المستخدم وهو يكتب، بل تُعرض عليه */
          if(reg.waiting){ swWaiting = reg.waiting; render(); }
          reg.addEventListener("updatefound", function(){
            var w = reg.installing;
            if(!w) return;
            w.addEventListener("statechange", function(){
              if(w.state === "installed" && navigator.serviceWorker.controller){
                swWaiting = w; render();
              }
            });
          });
          /* فحصٌ صريح عند كل فتح: الفحص التلقائي للمتصفّح لا يُعتمد
             عليه — قِيس فلم يطلب sw.js أصلاً في زيارةٍ ثانية.
             وعند العودة للتطبيق المثبَّت بعد غياب، وكل ساعة إن بقي مفتوحاً. */
          try{ reg.update(); }catch(e){}
          document.addEventListener("visibilitychange", function(){
            if(document.visibilityState === "visible"){
              try{ reg.update(); }catch(e){}
            }
          });
          setInterval(function(){ try{ reg.update(); }catch(e){} }, 3600000);
        })["catch"](function(){});
        var reloaded = false;
        navigator.serviceWorker.addEventListener("controllerchange", function(){
          if(reloaded) return;
          reloaded = true;
          location.reload();
        });
      }
    }catch(e){}
    try{
      window.addEventListener("beforeinstallprompt", function(e){
        e.preventDefault();
        installPrompt = e;
        render();
      });
      window.addEventListener("appinstalled", function(){
        installPrompt = null;
        toast("ثُبِّت على جهازك");
        render();
      });
    }catch(e){}
  }
  /* التحديث يُستبدل به الشيفرة كلّها. فقبل ذلك تُعرض النسخة الاحتياطية
     — تُطلب ولا تُفرض: من رفضها مضى، ومن قبلها نزل ملفّه أوّلاً. */
  function askUpdate(){
    if(!swWaiting) return;
    ask({ title: "نسخة جديدة جاهزة",
      msg: "خذ نسخةً احتياطية قبل التحديث — دقيقةٌ تقيك يوماً. "
         + "وبياناتك لا تُمسّ بالتحديث، ولك فوقها لقطةٌ تُحفظ تلقائياً "
         + "قبل أي تغييرٍ في بنيتها.",
      fields: [],
      ok: "انسخ ثم حدّث",
      onOk: function(){
        var ok = backupNow();
        toast(ok ? ("نزل " + backupName() + " · جارٍ التحديث…") : "جارٍ التحديث…");
        /* مهلةٌ يبدأ فيها التنزيل قبل أن تُستبدل الصفحة تحته */
        setTimeout(applyUpdate, ok ? 1200 : 0);
      },
      cancel: "حدّث بلا نسخة",
      onCancel: applyUpdate });
  }
  function applyUpdate(){
    if(!swWaiting) return;
    localFlush();                         /* لا يضيع تعديلٌ عند إعادة التحميل */
    try{ swWaiting.postMessage({ type: "SKIP_WAITING" }); }catch(e){}
    swWaiting = null;
    toast("جارٍ التحديث…");
  }
  function kb(n){
    return n < 1024 ? (n + " بايت") : (Math.round(n / 102.4) / 10 + "KB");
  }
  function clock(t){
    var d = new Date(t);
    return pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  /* دليلٌ لا وعد: متى كُتبت آخر مرّة، وكم حجمها */
  function saveProof(){

      try{ raw = localStorage.getItem(LSKEY); }catch(e){}

      return "لم يُحفظ شيء بعد";

  /* ═══ طبقة التخزين ═══
     وجهان خلف واجهة واحدة: جهازك (localStorage) أو سحابتك (Supabase).
     الإعدادات في localStorage لا في الحالة — لأنها تُقرأ قبل الحالة. */
  /* المفتاح العلني يُحقن عند البناء. علنيّ بطبعه: من فتح الصفحة قرأه.
     الحماية من RLS في القاعدة — كل صفٍّ مقيَّد بـauth.uid() — لا من
     إخفاء المفتاح. */
  var SUPA_URL = "";
  var SUPA_KEY = "";
  var AKEY = "kh_auth_demo";
  var CONFKEY = "kh_conf_demo";

  /* ما أدخله صاحب الجهاز يعلو ما حُقن عند البناء */
  function conf(){
    try{ return JSON.parse(localStorage.getItem(CONFKEY) || "{}") || {}; }
    catch(e){ return {}; }
  }
  function confSet(o){
    try{
      var c = conf();
      for(var k in o){ if(o[k]) c[k] = o[k]; else delete c[k]; }
      localStorage.setItem(CONFKEY, JSON.stringify(c));
    }catch(e){}
  }
  function supaUrl(){ return String(conf().supaUrl || SUPA_URL || ""); }
  function supaKey(){ return String(conf().supaKey || SUPA_KEY || ""); }
  function gdClient(){ return String(conf().gdId || GD_ID || ""); }

  function supaReady(){
    /* https وحده — إلا localhost، فالمتصفّحات نفسها تعدّه أصلاً آمناً،
       وعليه تُختبر الدورة كاملة قبل أن يُنشأ مشروعٌ حقيقي. */
    var u = supaUrl();
    var ok = /^https:\/\//.test(u)
          || /^http:\/\/(localhost|127\.0\.0\.1)(:|\/|$)/.test(u);
    return ok && supaKey().length > 30;
  }
  function authSess(){
    try{ var r = localStorage.getItem(AKEY); return r ? JSON.parse(r) : null; }
    catch(e){ return null; }
  }
  function authSet(o){
    try{ if(o) localStorage.setItem(AKEY, JSON.stringify(o));
         else localStorage.removeItem(AKEY); }catch(e){}
  }
  function signedIn(){
    var a = authSess();
    return cloudAllowed() && supaReady() && !!(a && a.access_token && a.uid);
  }
  function supaHead(tok){
    return { "apikey": supaKey(), "Content-Type": "application/json",
             "Authorization": "Bearer " + (tok || supaKey()) };
  }
  function authStore(j){
    if(!j || !j.access_token) return null;
    var o = { access_token: j.access_token, refresh_token: j.refresh_token,
              exp: Date.now() + ((j.expires_in || 3600) * 1000),
              uid: (j.user && j.user.id) || (authSess() || {}).uid,
              email: (j.user && j.user.email) || (authSess() || {}).email };
    authSet(o); return o;
  }
  /* الرمز ينتهي بعد ساعة. فيُجدَّد قبل كل طلب إن قارب — وإلا ردّت
     القاعدة 401 وظنّ المستخدم أن بياناته ضاعت. */
  function withTok(then){
    var a = authSess();
    if(!a){ then(null, "لم تسجّل دخولك"); return; }
    if(a.exp - Date.now() > 60000){ then(a, null); return; }
    if(!a.refresh_token){ then(null, "انتهت الجلسة — سجّل دخولك"); return; }
    fetch(supaUrl() + "/auth/v1/token?grant_type=refresh_token", {
      method: "POST", headers: supaHead(null),
      body: JSON.stringify({ refresh_token: a.refresh_token })
    }).then(function(r){ return r.json(); })
      .then(function(j){
        var o = authStore(j);
        if(o) then(o, null);
        else { authSet(null); then(null, "انتهت الجلسة — سجّل دخولك"); }
      })["catch"](function(e){ then(null, String(e.message || e)); });
  }
  function authSendCode(email, then){
    fetch(supaUrl() + "/auth/v1/otp", {
      method: "POST", headers: supaHead(null),
      body: JSON.stringify({ email: email, create_user: true })
    }).then(function(r){
      if(r.ok){ then(null); return; }
      return r.json().then(function(j){ then(j.msg || j.error_description || ("HTTP " + r.status)); });
    })["catch"](function(e){ then(String(e.message || e)); });
  }
  function authVerify(email, code, then){
    fetch(supaUrl() + "/auth/v1/verify", {
      method: "POST", headers: supaHead(null),
      body: JSON.stringify({ email: email, token: String(code).trim(), type: "email" })
    }).then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
      .then(function(x){
        if(!x.ok || !x.j.access_token){
          then(x.j.msg || x.j.error_description || "رمزٌ غير صحيح"); return;
        }
        authStore(x.j); then(null);
      })["catch"](function(e){ then(String(e.message || e)); });
  }
  function authGoogle(){
    var back = location.href.replace(/[#?].*$/, "");
    location.href = supaUrl() + "/auth/v1/authorize?provider=google&redirect_to="
                  + encodeURIComponent(back);
  }
  function authOut(){
    var a = authSess();
    if(a) try{ fetch(supaUrl() + "/auth/v1/logout", { method: "POST", headers: supaHead(a.access_token) }); }catch(e){}
    authSet(null);
  }
  /* العودة من Google أو من رابط البريد: الرمز في الجزء بعد #.
     يُقرأ ثم يُمحى من الشريط — كي لا يبقى في التاريخ ولا يُشارَك. */
  function authFromHash(){
    if(!location.hash || location.hash.indexOf("access_token") < 0) return false;
    /* جوجل ترجع state=gd — فيُفرَّق ردّها عن ردّ الحساب */
    if(location.hash.indexOf("state=gd") >= 0) return gdFromHash();
    if(!supaReady()) return false;
    var q = {}, h = location.hash.replace(/^#/, "");
    h.split("&").forEach(function(p){
      var i = p.indexOf("="); if(i < 0) return;
      q[decodeURIComponent(p.slice(0, i))] = decodeURIComponent(p.slice(i + 1));
    });
    try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
    if(!q.access_token) return false;
    authSet({ access_token: q.access_token, refresh_token: q.refresh_token || "",
              exp: Date.now() + ((+q.expires_in || 3600) * 1000),
              uid: "", email: "" });
    /* الهويّة تُقرأ من الخادم — لا تُستنتج من الرمز */
    fetch(supaUrl() + "/auth/v1/user", { headers: supaHead(q.access_token) })
      .then(function(r){ return r.json(); })
      .then(function(u){
        var a = authSess() || {};
        a.uid = u.id || ""; a.email = u.email || "";
        authSet(a); toast("أهلاً " + (u.email || "")); cloudFirstPull();
      })["catch"](function(){ render(); });
    return true;
  }

  /* ═══ لقطة ما قبل التحديث ═══ */
  var SNAPKEY = "kh_snap_demo", VERKEY = "kh_ver_demo";

  /* تُستدعى قبل migrate() — وإلا حُفظت البنية بعد ترقيتها فلا تنفع رجوعاً */
  function snapBeforeUpdate(){
    var prev = null, raw = null;
    try{ prev = localStorage.getItem(VERKEY); }catch(e){}
    try{ localStorage.setItem(VERKEY, APP_VERSION); }catch(e){}
    if(!prev || prev === APP_VERSION) return;    /* أوّل تشغيل، أو لا جديد */
    try{ raw = localStorage.getItem(LSKEY); }catch(e){}
    if(!raw || raw.length < 40) return;          /* لا بيانات تستحقّ */
    try{
      localStorage.setItem(SNAPKEY, JSON.stringify({
        ver: prev, at: new Date().toISOString(), data: raw }));
    }catch(e){
      /* امتلأت المساحة: التحديث أولى من اللقطة — لا يُوقَف من أجلها */
      try{ localStorage.removeItem(SNAPKEY); }catch(e2){}
    }
  }
  function snapInfo(){
    try{
      var r = localStorage.getItem(SNAPKEY);
      if(!r) return null;
      var o = JSON.parse(r);
      return (o && o.data) ? o : null;
    }catch(e){ return null; }
  }
  function snapRestore(){
    var o = snapInfo();
    if(!o) return false;
    try{
      var d = JSON.parse(o.data);
      for(var k in state) if(!(k in d)) delete state[k];
      for(var k2 in d) state[k2] = d[k2];
      migrate();
      localWrite();
      return true;
    }catch(e){ return false; }
  }
  function snapDrop(){ try{ localStorage.removeItem(SNAPKEY); }catch(e){} }

  /* ثلاثة أوضاع، ويُقرأ الجاري من الواقع لا من علَمٍ مخزَّن */
  function storageMode(){
    if(gdLinked()) return "drive";
    if(signedIn()) return "account";
    if(cloudOn()) return "own";

  function syncOn(){ return gdLinked() || cloudOn(); }
  function syncPush(then){
    if(gdLinked()) return gdPush(then);
    return cloudPush(then);

  function syncPull(then){

  /* full=true في الإعدادات: يُعرض ما ليس مهيّأً وسببُه.
     full=false في معالج البدء: من يفتح أوّل مرة لا يعنيه ما لا يعمل. */

    if(m2 < 60) return "قبل " + (m2 === 1 ? "دقيقة" : (m2 === 2 ? "دقيقتين"
                 : (m2 <= 10 ? m2 + " دقائق" : m2 + " دقيقة")));
    var h2 = Math.round(m2 / 60);
    if(h2 < 24) return "قبل " + (h2 === 1 ? "ساعة" : (h2 === 2 ? "ساعتين"
                 : (h2 <= 10 ? h2 + " ساعات" : h2 + " ساعة")));

    /* حاضرةٌ سلفاً: لا تُحقن ثانيةً */

    if(g.exp - Date.now() > 300000) return then(true);   /* أكثر من خمس دقائق */

       ليس خطأً بل وقتاً مضى. */
    if(!retried && (gdStale() || (gdSess() && gdSess().exp - Date.now() < 300000))){
      return gdFresh(function(){ gdPush(then, true); });
    }
    if(!gdOn()){
      var m0 = gdStale() ? "انتهت جلسة درايف — ادخل ثانيةً" : "لم تدخل درايف";
      syncLogPut(false, m0); then(m0); return;
    }
    cloudBusy = true; render();
    var body = JSON.stringify(state);
    gdFind(function(id, mtime, err){
      if(err){
        cloudBusy = false;
        cloudMsg = "تعذّر الرفع: " + err;
        syncLogPut(false, err);
        then(err); render(); return;
      }
      var url, opt;
      if(id){
        /* موجود: يُستبدل محتواه وحده */
        url = GD_API + "/upload/drive/v3/files/" + id + "?uploadType=media";
        opt = { method: "PATCH",
                headers: gdHead({ "Content-Type": "application/json" }),
                body: body };
      } else {
        /* أوّل مرة: وصفٌ ومحتوى في طلبٍ واحد متعدّد الأجزاء */
        var B = "kh" + Date.now().toString(36);
        var meta = JSON.stringify({ name: GD_FILE, parents: ["appDataFolder"] });
        var multi = "--" + B + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"
                  + meta
                  + "\r\n--" + B + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"
                  + body
                  + "\r\n--" + B + "--";
        url = GD_API + "/upload/drive/v3/files?uploadType=multipart";
        opt = { method: "POST",
                headers: gdHead({ "Content-Type": "multipart/related; boundary=" + B }),
                body: multi };
      }
      fetch(url, opt).then(function(r){
        cloudBusy = false;
        if(!r.ok) throw new Error(gdErr(r));
        cloudMsg = "رُفعت " + new Date().toLocaleTimeString("en-GB").slice(0, 5);
        syncLogPut(true, "");
        then(null);
      })["catch"](function(e){
        cloudBusy = false;
        var m = String(e.message || e);
        cloudMsg = "تعذّر الرفع: " + m;
        syncLogPut(false, m);
        then(m);
      });
    });
  }

  /* جوجل تردّ الخطأ في الاستعلام لا في الجزء بعد # — يُقرأ ويُشرح،
     فلا يعود المستخدم إلى شاشةٍ صامتة لا يدري لماذا لم يدخل. */
  function gdErrorBack(){
    var m = /[?&]error=([^&]+)/.exec(location.search || "");
    if(!m) return false;
    var e = decodeURIComponent(m[1]);
    try{ history.replaceState(null, "", location.pathname); }catch(x){}
    if(e.indexOf("redirect_uri_mismatch") >= 0){
      ask({ title: "جوجل ردّت: عنوان العودة غير مسجَّل",
        msg: "التطبيق أرسل هذا العنوان، وهو ليس في قائمة "
           + "<b>Authorized redirect URIs</b> في مشروعك:"
           + '<div class="gdvals"><div><s>redirect URI</s><code>'
           + esc(gdRedirect()) + '</code></div></div>'
           + "أضفه هناك حرفاً بحرف — والشرطة الأخيرة منه — ثم أعد المحاولة. "
           + "وقد تأخذ جوجل دقائق حتى يسري التغيير.",
        fields: [], ok: "فهمت", cancel: false });
      return true;
    }
    toast("تعذّر الدخول بجوجل: " + e);
    return true;
  }

  function gdFromHash(){
    var q = {}, h = location.hash.replace(/^#/, "");
    h.split("&").forEach(function(p){
      var i = p.indexOf("="); if(i < 0) return;
      q[decodeURIComponent(p.slice(0, i))] = decodeURIComponent(p.slice(i + 1));
    });
    try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
    if(!q.access_token) return false;
    gdSet({ token: q.access_token,
            exp: Date.now() + ((+q.expires_in || 3600) * 1000) });
    toast("دخلتَ درايف");
    setTimeout(gdFirstPull, 200);
    return true;
  }
  /* أوّل دخول: إن لم يكن له ملفٌّ في درايف أُنشئ الآن بما عنده */
  function gdFirstPull(){ syncNow(false); }

  /* داخل أرتفاكت كلود لا اتّصال بمضيف خارجي — فلا يُعرض خيارٌ لا يعمل */
  function cloudAllowed(){ return !(window.claude && window.claude.use); }
  /* طريقٌ واحد إلى القاعدة: الدخول بالحساب. وكان ثمّة ربطٌ يدويّ يلصق
     فيه المستخدم رابط مشروعٍ ومفتاحاً — وهو المزوّد نفسه بطريقٍ أوعر،
     فحُذف: خياران لشيءٍ واحد عبءٌ لا سعة. */
  function cloudOn(){ return signedIn(); }
  function cloudWho(){ return (authSess() || {}).email || "حسابك"; }
  /* يجمع ما يلزم الطلب — عنواناً ورؤوساً ومعرّفاً — أيّاً كان الوجه */
  function cloudCtx(then){
    if(signedIn()){
      withTok(function(a, err){
        if(err){ then(null, err); return; }
        then({ url: supaUrl().replace(/\/+$/, "") + "/rest/v1/budget",
               head: supaHead(a.access_token), uid: a.uid }, null);
      });
      return;
    }
    then(null, "لم تسجّل دخولك");
  }
  var cloudBusy = false, cloudMsg = "";
  /* رسائل الخادم لا تُعرض كما هي: HTTP 404 لا يقول لصاحبه شيئاً */
  function cloudErr(e){
    var t = String(e || "");
    if(t === "EMPTY") return "لا نسخة في حسابك بعد";
    if(/HTTP 40[13]/.test(t)) return "انتهت جلستك — سجّل دخولك من جديد";
    if(/HTTP 404/.test(t)) return "لم يُهيَّأ الجدول في القاعدة بعد";
    if(/Failed to fetch|NetworkError/i.test(t)) return "لا اتّصال بالإنترنت";
    return t;
  }
  function cloudPull(then){
    if(!cloudOn()) { if(then) then(null, "لم تُربط سحابة"); return; }
    cloudBusy = true; render();
    cloudCtx(function(c, err){
      if(err){ cloudBusy = false; if(then) then(null, err); render(); return; }
      fetch(c.url + "?id=eq." + encodeURIComponent(c.uid) + "&select=data,updated_at",
            { headers: c.head })
        .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(rows){
          cloudBusy = false;
          /* لا صفّ ليس خطأً: هو أوّل مرة. يُمرَّر رمزاً لا جملةً كي
             يفرّق المتّصل بين «جديد» و«تعطّل شيء». */
          if(!rows || !rows.length){ if(then) then(null, "EMPTY"); return; }
          if(then) then(rows[0], null);
        })["catch"](function(e){
          cloudBusy = false;
          if(then) then(null, String(e.message || e));
        });
    });
  }
  function cloudPush(then){
    if(!cloudOn()){ if(then) then("لم تُربط سحابة"); return; }
    cloudBusy = true; render();
    cloudCtx(function(c, err){
      if(err){ cloudBusy = false; if(then) then(err); render(); return; }
      var body = [{ id: c.uid, data: state, updated_at: new Date().toISOString() }];
      var h = {}; for(var k in c.head) h[k] = c.head[k];
      h.Prefer = "resolution=merge-duplicates";
      fetch(c.url, { method: "POST", headers: h, body: JSON.stringify(body) })
        .then(function(r){
          cloudBusy = false;
          if(!r.ok) throw new Error("HTTP " + r.status);
          cloudMsg = "رُفعت " + new Date().toLocaleTimeString("en-GB").slice(0, 5);
          if(then) then(null);
        })["catch"](function(e){
          cloudBusy = false;
          if(then) then(String(e.message || e));
        });
    });
  }
  /* أوّل دخولٍ على جهاز جديد: إن كانت السحابة أحدث وجهازك فارغ، تنزل
     بلا سؤال. وإن كان في الجهاز عملٌ فالقرار للمستخدم — الدمج التلقائي
     في أرقامٍ مالية يخطئ بصمت. */
  /* عدّ الوحدات — للرسالة التي تقول ماذا جاء من هناك */
  function unitCount(st){
    var n = 0, k, u = units(st || {});
    for(k in u) n++;
    return n;
  }

  /* يدمج ما جاء مع ما عندك، ثم يحفظ. ولا يستبدل شيئاً. */
  function applyCloud(row, quiet){
    try{
      var before = unitCount(state);
      var merged = mergeStates(state, migrateOf(row.data));
      for(var k in state) if(!(k in merged)) delete state[k];
      for(var k2 in merged) state[k2] = merged[k2];
      migrate();
      _stampPrev = null;         /* الوسم يُعاد بناؤه على الحالة الجديدة */
      localWrite();
      var after = unitCount(state);
      if(!quiet){
        toast(after > before
          ? ("دُمجت · وصل " + (after - before) + " سجلّاً جديداً")
          : "دُمجت · لا جديد");
      }
    }catch(e){ toast("تعذّر دمجُ الملفّ — تأكّد أنّه نسخةُ «مصروف» ولم يُعدَّل"); }
    render();
  }

  /* نسخةٌ من إصدارٍ أقدم تُرقّى قبل أن تُدمج — وإلا دُمجت ببنيةٍ لا تُفهم */
  function migrateOf(d){
    if(!d || typeof d !== "object") return {};
    var keep = state, out;
    try{
      state = JSON.parse(JSON.stringify(d));
      migrate();
      out = state;
    }catch(e){ out = d; }
    state = keep;
    return out;
  }

  /* الدورة كاملة: أنزِل · ادمج · ارفع الناتج */
  var syncBusy = false;
  function syncNow(quiet, then){
    if(!syncOn()){ if(then) then("لا مزامنة"); return; }
    if(syncBusy){ if(then) then(null); return; }
    syncBusy = true;
    syncSet("busy");
    syncPull(function(row, err){
      if(err === "EMPTY" || (!err && (!row || !row.data))){
        /* لا نسخة هناك بعد: يُرفع ما هنا فيُنشأ */
        syncPush(function(e2){
          syncBusy = false;
          syncSet(e2 ? "err" : "ok");
          if(!quiet) toast(e2 ? ("تعذّر الرفع: " + cloudErr(e2)) : "جُهّزت سحابتك");
          else if(!e2) toast("رُفعت تعديلاتك إلى درايف");
          render(); if(then) then(e2 || null);
        });
        return;
      }
      if(err){
        syncBusy = false;
        syncSet("err");
        if(!quiet) toast(cloudErr(err));
        render(); if(then) then(err);
        return;
      }
      applyCloud(row, quiet);
      syncPush(function(e3){
        syncBusy = false;
        syncSet(e3 ? "err" : "ok");
        if(e3){ if(!quiet) toast("دُمجت هنا · وتعذّر الرفع: " + cloudErr(e3)); }
        else toast("رُفعت تعديلاتك إلى درايف");
        render(); if(then) then(e3 || null);
      });
    });
  }
  function askCode(em){
    ask({ title: "الرمز وصل إلى " + em,
      msg: "افتح بريدك: إمّا تضغط الرابط فتدخل مباشرةً، وإمّا تنسخ الرمز هنا.",
      fields: [ { label: "الرمز", value: "", ph: "123456" } ],
      ok: "ادخل",
      onOk: function(v){
        cloudBusy = true; render();
        authVerify(em, v[0], function(err){
          cloudBusy = false;
          if(err){ toast(err); render(); return; }
          toast("دخلت"); cloudFirstPull();
        });
      },
      cancel: "لاحقاً" });
  }
  /* أوّل دخول: لا سؤال. ما هناك وما هنا يجتمعان، ولا يفقد أحدهما شيئاً. */
  function cloudFirstPull(){ syncNow(false); }
  var cloudPending = null;
  function cloudQueue(){
    if(!syncOn()) return;
    syncSet("wait");
    clearTimeout(cloudPending);
    cloudPending = setTimeout(function(){
      /* دورةٌ كاملة لا رفعاً وحده: جهازٌ آخر قد كتب بينهما */
      syncNow(true, function(err){
        if(err && err !== "لا مزامنة") toast("تعذّرت المزامنة: " + cloudErr(err));
      });
    }, 2500);
  }

  /* ينزّل نصّاً ملفّاً. يرجع false حيث تمنع البيئةُ التنزيل — كعرض
     الأرتفاكت — فيعرف المتّصل أن عليه إبقاء النصّ ظاهراً. */
  function downloadFile(name, text, mime){
    try{
      var blob = new Blob([text], { type: (mime || "text/plain") + ";charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = name;
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){
        try{ document.body.removeChild(a); URL.revokeObjectURL(url); }catch(e){}
      }, 4000);
      return true;
    }catch(e){ return false; }
  }
  function stamp(){
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function backupName(ext){ return "masrouf-" + stamp() + "." + (ext || "json"); }
  /* منسَّق لا مضغوط: النسخة الاحتياطية تُقرأ أحياناً، ولا يضرّ الحجم */
  /* يَعدّ ما في النسخة قسماً قسماً — فتُعَدّ ولا تُصدَّق */
  function backupCount(){
    var s = state, mk = Object.keys(s.months || {}), i;
    var o = { "شهور": mk.length, "حركات": 0,
              "بنود": (s.cats || []).length, "فروع": 0,
              "حسابات": (s.accts || []).length, "سطور الحسابات": 0,
              "أهداف": (s.goals || []).length,
              "جهات الاستثمار": (s.invest || []).length, "سطور الجهات": 0,
              "قواعد": (s.rules || []).length,
              "شهور فيها توزيع": 0, "شهور مقفلة": 0,
              "آثار محذوفة": (s.gone || []).length,
              "مفاتيح الحالة": Object.keys(s).length,
              "مفاتيح أخرى للتطبيق": Object.keys(backupExtras().ls || {}).length };
    mk.forEach(function(k){
      var m = s.months[k] || {};
      o["حركات"] += ((m.items) || []).length;
      if(m.dist && Object.keys(m.dist).length) o["شهور فيها توزيع"]++;
      if(m.locked) o["شهور مقفلة"]++;
    });
    (s.cats || []).forEach(function(c){ o["فروع"] += ((c.subs) || []).length; });
    (s.accts || []).forEach(function(a){ o["سطور الحسابات"] += ((a.log) || []).length; });
    (s.invest || []).forEach(function(x){ o["سطور الجهات"] += ((x.log) || []).length; });
    return o;
  }

  /* مغلَّفٌ لا حالةٌ عارية: يدخل فيه ما كان خارج state، وتصير للملفّ
     هويّةٌ وإصدارٌ تُمكّنان الهجرة حين تتغيّر البنية. */
  function backupText(){
    return JSON.stringify({
      kind: "masrouf-backup",
      appVer: APP_VERSION,
      schema: state.v,
      at: new Date().toISOString(),
      "ملحوظة": "نسخةٌ كاملة. ولا تحوي رموز الدخول (درايف والحساب) عمداً — "
              + "فهذا الملفّ يُرسَل ويُحفظ، ومن وضع فيه مفتاحه سلّمه لمن يجده. "
              + "تُطلب مرّةً واحدة بعد الاستعادة.",
      "بيان": backupCount(),
      /* الملحقات تُمسح مسحاً لا تُعدّ عدّاً: ما يُضاف غداً يدخل بلا
         تعديلٍ هنا. ويُستثنى الرمزان وحدهما — ويُعلَن استثناؤهما. */
      extras: backupExtras(),
      state: state
    }, null, 2);
  }

  /* كلُّ مفاتيح التطبيق في المتصفّح — إلا ما لا يجوز أن يُرسَل */
  var BK_SKIP = null;
  function backupExtras(){
    if(!BK_SKIP) BK_SKIP = [GDKEY, AKEY];       /* رمزان لا يُنسخان */
    var out = { ls: {} };
    try{
      for(var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if(!k) continue;
        if(k !== LSKEY && k.indexOf("kh") !== 0) continue;
        if(k === LSKEY) continue;               /* الحالة في مكانها */
        if(BK_SKIP.indexOf(k) >= 0) continue;
        out.ls[k] = localStorage.getItem(k);
      }
    }catch(e){}
    /* وتبقى الثلاثة بأسمائها: نسخةٌ قديمة تقرأها ولا تعرف ls */
    out.conf = conf();
    out.dev = devTag();
    out.snap = snapInfo();
    return out;
  }

  /* يقبل الشكلين: المغلَّف الجديد، والحالة العارية التي أُخذت بالأمس */
  function backupUnwrap(d){
    if(d && d.kind === "masrouf-backup" && d.state && typeof d.state === "object")
      return { st: d.state, ex: d.extras || {}, meta: d };
    return { st: d, ex: {}, meta: null };
  }

  /* تقريرٌ يُقرأ — لا يُستعاد منه، وإنما يُطمئن صاحبه أن ما فيه ماله */
  function reportText(){
    var L = [], i;
    function line(t){ L.push(t == null ? "" : String(t)); }
    function rule(){ line("──────────────────────────────────────────"); }
    function money(n){ return fmt(num(n)) + " " + cur(); }

    line("مصروف — خلاصة بياناتك");
    line("حُفظت في " + stamp() + " · التحديث " + verLabel());
    rule();
    line("");
    line("الدخل الافتراضي: " + money((state.income || {}).salary)
         + (num((state.income || {}).extra) ? "  ودخل إضافي "
            + money(state.income.extra) : ""));
    line("بداية الشهر المالي: يوم " + monthStart());
    line("العملة: " + cur());
    line("");

    var cats = (state.cats || []).filter(function(c){ return !c.hidden; });
    line("البنود (" + cats.length + ")");
    rule();
    cats.forEach(function(c){
      var kind = { fix: "ثابت", var: "متغيّر", inst: "قسط" }[c.t] || "";
      line("  " + (c.e || "•") + " " + c.n
           + " — خطة " + money(c.p) + (kind ? "  (" + kind + ")" : ""));
    });
    line("");

    var goals = (state.goals || []).filter(function(g){ return !g.arch; });
    if(goals.length){
      line("الأهداف (" + goals.length + ")");
      rule();
      goals.forEach(function(g){
        var pct = num(g.target) ? Math.round(num(g.saved) / num(g.target) * 100) : 0;
        line("  " + (g.e || "•") + " " + g.n + " — " + money(g.saved)
             + " من " + money(g.target) + " (" + pct + "٪)"
             + (num(g.m) ? "  · شهرياً " + money(g.m) : ""));
      });
      line("");
    }

    if((state.invest || []).length){
      line("الاستثمار (" + state.invest.length + ")");
      rule();
      state.invest.forEach(function(x){
        line("  " + x.n + " — أُودع " + money(x["in"]) + " · القيمة "
             + money(x.val) + (num(x.m) ? "  · شهرياً " + money(x.m) : ""));
      });
      line("");
    }

    var accts = state.accts || [];
    if(accts.length){
      var tot = 0;
      line("المحافظ (" + accts.length + ")");
      rule();
      accts.forEach(function(a){
        tot += num(a.bal);
        line("  " + a.n + (a.bank ? " — " + a.bank : "") + " · " + money(a.bal));
      });
      line("  المجموع: " + money(tot));
      line("");
    }

    var mks = Object.keys(state.months || {}).sort();
    line("الأشهر (" + mks.length + ")");
    rule();
    mks.forEach(function(mk){
      var items = (state.months[mk].items || []);
      var sum = 0;
      items.forEach(function(x){ sum += num(x.a); });
      line("  " + mk + " — " + items.length + " حركة · " + money(sum));
    });
    var all = 0, n = 0;
    mks.forEach(function(mk){
      (state.months[mk].items || []).forEach(function(x){ all += num(x.a); n++; });
    });
    line("");
    rule();
    line("الإجمالي: " + n + " حركة · " + money(all));
    line("");
    line("هذا الملفّ للقراءة. الاستعادة تكون من ملفّ JSON.");
    return L.join("\r\n");
  }

  /* أفضل ما تتيحه البيئة: حوار النظام · فمنتقي الملفّات · فالتنزيل.
     يُعيد وصف ما وقع كي تصدق الرسالة. */
  function saveText(name, text, mime, then){
    if(window.masrouf && typeof window.masrouf.saveAs === "function"){
      window.masrouf.saveAs(name, text)
        .then(function(ok){ then(ok ? "dialog" : "cancel"); })
        ["catch"](function(){ then(downloadFile(name, text, mime) ? "download" : "fail"); });
      return;
    }
    if(window.showSaveFilePicker){
      var ext = "." + name.split(".").pop();
      window.showSaveFilePicker({

  /* ── حدّ الشهر المالي ──

  function monthStart(){
    var d = Math.round(num(state.monthStart));
    return (d >= 2 && d <= 28) ? d : 1;
  }
  function monthOfDate(d, startDay){
    var m = /^(\d{4})-(\d{2})-?(\d{2})?/.exec(String(d || ""));
    if(!m) return ui.month;
    var st = startDay === undefined ? monthStart() : startDay;
    if(st <= 1) return m[1] + "-" + m[2];
    var y = +m[1], mo = +m[2], day = +(m[3] || 1);
    if(day < st){ mo--; if(mo < 1){ mo = 12; y--; } }
    if(st >= 15){ mo++; if(mo > 12){ mo = 1; y++; } }
    return y + "-" + pad(mo);
  }
  /* إعادة توزيع الحركات على الصناديق بعد تغيير الحدّ.

  function rebucket(newStart, dry){
    var moves = [], all = [];
    for(var mk in state.months){
      (state.months[mk].items || []).forEach(function(it){
        all.push({ from: mk, it: it });
      });
    }
    all.forEach(function(x){
      if(!x.it.d) return;                 /* حركة بلا تاريخ تبقى مكانها */
      var to = monthOfDate(x.it.d, newStart);
      if(to !== x.from) moves.push({ from: x.from, to: to, it: x.it });
    });
    if(dry) return moves;
    moves.forEach(function(mv){
      var src = state.months[mv.from];
      src.items = src.items.filter(function(y){ return y.id !== mv.it.id; });
      month(mv.to).items.push(mv.it);
    });
