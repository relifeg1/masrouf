      + '<input class="ni s" type="number" inputmode="numeric" data-dpay="' + a.id + '" value="'
      + (num(a.mpay) || "") + '" placeholder="شهرياً"></div>'
      + '<div class="dprog"><span class="dbar"><i style="width:' + (debtPct(a) * 100) + '%"></i></span>'
      + '<span class="dtx">سدّدت <b>' + fmt(paid) + '</b> من <b>' + fmt(princ) + '</b>'
      + ' · باقٍ <b class="rem">' + fmt(left) + '</b></span></div>'
      + '<div class="ahint">'

          : 'على هذا القسط ينتهي بعد <b>' + arMonths(n) + '</b> — في <b>' + esc(mName(end)) + '</b>.')
      + ' والسداد يكون بتحويل من حساب إلى هذا الالتزام.</div>';
  }

  function viewAccts(){
    var A = accts(), h = "";
    var ops = opsAssets();

                ? 'ينقص <b>' + fmt(Math.abs(g)) + '</b> ريال. صرفت أكثر مما سجّلت — مصروف لم تدوّنه، أو رسوم بنكية، أو تحويل خارج التطبيق.'
                : 'يزيد <b>' + fmt(g) + '</b> ريال. دخل لم تسجّله — أو مصروف دوّنته ولم تدفعه فعلاً.'))
        + '</div>';

              : 'لا لقطات بعد.')
        + '<div class="acts" style="justify-content:center"><button class="act" data-snapnow="' + ui.month + '">'

      h += '<div class="row"><span class="ic" style="background:var(--card-2)">Σ</span>'
        + '<span><span class="nm">إجمالي ما عليك</span>'
        + '<span class="sub">' + (instFreeMonth(ui.month) ? "تتحرر أموالك في " + mName(instFreeMonth(ui.month)) : "") + '</span></span>'
        + '<span class="rt"><span class="a" style="color:var(--warn)">−' + fmt(LB) + '</span></span></div></div>';
      h += '<div class="hintnote" data-note="n683513d">هذا <b>كامل ما تبقى عليك</b>، ويُطرح من ثروتك مرة واحدة. '
        + 'أما خطتك فتقتطع <b>' + fmt(instMonthly(ui.month)) + '</b> ريال شهرياً فقط — '

      return '<div class="row"><span class="ic" style="background:' + g.c + '22;color:' + g.c + '">' + g.e + '</span>'

    h += '</div>';

    /* الحسابات مرتّبة حسب الجهة (المرحلة ٤) */

                  + '<span class="bal2">' + fmt(ac.bal) + '</span>'
                : '<b>بلا حساب</b> — رصيد الظرف تخطيطي فقط')

        b2 += '</div>';
      }

      + fmt(tBal) + '</b><s>الرصيد</s></span></div>';

    /* ── الأهداف والادخار ── */

    if(AGE.length){
      var gBal = 0, gMon = 0;

              ? '<span class="gmode ' + (gMode(g) === "endless" ? "endless" : "calc") + '">'

          + '<span class="chev">' + (open ? "▾" : "▸") + '</span></b>'

          + (tg > 0 ? ' · المستهدف ' + fmt(tg) : ' · بلا سقف') + '</s>'

          + '<s>الرصيد</s></span></div>';
        if(open){
          var GL = goalLedger(g, k, 6);

  /* ═══ ٥ · السنة ═══ */
  /* ══ الدفتر ══
     طبقتان على نفس الشبكة: «الخطة» تكتب سقف البند في ذلك الشهر،
     و«الصرف» تكتب إجمالي ما صُرف فيه (عبر الإدخال السريع نفسه).
     تعديل شهر ماضٍ يُكتب في خطة ذلك الشهر وحده — لا في الأساس. */
  function ledgerMode(){ return ui.ledger || "plan"; }
  function ledgerVal(c, mk){
    return ledgerMode() === "plan" ? catPlan(c, mk) : (actuals(mk).by[c.k] || 0);
  }
  function ledgerSet(c, mk, v){
    if(ledgerMode() === "plan"){
      var need = subsSum(c, mk);
      if(v < need){ toast("لا يقل عن مجموع الفروع (" + fmt(need) + ")"); v = need; }
      setP(mk, c.k, v);                    /* دائماً خطة ذلك الشهر وحده */
    } else {
      setQuick(mk, c.k, v);
    }
  }
  function ledgerGrid(y){
    var months = yearMonths(y), now = todayKey(), mode = ledgerMode();
    var cats = visibleCats();
    var h = '<div class="sec"><h2>الدفتر</h2>'
      + '<span class="hint">اكتب في أي خانة — بلا مغادرة الصفحة</span></div>'
      + '<div class="card">'
      + '<div class="ledbar"><div class="chips">'
      + '<button class="chip sm' + (mode === "plan" ? " on" : "") + '" data-ledmode="plan">الخطة</button>'
      + '<button class="chip sm' + (mode === "spend" ? " on" : "") + '" data-ledmode="spend">الصرف</button>'
      + '</div><span class="lh">'
      + (mode === "plan" ? "السقف المخصَّص لكل بند في كل شهر"
                         : "إجمالي ما صُرف — يُسجَّل كإدخال سريع")
      + '</span></div>'
      + '<div class="ygrid ledger"><table><thead><tr><th class="cn">البند</th>'
      + months.map(function(mk){
          return '<th class="' + (mk === now ? "now" : "") + (isLocked(mk) ? " lk" : "") + '">'
            + AR_M3[+mk.slice(5) - 1] + (isLocked(mk) ? ' 🔒' : "") + '</th>';
        }).join("")
      + '<th>المجموع</th></tr></thead><tbody>';
    h += cats.map(function(c){
      var tot = 0;
      var tds = months.map(function(mk){
        var v = ledgerVal(c, mk); tot += v;
        var ro = isLocked(mk) || mk > now;
        return '<td class="' + (mk === now ? "now" : "") + '">'
          + (ro
              ? '<span class="lcell ro">' + (v ? fmt(v) : "·") + '</span>'
              : '<input class="lcell" type="number" inputmode="numeric" '
                + 'data-led="' + c.k + '|' + mk + '" value="' + (v || "") + '" placeholder="·">')
          + '</td>';
      }).join("");
      return '<tr><td class="cn">' + c.e + ' ' + esc(c.n) + '</td>' + tds
        + '<td class="v tot">' + fmt(tot) + '</td></tr>';
    }).join("");
    h += '</tbody></table></div>'
      + '<div class="lockbar">الأشهر القادمة والمُقفَلة للقراءة فقط. '
      + 'وتعديل شهر مضى يُكتب في خطته وحدها — لا يمسّ خطتك الأساسية.</div>'
      + '</div>';
    return h;
  }

  function viewYear(){
    var y = curYear(), Y = yearSum(y), h = "";
    var thisM = todayKey();

    /* ── ملخّص السنة ── */
    /* أفضل شهر: أكبر فائض */
    var bestM = null, bestV = null;
    Y.rows.forEach(function(r){
      if(!r.live || r.ahead) return;
      var d = r.inc - r.exp;
      if(bestV === null || d > bestV){ bestV = d; bestM = r; }
    });
    h += '<div class="kpis">'
      + kpi("◈", "accent", "دخل السنة", fmt(Y.inc), "",
            Y.months + " أشهر · متوسط " + fmt(Math.round(Y.inc / (Y.months || 1))))
      + kpi("↓", "warn", "صُرف", fmt(Y.exp), "",
            "متوسط شهري " + fmt(Math.round(Y.exp / (Y.months || 1))))
      + kpi("◇", "ok", "ما تبقّى", fmt(Y.net), "",
            (Y.inc > 0 ? Math.round(Y.rate * 100) + "٪ من دخل السنة" : "—"))
      + kpi("★", "gold", "أفضل شهر", bestM ? fmt(bestV) : "—", "",
            bestM ? esc(mName(bestM.k)).split(" ")[0] + " — دخله " + fmt(bestM.inc) : "لا بيانات")
      + '</div>';

    if(!Y.months){
      h += '<div class="empty"><b>لا بيانات في ' + esc(y) + '</b>'
        + 'سجّل دخل شهر أو مصروفاً، ثم عد إلى هنا.</div>';
      return h;
    }



    /* ── الشهور ── */
    var mx = 1;
    Y.rows.forEach(function(r){ mx = Math.max(mx, r.inc, r.exp); });
    h += '<div class="sec"><h2>شهور ' + esc(y) + '</h2><span class="hint">دخل ومصروف كل شهر</span></div>'
      + '<div class="card">'
      + '<div class="ylegend"><span><i style="background:var(--ok)"></i>الدخل</span>'
      + '<span><i style="background:var(--warn)"></i>المصروف</span></div>';
    h += Y.rows.map(function(r){
      if(!r.live || r.ahead)
        return '<div class="yrow empty"><span class="ym">' + esc(mName(r.k).split(" ")[0]) + '</span>'
          + '<span style="font-size:11.5px;color:var(--ink-3)">'
          + (r.live ? "قادم — دخل " + fmt(r.inc) + " محجوز ولا يُجمَع" : "لم يُسجَّل") + '</span>'
          + '<span class="ys">—</span></div>';
      return '<div class="yrow' + (r.k === thisM ? " now" : "") + '">'
        + '<span class="ym">' + esc(mName(r.k).split(" ")[0]) + '</span>'
        + '<span class="ybars">'
        + '<span class="ybar"><i style="width:' + (r.inc / mx * 100) + '%;background:var(--ok)"></i></span>'
        + '<span class="ybar"><i style="width:' + (r.exp / mx * 100) + '%;background:var(--warn)"></i></span>'
        + '</span>'

  /* ═══ العرض والربط ═══ */
  function render(){
    var body = ui.tab === "set" ? viewSet()
             : ui.tab === "year" ? viewYear()
             : ui.tab === "env" ? viewEnv()
             : ui.tab === "plan" ? viewPlan()
             : ui.tab === "spend" ? viewSpend()
             : ui.tab === "accts" ? viewAccts()
             : ui.tab === "inv" ? viewInv()
             : ui.tab === "rep" ? viewRep() : viewDash();
    /* صنف الشاشة على .wrap — مقبض تخطيطها في الأنماط */
    document.getElementById("root").innerHTML =
      '<div class="wrap v-' + (ui.tab || "dash") + '">'
      + topbar() + saveBar() + updateBar() + body
      + '<footer>' + (saveBlocked ? 'الحفظ متعذّر — اقرأ التنبيه أعلاه'
                                  : 'بياناتك تُحفظ تلقائياً') + '</footer></div>'
      + navbar() + dlgHTML();
    applyNotes();
    wire(); if(!setNav()) colLayout(); wire(); dlgWire(); restoreFocus();
  }
  /* ── عمودان بعد الرسم ──
     يعبر العمودين: الترويسة · شريط الشهور · المؤشرات · اللافتات
     · المعالج · الشبكات · الجداول العريضة.
     وما بقي يُقسَّم وحدات (عنوان + بطاقته) تُوضع كلٌّ في العمود الأقصر. */
  var COLTABS = { dash:1, rep:1, year:1, plan:1, accts:1, inv:1, set:1 };
  function spansBoth(el){
    var c = el.className || "";
    if(ui.tab === "plan" && /(flag|mixline|wiz)/.test(c)) return false;
    if(/\bnospan\b/.test(c)) return false;
    /* جسد الصفحة: بطاقة الجهة وزرّ الإضافة وما أُعلِن عابراً */
    if(/\b(invcard|addbtn|spanall)\b/.test(c)) return true;
    if(/\b(topbar|mstrip2|kpis|spendbar|autobar|grid|dcols|modesw)\b/.test(c)) return true;
    if(el.tagName === "FOOTER") return true;
    if(el.classList.contains("card") &&
       (el.querySelector(".ygrid") || el.querySelector(".yrow") || el.querySelector(".qtab"))) return true;
    return false;
  }
  /* true = يحتاج العرض · false = يكفيه الضيّق · null = لا رأي */
  var WIDE_OF = ["ptab", "ecard", "mstrip", "own", "acct", "invpath", "yrow", "eled",
                 "instbox", "tl", "subrow", "distcard"];
  var NARROW_OF = ["alrt", "clsbar", "capline", "netrow", "esum"];
  function wantsWide(els){
    for(var i = 0; i < els.length; i++){
      var el = els[i];
      if(!el.querySelector) continue;
      for(var j = 0; j < NARROW_OF.length; j++)
        if(el.querySelector("." + NARROW_OF[j])) return false;
      for(var k = 0; k < WIDE_OF.length; k++)
        if(el.querySelector("." + WIDE_OF[k])) return true;
      /* قائمة من ستّة صفوف فأكثر تستفيد من العرض */
      var rows = el.querySelectorAll(".row, .grow, .cmp, .mrow, .item");
      if(rows.length >= 6) return true;
      if(rows.length && rows.length <= 3) return false;
    }
    return null;
  }
  /* الإعدادات: قائمة أقسام + لوحة القسم المختار */
  function setNav(){
    var wrap = document.querySelector("#root > .wrap");
    if(!wrap || ui.tab !== "set" || window.innerWidth < 1180) return false;
    var kids = Array.prototype.slice.call(wrap.children);
    var lead = [], units = [], cur = null, tail = [];
    kids.forEach(function(el){
      if(el.tagName === "FOOTER"){ tail.push(el); return; }
      if(!units.length && !cur && !el.classList.contains("sec")){ lead.push(el); return; }
      if(el.classList.contains("sec")){ cur = { h: el, els: [el] }; units.push(cur); return; }
      if(cur) cur.els.push(el); else lead.push(el);
    });
    if(units.length < 3) return false;
    var pick = Math.min(ui.setSec || 0, units.length - 1);

    kids.forEach(function(el){ wrap.removeChild(el); });
    lead.forEach(function(el){ wrap.appendChild(el); });

    var box = document.createElement("div"); box.className = "colwrap setwrap";
    var a = document.createElement("div"); a.className = "colA";
    var b = document.createElement("div"); b.className = "colB";
    box.appendChild(a); box.appendChild(b);
    wrap.appendChild(box);

    /* القائمة في العمود الضيّق الأول (اليمين) والمحتوى في العريض */
    var nav = document.createElement("div");
    nav.className = "card setnav";
    nav.innerHTML = units.map(function(u, i){
      var h2 = u.h.querySelector("h2"), hint = u.h.querySelector(".hint");
      var name = h2 ? h2.textContent : "قسم";
      var danger = /خطر/.test(name);
      /* الشرح الطويل لا مكان له في القائمة — العدد وحده يفيد */
      var ht = hint ? hint.textContent.trim() : "";
      if(ht.length > 12 || !/[0-9٠-٩]/.test(ht)) ht = "";
      return '<button class="snv' + (i === pick ? " on" : "") + (danger ? " bad" : "")
        + '" data-setsec="' + i + '">' + esc(name)
        + (ht ? '<s>' + esc(ht) + '</s>' : "") + '</button>';
    }).join("");
    a.appendChild(nav);

    units[pick].els.forEach(function(el){ b.appendChild(el); });
    tail.forEach(function(el){ wrap.appendChild(el); });
    return true;
  }
  function colLayout(){
    var wrap = document.querySelector("#root > .wrap");
    if(!wrap) return;
    if(window.innerWidth < 1180 || !COLTABS[ui.tab || "dash"]) return;

    /* ١ · اقرأ الأبناء بالترتيب وقسّمهم: عابر · أو وحدة (عنوان + محتواه) */
    var kids = Array.prototype.slice.call(wrap.children);
    var seq = [], cur = null;
    kids.forEach(function(el, i){
      if(spansBoth(el)){ seq.push({ span: true, els: [el] }); cur = null; return; }
      /* عنوان يتبعه عنصر عابر يعبر معه — وإلا بقي يتيماً في عمود */
      if(el.classList.contains("sec") && kids[i + 1] && spansBoth(kids[i + 1])){
        seq.push({ span: true, els: [el] }); cur = null; return;
      }
      if(el.classList.contains("sec") || !cur){ cur = { span: false, els: [] }; seq.push(cur); }
      cur.els.push(el);
    });

    /* وحدة تحمل بطاقتين فأكثر ليست قسماً جانبياً بل جسد
       الصفحة — فلتعبر العمودين ولا تُفرِغ جارها. */
    seq.forEach(function(u){
      if(u.span) return;
      var n = 0;
      u.els.forEach(function(e){ if(e.classList.contains("card")) n++; });
      if(n >= 2) u.span = true;
    });

    /* ٢ · افصلهم عن الصفحة ثم أعِدهم بالترتيب نفسه */
    kids.forEach(function(el){ wrap.removeChild(el); });

    var box = null, colA = null, colB = null;
    function closeBox(){ box = colA = colB = null; }
    function openBox(){
      box = document.createElement("div"); box.className = "colwrap";
      colA = document.createElement("div"); colA.className = "colA";
      colB = document.createElement("div"); colB.className = "colB";
      box.appendChild(colA); box.appendChild(colB);
      wrap.appendChild(box);
    }
    /* كم وحدة متتالية غير عابرة؟ أقلّ من اثنتين لا تستحق عمودين */
    seq.forEach(function(u, i){
      if(u.span){
        closeBox();
        u.els.forEach(function(e){ wrap.appendChild(e); });
        return;
      }
      if(!box) openBox();

      /* الوجهة بالمعنى لا بالارتفاع:
         ما فيه جدول أو قائمة أعمدة يحتاج عرضاً · وما هو ملخّص أو تنبيه
         يكفيه الضيّق · وما لا يُعرف يذهب للعمود الأقصر. */
      var pref = wantsWide(u.els);
      var ha = colA.offsetHeight, hb = colB.offsetHeight, t;
      if(pref === true){
        /* العرض حقّه — إلا أن يطول العمود العريض حتّى يترك جاره
           فارغاً بمئات البكسلات. عندها الموازنة أولى من العرض. */
        t = (ha > hb + 420) ? colB : colA;
      } else if(pref === false){
        /* ملخّص أو تنبيه: الضيّق يكفيه — إلا أن يُفرِغ العريض */
        t = (hb > ha + 160) ? colA : colB;
      } else {
        t = (ha <= hb) ? colA : colB;
      }
      u.els.forEach(function(e){ t.appendChild(e); });
    });
  }
  function restoreFocus(){
    if(!focusSel) return;
    var el = document.querySelector(focusSel);
    focusSel = null;
    if(!el) return;
    try{ el.focus(); var v = el.value; el.value = ""; el.value = v; }catch(e){}
  }

  function wire(){
    var q = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };
    var on = function(sel, fn){ q(sel).forEach(function(el){ el.onclick = function(e){ fn(el, e); }; }); };
    var ch = function(sel, fn){ q(sel).forEach(function(el){ el.onchange = function(){ fn(el); }; }); };

    on("[data-tab]", function(b){ ui.tab = b.getAttribute("data-tab");
      try{ sessionStorage.setItem("kh_tab", ui.tab); }catch(e){} render(); });
    on("[data-ledmode]", function(b){ ui.ledger = b.getAttribute("data-ledmode"); render(); });
    ch("[data-led]", function(el){
      var p = el.getAttribute("data-led").split("|"), c = catOf(p[0]), mk = p[1];
      if(!c) return;
      if(isLocked(mk)){ toast(mName(mk) + " مُقفَل — افتحه من شاشة الخطة"); render(); return; }
      ledgerSet(c, mk, num(el.value));
      save(); render();
    });
    on("[data-clearjump]", function(){ ui.jumpTo = null; render(); });
    on("[data-gomonth]", function(b){
      ui.month = b.getAttribute("data-gomonth");
      ui.jumpTo = null;
      ui.stripYear = ui.month.slice(0, 4);
      try{ sessionStorage.setItem("kh_month", ui.month); }catch(e){}
      render();
    });
    on("[data-stripy]", function(b){
      ui.stripYear = String(+stripYear() + (+b.getAttribute("data-stripy")));
      render();
    });
    on("[data-nav]", function(b){ ui.month = shift(ui.month, +b.getAttribute("data-nav"));
      ui.stripYear = ui.month.slice(0, 4);
      try{ sessionStorage.setItem("kh_month", ui.month); }catch(e){} render(); });
    on("[data-ynav]", function(b){
      ui.year = String(+curYear() + (+b.getAttribute("data-ynav")));
      render();
    });

    /* الدخل — يخص الشهر المعروض */
    /* حقلا «الدخل الافتراضي» في الإعدادات كانا بلا مقبض: تكتب فيهما
       فلا يُحفظ شيء. كشفهما تدقيقُ المقابض، وأكّده اختبارٌ حيّ. */
    ch("[data-inc]", function(el){
      var f = el.getAttribute("data-inc");
      var v = calcAmt(el.value); if(v === null) v = num(el.value);
      state.income[f] = Math.max(0, Math.round(v));
      toast("حُدّث الدخل الافتراضي");
      save(); render();
    });
    ch("[data-minc]", function(el){
      var f = el.getAttribute("data-minc"), o = incObj(ui.month), v = num(el.value);
      if(onePlan() && !isPast(ui.month)){
        /* خطة واحدة: الرقم يصير الافتراضي، ويُرفع تخصيص هذا الشهر */
        state.income[f] = v;
        var mm2 = state.months[ui.month];
        if(mm2 && mm2.inc) delete mm2.inc;
      } else {
        var m = month(ui.month);
        if(!m.inc) m.inc = { salary: o.salary, extra: o.extra };
        m.inc[f] = v;
      }
      save(); render();
    });
    on("[data-incdef]", function(){
      var o = incObj(ui.month);
      state.income = { salary: o.salary, extra: o.extra };
      toast("صار الافتراضي لكل شهر"); save(); render();
    });
    on("[data-increset]", function(){
      month(ui.month).inc = null; toast("رجع للافتراضي"); save(); render();
    });

    /* فتح/طي البنود */
    on("[data-openenv]", function(b){
      var kk = b.getAttribute("data-openenv");
      ui.openEnv[kk] = !ui.openEnv[kk];
      render();
    });
    on("[data-envmove]", function(b, e){
      if(e) e.stopPropagation();
      var c = catOf(b.getAttribute("data-envmove")), ac = catAcct(c), src = salaryAcct();
      if(!ac || !src){ toast("اربط حساباً للبند أولاً"); return; }
      var amt = catPlan(c, ui.month);
      if(amt <= 0){ toast("لا مبلغ مخطَّط لهذا البند"); return; }
      confirmDlg("تحويل " + fmt(amt) + " إلى «" + ac.n + "»؟",
        "من <b>" + esc(src.n) + "</b> (رصيده " + fmt(src.bal) + ") إلى حساب بند <b>"
        + esc(c.n) + "</b>.", "حوّل", function(){
          if(doTransfer(src.id, ac.id, amt, "تمويل بند " + c.n)){
            distMap(ui.month)["c:" + c.k] = amt;   /* لا يتكرّر مع التوزيع الشهري */
            toast("حُوّل " + fmt(amt) + " إلى " + ac.n);
            save();
          }

    q("[data-quick],[data-plan],[data-gquick],[data-iquick],[data-minc]").forEach(function(el){

         وُلد نصّياً أصلاً (الاستثمار والدخل) فلم يُربط به الحاسب. */
      if(el.type === "number") el.setAttribute("type", "text");

    var navCol = function(attr){
      var arr = q("[" + attr + "]");
      arr.forEach(function(el, idx){
        el.onkeydown = function(e){
          if(e.key === "Escape"){ el.value = el.defaultValue; el.blur(); return; }
          if(e.key !== "Enter" && e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
          e.preventDefault();
          var nx = arr[idx + (e.key === "ArrowUp" ? -1 : 1)];
          if(!nx){ el.blur(); return; }
          var sel = "[" + attr + '="' + nx.getAttribute(attr) + '"]';
          focusSel = sel;
          el.blur();
          /* إن لم يتغيّر شيء فلا رسم ولا restoreFocus — ننقل التركيز بأنفسنا */
          setTimeout(function(){
            if(!focusSel) return;
            var t = document.querySelector(focusSel);
            focusSel = null;
            if(t){ try{ t.focus(); t.select(); }catch(e2){} }
          }, 0);
        };
      });
    };

    ch("[data-invclose]", function(el){
      var id = el.getAttribute("data-invclose"), v0 = null;
      state.invest.forEach(function(x){ if(x.id === id) v0 = x; });
      if(!v0) return;
      var mk = ui.month, x = num(el.value);
      var prev = invValAt(v0, shift(mk, -1)); if(prev === null) prev = 0;
      var put = invPut(v0, mk);
      var val = invEntry(v0) === "gain" ? prev + put + x : x;
      var g = Math.round(val - prev - put), base = prev + put;
      var commit = function(){
        if(!setInvValue(v0, mk, val)){ toast("عدّة محافظ — حدّثها من تبويب الحسابات"); return; }
        toast((g >= 0 ? "ربح " : "خسارة ") + mName(mk) + ": "

        save(); render();

  /* ═══ التثبيت على الجهاز ═══
     يعمل في النسخة المستقلّة، ويصمت في غيرها بلا خطأ. */
  /* رقم النسخة يُحقن عند البناء — فتعرف ما الذي يشغّله الناس */
  var APP_VERSION = "2026.08.31+65260c";
  /* بيت التطبيق. يُذكر حيث يحتاجه من فتحه في مكانٍ لا يُحفظ فيه. */
  var HOME = "relifeg1.github.io/masrouf";
  var installPrompt = null, swReady = false, swWaiting = null;
  function pwaInit(){
    try{
      /* isSecureContext هو المعيار: يشمل https وlocalhost و127.0.0.1
         معاً. وشرطُ الاسم نصّاً يسقط على 127.0.0.1 — وقد سقط. */
      if("serviceWorker" in navigator && window.isSecureContext){
        /* updateViaCache:"none" — وإلا أعاد المتصفّح استعمال sw.js من
             ذاكرة HTTP بلا طلبٍ أصلاً، فلا يعرف بنسخةٍ نُشرت. قِيس: في
             الزيارة الثانية لم يُطلب الملفّ ولا مرّة. */
        navigator.serviceWorker.register("sw.js", { updateViaCache: "none" })
          .then(function(reg){
          swReady = true;
          /* نسخة تنتظر: لا تُفرَض على المستخدم وهو يكتب، بل تُعرض عليه */
          if(reg.waiting){ swWaiting = reg.waiting; render(); }
          reg.addEventListener("updatefound", function(){
            var w = reg.installing;
            if(!w) return;
            w.addEventListener("statechange", function(){
              if(w.state === "installed" && navigator.serviceWorker.controller){
                swWaiting = w; render();
              }
            });
          });
          /* فحصٌ صريح عند كل فتح: الفحص التلقائي للمتصفّح لا يُعتمد
             عليه — قِيس فلم يطلب sw.js أصلاً في زيارةٍ ثانية.
             وعند العودة للتطبيق المثبَّت بعد غياب، وكل ساعة إن بقي مفتوحاً. */
          try{ reg.update(); }catch(e){}
          document.addEventListener("visibilitychange", function(){
            if(document.visibilityState === "visible"){
              try{ reg.update(); }catch(e){}
            }
          });
          setInterval(function(){ try{ reg.update(); }catch(e){} }, 3600000);
        })["catch"](function(){});
        var reloaded = false;
        navigator.serviceWorker.addEventListener("controllerchange", function(){
          if(reloaded) return;
          reloaded = true;
          location.reload();
        });
      }
    }catch(e){}
    try{
      window.addEventListener("beforeinstallprompt", function(e){
        e.preventDefault();
        installPrompt = e;
        render();
      });
      window.addEventListener("appinstalled", function(){
        installPrompt = null;
        toast("ثُبِّت على جهازك");
        render();
      });
    }catch(e){}
  }
  function applyUpdate(){

    try{ swWaiting.postMessage({ type: "SKIP_WAITING" }); }catch(e){}

  /* ═══ معالج البدء ═══
     يظهر لمن لم يبدأ بعد: لا دخل ولا حركة. وعلامته في الحالة لا في

  function needOnboard(){
    if(state.onboard) return false;
    if(income(ui.month) > 0) return false;
    var any = false;
    for(var k in state.months){ if((state.months[k].items || []).length) any = true; }

  }
  /* البنود المقترحة للاختيار — الأكثر شيوعاً أوّلاً */

  /* ═══ طبقة التخزين ═══
     وجهان خلف واجهة واحدة: جهازك (localStorage) أو سحابتك (Supabase).
     الإعدادات في localStorage لا في الحالة — لأنها تُقرأ قبل الحالة. */
  /* المفتاح العلني يُحقن عند البناء. علنيّ بطبعه: من فتح الصفحة قرأه.
     الحماية من RLS في القاعدة — كل صفٍّ مقيَّد بـauth.uid() — لا من
     إخفاء المفتاح. */
  var SUPA_URL = "";
  var SUPA_KEY = "";
  var AKEY = "kh_auth";

  function supaReady(){
    /* https وحده — إلا localhost، فالمتصفّحات نفسها تعدّه أصلاً آمناً،
       وعليه تُختبر الدورة كاملة قبل أن يُنشأ مشروعٌ حقيقي. */
    var ok = /^https:\/\//.test(SUPA_URL)
          || /^http:\/\/(localhost|127\.0\.0\.1)(:|\/|$)/.test(SUPA_URL);
    return ok && SUPA_KEY.length > 30;
  }
  function authSess(){
    try{ var r = localStorage.getItem(AKEY); return r ? JSON.parse(r) : null; }
    catch(e){ return null; }
  }
  function authSet(o){
    try{ if(o) localStorage.setItem(AKEY, JSON.stringify(o));
         else localStorage.removeItem(AKEY); }catch(e){}
  }
  function signedIn(){
    var a = authSess();
    return cloudAllowed() && supaReady() && !!(a && a.access_token && a.uid);
  }
  function supaHead(tok){
    return { "apikey": SUPA_KEY, "Content-Type": "application/json",
             "Authorization": "Bearer " + (tok || SUPA_KEY) };
  }
  function authStore(j){
    if(!j || !j.access_token) return null;
    var o = { access_token: j.access_token, refresh_token: j.refresh_token,
              exp: Date.now() + ((j.expires_in || 3600) * 1000),
              uid: (j.user && j.user.id) || (authSess() || {}).uid,
              email: (j.user && j.user.email) || (authSess() || {}).email };
    authSet(o); return o;
  }
  /* الرمز ينتهي بعد ساعة. فيُجدَّد قبل كل طلب إن قارب — وإلا ردّت
     القاعدة 401 وظنّ المستخدم أن بياناته ضاعت. */
  function withTok(then){
    var a = authSess();
    if(!a){ then(null, "لم تسجّل دخولك"); return; }
    if(a.exp - Date.now() > 60000){ then(a, null); return; }
    if(!a.refresh_token){ then(null, "انتهت الجلسة — سجّل دخولك"); return; }
    fetch(SUPA_URL + "/auth/v1/token?grant_type=refresh_token", {
      method: "POST", headers: supaHead(null),
      body: JSON.stringify({ refresh_token: a.refresh_token })
    }).then(function(r){ return r.json(); })
      .then(function(j){
        var o = authStore(j);
        if(o) then(o, null);
        else { authSet(null); then(null, "انتهت الجلسة — سجّل دخولك"); }
      })["catch"](function(e){ then(null, String(e.message || e)); });
  }
  function authSendCode(email, then){
    fetch(SUPA_URL + "/auth/v1/otp", {
      method: "POST", headers: supaHead(null),
      body: JSON.stringify({ email: email, create_user: true })
    }).then(function(r){
      if(r.ok){ then(null); return; }
      return r.json().then(function(j){ then(j.msg || j.error_description || ("HTTP " + r.status)); });
    })["catch"](function(e){ then(String(e.message || e)); });
  }
  function authVerify(email, code, then){
    fetch(SUPA_URL + "/auth/v1/verify", {
      method: "POST", headers: supaHead(null),
      body: JSON.stringify({ email: email, token: String(code).trim(), type: "email" })
    }).then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
      .then(function(x){
        if(!x.ok || !x.j.access_token){
          then(x.j.msg || x.j.error_description || "رمزٌ غير صحيح"); return;
        }
        authStore(x.j); then(null);
      })["catch"](function(e){ then(String(e.message || e)); });
  }
  function authGoogle(){
    var back = location.href.replace(/[#?].*$/, "");
    location.href = SUPA_URL + "/auth/v1/authorize?provider=google&redirect_to="
                  + encodeURIComponent(back);
  }
  function authOut(){
    var a = authSess();
    if(a) try{ fetch(SUPA_URL + "/auth/v1/logout", { method: "POST", headers: supaHead(a.access_token) }); }catch(e){}
    authSet(null);
  }
  /* العودة من Google أو من رابط البريد: الرمز في الجزء بعد #.
     يُقرأ ثم يُمحى من الشريط — كي لا يبقى في التاريخ ولا يُشارَك. */
  function authFromHash(){
    if(!supaReady() || !location.hash || location.hash.indexOf("access_token") < 0) return false;
    var q = {}, h = location.hash.replace(/^#/, "");
    h.split("&").forEach(function(p){
      var i = p.indexOf("="); if(i < 0) return;
      q[decodeURIComponent(p.slice(0, i))] = decodeURIComponent(p.slice(i + 1));
    });
    try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
    if(!q.access_token) return false;
    authSet({ access_token: q.access_token, refresh_token: q.refresh_token || "",
              exp: Date.now() + ((+q.expires_in || 3600) * 1000),
              uid: "", email: "" });
    /* الهويّة تُقرأ من الخادم — لا تُستنتج من الرمز */
    fetch(SUPA_URL + "/auth/v1/user", { headers: supaHead(q.access_token) })
      .then(function(r){ return r.json(); })
      .then(function(u){
        var a = authSess() || {};
        a.uid = u.id || ""; a.email = u.email || "";
        authSet(a); toast("أهلاً " + (u.email || "")); cloudFirstPull();
      })["catch"](function(){ render(); });
    return true;
  }

  /* ═══ لقطة ما قبل التحديث ═══ */
  var SNAPKEY = "kh_snap", VERKEY = "kh_ver";

  /* تُستدعى قبل migrate() — وإلا حُفظت البنية بعد ترقيتها فلا تنفع رجوعاً */
  function snapBeforeUpdate(){
    var prev = null, raw = null;
    try{ prev = localStorage.getItem(VERKEY); }catch(e){}
    try{ localStorage.setItem(VERKEY, APP_VERSION); }catch(e){}
    if(!prev || prev === APP_VERSION) return;    /* أوّل تشغيل، أو لا جديد */
    try{ raw = localStorage.getItem(LSKEY); }catch(e){}
    if(!raw || raw.length < 40) return;          /* لا بيانات تستحقّ */
    try{
      localStorage.setItem(SNAPKEY, JSON.stringify({
        ver: prev, at: new Date().toISOString(), data: raw }));
    }catch(e){
      /* امتلأت المساحة: التحديث أولى من اللقطة — لا يُوقَف من أجلها */
      try{ localStorage.removeItem(SNAPKEY); }catch(e2){}
    }
  }
  function snapInfo(){
    try{
      var r = localStorage.getItem(SNAPKEY);
      if(!r) return null;
      var o = JSON.parse(r);
      return (o && o.data) ? o : null;
    }catch(e){ return null; }
  }
  function snapRestore(){
    var o = snapInfo();
    if(!o) return false;
    try{
      var d = JSON.parse(o.data);
      for(var k in state) if(!(k in d)) delete state[k];
      for(var k2 in d) state[k2] = d[k2];
      migrate();
      localWrite();
      return true;
    }catch(e){ return false; }
  }
  function snapDrop(){ try{ localStorage.removeItem(SNAPKEY); }catch(e){} }

  var CKEY = "kh_cloud";
  function cloudCfg(){
    try{
      var raw = localStorage.getItem(CKEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function cloudSet(o){
    try{
      if(o) localStorage.setItem(CKEY, JSON.stringify(o));
      else localStorage.removeItem(CKEY);
    }catch(e){}
  }
  /* داخل أرتفاكت كلود لا اتّصال بمضيف خارجي — فلا يُعرض خيارٌ لا يعمل */
  function cloudAllowed(){ return !(window.claude && window.claude.use); }
  /* وجهان يصلان القاعدة نفسها: حسابٌ مسجَّل، أو ربطٌ يدويّ لمن أراد
     قاعدته هو. الأوّل هو الطريق، والثاني يبقى لمن يريده. */
  function cloudOn(){
    if(signedIn()) return true;
    var c = cloudCfg();
    return cloudAllowed() && !!(c && c.url && c.key && c.uid);
  }
  function cloudWho(){
    if(signedIn()) return (authSess() || {}).email || "حسابك";
    var c = cloudCfg() || {};
    return String(c.uid || "");
  }
  function cloudHead(c){
    return { "apikey": c.key, "Authorization": "Bearer " + c.key,
             "Content-Type": "application/json" };
  }
  function cloudUrl(c){
    return String(c.url).replace(/\/+$/, "") + "/rest/v1/" + (c.table || "budget");
  }
  /* يجمع ما يلزم الطلب — عنواناً ورؤوساً ومعرّفاً — أيّاً كان الوجه */
  function cloudCtx(then){
    if(signedIn()){
      withTok(function(a, err){
        if(err){ then(null, err); return; }
        then({ url: SUPA_URL.replace(/\/+$/, "") + "/rest/v1/budget",
               head: supaHead(a.access_token), uid: a.uid }, null);
      });
      return;
    }
    var c = cloudCfg();
    if(!c){ then(null, "لم تُربط سحابة"); return; }
    then({ url: cloudUrl(c), head: cloudHead(c), uid: c.uid }, null);
  }
  var cloudBusy = false, cloudMsg = "";
  /* رسائل الخادم لا تُعرض كما هي: HTTP 404 لا يقول لصاحبه شيئاً */
  function cloudErr(e){
    var t = String(e || "");
    if(t === "EMPTY") return "لا نسخة في حسابك بعد";
    if(/HTTP 40[13]/.test(t)) return "انتهت جلستك — سجّل دخولك من جديد";
    if(/HTTP 404/.test(t)) return "لم يُهيَّأ الجدول في القاعدة بعد";
    if(/Failed to fetch|NetworkError/i.test(t)) return "لا اتّصال بالإنترنت";
    return t;
  }
  function cloudPull(then){
    if(!cloudOn()) { if(then) then(null, "لم تُربط سحابة"); return; }
    cloudBusy = true; render();
    cloudCtx(function(c, err){
      if(err){ cloudBusy = false; if(then) then(null, err); render(); return; }
      fetch(c.url + "?id=eq." + encodeURIComponent(c.uid) + "&select=data,updated_at",
            { headers: c.head })
        .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(rows){
          cloudBusy = false;
          /* لا صفّ ليس خطأً: هو أوّل مرة. يُمرَّر رمزاً لا جملةً كي
             يفرّق المتّصل بين «جديد» و«تعطّل شيء». */
          if(!rows || !rows.length){ if(then) then(null, "EMPTY"); return; }
          if(then) then(rows[0], null);
        })["catch"](function(e){
          cloudBusy = false;
          if(then) then(null, String(e.message || e));
        });
    });
  }
  function cloudPush(then){
    if(!cloudOn()){ if(then) then("لم تُربط سحابة"); return; }
    cloudBusy = true; render();
    cloudCtx(function(c, err){
      if(err){ cloudBusy = false; if(then) then(err); render(); return; }
      var body = [{ id: c.uid, data: state, updated_at: new Date().toISOString() }];
      var h = {}; for(var k in c.head) h[k] = c.head[k];
      h.Prefer = "resolution=merge-duplicates";
      fetch(c.url, { method: "POST", headers: h, body: JSON.stringify(body) })
        .then(function(r){
          cloudBusy = false;
          if(!r.ok) throw new Error("HTTP " + r.status);
          cloudMsg = "رُفعت " + new Date().toLocaleTimeString("en-GB").slice(0, 5);
          if(then) then(null);
        })["catch"](function(e){
          cloudBusy = false;
          if(then) then(String(e.message || e));
        });
    });
  }
  /* أوّل دخولٍ على جهاز جديد: إن كانت السحابة أحدث وجهازك فارغ، تنزل
     بلا سؤال. وإن كان في الجهاز عملٌ فالقرار للمستخدم — الدمج التلقائي
     في أرقامٍ مالية يخطئ بصمت. */
  function applyCloud(row){
    try{
      var d = row.data;
      for(var k in d) state[k] = d[k];
      migrate();                 /* نسخةٌ رُفعت من إصدارٍ أقدم تُرقّى */
      localSave();
      toast("نزلت بياناتك");
    }catch(e){ toast("تعذّرت القراءة"); }
    render();
  }
  function askCode(em){
    ask({ title: "الرمز وصل إلى " + em,
      msg: "افتح بريدك: إمّا تضغط الرابط فتدخل مباشرةً، وإمّا تنسخ الرمز هنا.",
      fields: [ { label: "الرمز", value: "", ph: "123456" } ],
      ok: "ادخل",
      onOk: function(v){
        cloudBusy = true; render();
        authVerify(em, v[0], function(err){
          cloudBusy = false;
          if(err){ toast(err); render(); return; }
          toast("دخلت"); cloudFirstPull();
        });
      },
      cancel: "لاحقاً" });
  }
  function cloudFirstPull(){
    cloudPull(function(row, err){
      /* لا صفّ في حسابه: يُنشأ الآن برفع ما عنده. هذه هي كلّ «إنشاء
         قاعدة البيانات» من ناحيته — لا خطوة يفعلها ولا رسالة يقرؤها. */
      if(err === "EMPTY"){
        cloudPush(function(e2){
          if(e2) toast("تعذّر التجهيز: " + cloudErr(e2));
          else { cloudMsg = "جُهّز حسابك"; toast("جُهّز حسابك — بياناتك تُحفظ فيه من الآن"); }
          render();
        });
        return;
      }
      if(err){ toast(cloudErr(err)); render(); return; }
      if(!row || !row.data){ render(); return; }
      var mine = 0;
      for(var k in state.months) mine += (state.months[k].items || []).length;
      if(mine === 0 && !state.onboard){
        applyCloud(row); return;
      }
      confirmDlg("في حسابك نسخة",
        "آخر رفع: <b>" + esc(String(row.updated_at || "").slice(0, 16).replace("T", " "))
        + "</b>. أتُنزِلها بدل ما في هذا الجهاز؟",
        "أنزِلها", function(){
          applyCloud(row);
        });
    });
  }
  var cloudPending = null;
  function cloudQueue(){
    if(!cloudOn()) return;
    clearTimeout(cloudPending);
    cloudPending = setTimeout(function(){
      cloudPush(function(err){ if(err) toast("تعذّر الرفع: " + cloudErr(err)); render(); });
    }, 2500);
  }

  /* ── تصدير الحركات ──
     الفاصلة داخل النصّ تُحاط باقتباس، والـBOM في الأوّل — وإلا فتحه
     Excel بحروفٍ عربية مشوّهة. */
  function csvCell(v){
    var t = String(v == null ? "" : v);
    return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  }
  function csvExport(){
    var rows = [["التاريخ", "الشهر", "البند", "الفرع", "المبلغ", "الملاحظة", "الحساب"]];
    Object.keys(state.months).sort().forEach(function(mk){
      (state.months[mk].items || []).forEach(function(it){
        var c = catOf(it.c), sub = "";
        if(it.s && c.subs){
          c.subs.forEach(function(x){ if(x.id === it.s) sub = x.n; });
        }
        var a = it.acct ? acctOf(it.acct) : null;
        rows.push([it.d || "", mk, c.n, sub, it.a,
                   it.t || "", a ? (a.bank + " · " + a.n) : ""]);
      });
    });
    return "\ufeff" + rows.map(function(r){
      return r.map(csvCell).join(",");
    }).join("\r\n");
  }
  function csvDlg(){
    var txt = csvExport(), lines = txt.split("\r\n").length - 1;
    ask({ title: "تصدير الحركات",
      msg: "<b>" + lines + " حركة</b> بصيغة CSV. انسخها والصقها في ملفٍ باسم "
         + "<b>masrouf.csv</b> ثم افتحه في Excel.",
      fields: [{ label: "المحتوى", type: "area", value: txt }],
      ok: "انسخ",
      onOk: function(){
        try{
          var el = document.getElementById("df0");
          if(el){ el.select(); document.execCommand("copy"); }
          toast("نُسخ إلى الحافظة");
        }catch(e){ toast("حدّد النصّ وانسخه يدوياً"); }
      } });
  }

  /* ── التقويم الهجري ──
     من Intl لا من جدولٍ أكتبه: أم القرى فيه أدقّ ويتحدّث مع النظام. */
  var _hjOK = null;
  function hijriOn(){ return !!state.hijri; }
  function hijriOf(dateStr){
    if(_hjOK === false) return "";
    try{
      var d = dateStr ? new Date(dateStr + "T12:00:00") : new Date();
      if(isNaN(d.getTime())) return "";
      var f = new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura",
        { day: "numeric", month: "long", year: "numeric" });
      var out = f.format(d);
      _hjOK = true;
      return out;
    }catch(e){ _hjOK = false; return ""; }
  }
  /* الشهر الهجري الغالب على شهر ميلادي — يُعرض بجانب اسمه */
  function hijriMonthOf(mk){
    if(!hijriOn()) return "";
    return hijriOf(mk + "-15").replace(/^[0-9\u0660-\u0669]+\s*/, "");
  }

  /* ── زكاة المال ──
     الوعاء ليس صافي الثروة: النقد والمدَّخر والمحافظ، ناقص الدَّين
     الحالّ وحده — فالقسط المؤجَّل لم يحل عليه الحول. */
  function zakatOn(){ return !!state.zakat; }
  function zakatBase(){
    var cash = 0;
    accts().forEach(function(a){
      if(a.arch || isDebt(a)) return;         /* الدَّين المؤجَّل لا يُطرح: لم يحل حوله */
      cash += num(a.bal);
    });
    return { cash: cash, base: Math.max(0, cash) };
  }
  function zakatDue(){
    var Z = zakatBase(), nis = num(state.nisab);
    var owed = Z.base * 0.025;
    return { base: Z.base, nisab: nis, reached: nis > 0 && Z.base >= nis,
             owed: Math.round(owed), cash: Z.cash };
  }
  function zakatCard(){
    if(!zakatOn()) return "";
    var Z = zakatDue();
    var h = '<div class="sec"><h2>زكاة المال</h2>'
      + '<span class="hint">' + (Z.nisab > 0 ? (Z.reached ? "بلغ النصاب" : "دون النصاب")
                                             : "اكتب النصاب") + '</span></div><div class="card">';
    h += '<div class="frow"><span class="fd" style="background:var(--ok-2)"></span>'
      + '<span class="fn"><b>وعاء الزكاة</b>'
      + '<s>النقد والمدَّخر والمحافظ من حساباتك</s></span>'
      + '<span class="fv">' + fmt(Z.base) + '</span></div>';
    h += '<div class="frow"><span class="fd" style="background:var(--ink-3)"></span>'
      + '<span class="fn"><b>النصاب</b>'
      + '<s>قيمة ٥٩٥ غراماً من الفضة — تتغيّر بسعرها، فاكتبها أنت</s></span>'
      + '<span class="fv"><input class="ni s" type="text" inputmode="decimal" '
      + 'data-nisab="1" value="' + (num(state.nisab) || "") + '" placeholder="0"></span></div>';
    if(Z.nisab > 0){
      h += '<div class="frow"><span class="fd" style="background:'
        + (Z.reached ? "var(--gold)" : "var(--line-2)") + '"></span>'
        + '<span class="fn"><b>' + (Z.reached ? "المستحقّ تقديراً" : "لم يبلغ النصاب") + '</b>'
        + '<s>' + (Z.reached ? "٢٫٥٪ من الوعاء إن حال عليه الحول"
                             : "ينقص " + fmt(Z.nisab - Z.base) + " ليبلغه") + '</s></span>'
        + '<span class="fv">' + (Z.reached ? fmt(Z.owed) : "—") + '</span></div>';
    }
    h += '</div>';
    h += '<div class="hintnote">هذا <b>تقدير حسابيّ لا فتوى</b>. الوعاء هنا نقدك ومدّخرك '
      + 'ومحافظك؛ ولم تُطرح منه أقساطك المؤجَّلة لأن الحول لم يحل عليها، ولم تُحسب فيه '
      + 'عروض التجارة ولا الذهب خارج التطبيق. والحول يبدأ من يوم بلوغك النصاب — '
      + 'وهو تاريخٌ تعرفه أنت.</div>';
    return h;
  }

  /* ── التحكّم اليوميّ ── */
  var TABS_ALL = [["dash","اللوحة"],["rep","التقارير"],["year","السنة"],["plan","الخطة"],
                  ["env","الأظرف"],["spend","المصروف"],["accts","الحسابات"],["inv","الاستثمار"]];
  function theme(){
    var t = state.theme;
    return (t === "light" || t === "dark") ? t : "auto";
  }
  function applyTheme(){
    var r = document.documentElement, t = theme();
    if(t === "auto") r.removeAttribute("data-theme");
    else r.setAttribute("data-theme", t);
  }
  function hiddenTabs(){ return state.hideTabs || []; }
  function tabShown(k){
    if(k === "dash" || k === "set") return true;      /* اللوحة والإعدادات لا تُخفيان */
    return hiddenTabs().indexOf(k) < 0;
  }
  function nearPct(){
    var n = num(state.nearPct);
    return (n >= 50 && n <= 99) ? n : 80;
  }
  function nearRatio(){ return nearPct() / 100; }
  function autoDay(){
    var d = Math.round(num(state.autoDay));
    return (d >= 1 && d <= 28) ? d : 1;
  }
  /* آخر شهر فيه حركة — لمن يفتح التطبيق ليكمل تسجيلاً لا ليرى اليوم */
  function lastLiveMonth(){
    var ks = Object.keys(state.months).sort(), out = null;
    ks.forEach(function(k){ if((state.months[k].items || []).length) out = k; });
    return out || todayKey();
  }

  /* ── حدّ الشهر المالي ──
     القاعدة: الفترة تُنسب إلى الشهر الذي يقع فيه أكثرها. فمن يبدأ يوم
     ٢٥، فترته ٢٥ أغسطس–٢٤ سبتمبر تُسمّى «سبتمبر». */
  function monthStart(){
    var d = Math.round(num(state.monthStart));
    return (d >= 2 && d <= 28) ? d : 1;
  }
  function monthOfDate(d, startDay){
    var m = /^(\d{4})-(\d{2})-?(\d{2})?/.exec(String(d || ""));
    if(!m) return ui.month;
    var st = startDay === undefined ? monthStart() : startDay;
    if(st <= 1) return m[1] + "-" + m[2];
    var y = +m[1], mo = +m[2], day = +(m[3] || 1);
    if(day < st){ mo--; if(mo < 1){ mo = 12; y--; } }
    if(st >= 15){ mo++; if(mo > 12){ mo = 1; y++; } }
    return y + "-" + pad(mo);
  }
  /* إعادة توزيع الحركات على الصناديق بعد تغيير الحدّ.
     dry=true يحصي بلا أن يمسّ شيئاً. */
  function rebucket(newStart, dry){
    var moves = [], all = [];
    for(var mk in state.months){
      (state.months[mk].items || []).forEach(function(it){
        all.push({ from: mk, it: it });
      });
    }
    all.forEach(function(x){
      if(!x.it.d) return;                 /* حركة بلا تاريخ تبقى مكانها */
      var to = monthOfDate(x.it.d, newStart);
      if(to !== x.from) moves.push({ from: x.from, to: to, it: x.it });
    });
    if(dry) return moves;
    moves.forEach(function(mv){
      var src = state.months[mv.from];
      src.items = src.items.filter(function(y){ return y.id !== mv.it.id; });
      month(mv.to).items.push(mv.it);
    });
    state.monthStart = newStart;
    return moves;
  }
  function addItem(){
    var el = document.getElementById("amt"), amt = parseFloat(el && el.value);
    if(!(amt > 0)) return;
    if(!ui.cat){ toast("اختر التصنيف"); return; }
    var n = document.getElementById("note");
    var de = document.getElementById("sdate");
    var dv = (de && de.value) || defaultDate();
    var rec = { id: uid(), c: ui.cat, a: amt, t: (n && n.value || "").trim(), d: dv };
    if(ui.sub) rec.s = ui.sub;
    if(trackSrc()){
      var se = document.getElementById("srcacct");
      var aid = se ? se.value : "";
      /* لو للبند حساب مخصَّص ولم تختر غيره، يُخصم منه */
      var cAcc = catOf(ui.cat).acct;
      if(!aid && cAcc && acctOf(cAcc)) aid = cAcc;
      if(aid){ rec.acct = aid; if(aid !== cAcc) ui.spendAcct = aid; }
    }
    var mk = monthOfDate(rec.d);
    month(mk).items.push(rec);
    linkSpend(rec);
    save();
    if(mk !== ui.month){
      ui.jumpTo = mk;                       /* يعرض إشعاراً مع زرّ «افتحه» */
      toast("حُفظت في " + mName(mk));
    }
    render();
  }

  /* ═══ إقلاع ═══ */
  storeProbe();           /* قبل كل شيء: أيُحفظ العمل أصلاً؟ */
  localLoad();
  snapBeforeUpdate();     /* قبل migrate — اللقطة للبنية القديمة لا المرقّاة */
  migrate();
  try{
    var st0 = state.startTab || "last";
    ui.tab = st0 === "last" ? (sessionStorage.getItem("kh_tab") || "dash") : st0;
    if(!tabShown(ui.tab)) ui.tab = "dash";
    ui.month = (state.startMonth === "last") ? lastLiveMonth()
             : (sessionStorage.getItem("kh_month") || todayKey());
  }catch(e){ ui.month = todayKey(); }
  if(!ui.month) ui.month = todayKey();
  month(ui.month);
  applyTheme();
  pwaInit();
  /* العودة من Google أو من رابط البريد تُقرأ قبل الرسم — فلا تومض شاشةُ
     «غير مسجَّل» ثم تنقلب */
  var backFromAuth = authFromHash();
  render();
  /* أول مرة: المعالج بعد الرسم لا قبله — فيرى الشاشة خلفه ويعرف أين هو */
  /* لو كان الحفظ متعذّراً لعاد المعالج مع كل تحديثٍ للصفحة — وهو ما
     شكا منه المستخدم. التنبيه أصدق منه هنا. */
  if(needOnboard() && !backFromAuth && !saveBlocked)
    setTimeout(function(){ onboardDlg(); }, 120);
  /* جلسةٌ قائمة من زيارةٍ سابقة: تُنزَّل نسخةُ الحساب إن كان الجهاز خالياً */
  if(!backFromAuth && signedIn()) setTimeout(cloudFirstPull, 400);

  if(window.claude && typeof window.claude.use === "function"){
    window.claude.use("artifact").then(function(api){ pubApi = api; })["catch"](function(){});
  }
})();
</script>
