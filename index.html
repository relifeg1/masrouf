<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4C3AE3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0F14" media="(prefers-color-scheme: dark)">
<meta name="description" content="ميزانية شهرية بالعربية · بياناتك في جهازك">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مصروف">
<title>مصروف — خطتي الشهرية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

</head>
<body>
<style id="app-style">
:root{
  /* ══ نظام التنسيق ══
     الخط — تسعة أدوار لا مقاسات حرّة:
       10 شارة · 11 تسمية · 13 نصّ ثانوي · 15 نصّ أساسي · 17 مجموع ورأس
       لوحة · 21 عنوان شاشة · 24 رقم مؤشّر · 34 رقم بطل (42 على الحاسب)
       و16px لحقول الإدخال وحدها — لا تقلّ، وإلا كبّر iOS الصفحة عند اللمس.
     الوزن  400 نصّ · 500 اسم صفّ · 600 رقم · 700 تشديد داخل جملة
     اللون  ink متن · ink-2 ثانوي · ink-3 تسمية وحاشية — ثلاث لا أكثر
     السطر  68 حرفاً حدّاً في الفقرات · 1.75 ارتفاعاً

     ══ اللون: ثلاثة أدوار لا رابع ══
     هويّة   لون البند/الهدف/الجهة — في مربّع أيقونته وشريط تقدّمه فقط،
             بشفافية 22 موحّدة. ولا يُلوَّن به رقم ولا عنوان ولا حدّ.
     حُكم    ok تمّ · ضمن الخطة · مكسب
             ok-2 درجةٌ ثانية للاستثمار — للأشرطة والنقاط لا للنصّ:
             تباينها 3.34 على الأبيض، يكفي شكلاً ولا يكفي حرفاً.
             warn تجاوز · نقص · يطلب فعلاً
             gold قارب الحدّ · بانتظار قرارك
     تطبيق   accent — التبويب النشط · الزرّ الرئيسي · التركيز · الاختيار.
             لا يعني شيئاً عن مالك، فلا يُستعمل قيمةً ولا تصنيفاً.
     رمادي   ink / ink-2 / ink-3 لكل ما لا حكم فيه — وهو الأكثر.
     المسافة 2 · 4 · 8 · 12 · 16 · 24
     الحافة  4 (أشرطة) · 10 (أزرار وحقول) · 16 (بطاقات) · 99 (شارات) */
  --fs-2xs:10px; --fs-xs:11px; --fs-sm:13px; --fs-md:15px;
  --fs-lg:17px; --fs-xl:21px; --fs-kpi:24px; --fs-display:34px;
  --s1:2px; --s2:4px; --s3:8px; --s4:12px; --s5:16px; --s6:24px;
  --r-bar:4px; --r-ui:10px; --r-card:16px; --r-pill:99px;
  --bg:#F1F2F5; --card:#FFFFFF; --card-2:#F7F8FA;
  --ink:#15171C; --ink-2:#5A616E; --ink-3:#6E7684;
  --line:#E2E5EB; --line-2:#CBD1DA;
  --accent:#4C3AE3; --accent-soft:#EDEAFE;
  --ok:#0F7355; --ok-2:#2E9E79; --ok-soft:#E2F1EC;
  --cls-need:#0F7355; --cls-want:#8A5F10; --cls-duty:#B4342B;
  --warn:#B4342B; --warn-soft:#FBE7E4;
  --gold:#9A6B12; --gold-soft:#FBF1DC;
  --track:#E6E9EF;
  --shadow:0 1px 2px rgba(21,23,28,.05),0 10px 28px -20px rgba(21,23,28,.35);
  --navbg:rgba(255,255,255,.92);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D0F14; --card:#161922; --card-2:#1D212C;
    --ink:#E9EBF1; --ink-2:#A3AAB9; --ink-3:#858D9C;
    --line:#252A36; --line-2:#39404F;
    --accent:#9C8BFF; --accent-soft:#1E1B33;
    --ok:#4FC49E; --ok-2:#8FE3C4; --ok-soft:#12261F;
    --cls-need:#4FC49E; --cls-want:#E0B45F; --cls-duty:#E58474;
    --warn:#E58474; --warn-soft:#2A1815;
    --gold:#D9A94E; --gold-soft:#2A2214;
    --track:#222736;
    --shadow:none;
    --navbg:rgba(19,22,29,.94);
  }
}
:root[data-theme="dark"]{
  --bg:#0D0F14; --card:#161922; --card-2:#1D212C;
  --ink:#E9EBF1; --ink-2:#A3AAB9; --ink-3:#858D9C;
  --line:#252A36; --line-2:#39404F;
  --accent:#9C8BFF; --accent-soft:#1E1B33;
  --ok:#4FC49E; --ok-2:#8FE3C4; --ok-soft:#12261F;
  --cls-need:#4FC49E; --cls-want:#E0B45F; --cls-duty:#E58474;
  --warn:#E58474; --warn-soft:#2A1815;
  --gold:#D9A94E; --gold-soft:#2A2214;
  --track:#222736;
  --shadow:none;
  --navbg:rgba(19,22,29,.94);
}

*{box-sizing:border-box}
/* التركيز ظاهر دائماً — للتنقّل بلوحة المفاتيح */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
button:active,.chip:active,.row.tap:active,.env:active,.ecard:active,.acct:active{filter:brightness(.94)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  font-size:16px;line-height:1.7;direction:rtl;text-align:right;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:620px;margin:0 auto;padding:0 16px 108px;width:100%}
h1,h2,h3{font-family:"Alexandria","IBM Plex Sans Arabic",sans-serif;margin:0;line-height:1.3;text-wrap:balance}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:24px 0 12px}
.brand{font-family:"Alexandria",sans-serif;font-weight:700;font-size:21px;letter-spacing:-.01em}
.mnav{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);
  border-radius:99px;padding:2px;box-shadow:var(--shadow)}
.mnav button{border:0;background:transparent;color:var(--ink-2);font-size:17px;line-height:1;
  width:32px;height:32px;border-radius:50%;cursor:pointer;font-family:inherit}
.mnav button:hover{background:var(--card-2);color:var(--ink)}
.mnav .lbl{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:500;padding:0 4px;min-width:72px;text-align:center}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card.p{padding:16px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 9px}
.sec h2{font-size:15px;font-weight:600}
.sec .hint{font-size:13px;color:var(--ink-3)}

.hero{padding:24px 24px 16px}
.hero-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:13px}
.lab{font-size:13px;color:var(--ink-3);margin-bottom:2px}
.big{font-family:"IBM Plex Mono",monospace;font-size:34px;font-weight:600;line-height:1.05;letter-spacing:-.02em}
.big .r{font-size:15px;font-weight:400;color:var(--ink-3);margin-inline-start:5px}
.side{text-align:left}
.side .v{font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600}
.bar{height:10px;border-radius:99px;background:var(--track);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.foot{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);margin-top:8px;gap:12px;flex-wrap:wrap}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;box-shadow:var(--shadow)}
.stat .lab{margin-bottom:4px}
.stat .v{font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600;line-height:1.15}
.stat .s{font-size:11px;color:var(--ink-3);margin-top:2px}

/* ══ الدفتر ══ */
.ledbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;
  background:var(--card-2);border-bottom:1px solid var(--line)}
.ledbar .lh{font-size:11px;color:var(--ink-3)}
.ygrid.ledger table{min-width:640px}
.ygrid.ledger th.now{color:var(--accent)}
.ygrid.ledger th.lk{color:var(--gold)}
.ygrid.ledger td{padding:3px 4px}
.ygrid.ledger td.now{background:var(--accent-soft)}
.lcell{width:52px;background:transparent;border:1.5px solid transparent;border-radius:8px;
  padding:5px 4px;color:var(--ink-2);font-family:"IBM Plex Mono",monospace;font-size:13px;
  font-variant-numeric:tabular-nums;text-align:center;direction:ltr;outline:none;
  -moz-appearance:textfield}
.lcell::-webkit-outer-spin-button,.lcell::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.lcell::placeholder{color:var(--ink-3);opacity:.5}
.lcell:hover{border-color:var(--line-2)}
.lcell:focus{border-color:var(--accent);background:var(--card);color:var(--ink);font-weight:600}
.lcell.ro{display:inline-block;color:var(--ink-3);opacity:.55;border-color:transparent}

/* ══ الشهر المُقفَل ══ */
.lockbar{padding:8px 16px;font-size:11px;line-height:1.7;background:var(--card-2);
  border-bottom:1px solid var(--line);color:var(--ink-3)}
.lockbar.warn{background:var(--gold-soft);color:var(--gold)}
.dlist .dv.up{color:var(--ok)}
.dlist .dv.dn{color:var(--warn)}

/* ══ حقل تاريخ العملية ══ */
.daterow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:11px}
.daterow label{font-size:11px;color:var(--ink-3);flex:none}
.dinp{background:var(--card-2);border:1.5px solid var(--line);border-radius:10px;
  padding:8px 12px;color:var(--ink);font-family:"IBM Plex Mono",monospace;font-size:13px;
  outline:none;direction:ltr}
.dinp:focus{border-color:var(--accent);background:var(--card)}
.dhint{font-size:11px;color:var(--ink-3)}
.dhint.on{color:var(--accent);font-weight:600}

/* ══ شريط الشهور — في كل شاشة ══ */
.mstrip2{display:flex;align-items:center;gap:4px;padding:0 0 12px;width:100%;min-width:0}
.mstrip2 .msy{border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  cursor:pointer;width:26px;height:26px;border-radius:10px;font-size:13px;line-height:1;
  flex:none;font-family:inherit;padding:0}
.mstrip2 .msy:hover{border-color:var(--accent);color:var(--accent)}
.mstrip2 .msl{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);
  flex:none;min-width:34px;text-align:center}
.msrow{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.msrow .ms i{font-style:normal;font-family:"IBM Plex Mono",monospace;
  font-size:10px;opacity:.55;margin-inline-end:4px}
.msrow .ms.on i{opacity:.85}
/* الاسم كاملاً حيث يتّسع، والمختصر على الجوال — لا تمرير في الحالين */
.msrow .ms u{display:none;text-decoration:none}
.msrow .ms q{quotes:none}
.msrow::-webkit-scrollbar{display:none}
.msrow .ms{border:1.5px solid transparent;background:var(--card-2);color:var(--ink-3);
  cursor:pointer;border-radius:10px;padding:4px 8px;font-size:11px;font-family:inherit;
  white-space:nowrap;flex:none;min-width:38px}
.msrow .ms.has{background:var(--card);color:var(--ink-2);border-color:var(--line)}
.msrow .ms.future{opacity:.45}
.msrow .ms.on{background:var(--accent-soft);border-color:var(--accent);
  color:var(--accent);font-weight:600;opacity:1}
.msrow .ms:hover{border-color:var(--accent);color:var(--accent)}
.mstoday{border:1.5px solid var(--line-2);background:var(--card);color:var(--ink-2);
  cursor:pointer;border-radius:10px;padding:4px 10px;font-size:11px;font-family:inherit;
  white-space:nowrap;flex:none}
.mstoday:hover{border-color:var(--accent);color:var(--accent)}
/* على الحاسب: الاثنا عشر شهراً يقتسمون عرض البطاقة تحتهم.
   موضعها هنا لا فوق: كتلة الوسائط لا تزيد الأولوية، فأيّة قاعدة
   لـ .msrow .ms تأتي بعدها تغلبها. */
@media (min-width:820px){
  .mstrip2{flex-wrap:wrap;row-gap:7px;align-items:center}
  .msy, .msl, .mstoday{order:1}
  .msrow{order:2;flex:1 0 100%;overflow:visible}
  .msrow .ms{flex:1 1 0;min-width:0;display:flex;align-items:baseline;
    justify-content:center;gap:5px;padding:6px 4px}
  .msrow .ms i{margin-inline-end:0}
  .msrow .ms u{display:inline}
  .msrow .ms q{display:none}
  .mstoday{margin-inline-start:8px}
}

/* ══ الصفّ الموحَّد: أساس واحد لكل قوائم التطبيق ══
   أ · صفّ بأيقونة  34px | الاسم | القيمة      .row .ecard .grow .env
   ب · صفّ نصّي     الاسم | القيمة (+فرق)      .cmp .mrow .own .acct
   كل ما يخصّ الصفّ — الحشو والفاصل والمحاذاة — يُعدَّل هنا فقط. */
.row,.ecard,.grow,.env,.cmp,.mrow,.own,.acct,.distcard .dl{
  display:grid;gap:12px;align-items:center;padding:12px 16px;
  border-bottom:1px solid var(--line)}
.row:last-child,.ecard:last-child,.grow:last-child,.env:last-child,
.cmp:last-child,.mrow:last-child,.own:last-child,.distcard .dl:last-child{border-bottom:0}
.rowa,.row,.ecard,.grow,.env{grid-template-columns:34px minmax(0,1fr) auto}
.rowb,.own,.acct{grid-template-columns:minmax(0,1fr) auto}
.cmp,.mrow{grid-template-columns:minmax(0,1fr) auto auto}
/* أيقونة الصفّ — مقاس واحد */
.ic,.eic,.grow .gic,.env .ei{width:34px;height:34px;border-radius:10px;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:16px}
.nm{font-size:15px;font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:11px;color:var(--ink-3);display:block;margin-top:1px}
.track{display:block;height:6px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:6px}
.track i{display:block;height:100%;border-radius:99px}
.rt{display:block;text-align:left;flex:none}
.rt .a{display:block;font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;line-height:1.25}
.rt .b{display:block;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);line-height:1.3;margin-top:1px}
.row.zero{opacity:.45}
.row.tap{cursor:pointer}
.row.tap:hover{background:var(--card-2)}
.chev{font-size:13px;color:var(--ink-3);margin-inline-start:5px}

/* بنود فرعية */
.subs{background:var(--card-2);border-bottom:1px solid var(--line)}
.subrow{display:grid;grid-template-columns:14px minmax(0,1fr) auto auto;gap:8px;align-items:center;
  padding:8px 16px 8px 16px;border-bottom:1px solid var(--line)}
.subrow:last-child{border-bottom:0}
.subrow .tick{width:14px;height:14px;border-radius:4px;flex:none;opacity:.55}
.subrow .sn{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subrow .sv{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-3)}
.subadd{padding:12px 16px 12px}

input,select,button,textarea{font-family:inherit;font-size:16px;min-width:0;max-width:100%}
.ni{width:84px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:4px 8px;
  color:var(--ink);font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;
  text-align:center;direction:ltr;outline:none}
.ni:focus{border-color:var(--accent)}
.ni.w{width:112px}
.ni.s{width:72px;font-size:13px;padding:4px 4px}

.amt-row{display:flex;gap:8px;margin-bottom:11px}
.amt{flex:1 1 0;min-width:0;background:var(--card-2);border:1.5px solid var(--line);border-radius:16px;
  padding:12px 16px;color:var(--ink);font-family:"IBM Plex Mono",monospace;font-size:21px;
  font-weight:600;text-align:center;direction:ltr;outline:none}
.amt::placeholder{color:var(--ink-3);font-weight:400}
.amt:focus{border-color:var(--accent);background:var(--card)}
.go{background:var(--accent);color:#fff;border:0;border-radius:16px;padding:0 24px;font-weight:600;
  cursor:pointer;font-size:15px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card-2);color:var(--ink-2);border-radius:99px;
  padding:8px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:4px}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip.sm{padding:4px 12px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.note{width:100%;background:var(--card-2);border:1.5px solid var(--line);border-radius:16px;
  padding:8px 12px;color:var(--ink);font-size:15px;outline:none;margin-top:10px}
.subpick{margin-top:10px;padding-top:12px;border-top:1px dashed var(--line)}
.subpick .lab{margin-bottom:7px}

.addbtn{width:100%;background:transparent;border:1.5px dashed var(--line-2);color:var(--ink-3);
  border-radius:16px;padding:12px;cursor:pointer;font-size:15px}
.addbtn:hover{border-color:var(--accent);color:var(--accent)}
.addbtn.sm{padding:8px;font-size:13px;border-radius:10px}
/* زرّ الحذف: يبقى صغيراً في العين، ومساحة لمسه ٤٤px */
.del{border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:17px;
  width:28px;height:28px;border-radius:10px;line-height:1;flex:none;position:relative}
.del::after{content:"";position:absolute;top:50%;left:50%;width:44px;height:44px;
  transform:translate(-50%,-50%)}
.del:hover{background:var(--warn-soft);color:var(--warn)}

.blk{padding:16px;border-bottom:1px solid var(--line)}
.blk:last-child{border-bottom:0}
.blk.done{background:var(--ok-soft)}
.blk-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.blk-h .t{flex:1;min-width:0}
.blk-h .t b{font-size:15px;font-weight:600;display:block}
.blk-h .t s{text-decoration:none;font-size:11px;color:var(--ink-3);display:block}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin-top:9px}
.f{display:flex;flex-direction:column;gap:2px}
.f label{font-size:11px;color:var(--ink-3)}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--card-2);color:var(--ink-2);white-space:nowrap}
.pill.auto{background:var(--accent-soft);color:var(--accent)}
.pill.self{background:var(--gold-soft);color:var(--gold)}
.pill.done{background:var(--ok);color:#fff;font-weight:600}
.eta{font-size:13px;color:var(--ink-2);margin-top:8px}
.eta b{color:var(--ink);font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
/* ══ الأزرار: أربعة أدوار لا غير ══
   رئيسي  .go                          ممتلئ بالأساسي — فعل واحد في الشاشة
   ثانوي  .act قياسي · .mini مصغَّر      محدَّد بإطار — نفس الشكل بحجمين
   شفّاف  .del · .sugg · .carrybtn        داخل الصفوف
   خطر    .act.danger · .mini.bad       الحذف وحده
   .solid يملأ الثانوي حين يكون هو الفعل المؤكَّد داخل تنبيه. */
.act,.mini{border:1.5px solid var(--line-2);background:var(--card);color:var(--ink-2);
  border-radius:10px;cursor:pointer;font-family:inherit;white-space:nowrap;
  transition:border-color .15s,color .15s}
.act{padding:8px 12px;font-size:13px}
.mini{padding:4px 12px;font-size:11px}
.act:hover,.mini:hover{border-color:var(--accent);color:var(--accent)}
.act.solid{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}

.item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .d{width:7px;height:7px;border-radius:50%;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{font-weight:500;font-size:15px}
.item .t s{display:block;text-decoration:none;font-size:11px;color:var(--ink-3)}
.item .a{display:block;font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;flex:none}

.empty{text-align:center;color:var(--ink-3);font-size:13px;padding:24px 16px;line-height:1.8}
.empty b{display:block;color:var(--ink-2);font-weight:600;font-size:15px;margin-bottom:4px}
.flag{border-radius:16px;padding:12px 16px;font-size:13px;margin-bottom:12px;line-height:1.6}
.flag.ok{background:var(--ok-soft);color:var(--ok)}
.flag.bad{background:var(--warn-soft);color:var(--warn)}
/* شرح دائم — ليس تنبيهاً: بلا تعبئة ولا لون تحذير، خطّ جانبي فقط.
   التنبيه (.flag) يبقى للحالات التي تتغيّر وتطلب فعلاً. */
.hintnote{font-size:13px;color:var(--ink-3);line-height:1.75;margin-bottom:12px;
  border-inline-start:2px solid var(--line-2);padding-inline-start:12px}
.hintnote b{color:var(--ink-2);font-weight:600}
.flag b{font-weight:700}
.savebar{margin:12px 0}
.flag .acts{margin-top:9px}

.nav{position:fixed;inset-inline:0;bottom:0;z-index:40;background:var(--navbg);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.nav-in{max-width:620px;margin:0 auto;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(0,1fr));grid-auto-flow:column;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
.nav button{background:transparent;border:0;color:var(--ink-3);cursor:pointer;padding:8px 0;
  border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;
  white-space:nowrap}
.nav button .g{font-size:15px;line-height:1}
.nav button{font-size:10px}
.nav button.on{color:var(--accent);background:var(--accent-soft);font-weight:600}

.toast{position:fixed;inset-inline:0;bottom:78px;margin:0 auto;width:max-content;max-width:90%;
  background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13px;
  opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:60}
.toast.on{opacity:1;transform:none}
footer{text-align:center;color:var(--ink-3);font-size:13px;padding:24px 0 0}

/* ── نافذة داخلية (بديل prompt المحجوب داخل الإطار) ── */
.ovl{position:fixed;inset:0;z-index:80;background:rgba(10,12,17,.55);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;padding:0}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 0 0;
  width:100%;max-width:620px;padding:24px 16px calc(24px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 40px -12px rgba(0,0,0,.4);max-height:88vh;overflow-y:auto}
.dlg h3{font-size:17px;font-weight:600;margin-bottom:6px}
.dmsg{font-size:13px;color:var(--ink-2);margin:0 0 14px;line-height:1.7}
.dmsg b{color:var(--ink);font-weight:600}
.f2{display:flex;flex-direction:column;gap:3px;margin-bottom:10px;min-width:0}
.f2 label{font-size:11px;color:var(--ink-3)}
.f2 input{width:100%;background:var(--card-2);border:1.5px solid var(--line);border-radius:10px;
  padding:9px 12px;color:var(--ink);font-size:16px;outline:none}
/* عمودان على الحاسب: ستة حقول في عمود واحد تصنع نافذة
   لا تُرى دفعة واحدة، والأول والأخير يمتدّان لأنّهما أطول. */
@media (min-width:640px){
  .f2grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .f2grid > .f2:first-child, .f2grid > .f2:last-child{grid-column:1 / -1}
  .f2grid > .f2:only-child{grid-column:1 / -1}
}
.f2 input:focus{border-color:var(--accent);background:var(--card)}
.f2 input[type=number]{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:21px;
  text-align:center;direction:ltr}
.dacts{display:flex;gap:8px;margin-top:16px}
.dacts .act{flex:1;padding:12px;font-size:15px;text-align:center;border-radius:16px}
.act.danger{background:var(--warn);border-color:var(--warn);color:#fff}
.dlab{font-size:11px;color:var(--ink-3);margin:12px 0 6px}
.dbtns{display:flex;gap:8px;flex-wrap:wrap}
/* المجموعات جنباً إلى جنب — بأسمائها، فالزرّ بلا اسم لغز */
.dgrp{margin-bottom:2px}
.dgrp .dlab{margin:10px 0 5px}
@media (min-width:640px){
  .dlg > .dgrp{display:inline-block;vertical-align:top;margin-inline-end:18px}
  .dlg > .dgrp .dlab{margin:0 0 5px}
}
.dbtns .mini{padding:8px 12px;font-size:13px}
.dlist{margin:6px 0 0;padding:0;list-style:none}
.dlist li{display:flex;justify-content:space-between;gap:12px;font-size:13px;
  padding:8px 0;border-bottom:1px dashed var(--line)}
.dlist li:last-child{border-bottom:0}
.dlist .dv{font-family:"IBM Plex Mono",monospace;font-weight:600}

/* ── معالج بداية الشهر ── */
.wiz{background:var(--card);border:2px solid var(--accent);border-radius:16px;padding:16px;
  margin-bottom:14px;box-shadow:var(--shadow)}
.wiz h3{font-size:17px;font-weight:600;margin-bottom:4px}
.wiz p{font-size:13px;color:var(--ink-2);margin:0 0 13px;line-height:1.7}
.wiz .row2{display:flex;gap:12px;flex-wrap:wrap}
.wiz .f{flex:1;min-width:130px}

/* ── ربط الحساب: قائمة منسدلة + شارات ── */
.linkrow{margin-top:11px;padding-top:12px;border-top:1px dashed var(--line)}
.linkrow .lab{margin-bottom:7px}
.sel{width:100%;background:var(--card-2);border:1.5px solid var(--line);border-radius:10px;
  padding:12px 12px;color:var(--ink);font-size:15px;outline:none;
  appearance:none;-webkit-appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),
                   linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:14px calc(50% - 2px),19px calc(50% - 2px);
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.sel:focus{border-color:var(--accent);background-color:var(--card)}
.sel option{background:var(--card);color:var(--ink)}
.linked{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.lchip{display:flex;align-items:center;gap:4px;font-size:13px;padding:4px 4px 4px 12px;
  border-radius:99px;background:var(--ok-soft);color:var(--ok);font-weight:500}
.lchip.inv{background:var(--accent-soft);color:var(--accent)}
.lchip button{border:0;background:transparent;color:inherit;cursor:pointer;font-size:15px;
  line-height:1;padding:0 2px;opacity:.7}
.lchip button:hover{opacity:1}

/* ── أنواع البنود (لوحة مضغوطة) ── */
.tpill{font-family:"IBM Plex Mono",monospace;font-size:10px;padding:2px 8px;border-radius:99px;
  margin-inline-start:6px;white-space:nowrap;vertical-align:middle}
.tp-var{background:var(--card-2);color:var(--ink-3)}
.tp-fix{background:var(--ok-soft);color:var(--ok)}
.tp-seas{background:var(--gold-soft);color:var(--gold)}
.tp-inst{background:var(--warn-soft);color:var(--warn)}
.tp-done{background:var(--card-2);color:var(--ink-3);text-decoration:line-through}
.xtra{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.xtra label{font-size:11px;color:var(--ink-3)}
.xtra .hintx{font-size:11px;color:var(--ink-2)}
.capline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 16px;
  border-bottom:1px solid var(--line);background:var(--card-2);font-size:13px;color:var(--ink-2)}
.capline .fill{height:6px;border-radius:99px;background:var(--track);flex:1;min-width:70px;overflow:hidden}
.capline .fill i{display:block;height:100%;border-radius:99px}
.capline b{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--ink)}
.capwarn{color:var(--warn);font-weight:600}
.instbox{padding:12px 16px;border-bottom:1px solid var(--line)}
.instbox:last-child{border-bottom:0}
.instrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:baseline}
.instrow .inm{font-size:15px}
.instrow .iv{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600}
.instrow .ix{font-size:11px;color:var(--ink-3);display:block;margin-top:2px}
.instbar{display:flex;gap:2px;margin-top:7px}
.instbar i{flex:1;height:6px;border-radius:4px;background:var(--line-2);display:block}
.instbar i.paid{background:var(--ok)}
.instbar i.left{background:var(--warn)}
.mixline{font-size:13px;color:var(--ink-3);margin:-4px 2px 9px;display:flex;gap:12px;flex-wrap:wrap}
.mixline b{color:var(--ink-2);font-weight:600}
.subrow .sn.tap{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.subrow .sn.tap:hover{color:var(--accent)}
.item.tap{cursor:pointer}
.item.tap:hover{background:var(--card-2)}
.item .au{font-size:10px;padding:2px 4px;border-radius:99px;background:var(--ok-soft);
  color:var(--ok);margin-inline-start:6px}
.mrow[data-hid]{opacity:.5}
.autobar{background:var(--ok-soft);color:var(--ok);border-radius:16px;padding:12px 16px;
  font-size:13px;margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.autobar b{font-weight:700}
.autobar button{margin-inline-start:auto}

/* ── خطة الشهر · الترحيل · التحليل ── */
.planbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:9px 14px;
  border-bottom:1px solid var(--line);background:var(--card-2);font-size:13px;color:var(--ink-2)}
.planbar .badge{font-size:10px;padding:2px 8px;border-radius:99px;white-space:nowrap}
.planbar .b-own{background:var(--accent-soft);color:var(--accent);font-weight:600}
.planbar .b-base{background:var(--card-2);color:var(--ink-3);border:1px solid var(--line)}

.ovr{color:var(--accent);font-size:10px;margin-inline-start:4px}
.carry{font-size:10px;padding:2px 8px;border-radius:99px;background:var(--ok-soft);
  color:var(--ok);margin-inline-start:6px;white-space:nowrap}
.carry.neg{background:var(--warn-soft);color:var(--warn)}
.spark{display:flex;align-items:flex-end;gap:4px;margin-top:6px;width:100%}
.spark .sb{flex:1 1 0;min-width:0;display:flex;flex-direction:column;
  align-items:stretch;justify-content:flex-end;gap:2px}
.spark i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--line-2)}
.spark i.last{background:var(--accent)}
.spark em{font-family:"IBM Plex Mono",monospace;font-style:normal;font-size:10px;
  color:var(--ink-3);text-align:center;direction:ltr}

.cmp .cn{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp .cv{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-3)}
.cmp .cd{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;text-align:left;min-width:74px}
.cmp .up{color:var(--warn)}
.cmp .dn{color:var(--ok)}
.clsbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--track);margin:10px 0 8px}
.clsbar i{display:block;height:100%}
.clsleg{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.clsleg span{display:flex;align-items:center;gap:4px}
.clsleg .d{width:9px;height:9px;border-radius:4px;display:block}
.sugg{border:0;background:transparent;color:var(--accent);cursor:pointer;font-size:11px;
  padding:2px 4px;border-radius:10px;white-space:nowrap}
.sugg:hover{background:var(--accent-soft)}

/* ── الإعدادات ── */
.gear{border:1px solid var(--line);background:var(--card);color:var(--ink-2);cursor:pointer;
  width:38px;height:38px;border-radius:50%;font-size:17px;line-height:1;box-shadow:var(--shadow)}
.gear:hover{color:var(--accent);border-color:var(--accent)}
.gear.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.mrow{gap:8px}
.mrow .mn{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .ms{font-size:11px;color:var(--ink-3);display:block}
.mini.bad{color:var(--ink-3)}
.mini.bad:hover{border-color:var(--warn);color:var(--warn)}
.mini.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.f2 textarea{width:100%;background:var(--card-2);border:1.5px solid var(--line);border-radius:16px;
  padding:12px 12px;color:var(--ink);font-size:13px;outline:none;min-height:160px;
  font-family:"IBM Plex Mono",monospace;direction:ltr;text-align:left;resize:vertical}
.f2 textarea:focus{border-color:var(--accent)}

/* ══════════ تخطيط الحاسب ══════════ */
@media (min-width:820px){
  /* ══════════ قشرة الحاسب ══════════
     الشريط السفلي يصير عموداً ثابتاً على اليمين بأسمائه كاملة،
     والمحتوى يفسح له مكانه. التحويل بالأنماط وحدها — لا شيء في
     الجافاسكربت يتغيّر، فلا معالِج يفقد عنصره. */
  body{min-height:100vh}
  #root{min-height:100vh}

  .nav{position:fixed;inset-inline-start:0;inset-inline-end:auto;top:0;bottom:0;width:212px;
    background:var(--card);border-top:0;border-inline-end:1px solid var(--line);
    backdrop-filter:none;-webkit-backdrop-filter:none;overflow-y:auto;z-index:40}
  .nav-in{max-width:none;margin:0;display:flex;flex-direction:column;gap:2px;
    padding:16px 12px 20px}
  .nav button{flex-direction:row;justify-content:flex-start;gap:10px;width:100%;
    font-size:13px;padding:9px 11px;border-radius:10px;text-align:right}
  .nav button .g{font-size:15px;width:18px;text-align:center;flex:none;line-height:1}
  .nav button:hover{background:var(--card-2);color:var(--ink-2)}
  .nav button.on:hover{background:var(--accent-soft);color:var(--accent)}

  /* المحتوى بجوار الشريط */
  .wrap{max-width:none;width:auto;margin:0;padding:0 26px 44px;margin-inline-start:212px}

  /* الترويسة تلتصق بالأعلى فيبقى مبدّل الشهر وأزراره في المتناول */
  .topbar{position:sticky;top:0;z-index:30;background:var(--bg);
    padding:18px 0 12px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .brand{font-size:21px}
  .dcols{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);
    gap:16px;align-items:start}
  .dcols > *{margin-bottom:0}
  .big{font-size:42px}
  .row{padding:12px 16px}
  .subrow{padding:12px 16px}
  .acct{padding:12px 16px 12px 24px}
  .blk{padding:16px}
  .ovl{align-items:center;padding:24px}
  .dlg{border-radius:16px;max-width:620px;padding:22px 24px}
  .toast{bottom:24px}
  .chip{font-size:15px;padding:8px 16px}
  .ni{width:96px;font-size:16px;padding:8px 12px}
  .ni.w{width:126px}
  .ni.s{width:84px;font-size:15px}
  .amt{font-size:21px;padding:16px}
  .go{font-size:16px;padding:0 24px}
  .act{font-size:15px;padding:8px 16px}
  .sec h2{font-size:17px}
  .stat .v{font-size:21px}
}
/* ══════════ تخطيط الشاشات على الحاسب ══════════ */
@media (min-width:820px){
  /* ── الأظرف: شبكة بطاقات بدل قائمة ──
     البطاقة الحاوية تصير شبكة، وكل صفّ يصير بطاقة مستقلة بإطارها.
     الترتيب والمحتوى كما هما — الشكل وحده تغيّر. */
  .v-env .card:has(> .ecard){display:grid;grid-template-columns:repeat(3,1fr);
    gap:12px;background:transparent;border:0;box-shadow:none}
  .v-env .card:has(> .ecard) > .ecard{background:var(--card);border:1px solid var(--line);
    border-radius:12px;box-shadow:var(--shadow);padding:14px 15px;
    grid-template-columns:34px minmax(0,1fr);row-gap:9px}
  .v-env .card > .ecard .eamt{grid-column:1 / -1;text-align:right}
  .v-env .card > .ecard .eamt b{font-size:21px}
  .v-env .card > .ecard .track{grid-column:1 / -1;margin-top:0}
  .v-env .card:has(> .ecard) > .envhead,
  .v-env .card:has(> .ecard) > .hintnote{grid-column:1 / -1;background:var(--card);
    border:1px solid var(--line);border-radius:12px}

  /* ── الإعدادات: عمودان، فالأقسام الثمانية لا تُقرأ في تمرير واحد ── */
  .v-set .sec{margin-top:0}
  .v-set > .sec ~ .card{break-inside:avoid}

  /* ── السنة والحسابات: الجداول العريضة تبقى بعرضها ── */
  .v-year .ygrid table{min-width:0}
}
/* ══ صفّ المؤشرات ══ */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
@media (min-width:1060px){.kpis{grid-template-columns:repeat(4,1fr)}
  .grid{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px 16px;box-shadow:var(--shadow)}
.kl{font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.ki{width:24px;height:24px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:13px;flex:none}
.kv{font-family:"IBM Plex Mono",monospace;font-size:24px;font-weight:600;
  line-height:1.15;margin-top:8px;letter-spacing:-.02em;direction:ltr}
.kd{font-size:11px;color:var(--ink-3);margin-top:4px;line-height:1.6}
.kd b{font-family:"IBM Plex Mono",monospace;font-weight:600;direction:ltr;display:inline-block}
.kd b.kup{color:var(--warn)}
.kd b.kdn{color:var(--ok)}

.kpis.k3{grid-template-columns:1fr 1fr}
@media (min-width:1060px){.kpis.k3{grid-template-columns:repeat(3,1fr)}}
/* صفٌّ من خمسة: يتشكّل بعدد خلاياه لا برقمٍ ثابت، فلا تبقى خلية فارغة */
.kpis.k5{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
@media (min-width:1060px){.kpis.k5{grid-template-columns:repeat(5,1fr)}}
/* البطاقات المتبقّية بعد نقل أرقامها إلى المؤشرات — نحيلة لا ضخمة */
.spendbar{padding:14px 16px}
.spendbar .foot{margin-top:8px}
.envhero,.invhero,.acctshero{padding:14px 16px}
.envhero .big{font-size:21px}

/* ══ لوحة يحتاج انتباهك ══ */
.alrt{display:flex;gap:11px;padding:13px 16px;border-bottom:1px solid var(--line)}
.alrt:last-child{border-bottom:0}
.alrt .ad{width:26px;height:26px;border-radius:8px;flex:none;display:flex;
  align-items:center;justify-content:center;font-size:13px;font-weight:700}
.alrt .at b{display:block;font-size:13px;font-weight:600;margin-bottom:2px}
.alrt .at s{text-decoration:none;font-size:11px;color:var(--ink-3);line-height:1.7;display:block}
.alrt .at s b{display:inline;font-family:"IBM Plex Mono",monospace;color:var(--ink-2);font-size:11px}

/* ══ اللوحة الواحدة: العنوان داخل البطاقة لا فوقها ══
   كان العنوان يطفو خارج البطاقة فتبدو الصفحة عناوين معلّقة وصناديق
   منفصلة. صار العنوان رأس اللوحة: خلفية البطاقة وإطارها، وحدّه السفلي
   يفصله عن محتواه — لوحة واحدة كما في المقترح. */
.sec:has(+ .card){background:var(--card);border:1px solid var(--line);
  border-radius:16px 16px 0 0;padding:13px 16px;margin:20px 0 0;
  align-items:baseline}
.sec:has(+ .card) + .card{border-radius:0 0 16px 16px;border-top:0;margin-top:0}
.sec:has(+ .card) h2{font-size:15px;font-weight:600}
.sec:has(+ .card) .hint{font-size:11px}

/* ══ عمود المقارنة بالشهر الماضي ══
   خامسُ عمود لا يظهر إلا حين تطلبه — أربعة أعمدة تكفي القراءة اليومية. */
/* مجموعات شريط الحالة: كلٌّ بمعناها، يفصلها خطّ */
.planbar .pbgrp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  margin-inline-start:auto;padding-inline-start:10px;
  border-inline-start:1px solid var(--line-2)}
.planbar .pbgrp.end{margin-inline-start:0}
.planbar .pbgrp .gl{font-size:10px;color:var(--ink-3);flex:none}
.planbar .mini{padding:3px 10px;font-size:11px;border-radius:99px}

/* أدوات العرض في آخر شريط الترتيب — كلاهما «كيف يُعرض الجدول» */
.sortbar .sbt{display:flex;align-items:center;gap:4px;flex-wrap:wrap;
  margin-inline-start:auto;padding-inline-start:10px;
  border-inline-start:1px solid var(--line)}
.sortbar .sbt .chip{color:var(--ink-3)}
.sortbar .sbt .chip.on{color:var(--accent)}
.ptab.pv{grid-template-columns:minmax(0,1fr) 58px 62px 58px 62px}
.ptab .pp{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-3);
  text-align:center;line-height:1.3}
.ptab .pp s{display:block;text-decoration:none;font-size:10px;margin-top:1px}
.ptab .pp s.up{color:var(--warn)}
.ptab .pp s.dn{color:var(--ok)}

/* ══ ماذا لو ══ */
.wsum{font-size:13px;line-height:1.75;border-radius:10px;padding:9px 12px;margin-bottom:11px}
.wsum b{font-family:"IBM Plex Mono",monospace;font-weight:600}
.wsum.ok{background:var(--ok-soft);color:var(--ok)}
.wsum.bad{background:var(--warn-soft);color:var(--warn)}

/* ══ قياس السطر ══
   تسعون حرفاً في السطر تُضِلّ العين عند العودة إلى أوّله. الحدّ ٦٨.
   ويُستثنى ذيل اللوحة: هو جزء من صندوقٍ له عرضه، وقصُّه يكسر اللوحة. */
.hintnote, .yhint, .empty, .dmsg, .wsum, .bsum, .rlist,
.clsnag s, .fh, .qbar .qh{max-width:68ch}
.hintnote, .yhint, .dmsg, .wsum, .bsum{line-height:1.75}
.card + .hintnote, .card + .acts{max-width:none}

.cmodes{display:flex;gap:4px;flex-wrap:wrap;flex:none}

.hsub .hj{color:var(--ink-3);font-size:11px;margin-inline-start:6px}
.hsub .hj::before{content:"· "}

/* ══ بطاقة الجهة: نتيجةٌ لا نموذج ══
   ثلاثة أرقام في الأعلى، فمسار القيمة، فالأفعال في الذيل. */
.ires{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ires .rq{background:var(--card);padding:11px 15px;display:block}
.ires .rq s{display:block;text-decoration:none;font-size:11px;color:var(--ink-3);
  margin-bottom:3px}
.ires .rq b{display:block;font-family:"IBM Plex Mono",monospace;font-size:21px;
  font-weight:600;line-height:1.15;letter-spacing:-.02em;direction:ltr;text-align:right}
.ires .rq b.dim{color:var(--ink-3);font-weight:400}
.ires .rq b.up{color:var(--ok)}
.ires .rq b.dn{color:var(--warn)}
.ires .rq em{display:block;font-style:normal;font-family:"IBM Plex Mono",monospace;
  font-size:11px;color:var(--ink-3);margin-top:2px;direction:ltr;text-align:right}
/* مسار القيمة */
.ispark{display:flex;align-items:flex-end;gap:3px;padding:12px 15px 8px;width:100%}
.ispark .sb{flex:1 1 0;min-width:0;display:flex;flex-direction:column;
  align-items:stretch;justify-content:flex-end;gap:3px}
.ispark i{display:block;width:100%;border-radius:3px 3px 0 0;background:var(--line-2)}
.ispark i.last{background:var(--ok-2)}
.ispark em{font-family:"IBM Plex Mono",monospace;font-style:normal;font-size:10px;
  color:var(--ink-3);text-align:center;direction:ltr}
/* الإقفال شريطُ فعلٍ في الذيل لا نموذجاً بعنوان */
.invclose{margin-top:0;padding-top:0;border-top:0}
.invclose .arow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.invclose .arow .cl{font-size:11px;color:var(--ink-3);flex:none}

/* زرّ طيّ السجلّ داخل بطاقة الجهة */
.logtog{display:block;width:100%;margin-top:12px;padding:7px 10px;border:1px dashed var(--line-2);
  background:transparent;color:var(--ink-3);border-radius:10px;cursor:pointer;
  font-family:inherit;font-size:11px;text-align:right}
.logtog:hover{border-color:var(--accent);color:var(--accent)}
.logtog.on{border-style:solid;border-color:var(--line);color:var(--ink-2)}
/* الجهة التي لم تبدأ — صفٌّ لا بطاقة */
.invcard.idle .ihead{padding:11px 15px}
.invcard.idle{opacity:.85}

/* ══ التنويه الذي يُغلق ══
   العلامة في زاوية الشرح لا في متنه، وتظهر باهتة حتى تُقصد. */
.dsm{position:relative;padding-inline-end:30px}
.nx{position:absolute;inset-inline-end:5px;top:5px;border:0;background:transparent;
  color:var(--ink-3);cursor:pointer;font-size:13px;line-height:1;width:22px;height:22px;
  border-radius:99px;opacity:.5;font-family:inherit;padding:0}
.nx:hover{opacity:1;background:var(--card-2);color:var(--ink)}
.dsm:hover .nx{opacity:.85}
/* مساحة لمسٍ ٤٤px بلا تكبير المرئيّ */
.nx::after{content:"";position:absolute;top:50%;left:50%;width:44px;height:44px;
  transform:translate(-50%,-50%)}

/* زرّ استعادة الشروح في ترويسة الشاشة — واحدٌ لكل شاشة */
.qmark{border:1px solid var(--line);background:var(--card);color:var(--ink-3);
  cursor:pointer;width:30px;height:30px;border-radius:50%;font-size:15px;line-height:1;
  font-family:inherit;padding:0;flex:none}
.qmark:hover{border-color:var(--accent);color:var(--accent)}

/* ══ شريط الدخل في الإدخال السريع ══
   الراتب أوّل ما يُكتب في الشهر، فليكن أوّل ما تراه في شاشة الإدخال. */
.qinc{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:10px 14px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);margin-bottom:10px}
.qinc .f{display:flex;flex-direction:column;gap:3px;flex:none}
.qinc .f label{font-size:10px;color:var(--ink-3)}
.qinc .qi2{width:104px;background:var(--card-2);border:1.5px solid var(--line);
  border-radius:10px;padding:6px 10px;color:var(--ink);font-family:"IBM Plex Mono",monospace;
  font-size:15px;font-weight:600;text-align:center;direction:ltr;outline:none}
.qinc .qi2:focus{border-color:var(--accent);background:var(--card)}
.qinc .qsum{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;
  margin-inline-start:auto}
.qinc .qs{display:flex;flex-direction:column;gap:1px;text-align:left}
.qinc .qs s{text-decoration:none;font-size:10px;color:var(--ink-3)}
.qinc .qs b{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600}
.qinc .qs b.ok{color:var(--ok)}
.qinc .qs b.bad{color:var(--warn)}
.qinc .qs.big b{font-size:21px;letter-spacing:-.02em}

/* وميض الحفظ */
@keyframes qsaved{
  0%{background:var(--ok-soft)}
  100%{background:transparent}
}
.qtab.flash{animation:qsaved 1.1s ease-out}
@media (prefers-reduced-motion:reduce){
  .qtab.flash{animation:none;background:var(--ok-soft)}
}
.qadd{padding:10px 14px 12px}

/* ══ شريط الإدخال السريع ══
   التقدّم أولاً لأنه الجواب عن «هل انتهيت؟»، ثم الملء دفعةً، ثم التلميح. */
.qbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 14px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);margin-bottom:10px}
.qbar .qp{font-size:11px;color:var(--ink-2);flex:none}
.qbar .qp b{font-family:"IBM Plex Mono",monospace;font-size:15px;color:var(--ink)}
.qbar .qtrack{flex:1 1 90px;min-width:70px;height:6px;border-radius:99px;
  background:var(--track);overflow:hidden}
.qbar .qtrack i{display:block;height:100%;border-radius:99px;background:var(--ok);
  transition:width .25s}
.qbar .qh{font-size:11px;color:var(--ink-3);flex:1 1 100%;line-height:1.6}
.qbar .qh b{font-family:"IBM Plex Mono",monospace;color:var(--ink-2);font-weight:600}
@media (min-width:820px){
  .qbar .qh{flex:0 1 auto;margin-inline-start:auto}
}

/* حقل الخطة داخل الجدول السريع — يتميّز عن حقل الصرف بلونه لا بحجمه */
.qtab .qin.plan{background:transparent;border-color:transparent;color:var(--ink-3);
  font-weight:500}
.qtab .qin.plan:hover{border-color:var(--line)}
.qtab .qin.plan:focus{background:var(--card);border-color:var(--accent);color:var(--ink);
  font-weight:600}

/* ══ التقارير ══ */
.repbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 14px}
.repbar .rl{font-size:10px;color:var(--ink-3);flex:none}
.repbar .rh{font-size:11px;color:var(--ink-3);margin-inline-start:auto}

/* شريط المسار: عرض كل جزء بقدر نصيبه */
.flowbar{display:flex;height:14px;border-radius:99px;overflow:hidden;
  background:var(--track);margin:14px 15px 12px;gap:1px}
.flowbar i{display:block;min-width:2px}
.frow{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:9px 15px;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow .fd{width:10px;height:10px;border-radius:3px}
.frow .fn b{display:block;font-size:15px;font-weight:500}
.frow .fn s{display:block;text-decoration:none;font-size:11px;color:var(--ink-3)}
.frow .fv{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;text-align:left}
.frow .fv s{display:block;text-decoration:none;font-size:11px;color:var(--ink-3);font-weight:400}

/* أين يذهب راتبك */
.rbar{display:block;height:5px;border-radius:99px;background:var(--track);
  overflow:hidden;margin-top:6px}
.rbar i{display:block;height:100%;border-radius:99px}
.trow{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:10px 15px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .ti{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:13px}
.trow .tn b{font-size:15px;font-weight:500}
.trow .tc{font-size:10px;padding:1px 7px;border-radius:99px;margin-inline-start:6px;
  vertical-align:middle}
.trow .tv{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;text-align:left}
.trow .tv s{display:block;text-decoration:none;font-size:10px;color:var(--ink-3);font-weight:400}

/* دعوة التصنيف */
.clsnag{padding:12px 15px;background:var(--gold-soft);color:var(--gold);
  border-bottom:1px solid var(--line)}
.clsnag b{display:block;font-size:13px;font-weight:700}
.clsnag s{display:block;text-decoration:none;font-size:11px;line-height:1.7;margin-top:2px}
.clsnag .acts{margin-top:9px}

/* دقّة الخطة */
.arow{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:10px 15px;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow .ai{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:13px}
.arow .an b{display:block;font-size:15px;font-weight:500}
.arow .an s{display:block;text-decoration:none;font-size:11px;color:var(--ink-3)}
.arow .av{text-align:left}
.arow .av b{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600}
.arow .av b.up{color:var(--warn)}
.arow .av b.dn{color:var(--ok)}
.arow .av s{display:block;text-decoration:none;font-size:10px;color:var(--ink-3);
  font-family:"IBM Plex Mono",monospace}

/* الادخار والتسريب */
.srow{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:9px 15px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow.tot{background:var(--card-2);font-weight:600}
.srow .sm{font-size:11px;color:var(--ink-2);white-space:nowrap}
.srow .sn2{font-size:11px;color:var(--ink-3)}
.srow .sv{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;text-align:left}
.srow .sv.neg{color:var(--warn)}
.srow .sv s{display:block;text-decoration:none;font-size:10px;color:var(--ink-3);font-weight:400}

.onbchips{max-height:34vh;overflow-y:auto;padding:2px}
.onbchips .chip{font-size:13px;padding:6px 12px}

/* ══ مصنِّف البنود ══ */
.clist{border:1px solid var(--line);border-radius:10px;overflow:hidden;
  max-height:52vh;overflow-y:auto}
.crow{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:9px;align-items:center;
  padding:7px 11px;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow .ci{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:13px}
.crow .cn{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .cn s{display:block;text-decoration:none;font-size:10px;color:var(--ink-3);
  font-family:"IBM Plex Mono",monospace}
.crow .cb{display:flex;gap:3px;flex:none}
.crow .cb .chip{padding:2px 9px;font-size:11px;border-width:1px}

/* ══ قواعدك النسبية ══ */
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto 28px;gap:10px;align-items:center;
  padding:11px 15px;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:0}
.rrow.bad{background:var(--warn-soft)}
.rrow .rn b{display:block;font-size:15px;font-weight:600}
.rrow .rn s{display:block;text-decoration:none;font-size:11px;color:var(--ink-3);margin-top:1px}
.rrow .rv{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600}
.rrow.bad .rv{color:var(--warn)}
.rlist{margin:8px 0 0;padding-inline-start:16px;font-size:13px;line-height:1.8}
.rlist b{font-family:"IBM Plex Mono",monospace}
.rpill{font-family:"IBM Plex Mono",monospace;font-size:10px;padding:2px 7px;border-radius:99px;
  margin-inline-start:6px;white-space:nowrap;vertical-align:middle;
  background:var(--card-2);color:var(--ink-3)}
.rpill.bad{background:var(--warn-soft);color:var(--warn);font-weight:600}

/* ══ جدول «ابْنِ خطتي» ══ */
.blist{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.brow{display:grid;grid-template-columns:26px minmax(0,1fr) auto 14px auto 62px;
  gap:9px;align-items:center;padding:8px 11px;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow.tot{background:var(--card-2);font-weight:600}
.brow .bi{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:13px}
.brow .bn{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bv{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600}
.brow .bv.dim{color:var(--ink-3);font-weight:400}
.brow .ba{color:var(--ink-3);font-size:11px;text-align:center}
.brow .bd{font-family:"IBM Plex Mono",monospace;font-size:11px;text-align:left;color:var(--ink-3)}
.brow .bd.up{color:var(--warn)}
.brow .bd.dn{color:var(--ok)}
.bsum{font-size:13px;line-height:1.7;border-radius:10px;padding:9px 12px}
.bsum b{font-family:"IBM Plex Mono",monospace;font-weight:600}
.bsum.ok{background:var(--ok-soft);color:var(--ok)}
.bsum.warn{background:var(--gold-soft);color:var(--gold)}
.bsum.bad{background:var(--warn-soft);color:var(--warn)}

/* ══ بطاقة الدخل ══
   حقلان وزرّان لا يستحقّان أربعة أسطر — صفّ واحد يكفيهما. */
.incard{padding:12px 15px 13px}
.increr{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.increr .inclab{font-size:11px;color:var(--ink-3);align-self:center;flex:none}
.increr .f{display:flex;flex-direction:column;gap:3px;flex:none}
.increr .f label{font-size:10px;color:var(--ink-3)}
.increr .incacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  margin-inline-start:auto}
.increr .incacts .act{padding:6px 12px;font-size:13px}
.increr .incacts .pill{font-size:11px}

/* ══ مسار الخطة ══
   أربع مراحل متّصلة في لوحة واحدة؛ كل واحدة تُغلق
   برقم «يبقى بعدها» — فيُقرأ التخطيط مساراً لا جدولاً. */
.psteps{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
  overflow:hidden;padding:0}
@media (min-width:820px){.psteps{grid-template-columns:repeat(4,1fr)}}
.psteps .pstep{background:var(--card);border:0;border-radius:0;cursor:pointer;
  font-family:inherit;text-align:right;padding:13px 15px;display:block;
  position:relative;transition:background .15s}
.psteps .pstep:hover{background:var(--card-2)}
.psteps .pstep .sn{display:block;text-decoration:none;font-size:11px;color:var(--ink-3);
  margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psteps .pstep b{display:block;font-family:"IBM Plex Mono",monospace;font-size:21px;
  font-weight:600;line-height:1.15;letter-spacing:-.02em;direction:ltr;text-align:right}
.psteps .pstep em{display:block;font-style:normal;font-size:11px;color:var(--ink-2);
  margin-top:3px}
.psteps .pstep .ss{display:block;font-style:normal;font-size:10px;color:var(--ink-3);
  margin-top:1px}
/* اللون معنى لا زينة: الدخل هو المصدر، والالتزام عبء، والادخار وحده
   مكسب. والمرحلة الأخيرة خضراء إن أُغلقت الخطة وحمراء إن تجاوزتها. */
.psteps .pstep .sn i{font-style:normal;font-family:"IBM Plex Mono",monospace;
  color:var(--ink-3);margin-inline-end:5px;font-size:10px}
.psteps .pstep.l-inc b{color:var(--ink)}
.psteps .pstep.l-duty b{color:var(--ink-2)}
.psteps .pstep.l-save b{color:var(--ok)}
.psteps .pstep.l-flex b{color:var(--ink)}
.psteps .pstep.shut .sn{color:var(--ok)}
.psteps .pstep.shut b{color:var(--ok)}
.psteps .pstep.bad .sn, .psteps .pstep.bad b, .psteps .pstep.bad em{color:var(--warn)}
.psteps .pstep.on{background:var(--accent-soft)}
.psteps .pstep.on .sn{color:var(--accent);font-weight:600}
.psteps .pstep.on::after{content:"";position:absolute;inset-inline:0;bottom:0;height:2px;
  background:var(--accent)}
.laybar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 15px;
  background:var(--accent-soft);color:var(--accent);font-size:11px;
  border-bottom:1px solid var(--line)}
.laybar b{font-weight:700}
.laybar .mini{margin-inline-start:auto;border-color:var(--accent);color:var(--accent);
  background:transparent}

/* ══ ذيل اللوحة ══
   الملاحظة التي تشرح بطاقة، والزرّ الذي يفتح تفصيلها، كانا
   صندوقين طافيين بين البطاقة وما بعدها. صارا ذيلها. */
.card:has(+ .hintnote), .card:has(+ .acts), .card:has(+ .flag){
  border-end-start-radius:0;border-end-end-radius:0;margin-bottom:0}
.card + .hintnote, .card + .acts{
  background:var(--card-2);border:1px solid var(--line);border-top:0;
  border-radius:0 0 16px 16px;margin:0 0 14px;padding:12px 16px}
.card + .hintnote{border-inline-start-width:1px;border-inline-start-color:var(--line);
  padding-inline-start:16px;color:var(--ink-3)}
.card + .hintnote .acts{margin-top:9px}
.card + .acts{display:flex;gap:8px;flex-wrap:wrap}
.card + .flag{border-radius:0 0 16px 16px;margin:0 0 14px;
  border:1px solid var(--line);border-top:0}
@media (min-width:820px){
  .card + .hintnote, .card + .acts, .card + .flag{margin-bottom:10px}
}

/* ══ قائمة أقسام الإعدادات ══ */
.setnav{padding:8px;display:flex;flex-direction:column;gap:2px}
.setnav .snv{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  width:100%;text-align:right;border:0;background:transparent;color:var(--ink-2);
  font-family:inherit;font-size:13px;padding:9px 12px;border-radius:10px;cursor:pointer}
.setnav .snv s{text-decoration:none;font-family:"IBM Plex Mono",monospace;
  font-size:11px;color:var(--ink-3);flex:none}
.setnav .snv:hover{background:var(--card-2);color:var(--ink)}
.setnav .snv.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.setnav .snv.on s{color:var(--accent)}
.setnav .snv.bad{color:var(--warn)}
.setnav .snv.bad:hover{background:var(--warn-soft)}

/* ══ الترويسة: عنوان الشاشة وحالتها وفعلها ══ */
.htxt{min-width:0}
.hsub{font-size:13px;color:var(--ink-3);margin-top:1px;line-height:1.6}
.tact{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btnpri{background:var(--accent);color:#fff;border:1.5px solid var(--accent);
  border-radius:10px;padding:7px 14px;font-size:13px;font-weight:600;
  font-family:inherit;cursor:pointer;white-space:nowrap}
.btnpri:hover{filter:brightness(1.08)}
/* اسم التطبيق في رأس الشريط — على الحاسب وحده */
.navbrand{display:none}

@media (min-width:820px){
  .navbrand{display:flex;align-items:center;gap:9px;padding:4px 8px 16px;
    margin-bottom:6px;border-bottom:1px solid var(--line)}
  .navbrand .nbm{width:28px;height:28px;border-radius:9px;background:var(--accent);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:15px;flex:none}
  .navbrand b{font-family:"Alexandria",sans-serif;font-size:15px;font-weight:700;
    letter-spacing:-.01em;color:var(--ink)}
  .topbar{align-items:flex-start}
  .brand{font-size:21px;line-height:1.25}
  .hsub{font-size:13px}
}

/* ══ اللوحة الملمومة ══
   المؤشّرات وبطاقات الأرقام: إطار واحد يحيط بها كلها، والفواصل خطوط
   بعرض بكسل — لا صناديق طافية بينها فراغ. */
@media (min-width:820px){
  .kpis, .grid{gap:1px;background:var(--line);border:1px solid var(--line);
    border-radius:16px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:10px}
  .kpi, .stat{border:0;border-radius:0;box-shadow:none;background:var(--card)}
  .card{margin-bottom:10px}
  .sec:has(+ .card){margin-top:12px}
  /* عنوان لوحة الأرقام يلتصق بها كما يلتصق عنوان البطاقة ببطاقته */
  .sec:has(+ .kpis), .sec:has(+ .grid){background:var(--card);
    border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;
    padding:13px 16px;margin:12px 0 0;align-items:baseline}
  .sec:has(+ .kpis) h2, .sec:has(+ .grid) h2{font-size:15px;font-weight:600}
  .sec:has(+ .kpis) .hint, .sec:has(+ .grid) .hint{font-size:11px}
  .sec:has(+ .kpis) + .kpis, .sec:has(+ .grid) + .grid{
    border-radius:0 0 16px 16px;border-top:0}
  .hintnote, .flag, .autobar{margin-bottom:10px}
}

/* ══════════ تخطيط الشاشات على الحاسب ══════════
   تدفّق أعمدة لا شبكة: الشبكة تشدّ العمودين في صفّ واحد فتصنع فجوات
   بمئات البكسلات حين يختلف ارتفاع جانبيها (قِيست 1264px في الخطة).
   التدفّق يوازن الارتفاعين وحده ولا يترك ثقوباً. */
@media (min-width:1180px){
  .colwrap{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);
    gap:12px;align-items:start}
  .colA, .colB{min-width:0;display:flex;flex-direction:column}
  /* الإعدادات: القائمة ضيّقة يميناً واللوحة عريضة يساراً */
  .colwrap.setwrap{grid-template-columns:minmax(0,1fr) minmax(0,1.62fr)}
  .colA > .sec, .colB > .sec{margin-top:12px}
  .colA > .sec:first-child, .colB > .sec:first-child{margin-top:0}

  /* ما يعبر العمودين: الترويسة · شريط الشهور · المؤشرات · اللافتات
     · الشبكات · الجداول العريضة — ومعها عناوينها فلا تيتم */
  .v-dash > .topbar, .v-year > .topbar, .v-plan > .topbar,
  .v-accts > .topbar, .v-inv > .topbar, .v-set > .topbar,
  .v-dash > .mstrip2, .v-year > .mstrip2, .v-plan > .mstrip2,
  .v-accts > .mstrip2, .v-inv > .mstrip2, .v-set > .mstrip2,
  .v-dash > .kpis, .v-year > .kpis, .v-accts > .kpis, .v-inv > .kpis,
  .v-env > .kpis,
  .v-dash > .spendbar, .v-dash > .wiz, .v-dash > .flag, .v-dash > .autobar,
  .v-dash > .dcols, .v-dash > .grid, .v-dash > .sec:has(+ .grid),
  .v-plan > .flag, .v-plan > .wiz, .v-plan > .mixline,
  .v-plan > .sec:has(+ .mixline),
  .v-year > .card:has(.ygrid), .v-year > .sec:has(+ .card .ygrid),
  .v-year > .card:has(.yrow), .v-year > .sec:has(+ .card .yrow),
  .v-accts > .card:has(.ygrid),
  .v-dash > footer, .v-year > footer, .v-plan > footer,
  .v-accts > footer, .v-inv > footer, .v-set > footer{
    column-span:all}

  /* العنوان لا ينفصل عن بطاقته، والبطاقة لا تُقسَّم بين عمودين */
  .v-dash > .sec, .v-year > .sec, .v-plan > .sec,
  .v-accts > .sec, .v-inv > .sec, .v-set > .sec{
    break-after:avoid;break-inside:avoid;margin-top:14px}
  .v-dash > .card, .v-year > .card, .v-plan > .card,
  .v-accts > .card, .v-inv > .card, .v-set > .card,
  .v-dash > .hintnote, .v-year > .hintnote, .v-plan > .hintnote,
  .v-accts > .hintnote, .v-inv > .hintnote, .v-set > .hintnote,
  .v-inv > .flag, .v-accts > .flag{break-inside:avoid}

  /* الترويسة اللاصقة لا تعمل داخل تدفّق الأعمدة */
  .v-dash > .topbar, .v-year > .topbar, .v-plan > .topbar,
  .v-accts > .topbar, .v-inv > .topbar, .v-set > .topbar{position:static}

  /* ══ المصروف: نموذج ثابت + قائمة — شبكة صريحة لأن جانبيه متقاربان ══ */
  .v-spend{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);
    column-gap:16px;align-items:start;grid-auto-flow:row dense}
  .v-spend > *{grid-column:1}
  .v-spend > .topbar, .v-spend > .mstrip2, .v-spend > footer{grid-column:1 / -1}
  .v-spend > .card:has(.qtab){grid-column:1}
  .v-spend > .modesw{grid-column:2}
  .v-spend > .card:has(.amt-row){grid-column:2;position:sticky;top:14px}
  .v-spend > .sec{margin-top:0;margin-bottom:8px}
  .v-spend > .card, .v-spend > .hintnote{margin-bottom:14px}
}

@media (min-width:1200px){
  .wrap{padding:0 40px 44px}
}
@media (min-width:1520px){
  /* لا يتمدّد النصّ إلى ما لا نهاية على الشاشات العريضة —
     الحدّ 1280px: أبعد منه تتباعد الأرقام عن عناوينها داخل الخلية. */
  .wrap{padding-inline-start:calc((100vw - 212px - 1280px) / 2);
        padding-inline-end:calc((100vw - 212px - 1280px) / 2)}
}


/* ── الحسابات المصرفية ── */
.bankhead{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;
  border-bottom:1px solid var(--line);background:var(--card-2)}
.bankhead .bn{flex:1;min-width:0;font-size:15px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.bankhead .bv{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600}
.bankhead .bc{font-size:11px;color:var(--ink-3)}
.acct{padding-inline-start:24px;cursor:pointer}
.acct:hover{background:var(--card-2)}
.acct .an{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .av{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;text-align:left}
.tagline{display:flex;align-items:center;gap:4px;margin-top:3px;flex-wrap:wrap}
.tag{font-size:10px;padding:2px 8px;border-radius:99px;white-space:nowrap}
.tag.ops{background:var(--card-2);color:var(--ink-3)}
.tag.goal{background:var(--ok-soft);color:var(--ok)}
.tag.inv{background:var(--accent-soft);color:var(--accent)}
.tag.cat{background:var(--gold-soft);color:var(--gold)}
/* عقد الالتزام */
.creditor{font-size:13px;font-weight:600;color:var(--ink-2)}
.dprog{padding:6px 0 2px}
.dbar{display:block;height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.dbar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.dtx{display:block;font-size:11px;color:var(--ink-3);margin-top:5px}
.dtx b{font-family:"IBM Plex Mono",monospace;color:var(--ink-2);font-weight:600}
.dtx b.rem{color:var(--warn)}
.apanel{background:var(--card-2);border-bottom:1px solid var(--line);padding:8px 16px 12px}
.apanel .lab{margin-bottom:6px}
.arow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0}
.arow .al{flex:none;min-width:44px;font-size:11px;color:var(--ink-3)}
.arow .chips{gap:4px}
.arow .chip.sm{padding:2px 8px;font-size:11px;border-width:1px}
.arow .ni.s{width:80px;font-size:13px;padding:4px 4px}
.ahint{font-size:10px;color:var(--ink-3);padding:0 0 4px;line-height:1.6}
.salpill{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--ok-soft);
  color:var(--ok);font-weight:600;white-space:nowrap}
.spentpill{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;color:var(--warn)}
.abtns{display:flex;gap:4px;flex-wrap:wrap;margin-top:9px}
.srcpick{margin-top:10px;padding-top:12px;border-top:1px dashed var(--line)}
.srcpick .lab{margin-bottom:6px}
.itemacct{font-family:"IBM Plex Mono",monospace;font-size:10px;padding:2px 4px;
  border-radius:99px;background:var(--card-2);color:var(--ink-3);margin-inline-start:6px}

/* ══ تبويب السنة ══ */
.yrow{display:grid;grid-template-columns:64px minmax(0,1fr) 78px;gap:12px;align-items:center;
  padding:8px 16px;border-bottom:1px solid var(--line)}
.yrow:last-child{border-bottom:0}
.yrow.now{background:var(--accent-soft)}
.yrow .ym{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-2)}
.yrow.now .ym{color:var(--accent);font-weight:600}
.ybars{display:flex;flex-direction:column;gap:2px}
.ybar{height:7px;border-radius:99px;background:var(--track);overflow:hidden;display:block}
.ybar i{display:block;height:100%;border-radius:99px}
.yrow .ys{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;text-align:left}
.yrow .ys s{display:block;text-decoration:none;font-size:10px;color:var(--ink-3);font-weight:400}
.yrow.empty{opacity:.4}
.ylegend{display:flex;gap:16px;flex-wrap:wrap;padding:12px 16px;font-size:11px;
  color:var(--ink-3);background:var(--card-2);border-bottom:1px solid var(--line)}
.ylegend span{display:flex;align-items:center;gap:4px}
.ylegend i{width:14px;height:6px;border-radius:99px;display:block}

.ygrid{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ygrid table{border-collapse:collapse;font-size:13px;width:100%;min-width:560px}
.ygrid th,.ygrid td{padding:8px 8px;text-align:center;white-space:nowrap;
  border-bottom:1px solid var(--line)}
.ygrid thead th{font-size:10px;color:var(--ink-3);font-weight:500;background:var(--card-2);
  position:sticky;top:0}
.ygrid .cn{text-align:right;position:sticky;inset-inline-start:0;background:var(--card);
  z-index:2;min-width:104px;max-width:104px;overflow:hidden;text-overflow:ellipsis;
  font-size:13px}
.ygrid thead .cn{background:var(--card-2);z-index:3}
.ygrid tbody tr:hover .cn{background:var(--card-2)}
.ygrid .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.ygrid .z{color:var(--ink-3);opacity:.4}
.ygrid .tot{font-weight:600;background:var(--card-2)}
.ygrid tfoot td{font-weight:600;background:var(--card-2);border-bottom:0}
.ygrid .hot{color:var(--warn);font-weight:600}
.yhint{padding:8px 16px;font-size:11px;color:var(--ink-3);background:var(--card-2);
  border-bottom:1px solid var(--line)}
.tl{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.tl:last-child{border-bottom:0}
.tl .tm{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);
  flex:none;min-width:62px}
.tl .tn{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl .tv{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;color:var(--warn)}

/* ══ جدول الخطة ══ */
.ptab{display:grid;grid-template-columns:minmax(0,1fr) 58px 58px 60px;gap:4px;
  align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.ptab.head{background:var(--card-2);padding:8px 12px;font-size:10px;color:var(--ink-3);
  position:sticky;top:0;z-index:2}
.ptab.head span{text-align:center}
.ptab.head span:first-child{text-align:right}
.ptab .pn{display:flex;align-items:center;gap:8px;min-width:0}
.ptab .pn .pi{width:26px;height:26px;border-radius:10px;flex:none;display:flex;
  align-items:center;justify-content:center;font-size:13px}
.ptab .pnm{min-width:0;flex:1}
.ptab .pnm b{font-size:13px;font-weight:500;display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.ptab .pnm s{text-decoration:none;font-size:10px;color:var(--ink-3);display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptab .ptrack{display:block;height:3px;border-radius:99px;background:var(--track);
  overflow:hidden;margin-top:4px}
.ptab .ptrack i{display:block;height:100%;border-radius:99px}
.ptab .pv{font-family:"IBM Plex Mono",monospace;font-size:13px;text-align:center;
  font-variant-numeric:tabular-nums;color:var(--ink-2)}
.ptab .pv.plan{font-weight:600;color:var(--ink)}
.ptab .pv.neg{color:var(--warn);font-weight:600}
.ptab .pv.dim{opacity:.35}
.ptab.foot{background:var(--card-2);border-bottom:0;font-weight:600}
.ptab.foot .pv{color:var(--ink);font-weight:600}
.ptab.tap{cursor:pointer}
.ptab.tap:hover{background:var(--card-2)}
.ptab.zero .pnm b{color:var(--ink-3);font-weight:400}
.carrybtn{border:0;background:var(--ok-soft);color:var(--ok);border-radius:99px;
  font-size:10px;padding:2px 8px;cursor:pointer;margin-inline-start:5px;
  font-family:"IBM Plex Mono",monospace;white-space:nowrap}
.carrybtn.neg{background:var(--warn-soft);color:var(--warn)}
.carrybtn:hover{filter:brightness(1.15)}
/* شريط الترتيب — يعلو الجدول */
.sortbar{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:8px 12px;
  background:var(--card-2);border-bottom:1px solid var(--line)}
.sortbar .sl{font-size:11px;color:var(--ink-3);margin-inline-end:4px}
.sortbar .chip{padding:2px 12px;font-size:11px;border-width:1px}
/* صفّ البنود غير المستعملة */
.ptab.zrow{cursor:pointer;background:var(--card-2);grid-template-columns:1fr}
.ptab.zrow:hover{background:var(--line)}
.ptab.zrow .zt{font-size:11px;color:var(--ink-3)}
.metaline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 16px;
  background:var(--card-2);border-bottom:1px solid var(--line);font-size:11px;color:var(--ink-3)}
.metaline b{color:var(--ink-2);font-weight:600}
.metaline .sep{opacity:.4}
.metaline .mini{margin-inline-start:auto}

/* ══ الإدخال السريع ══ */
.modesw{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:4px;margin-bottom:14px;box-shadow:var(--shadow)}
.modesw button{flex:1;border:0;background:transparent;color:var(--ink-3);cursor:pointer;
  border-radius:10px;padding:8px 8px;font-size:13px;font-family:inherit}
.modesw button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.fitbar{border-radius:16px;padding:16px 16px;margin-bottom:14px;border:1px solid var(--line)}
.fitbar.down{background:var(--warn-soft);border-color:var(--warn)}
.fitbar.up{background:var(--ok-soft);border-color:var(--ok)}
.fitbar .ft b{font-size:15px;font-weight:600;display:block}
.fitbar.down .ft b{color:var(--warn)}
.fitbar.up .ft b{color:var(--ok)}
.fitbar .ft s{text-decoration:none;font-size:13px;color:var(--ink-2);display:block;margin-top:3px}
.fitbar .ft s b{font-family:"IBM Plex Mono",monospace;display:inline;font-size:13px;color:var(--ink)}
.fitbar .fh{font-size:11px;color:var(--ink-3);margin-top:10px;line-height:1.75}
.fitbar .fh b{color:var(--ink-2);font-weight:600}
.qtab{display:grid;grid-template-columns:minmax(0,1fr) 78px 84px 58px;gap:4px;
  align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.qtab.head{background:var(--card-2);font-size:10px;color:var(--ink-3);position:sticky;top:0;z-index:2}
.qtab.head span{text-align:center}
.qtab.head span:first-child{text-align:right}
.qtab .qn{display:flex;align-items:center;gap:8px;min-width:0}
.qtab .qi{width:26px;height:26px;border-radius:10px;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:13px}
.qtab .qt{min-width:0;flex:1}
.qtab .qt b{font-size:13px;font-weight:500;display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.qtab .qt s{text-decoration:none;font-size:10px;color:var(--ink-3);display:block}
.qtab .qv{font-family:"IBM Plex Mono",monospace;font-size:13px;text-align:center;
  color:var(--ink-2);font-variant-numeric:tabular-nums}
.qtab .qv.neg{color:var(--warn);font-weight:600}
.qtab .qv.dim{opacity:.35}

  /* ═══ حسابات ═══ */
  function month(k){ if(!state.months[k]) state.months[k] = { items: [], inc: null }; return state.months[k]; }

  /* ── أنواع البنود ── */

  /* ── خطة خاصة بالشهر (المرحلة ٣) ── */
  function lineKey(ck, sid){ return sid ? ck + "|" + sid : ck; }
