  }

  /* ── ترحيل الفائض (المرحلة ٤) ── */
  /* كل بند ظرف مستقل: ما لم يُصرف ينتقل للشهر التالي دائماً */
  /* all الكل · neg السالب وحده · none لا شيء */
  function carryMode(){
    var m = state.carryMode;
    return (m === "neg" || m === "none") ? m : "all";
  }
  function carryOf(c, mk){
    var mode = carryMode();
    if(mode === "none") return 0;
    var keys = Object.keys(state.months).sort(), carry = 0;
    for(var i=0;i<keys.length;i++){
      var k = keys[i];
      if(k >= mk) break;
      var m = state.months[k];
      if(!m || !m.items || !m.items.length) continue;   /* شهر بلا حركة لا يُرحِّل */
      var act = 0;
      m.items.forEach(function(it){ if(it.c === c.k) act += num(it.a); });
      carry = (catPlan(c, k) + carry) - act;
      /* «السالب وحده» يُقصّ في كل خطوة لا في النهاية — وإلا تراكم
         الفائض في الطريق ثم قُصّ، فأعطى رقماً لا معنى له. */
      if(mode === "neg" && carry > 0) carry = 0;
    }
    return Math.round(carry);
  }
  function effPlan(c, mk){ return catPlan(c, mk) + carryOf(c, mk); }

  /* ══ أمان الأثر الرجعي ══
     أيّ تعديل على شهر ماضٍ ينزلق إلى كل شهر بعده عبر الترحيل.
     carryImpact تُرجع الأشهر التي سيتغيّر رصيدها ومقدار التغيّر — تُحسب
     بمقارنة الرصيد الحالي بالرصيد بعد تطبيق التعديل مؤقّتاً ثم التراجع. */
  function laterMonths(mk){
    return Object.keys(state.months).sort().filter(function(k){ return k > mk; });
  }
  function carryImpact(c, mk, apply, undo){
    var later = laterMonths(mk);
    if(!later.length) return [];
    var before = later.map(function(k){ return carryOf(c, k); });
    apply();
    var after = later.map(function(k){ return carryOf(c, k); });
    undo();
    var out = [];
    later.forEach(function(k, i){
      if(after[i] !== before[i]) out.push({ mk: k, d: after[i] - before[i], to: after[i] });
    });
    return out;
  }
  function impactHTML(list){
    if(!list.length) return "";
    var show = list.slice(0, 4), rest = list.length - show.length;
    return '<div class="dlab">أشهر سيتغيّر رصيدها</div><ul class="dlist">'
      + show.map(function(x){
          return '<li><span>' + esc(mName(x.mk)) + '</span><span class="dv '
            + (x.d > 0 ? "up" : "dn") + '">' + (x.d > 0 ? "+" : "−") + fmt(Math.abs(x.d))
            + '</span></li>';
        }).join("")
      + (rest > 0 ? '<li><span>و' + arMonths(rest) + ' أخرى</span><span class="dv"></span></li>' : "")
      + '</ul>';
  }
  /* ── الشهر المُقفَل ── */
  function isLocked(mk){ var m = state.months[mk]; return !!(m && m.locked); }
  function isPast(mk){ return mk < todayKey(); }
  function lockMonth(mk, on){
    var m = month(mk);
    if(on){ m.locked = true; }
    else {
      delete m.locked;
      if(!m.reopened) m.reopened = [];
      m.reopened.push(new Date().toISOString().slice(0, 10));
    }
  }
  /* حارس مشترك: يُنفَّذ fn بعد موافقتك إن كان الشهر ماضياً أو مُقفَلاً */
  function guardEdit(mk, title, impact, fn){
    if(isLocked(mk)){
      confirmDlg("«" + mName(mk) + "» مُقفَل",
        "أقفلتَ هذا الشهر بعد أن طابقت أرصدته. فتحه يسمح بتعديله، ويُسجَّل أنه فُتح بأثر رجعي.",
        "افتحه وعدّله", function(){ lockMonth(mk, false); save(); fn(); }, true);
      return;
    }
    if(!isPast(mk) || !impact.length){ fn(); return; }
    ask({ title: title,
      msg: "هذا شهر مضى، والترحيل يجعل تعديله ينتقل إلى ما بعده.",
      fields: [],
      html: impactHTML(impact),
      ok: "نفّذ التعديل", onOk: fn });
  }
  /* من أين جاء الرصيد المرحَّل: صفّ لكل شهر سابق فيه حركة */
  function carryTrail(c, mk){
    var keys = Object.keys(state.months).sort(), out = [], carry = 0;
    for(var i=0;i<keys.length;i++){
      var k = keys[i];
      if(k >= mk) break;
      var m = state.months[k];
      if(!m || !m.items || !m.items.length) continue;
      var act = 0;
      m.items.forEach(function(it){ if(it.c === c.k) act += num(it.a); });
      var pl = catPlan(c, k), inC = Math.round(carry);
      carry = (pl + carry) - act;
      out.push({ k: k, plan: pl, spent: act, inC: inC,
                 diff: Math.round(pl - act), bal: Math.round(carry) });
    }
    return out;
  }
  /* الحساب المخصَّص للبند إن وُجد */
  function catAcct(c){ return c && c.acct ? acctOf(c.acct) : null; }
  /* كشف البند لآخر n شهراً: المخطط · صُرف · الرصيد */
  function envLedger(c, mk, n){
    var keys = Object.keys(state.months).sort().filter(function(x){ return x <= mk; });
    var carry = 0, out = [];
    for(var i=0;i<keys.length;i++){
      var kk = keys[i], m = state.months[kk], sp = 0;
      if(m && m.items) m.items.forEach(function(it){ if(it.c === c.k) sp += num(it.a); });
      var used = !!(m && m.items && m.items.length);
      var pl = catPlan(c, kk), inC = carry;
      /* شهر بلا حركة لا يراكم ميزانيته — رصيده يبقى كما دخل */
      var bal = used ? (pl + inC - sp) : inC;
      if(used) carry = bal;
      out.push({ k: kk, plan: pl, spent: sp, inC: inC, bal: bal, used: used });
    }
    return out.slice(-(n || 6));
  }
  /* نسبة تغيّر الصرف عن الشهر السابق */
  function envChange(c, mk){
    var pk = shift(mk, -1), pm = state.months[pk];
    if(!pm || !pm.items || !pm.items.length) return null;
    var prev = 0, now = 0, m = state.months[mk];
    pm.items.forEach(function(it){ if(it.c === c.k) prev += num(it.a); });
    if(m && m.items) m.items.forEach(function(it){ if(it.c === c.k) now += num(it.a); });
    if(prev === 0) return now === 0 ? { pct: 0, prev: 0, now: 0 } : null;
    return { pct: (now - prev) / prev * 100, prev: prev, now: now };
  }

  /* كل بند ظرف: ما بقي فيه = (خطة الشهر + المرحَّل) − ما صُرف */
  function envelopes(mk){
    var A = actuals(mk);
    return visibleCats().map(function(c){
      var cry = carryOf(c, mk), avail = catPlan(c, mk) + cry, sp = A.by[c.k] || 0;
      return { c: c, carry: cry, avail: avail, spent: sp, left: avail - sp,
               trail: carryTrail(c, mk) };
    }).filter(function(x){ return x.avail > 0 || x.spent > 0; });
  }

  /* ── الأقساط: كل التزام بمدّته ── */
  function allInst(mk){
    var out = [];
    state.cats.forEach(function(c){
      if(c.hidden) return;
      /* بند فيه فروع = حاوٍ وسقف، لا قسط بذاته */
      if(!(c.subs || []).length && typeOf(c) === "inst" && !instDone(c, mk) && instLeft(c, mk) > 0)
        out.push({ n: c.n, c: c, x: c, p: linePlan(c, mk, c.k), left: instLeft(c, mk), end: c.end });
      (c.subs || []).forEach(function(x){
        if(typeOf(x) === "inst" && !instDone(x, mk) && instLeft(x, mk) > 0)
          out.push({ n: c.n + " · " + x.n, c: c, x: x,
                     p: linePlan(x, mk, lineKey(c.k, x.id)), left: instLeft(x, mk), end: x.end });
      });
    });
    out.sort(function(a, b){ return a.end < b.end ? -1 : (a.end > b.end ? 1 : 0); });
    return out;
  }
  function instMonthly(mk){ var s = 0; allInst(mk).forEach(function(i){ s += i.p; }); return s; }
  function instRemain(mk){ var s = 0; allInst(mk).forEach(function(i){ s += i.p * i.left; }); return s; }
  function instFreeMonth(mk){
    var a = allInst(mk);
    if(!a.length) return null;
    var last = a[a.length - 1].end;
    return shift(last, 1);
  }
  function instBar(i, mk){
    var total = i.x.mo ? num(i.x.mo) : i.left;      /* عدد الأقساط الأصلي إن عُرف */
    if(total < i.left) total = i.left;
    var paid = total - i.left, out = "";
    for(var j = 0; j < total && j < 24; j++)
      out += '<i class="' + (j < paid ? "paid" : "left") + '"></i>';
    return '<div class="instbar">' + out + '</div>';
  }

  /* ── تحليل (المرحلة ٥) ── */
  function monthsWithData(){
    return Object.keys(state.months).filter(function(k){
      return state.months[k].items && state.months[k].items.length;
    }).sort();
  }
  function catHistory(ck, n){
    var keys = monthsWithData().slice(-(n || 6));
    return keys.map(function(k){
      var v = 0;
      state.months[k].items.forEach(function(it){ if(it.c === ck) v += num(it.a); });
      return { k: k, v: v };
    });
  }
  function catAvg(ck, n){
    var h = catHistory(ck, n || 3).filter(function(x){ return x.v > 0; });
    if(!h.length) return 0;
    var s = 0; h.forEach(function(x){ s += x.v; });
    return Math.round(s / h.length);
  }
  function sparkline(ck){
    var h = catHistory(ck, 6);
    if(h.length < 2) return "";
    var mx = 1; h.forEach(function(x){ if(x.v > mx) mx = x.v; });
    var H = 46;
    return '<div class="spark">' + h.map(function(x, i){
      return '<span class="sb"><i class="' + (i === h.length - 1 ? "last" : "") + '" style="height:'
        + Math.max(5, Math.round(x.v / mx * H)) + 'px" title="' + fmt(x.v) + '"></i>'
        + '<em>' + x.k.slice(5) + '</em></span>';
    }).join("") + '</div>';
  }
  function prevDataMonth(mk){
    var keys = monthsWithData(), out = null;
    keys.forEach(function(k){ if(k < mk) out = k; });
    return out;
  }
  function clsTotals(mk){
    var a = actuals(mk), o = { need: 0, want: 0, duty: 0 }, sum = 0;
    state.cats.forEach(function(c){
      var v = a.by[c.k] || 0;
      if(v){ o[clsOf(c)] += v; sum += v; }
    });
    o.sum = sum;
    return o;
  }
  function planByType(mk){
    mk = mk || ui.month;
    var o = { var: 0, fix: 0, seas: 0, inst: 0 };
    state.cats.forEach(function(c){
      if(c.hidden) return;
      var subs = c.subs || [];
      o[typeOf(c)] += subs.length ? catFree(c, mk) : linePlan(c, mk, c.k);
      subs.forEach(function(x){ o[typeOf(x)] += linePlan(x, mk, lineKey(c.k, x.id)); });
    });
    return o;
  }

  /* ── التسجيل التلقائي للثابت والأقساط ── */
  function autoLines(mk){
    var out = [];
    state.cats.forEach(function(c){
      if(c.hidden) return;
      var t = typeOf(c);
      var own = (c.subs || []).length ? catFree(c, mk) : linePlan(c, mk, c.k);
      if((t === "fix" || t === "inst") && own > 0)
        out.push({ c: c, s: null, a: own, n: c.n });
      (c.subs || []).forEach(function(x){
        var t2 = typeOf(x), kk = lineKey(c.k, x.id);
        if((t2 === "fix" || t2 === "inst") && linePlan(x, mk, kk) > 0)
          out.push({ c: c, s: x, a: linePlan(x, mk, kk), n: c.n + " · " + x.n });
      });
    });
    return out;
  }
  function autoDone(mk, ck, sid){
    var m = state.months[mk];
    if(!m) return false;
    for(var i=0;i<m.items.length;i++){
      var it = m.items[i];
      if(it.auto && it.c === ck && (it.s || null) === (sid || null)) return true;
    }
    return false;
  }
  function autoPending(mk){
    return autoLines(mk).filter(function(x){ return !autoDone(mk, x.c.k, x.s ? x.s.id : null); });
  }
  function autoRecord(mk){
    var p = autoPending(mk), m = month(mk), n = 0;
    p.forEach(function(x){
      var rec = { id: uid(), c: x.c.k, a: x.a, t: "سُجّل تلقائياً",
                  d: mk + "-" + pad(autoDay()), auto: true };
      if(x.s) rec.s = x.s.id;
      if(trackSrc() && state.salaryAcct && acctOf(state.salaryAcct)) rec.acct = state.salaryAcct;
      m.items.push(rec); linkSpend(rec); n++;
    });
    return n;
  }
  /* ── طبقات الخطة ──
     التزام: ثابت وأقساط وموسمي — لا تتفاوض عليها هذا الشهر.
     ادخار: بند الاستثمار (والأهداف تُحسب معه خارج الجدول).
     مرن:   ما تبقّى — وهو وحده ما تملك خفضه فعلاً. */
  function layerOf(c, mk){
    if(invCat() && c.k === INVK) return "save";
    mk = mk || ui.month;
    /* بند كـ«أقساط» نوعه متغيّر وفروعه أقساط — فالعبرة
       بموضع المال لا باسم الأب. وهو المنطق نفسه في planByType،
       فيطابق الترشيح مجاميع المراحل حرفاً. */
    var subs = c.subs || [], duty = 0, flex = 0;
    function add(t, v){
      if(t === "fix" || t === "inst" || t === "seas") duty += v; else flex += v;
    }
    add(typeOf(c), subs.length ? catFree(c, mk) : linePlan(c, mk, c.k));
    subs.forEach(function(x){ add(typeOf(x), linePlan(x, mk, lineKey(c.k, x.id))); });
    return duty > flex ? "duty" : "flex";
  }
  var LAYERS = [
    { k: "inc",  n: "دخلك" },
    { k: "duty", n: "ما لا يتفاوض" },
    { k: "save", n: "ادفع لنفسك" },
    { k: "flex", n: "ما تصرفه" }
  ];
  function layerSums(mk){
    /* تُبنى بـ layerOf نفسه الذي يرشّح الجدول، لا بـ planByType — وإلا
       دخل بند «الاستثمار» (نوعه ثابت) في الالتزامات ثم أُضيف ثانيةً في
       الادخار عبر planInv، فانتقص المرن بقدره مرّتين. */
    var duty = 0, flex = 0;
    state.cats.forEach(function(c){
      if(c.hidden) return;
      var L = layerOf(c, mk);
      if(L === "save") return;          /* بند الاستثمار يُحسب في الادخار وحده */
      if(L === "duty") duty += catPlan(c, mk); else flex += catPlan(c, mk);
    });
    return { inc: income(mk), duty: duty, save: planGoals() + planInv(), flex: flex };
  }
  function planExp(){ var s = 0; state.cats.forEach(function(c){ s += catPlan(c); }); return s; }
  function activeGoals(){ return state.goals.filter(function(g){ return !g.arch; }); }
  function planGoals(){ var s = 0; activeGoals().forEach(function(g){ s += goalMonthly(g); }); return s; }
  function planInv(){ return invMonthly(); }
  /* الاستثمار بند داخل planExp \u2014 لا يُجمع مرتين */
  function allocated(){ return planExp() + planGoals() + (invCat() ? 0 : planInv()); }
  function savedTotal(){ var s = 0; state.goals.forEach(function(g){ s += goalSaved(g); }); return s; }
  function investVal(){ var s = 0; state.invest.forEach(function(v){ s += invVal(v); }); return s; }

  /* ── إقفال الشهر: مدخل واحد بوجهين ──
     «بالقيمة» تكتب قيمة المحفظة   → الربح يُشتقّ
     «بالربح»  تكتب ربح الجهة      → القيمة تُشتقّ ثم تُخزَّن
     المخزَّن في الحالتين هو القيمة وحدها. */
  function invEntry(v){ return v.entry === "gain" ? "gain" : "val"; }
  function invClose(v, mk){
    var as = invAccts(v);
    if(as.length > 1)
      return '<div class="ahint" style="padding:8px 0 0">هذه الجهة فيها '
        + as.length + ' محافظ — حدّث كل محفظة من تبويب «الحسابات».</div>';
    var prev = invValAt(v, shift(mk, -1)); if(prev === null) prev = 0;
    var put = invPut(v, mk), now = invValAt(v, mk), mode = invEntry(v);
    var gain = now === null ? null : Math.round(now - prev - put);
    return '<div class="invclose">'
      + '<div class="arow">'
      + '<span class="cl">أقفِل ' + esc(mName(mk).split(" ")[0]) + '</span>'
      + '<span class="chips">'
      + '<button class="chip sm' + (mode === "val" ? " on" : "") + '" data-inmode="' + v.id + '|val">بالقيمة</button>'
      + '<button class="chip sm' + (mode === "gain" ? " on" : "") + '" data-inmode="' + v.id + '|gain">بالربح</button>'
      + '</span>'
      + '<input class="ni w" type="number" inputmode="numeric" data-invclose="' + v.id
      + '" placeholder="' + (mode === "val" ? "القيمة" : "الربح") + '" value="'
      + (mode === "val" ? (now === null ? "" : now) : (gain === null ? "" : gain)) + '">'
      + '</div>'
      + '<div class="calc">'
      + (mode === "val"
          ? 'القيمة − <b>' + fmt(prev) + '</b> السابقة − <b>' + fmt(put) + '</b> أودعتَها'
          : '<b>' + fmt(prev) + '</b> + <b>' + fmt(put) + '</b> + ربحك')
      + (gain === null ? '' :
          ' <span class="sep">·</span> الآن <b class="' + (gain >= 0 ? "up" : "dn") + '">'
          + (gain >= 0 ? "+" : "−") + fmt(Math.abs(gain)) + '</b>')
      + '</div></div>';
  }
  /* مسار القيمة عبر الأشهر — الرقم وحده لا يقول أصاعدٌ أم هابط */
  function invSpark(v){
    var ms = invMonthsOf(v).filter(function(mk){ return invValAt(v, mk) !== null; }).slice(-8);
    if(ms.length < 2) return "";
    var vals = ms.map(function(mk){ return num(invValAt(v, mk)); });
    var mx = 1;
    vals.forEach(function(x){ if(x > mx) mx = x; });
    var H = 34;
    return '<div class="ispark">' + ms.map(function(mk, i){
      var val = vals[i], last = i === ms.length - 1;
      return '<span class="sb"><i class="' + (last ? "last" : "") + '" style="height:'
        + Math.max(3, Math.round(val / mx * H)) + 'px" title="'
        + esc(mName(mk)) + ' · ' + fmt(val) + '"></i>'
        + '<em>' + mk.slice(5) + '</em></span>';
    }).join("") + '</div>';
  }
  function invHist(v){
    var ms = invMonthsOf(v).filter(function(mk){
      return num(invValAt(v, mk)) || invGainOf(v, mk) || invPut(v, mk);
    }).slice(-6);
    if(!ms.length) return "";
    /* السجلّ تفصيلٌ لا يُقرأ كل مرة — يُطوى ويُفتح بطلبه */
    var op = !!ui.invLog[v.id];
    var head = '<button class="logtog' + (op ? " on" : "") + '" data-invlog="' + v.id + '">'
      + (op ? "▾" : "▸") + ' السجلّ · ' + arMonths(ms.length) + '</button>';
    if(!op) return head;
    var rows = ms.map(function(mk){
      var val = invValAt(v, mk), g = invGainOf(v, mk), put = invPut(v, mk);
      var prev = invValAt(v, shift(mk, -1)); if(prev === null) prev = 0;
      var base = prev > 0 ? prev : put;
      return '<tr><td class="cn">' + esc(mName(mk)) + '</td>'
        + '<td class="v">' + fmt(val) + '</td>'
        + '<td class="v z">' + fmt(put) + '</td>'
        + '<td class="v ' + (g >= 0 ? "gp" : "gn") + '">' + (g >= 0 ? "+" : "−") + fmt(Math.abs(g)) + '</td>'
        + '<td class="v">' + (base > 0 ? pctTxt(g / base) : "—") + '</td></tr>';
    }).join("");
    return head + '<div class="ygrid" style="margin-top:10px">'
      + '<table><thead><tr><th class="cn">الشهر</th><th>القيمة</th><th>أودعت</th>'
      + '<th>الربح</th><th>٪</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  /* ══ قياس الاستثمار ══
     مصدر الحقيقة واحد: قيمة المحفظة في كل شهر — لقطة الحساب المربوط،
     أو v.hist للجهة غير المربوطة. الربح مشتقّ لا مخزَّن، فلا يتناقض رقمان.
     وتسجيلك «بالربح» ليس تخزيناً ثانياً — بل مدخل يُحوَّل إلى قيمة قبل الحفظ. */
  function invAccts(v){ return linkedTo("i:" + v.id); }
  function invValAt(v, mk){
    var as = invAccts(v);
    if(as.length){
      var t = 0, any = false;
      as.forEach(function(a){ var sn = snapAt(a, mk); if(sn !== null){ t += sn; any = true; } });
      return any ? t : null;
    }
    var h = v.hist || {}, keys = Object.keys(h).sort(), out = null;
    for(var i=0;i<keys.length;i++){ if(keys[i] <= mk) out = num(h[keys[i]]); else break; }
    return out;
  }
  function invPut(v, mk){ return num(distMap(mk)["i:" + v.id]); }
  function invGainOf(v, mk){
    var now = invValAt(v, mk);
    if(now === null) return null;

  function invMonthsOf(v){
    var set = {}, as = invAccts(v);
    if(as.length) as.forEach(function(a){ var sn = snapOf(a); for(var k in sn) set[k] = 1; });
    else { var h = v.hist || {}; for(var k2 in h) set[k2] = 1; }

  /* عائد مرجَّح بالزمن: يقيس المحفظة لا توقيت إيداعاتك.

     من الشهر فيعمل طوال الشهر مثله مثل الرصيد القديم. */
  function monthFactor(v, mk){

  function investReturn(){                    /* المحفظة كلها */
    var ms = {}, chain = 1, n = 0;

    Object.keys(ms).sort().forEach(function(mk){
      var now = 0, prev = 0, put = 0, any = false;
      state.invest.forEach(function(v){

  function pctTxt(x){ return (x * 100).toFixed(1).replace(/\.0$/, "").replace("-", "−") + "٪"; }
  /* الكتابة: القيمة هي ما يُخزَّن دائماً */

  /* ── المرحلة ٣: نوع الحساب · الأصل مقابل الالتزام ── */
  var KINDS = [
    { k: "bank",   n: "\u062d\u0633\u0627\u0628 \u0628\u0646\u0643\u064a" },
    { k: "wallet", n: "\u0645\u062d\u0641\u0638\u0629" },

  /* ══ الالتزام عقد ══

  function debtLeft(a){ return Math.max(0, Math.abs(num(a.bal))); }

  /* ── المرحلة ١: التحويل \u2014 حركة واحدة بطرفين ── */
  /* رصيد حساب الالتزام يحمل «ما عليك» لا «ما تملك» — فإشارته معكوسة:

  function transferKind(f, t){

  }
  function doTransfer(fromId, toId, amt, note){

  /* ══ رؤية السنة ══ */

  /* كم وضعتَ فعلاً في هذا الهدف هذا الشهر — قد يقلّ عن المخطط */

  var LKINDS = {

  function spentFrom(aid, mk){

  }

  /* ── المرحلة ٥: اللقطة الشهرية ── */
  function snapOf(a){ if(!a.snap) a.snap = {}; return a.snap; }

  /* التسوية: هل يفسّر دخلُك ومصروفُك تغيُّرَ رصيدك؟ */

  function invAssetsAt(mk){

  /* مكسب المحافظ = تغيّر قيمتها ناقص ما ساهمت به */

  function netSpark(){

        + ' title="' + fmt(v) + '"></i><em>' + k.slice(5) + '</em></span>';
    }).join("") + '</div>'
      + '<div class="foot"><span>الأعمدة مقيسة بين <b>' + fmt(lo) + '</b> و<b>' + fmt(hi) + '</b>'
      + ' — لا من الصفر</span><span>'
      + (vals[vals.length-1] - vals[0] >= 0 ? "+" : "−")
      + fmt(Math.abs(vals[vals.length-1] - vals[0])) + ' خلال ' + arMonths(last.length) + '</span></div>';
  }

  /* ── المرحلة ٤: ترشيح القائمة ── */
  function acctQuery(){ return (ui.acctQ || "").trim().toLowerCase(); }
  function acctMatch(a){
    var qy = acctQuery();
    if(!qy) return true;
    return ((a.bank || "") + " " + (a.n || "")).toLowerCase().indexOf(qy) >= 0;
  }
  function acctKeep(a){
    /* لا يُخفى أبداً: المثبَّت \u00b7 حساب الراتب \u00b7 الحساب المفتوح */
    return !!a.pin || state.salaryAcct === a.id || !!ui.openAcct[a.id];
  }
  function acctVisible(a){
    if(!acctMatch(a)) return false;
    if(acctQuery()) return true;                       /* البحث يشمل المؤرشف */
    if(a.arch) return false;
    if(ui.hideZero && num(a.bal) === 0 && !acctKeep(a)) return false;
    return true;
  }
  function pinnedAccts(){ return accts().filter(function(a){ return a.pin && acctVisible(a); }); }
  function archAccts(){ return accts().filter(function(a){ return a.arch && acctMatch(a); }); }
  function hiddenCount(){
    var n = 0;
    accts().forEach(function(a){ if(!acctVisible(a)) n++; });
    return n;
  }

  /* ترتيب عربي للتسمية التلقائية */
  var ORD = ["الأساسي","الثاني","الثالث","الرابع","الخامس","السادس","السابع","الثامن",
             "التاسع","العاشر","الحادي عشر","الثاني عشر"];
  function ordName(base, n){
    return base + " " + (ORD[n] || ("رقم " + (n + 1)));
  }
  /* اسم الحساب التالي داخل جهة \u2014 لا يكرّر اسم الجهة */
  function nextAcctName(bank){
    var n = accts().filter(function(a){ return a.bank === bank; }).length;
    return ordName("الحساب", n);
  }
  function nextWalletName(invId){
    var n = linkedTo("i:" + invId).length;
    return ordName("المحفظة", n);
  }

  function banks(){
    var out = [];
    accts().forEach(function(a){ if(out.indexOf(a.bank) < 0) out.push(a.bank); });
    return out;
  }
  /* البند الذي خُصّص له هذا الحساب — العلاقة مخزَّنة على البند لا على الحساب */
  function catOfAcct(a){
    if(!a) return null;
    var out = null;
    state.cats.forEach(function(c){ if(c.acct === a.id) out = c; });
    return out;
  }
  /* غرض الحساب كما يُعرض: البند يسبق «تشغيلي» لأنه أدقّ منه */
  function acctPurpose(a){
    if(!a) return { t: "تشغيلي", cls: "ops" };
    if(!a.link || a.link === "ops"){
      var c = catOfAcct(a);
      if(c) return { t: c.e + " " + c.n, cls: "cat" };
    }
    return linkLabel(a.link);
  }
  function linkLabel(link){
    if(!link || link === "ops") return { t: "تشغيلي", cls: "ops" };
    var id = link.slice(2), i;
    if(link.charAt(0) === "g"){
      for(i=0;i<state.goals.length;i++) if(state.goals[i].id === id)
        return { t: state.goals[i].n, cls: "goal" };
      return { t: "هدف محذوف", cls: "ops" };
    }
    for(i=0;i<state.invest.length;i++) if(state.invest[i].id === id)
      return { t: state.invest[i].n, cls: "inv" };
    return { t: "جهة محذوفة", cls: "ops" };
  }
  /* المُدَّخر يُشتق من الحسابات المرتبطة إن وُجدت */
  function goalSaved(g){
    var l = linkedTo("g:" + g.id);
    return l.length ? linkedSum("g:" + g.id) : num(g.saved);
  }
  function goalFromAccts(g){ return linkedTo("g:" + g.id).length > 0; }
  function invVal(v){
    var l = linkedTo("i:" + v.id);
    return l.length ? linkedSum("i:" + v.id) : num(v.val);
  }
  function invFromAccts(v){ return linkedTo("i:" + v.id).length > 0; }

  /* ── أنواع الأهداف ──
     fixed   : مبلغ تكتبه بنفسك، ينتهي عند بلوغه
     salary  : مستهدفه = مضاعف الراتب  (يُعاد حسابه إن تغيّر دخلك)
     months  : مستهدفه = مضاعف متوسط مصروفك الشهري
     endless : بلا مستهدف — يقتطع حتى توقفه أنت */
  var GMODES = [
    { k: "fixed",   n: "مبلغ محدَّد" },
    { k: "salary",  n: "مضاعف الراتب" },
    { k: "months",  n: "أشهر من مصروفك" },
    { k: "endless", n: "بلا نهاية" }
  ];
  function gMode(g){ return g && g.mode ? g.mode : "fixed"; }
  function gModeName(k){
    for(var i=0;i<GMODES.length;i++) if(GMODES[i].k === k) return GMODES[i].n;
    return GMODES[0].n;
  }
  /* متوسط مصروفك الشهري الفعلي — وإلا فخطة المصروف */
  /* مصروف المعيشة: بلا أقساط (تنتهي) ولا استثمار (ادخار لا صرف) */
  function livingSpend(mk){
    var m = state.months[mk], t = 0;
    if(!m || !m.items) return 0;
    m.items.forEach(function(it){
      var c = catOf(it.c);
      if(isInvCat(c)) return;
      var line = it.s ? subOf(c, it.s) : c;
      if(typeOf(line || c) === "inst") return;
      t += num(it.a);
    });
    return t;
  }
  function avgSpend(){
    var ks = Object.keys(state.months).filter(function(k){
      return state.months[k].items && state.months[k].items.length;
    }).sort().slice(-3);
    if(!ks.length) return planExp() || baseSalary();
    var t = 0;
    ks.forEach(function(k){ t += livingSpend(k); });
    return Math.round(t / ks.length);
  }
  /* الراتب المعتمد: راتب الشهر المعروض، وإلا الافتراضي، وإلا آخر شهر سُجّل فيه */
  function baseSalary(){
    var o = incObj(ui.month || todayKey());
    if(o.salary > 0) return o.salary;
    if(num(state.income.salary) > 0) return num(state.income.salary);
    var ks = Object.keys(state.months).sort(), last = 0;
    ks.forEach(function(k){
      var m = state.months[k];
      if(m && m.inc && num(m.inc.salary) > 0) last = num(m.inc.salary);
    });
    return last;
  }
  function goalTarget(g){
    var m = gMode(g), mu = num(g.mult) || 1;
    if(m === "endless") return 0;
    if(m === "salary") return Math.round(baseSalary() * mu);
    if(m === "months") return Math.round(avgSpend() * mu);
    return num(g.target);
  }
  function goalWhy(g){
    var m = gMode(g), mu = num(g.mult) || 1;
    if(m === "salary")
      return mu + " × راتبك (" + fmt(baseSalary()) + ") = <b>" + fmt(goalTarget(g)) + "</b>";
    if(m === "months")
      return arMonths(mu) + " × متوسط مصروف معيشتك (" + fmt(avgSpend()) + ") = <b>"
        + fmt(goalTarget(g)) + "</b><br><span style=\"opacity:.75\">بلا أقساط ولا استثمار — "
        + "هذه تنتهي أو تتوقف عند الأزمة</span>";
    if(m === "endless") return "بلا مستهدف — يقتطع كل شهر حتى توقفه بنفسك";
    return "";
  }
  function isDone(g){
    if(gMode(g) === "endless") return false;
    var t = goalTarget(g);
    return t > 0 && goalSaved(g) >= t;
  }
  /* المكتمل يتوقّف اقتطاعه تلقائياً، ويستأنف إن نقص رصيده */
  function goalMonthly(g, mk){
    if(isDone(g)) return 0;
    var m = state.months[mk || ui.month];
    if(m && m.gm && m.gm[g.id] !== undefined) return num(m.gm[g.id]);
    return num(g.m);
  }
  /* ما حُوِّل فعلاً لهذا الهدف في شهر معيّن (من سجلّ التوزيع) */
  function goalMoved(g, mk){
    var m = state.months[mk];
    return (m && m.dist) ? num(m.dist["g:" + g.id]) : 0;
  }
  /* كشف الهدف: ما أُضيف له شهراً بشهر */
  function goalLedger(g, mk, n){
    var keys = Object.keys(state.months).sort().filter(function(k){ return k <= mk; });
    var cum = 0, out = [];
    keys.forEach(function(k){
      var add = goalMoved(g, k);
      cum += add;
      out.push({ k: k, plan: k === mk ? goalMonthly(g) : 0, add: add, cum: cum });
    });
    return out.slice(-(n || 6));
  }
  function goalEta(g){
    if(gMode(g) === "endless") return { done: false, months: null, when: "", endless: true };
    if(isDone(g)) return { done: true, months: 0, when: "" };
    var rem = Math.max(0, goalTarget(g) - goalSaved(g));
    if(num(g.m) <= 0) return { done: false, months: null, when: "" };
    var n = Math.ceil(rem / num(g.m));
    return { done: false, months: n, when: shift(todayKey(), n) };
  }
  function freshDone(){ return state.goals.filter(function(g){ return isDone(g) && !g.arch; }); }

  /* ═══ حفظ ═══ */
  /* ── الحفظ المحلّي: خارج مسار التفاعل ──
     كان يُسلسل الحالة كلها في كل تعديل. والقياس أراه ٥ms من أصل ١٦
     عند عشر سنوات — وهو الشيء الوحيد الذي ينمو مع تاريخك.
     صار يؤجَّل ٤٠٠ms: عشرة حقول تُملأ متتابعةً تُكتب مرّة لا عشراً.
     ويُفرَغ فوراً عند مغادرة الصفحة، فلا يضيع تعديلٌ أخير. */
  var _lsT = null, _lsDirty = false;
  /* سببُ تعذّر الحفظ، إن تعذّر. "" يعني أنّه يعمل. */
  var saveBlocked = "";
  function localWrite(){
    _lsDirty = false;
    try{
      localStorage.setItem(LSKEY, JSON.stringify(state));
      if(saveBlocked === "store"){ saveBlocked = ""; render(); }
    }catch(e){
      /* قد تكون المساحة امتلأت، وقد يكون التخزين ممنوعاً أصلاً.
         الفرق يهمّ المستخدم: الأولى يعالجها، والثانية ليست بيده. */
      var full = /quota|exceed/i.test(String(e && (e.name + " " + e.message)));
      var was = saveBlocked;
      saveBlocked = full ? "full" : "store";
      if(was !== saveBlocked) render();
    }
  }
  /* فحصٌ عند الإقلاع: لا ننتظر أوّل تعديلٍ ليكتشف أن عمله يضيع */
  function storeProbe(){
    try{
      localStorage.setItem("kh_probe", "1");
      if(localStorage.getItem("kh_probe") !== "1") throw new Error("no readback");
      localStorage.removeItem("kh_probe");
    }catch(e){ saveBlocked = "store"; }
  }
  function localSave(){
    _lsDirty = true;
    clearTimeout(_lsT);
    _lsT = setTimeout(localWrite, 400);
  }
  function localFlush(){ if(_lsDirty){ clearTimeout(_lsT); localWrite(); } }
  try{
    window.addEventListener("pagehide", localFlush);
    window.addEventListener("beforeunload", localFlush);
    document.addEventListener("visibilitychange", function(){
      if(document.visibilityState === "hidden") localFlush();
    });
  }catch(e){}
  function countItems(ms){ var n=0; for(var k in ms){ if(ms[k]&&ms[k].items) n += ms[k].items.length; } return n; }
  function localLoad(){
    try{
      var raw = localStorage.getItem(LSKEY); if(!raw) return;
      var d = JSON.parse(raw);
      if(d && d.months && countItems(d.months) > countItems(state.months)){
        state.months = d.months;
        if(d.income) state.income = d.income;
        if(d.goals) state.goals = d.goals;
        if(d.invest) state.invest = d.invest;
        if(d.cats) state.cats = d.cats;
        if(d.accts) state.accts = d.accts;
      }
    }catch(e){}
  }
  function buildDoc(){
    var css = document.getElementById("app-style").textContent;
    var js = document.getElementById("app-script").textContent;
    var json = JSON.stringify(state).replace(/</g, "\\u003c");
    return '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">'
      + '<meta name="viewport" content="width=device-width, initial-scale=1">'
      + '<title>خطتي الشهرية</title>'
      + '<link rel="preconnect" href="https://fonts.googleapis.com">'
      + '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
      + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700'
      + '&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">'
      + '<style id="app-style">' + css + '<' + '/style></head><body><div id="root"></div>'
      + '<script id="app-state" type="application/json">' + json + '<' + '/script>'
      + '<script id="app-script">' + js + '<' + '/script></body></html>';
  }
  var _wasWide = window.innerWidth >= 1180;
  window.addEventListener("resize", function(){
    var wide = window.innerWidth >= 1180;
    if(wide === _wasWide) return;
    _wasWide = wide; render();
  });
  function toast(msg){
    var t = document.getElementById("toast");
    if(!t){ t = document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); }
    t.textContent = msg; t.classList.add("on");
    clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove("on"); }, 1800);
  }
  function save(){
    localSave(); dirty = true;
    cloudQueue();
    try{ sessionStorage.setItem("kh_tab", ui.tab); sessionStorage.setItem("kh_month", ui.month); }catch(e){}
    if(!pubApi) return;
    clearTimeout(pending);
    pending = setTimeout(function(){
      if(!dirty) return;
      dirty = false; toast("جارٍ الحفظ…");
      pubApi.publish(buildDoc()).then(function(){ toast("تم الحفظ"); })
      ["catch"](function(err){
        var c = err && err.code;
        if(c === "conflict") toast("حُفظت نسخة أحدث من جهاز آخر");
        else if(c === "not_granted" || c === "not_writer"){
          /* عرضٌ للقراءة: لو كان التخزين المحلّي يعمل لبقي عمله فيه،
             وإلا فهو يضيع مع كل تحديثٍ للصفحة. شتّان. */
          saveBlocked = (saveBlocked === "store") ? "store" : "readonly";
          render();
        }
        else toast("تعذّر الحفظ — محفوظ على هذا الجهاز");
      });
    }, 2200);
  }


  /* ═══ قائمة اختيار الحساب (مجمَّعة حسب الجهة) ═══ */
  function acctSelect(attr, id, link){
    var A = accts();
    if(!A.length) return '<span class="pill">أضف حساباتك من تبويب «الحسابات»</span>';
    var h = '<select class="sel" ' + attr + '="' + id + '">'
      + '<option value="">— اختر حساباً لإضافته —</option>';
    banks().forEach(function(b){
      h += '<optgroup label="' + esc(b) + '">';
      A.filter(function(a){ return a.bank === b; }).forEach(function(a){
        var busy = a.link !== "ops" && a.link !== link;
        h += '<option value="' + a.id + '">' + esc(a.n)
          + (busy ? " — مرتبط بـ " + esc(linkLabel(a.link).t) : "")
          + " · " + fmt(a.bal) + '</option>';
      });
      h += '</optgroup>';
    });
    return h + '</select>';
  }
  /* قائمة الحساب المرتبط: الحساب الحالي هو الخيار المختار داخلها.
     تُستعمل حين تحمل الجهةَ محفظةٌ واحدة — وهو الحال الطبيعي. */
  function acctSelectOne(attr, id, link){
    var A = accts(), cur = linkedTo(link)[0];
    if(!A.length) return '<span class="pill">أضف حساباتك من تبويب «الحسابات»</span>';
    var h = '<select class="sel" ' + attr + '="' + id + '">'
      + '<option value=""' + (cur ? "" : " selected") + '>— بلا حساب · القيمة تُكتب يدوياً —</option>';
    banks().forEach(function(b){
      h += '<optgroup label="' + esc(b) + '">';
      A.filter(function(a){ return a.bank === b; }).forEach(function(a){
        var mine = cur && a.id === cur.id;
        var busy = !mine && a.link !== "ops" && a.link !== link;
        h += '<option value="' + a.id + '"' + (mine ? " selected" : "") + '>'
          + esc(a.n) + (busy ? " — مرتبط بـ " + esc(linkLabel(a.link).t) : "")
          + " · " + fmt(a.bal) + '</option>';
      });
      h += '</optgroup>';
    });
    return h + '</select>';
  }
  function linkedChips(link, cls, attr){
    var L = linkedTo(link);
    if(!L.length) return "";
    return '<div class="linked">' + L.map(function(a){
      return '<span class="lchip' + (cls ? " " + cls : "") + '">'
        + esc(a.bank) + ' · ' + esc(a.n) + ' · ' + fmt(a.bal)
        + '<button ' + attr + '="' + a.id + '" title="فك الارتباط">×</button></span>';
    }).join("") + '</div>';
  }

  /* ═══ نافذة داخلية — بديل prompt/confirm المحجوبين داخل الإطار ═══ */
  var dlg = null;
  function ask(cfg){ dlg = cfg; render(); }

  /* ── لوحة الأفعال داخل نافذة التعديل ──
     كانت هذه الأزرار مكشوفة في كل صفّ من صفوف الإعدادات — ١٥٦ زراً محتملاً.
     صارت خلف زرّ «تعديل» واحد، والفعل الخطر آخرها ومعزول. */
  function dgroup(label, inner){
    return '<div class="dgrp"><div class="dlab">' + esc(label) + '</div>'
      + '<div class="dbtns">' + inner + '</div></div>';
  }
  function catPanel(k){
    var c = catOf(k); if(!c) return "";
    var i = -1; state.cats.forEach(function(x, ix){ if(x.k === k) i = ix; });
    return dgroup("الترتيب في القوائم",
        '<button class="mini" data-mvcat="' + k + '|-1"' + (i <= 0 ? " disabled" : "") + '>▲ لأعلى</button>'
      + '<button class="mini" data-mvcat="' + k + '|1"'
      + (i < 0 || i >= state.cats.length - 1 ? " disabled" : "") + '>▼ لأسفل</button>')
    + dgroup("الظهور",
        '<button class="mini' + (c.hidden ? " on" : "") + '" data-hidecat="' + k + '">'
      + (c.hidden ? "مخفي الآن — أظهره" : "ظاهر الآن — أخفِه") + '</button>')
    + dgroup("خطر", '<button class="mini bad" data-rmcat="' + k + '">احذف البند نهائياً</button>');
  }
  function editSimple(title, o, fields, delAttr, delId, delLabel){
    ask({ title: title,
      msg: "الاسم يُحفظ بزرّ الحفظ · الحذف يُنفَّذ فوراً.",
      fields: fields,
      html: function(){ return dgroup("خطر",
        '<button class="mini bad" data-' + delAttr + '="' + delId + '">' + esc(delLabel) + '</button>'); },
      ok: "احفظ الاسم",
      onOk: function(v){ fields.forEach(function(f, i){ if(v[i]) o[f.key] = v[i]; }); save(); } });
  }
  function closeDlg(){ dlg = null; render(); }
  function confirmDlg(title, msg, okText, onOk, danger){
    ask({ title: title, msg: msg, fields: [], ok: okText || "تأكيد", danger: !!danger, onOk: onOk });
  }
  function dlgHTML(){
    if(!dlg) return "";
    var f = dlg.fields || [];
    return '<div class="ovl" data-ovl="1"><div class="dlg">'
      + '<h3>' + esc(dlg.title) + '</h3>'
      + (dlg.msg ? '<p class="dmsg">' + dlg.msg + '</p>' : "")
      + '<div class="dlghtml">'
      + (typeof dlg.html === "function"
          ? dlg.html((dlg.fields || []).map(function(x){ return x.value; }))
          : (dlg.html || "")) + '</div>'
      + '<div class="f2grid">'
      + f.map(function(x, i){
          if(x.type === "select")
            return '<div class="f2"><label>' + esc(x.label) + '</label>'
              + '<select id="df' + i + '" class="sel">'
              + (x.options || []).map(function(o){
                  return '<option value="' + esc(o.v) + '"'
                    + (String(o.v) === String(x.value) ? ' selected' : '') + '>' + esc(o.n) + '</option>';
                }).join("")
              + '</select></div>';
          if(x.type === "area")
            return '<div class="f2"><label>' + esc(x.label) + '</label>'
              + '<textarea id="df' + i + '" placeholder="' + esc(x.ph || "") + '">'
              + esc(x.value == null ? "" : x.value) + '</textarea></div>';
          return '<div class="f2"><label>' + esc(x.label) + '</label>'
            + '<input id="df' + i + '" type="' + (x.type || "text") + '"'
            + (x.type === "number" ? ' inputmode="decimal"' : "")
            + ' value="' + esc(x.value == null ? "" : x.value) + '"'
            + ' placeholder="' + esc(x.ph || "") + '"></div>';
        }).join("")
      + '</div>'
      + '<div class="dacts">'
      + (dlg.cancel === false ? ""
          : '<button class="act" data-dcancel="1">' + esc(dlg.cancel || "إلغاء") + '</button>')

  function dlgWire(){
    if(!dlg) return;
    var vals = function(){
      return (dlg.fields || []).map(function(x, i){
        var el = document.getElementById("df" + i);
        return el ? el.value : "";
      });
    };
    var fire = function(){
      var v = vals(), fn = dlg.onOk;
      dlg = null;
      if(fn) fn(v);
      render();
    };
    var ok = document.querySelector("[data-dok]");
    if(ok) ok.onclick = fire;
    var bail = function(){
      var fn2 = dlg && dlg.onCancel;
      dlg = null;
      if(fn2) fn2();
      render();
    };
    var cn = document.querySelector("[data-dcancel]");
    if(cn) cn.onclick = bail;
    var ov = document.querySelector("[data-ovl]");
    /* الإغلاق بالنقر خارج النافذة يفعل ما يفعله زرّ الإلغاء */
    if(ov) ov.onclick = function(e){ if(e.target === ov) bail(); };
    (dlg.fields || []).forEach(function(x, i){
      var el = document.getElementById("df" + i);
      if(!el) return;
      if(x.type !== "area") el.onkeydown = function(e){ if(e.key === "Enter") fire(); };
      /* نافذة حيّة: تُعاد كتلة العرض وحدها فلا يفقد الحقل تركيزه */
      if(dlg.live && typeof dlg.html === "function"){
        el.oninput = function(){
          var box = document.querySelector(".dlghtml");
          if(box) box.innerHTML = dlg.html(vals());
        };
      }
      if(i === 0) setTimeout(function(){ try{ el.focus(); el.select(); }catch(e2){} }, 30);
    });
  }

  function clampSub(c, x){
    var mk = ui.month, cap = catCap(c, mk), others = 0;
    (c.subs || []).forEach(function(y){
      if(y.id !== x.id) others += linePlan(y, mk, lineKey(c.k, y.id));
    });
    var key = lineKey(c.k, x.id), cur = rawP(x, mk, key);
    if(cap <= 0){
      /* لم تُحدَّد ميزانية للبند بعد — نرفع السقف ليسع الفروع بدل تصفيرها */
      if(hasOvr(mk)) setP(mk, c.k, cur + others); else c.p = cur + others;
      return false;
    }
    var room = Math.max(0, cap - others);
    if(cur > room){
      overCapDlg({
        catName: c.n, lineName: x.n, cap: cap, others: others, room: room, want: cur,
        raise: function(){
          if(hasOvr(mk)) setP(mk, c.k, others + cur); else c.p = others + cur;
        },
        clampIt: function(){
          if(hasOvr(mk)) setP(mk, key, room); else x.p = room;
        }
      });
      return true;
    }
    return false;
  }

  function monthSetup(){ var m = month(ui.month); return m.setup; }
  function autoSplit(){
    var out = [];

    visibleCats().forEach(function(c){
      var a = catAcct(c), amt = catPlan(c, ui.month);
      if(a && amt > 0)
        out.push({ kind: "c", id: c.k, n: c.n, a: amt, acct: a });
    });
    activeGoals().forEach(function(g){
      if(goalMonthly(g) > 0) out.push({ kind: "g", id: g.id, n: g.n, a: goalMonthly(g),
                                        acct: linkedTo("g:" + g.id)[0] || null });
    });
    state.invest.forEach(function(v){
      if(num(v.m) > 0) out.push({ kind: "i", id: v.id, n: v.n, a: num(v.m),
                                  acct: linkedTo("i:" + v.id)[0] || null });
    });
    return out;
  }
  /* ── المرحلة ٢: تنفيذ التوزيع ── */
  function salaryAcct(){
    var a = state.salaryAcct ? acctOf(state.salaryAcct) : null;
    if(a) return a;
    var f = null;
    accts().forEach(function(x){ if(!f && x.link === "ops" && !isDebt(x)) f = x; });
    return f;
  }
  function distMap(mk){
    var m = state.months[mk];
    if(!m) return {};
    if(!m.dist) m.dist = {};
    return m.dist;
  }
  function distKey(x){ return x.kind + ":" + x.id; }
  function distDone(mk, x){ return num(distMap(mk)[distKey(x)]) > 0; }
  function distMoved(mk){
    var d = distMap(mk), s2 = 0;
    for(var k in d) s2 += num(d[k]);
    return s2;
  }
  function distPlanned(){
    var s2 = 0;
    autoSplit().forEach(function(x){ s2 += x.a; });
    return s2;
  }
  function runDist(mk){
    var src = salaryAcct();
    if(!src) return { done: 0, miss: 0, nosrc: true };
    var d = distMap(mk), done = 0, miss = 0;
    autoSplit().forEach(function(x){
      var key = distKey(x), already = num(d[key]), rest = x.a - already;
      if(rest <= 0) return;                       /* اكتمل — أو سجّلتَ أكثر منه */
      if(!x.acct){ miss++; return; }
      if(doTransfer(src.id, x.acct.id, rest,
                    "\u062a\u0648\u0632\u064a\u0639 " + mName(mk) + " \u2014 " + x.n)){
        d[key] = x.a;
        done++;
      }
    });
    return { done: done, miss: miss, nosrc: false };
  }
