      + '<li><span><b>الإجمالي</b></span><span class="dv">' + fmt(t) + '</span></li></ul>'
      + '<div class="acts"><button class="act solid" data-wizfix="1">سجّلها الآن</button>'
      + '<button class="act" data-wizfixskip="1">سأسجّلها بنفسي</button></div></div>';
  }

  /* ═══ عناصر مشتركة ═══ */
  /* ── شريط الشهور ──
     يظهر في كل شاشة ما عدا «السنة» (فهي بطبيعتها سنة كاملة).
     الشهر المفتوح مميَّز · الشهور ذات الحركة أوضح · القادمة باهتة. */
  function monthHasData(mk){
    var m = state.months[mk];
    if(!m) return false;
    if(m.items && m.items.length) return true;
    if(m.plan && Object.keys(m.plan).length) return true;
    if(m.dist && Object.keys(m.dist).length) return true;
    return !!(m.inc && (num(m.inc.salary) || num(m.inc.extra)));
  }
  var AR_M3 = ["ينا","فبر","مار","أبر","ماي","يون","يول","أغس","سبت","أكت","نوف","ديس"];
  function stripYear(){
    return ui.stripYear || String(ui.month || todayKey()).slice(0, 4);
  }
  function monthStrip(){
    if(ui.tab === "year") return "";
    var y = stripYear(), now = todayKey(), out = "";
    for(var i = 1; i <= 12; i++){
      var mk = y + "-" + pad(i);
      out += '<button class="ms' + (mk === ui.month ? " on" : "")
           + (monthHasData(mk) ? " has" : "")
           + (mk > now ? " future" : "")
           + '" data-gomonth="' + mk + '" title="' + esc(mName(mk)) + '">'
           + '<i>' + i + '</i><u>' + AR_M[i - 1] + '</u><q>' + AR_M3[i - 1] + '</q></button>';
    }
    return '<div class="mstrip2">'
      + '<button class="msy" data-stripy="-1" title="السنة السابقة">‹</button>'
      + '<span class="msl">' + esc(y) + '</span>'
      + '<button class="msy" data-stripy="1" title="السنة التالية">›</button>'
      + '<div class="msrow">' + out + '</div>'
      + (ui.month === now ? "" : '<button class="mstoday" data-gomonth="' + now + '">اليوم</button>')
      + '</div>';
  }

  /* عنوان الشاشة وسطر حالتها وفعلها الرئيسي */
  function headInfo(){
    var k = ui.month, t = ui.tab || "dash";
    var inc = income(k), sp = actuals(k).sum, left = inc - sp;
    var N = { dash:"اللوحة", rep:"التقارير", year:"السنة", plan:"الخطة", env:"الأظرف",
              spend:"المصروف", accts:"الحسابات", inv:"الاستثمار", set:"الإعدادات" };
    var sub = "";
    if(t === "year"){
      var Y = yearSum(curYear());
      sub = Y.months ? "دخل " + fmt(Y.inc) + " · صُرف " + fmt(Y.exp)
                       + " · " + Y.months + " من ١٢ شهراً" : "لا بيانات بعد";
    } else if(t === "set"){
      sub = "كل تعديل يُحفظ تلقائياً";
    } else if(t === "accts"){
      sub = accts().length + " حساباً · صافي ثروتك " + fmt(assetTotal() - liabTotal(k));
    } else if(t === "inv"){
      sub = "ساهمتَ بـ " + fmt(investIn()) + " · قيمتها " + fmt(investVal());
    } else {
      sub = "صُرف " + fmt(sp) + " من " + fmt(inc)
          + (left >= 0 ? " · بقي " + fmt(left) : " · تجاوزت بـ " + fmt(-left));
    }
    var act = "";
    if(t === "dash" || t === "plan" || t === "env")
      act = '<button class="btnpri" data-tab="spend">+ أضف مصروفاً</button>';
    else if(t === "spend")
      act = '<button class="btnpri" data-tab="plan">راجع الخطة</button>';
    else if(t === "accts" || t === "inv")
      act = '<button class="btnpri" data-tab="dash">اللوحة</button>';
    return { t: N[t] || "اللوحة", s: sub, a: act };
  }
  function topbar(){
    var H = headInfo();
    return '<div class="topbar">'
      + '<div class="htxt"><div class="brand">' + esc(H.t) + '</div>'
      + '<div class="hsub">' + H.s
      + (hijriOn() ? ' <span class="hj">' + esc(hijriOf(null)) + '</span>' : "")
      + '</div></div>'
      + '<div class="tact">'
      + (function(){
          var n = hiddenHere();
          return n ? '<button class="qmark" data-unseen="' + (ui.tab || "dash") + '" title="'
            + esc("أعِد " + n + " شرحاً أخفيتَه في هذه الشاشة") + '">؟</button>' : "";
        })()
      + H.a
      + (ui.tab === "year"
          ? '<div class="mnav"><button data-ynav="-1">‹</button>'
            + '<span class="lbl">' + esc(curYear()) + '</span>'
            + '<button data-ynav="1">›</button></div>'
          : '<div class="mnav"><button data-nav="-1">‹</button>'
            + '<span class="lbl">' + esc(mName(ui.month)) + '</span>'
            + '<button data-nav="1">›</button></div>')
      + '<button class="gear' + (ui.tab === "set" ? " on" : "") + '" data-settab="1" title="الإعدادات">⚙</button>'
      + '</div></div>' + monthStrip();
  }
  function navbar(){
    var tabs = [["dash","🏠","اللوحة"],["rep","📊","التقارير"],["year","📅","السنة"],
                ["plan","🧭","الخطة"],["env","🧧","الأظرف"],["spend","🧾","المصروف"],
                ["accts","🏦","الحسابات"],["inv","📈","الاستثمار"]]
                .filter(function(t){ return tabShown(t[0]); });
    return '<div class="nav"><div class="nav-in">'
      + '<div class="navbrand"><span class="nbm">◈</span><b>خطتي الشهرية</b></div>'
      + tabs.map(function(t){
          return '<button data-tab="' + t[0] + '" class="' + (ui.tab === t[0] ? "on" : "") + '">'
            + '<span class="g">' + t[1] + '</span>' + t[2] + '</button>';
        }).join("") + '</div></div>';
  }
  /* مؤشّر: أيقونة · تسمية · رقم · مقارنة بالشهر الماضي */
  function kpi(icon, tone, lab, val, delta, note){
    return '<div class="kpi"><div class="kl">'
      + '<span class="ki" style="background:var(--' + tone + '-soft);color:var(--' + tone + ')">'
      + icon + '</span>' + esc(lab) + '</div>'
      + '<div class="kv">' + val + '</div>'
      + '<div class="kd">' + (delta || "") + (note ? (delta ? " · " : "") + note : "") + '</div></div>';
  }
  /* فرق النسبة عن الشهر الماضي — «أعلى» ليس دائماً سيئاً، فالاتجاه يُمرَّر */
  function deltaTxt(now, prev, badUp){
    if(!prev) return "";
    var d = now - prev, p = Math.round(d / prev * 100);
    if(!p) return '<b>بلا تغيّر</b> عن الشهر الماضي';
    var bad = badUp ? d > 0 : d < 0;
    return '<b class="' + (bad ? "kup" : "kdn") + '">' + (d > 0 ? "+" : "−")
      + Math.abs(p) + '٪</b> عن ' + fmt(prev);
  }
  /* ما يطلب فعلاً الآن — بترتيب الأهمية */
  function alertList(k){
    var out = [], A = actuals(k), inc = income(k), un = inc - allocated();
    if(un < 0)
      out.push({ i: "!", t: "warn", h: "خطتك تتجاوز دخل الشهر",
        b: "بـ <b>" + fmt(-un) + "</b> ريال. راجع «الخطة» وقلّص بنداً." });
    else if(un > 0)
      out.push({ i: "◔", t: "gold", h: fmt(un) + " " + cur() + " بلا وجهة",
        b: "افتح «الخطة» وأعطِ كل ريال بنداً أو هدفاً." });
    /* بنود تجاوزت ما أُتيح لها */
    var over = [];
    visibleCats().forEach(function(c){
      var av = catPlan(c, k) + carryOf(c, k), sp = A.by[c.k] || 0;
      if(sp > av && av >= 0) over.push({ n: c.n, d: sp - av });
    });
    if(over.length){
      over.sort(function(x, y){ return y.d - x.d; });
      var tot = 0; over.forEach(function(x){ tot += x.d; });
      out.push({ i: "↑", t: "warn",
        h: over.length === 1 ? "بند تجاوز ما أُتيح له"
           : (over.length === 2 ? "بندان تجاوزا ما أُتيح لهما"
              : over.length + " بنود تجاوزت ما أُتيح لها"),
        b: over.slice(0, 3).map(function(x){
             return esc(x.n) + " <b>+" + fmt(x.d) + "</b>"; }).join(" · ")
           + (over.length > 3 ? " …" : "")
           + " — مجموعها <b>" + fmt(tot) + "</b> ريالاً." });
    }
    /* استثمار مخطط ولم يُنفَّذ */
    var pi = planInv();
    if(pi > 0){
      var d = distMap(k), put = 0;
      for(var key in d){ if(key.charAt(0) === "i") put += num(d[key]); }
      if(!put) out.push({ i: "◺", t: "gold", h: "الاستثمار لم يُموَّل هذا الشهر",
        b: "خطتك <b>" + fmt(pi) + "</b> ريال ولم يخرج منها شيء بعد." });
    }
    /* هبوط حادّ في محفظة — غالباً خطأ إدخال */
    state.invest.forEach(function(v){
      var g = invGainOf(v, k), prev = invValAt(v, shift(k, -1));
      if(g === null || prev === null || prev <= 0) return;
      if(g < 0 && Math.abs(g) > prev / 2)
        out.push({ i: "!", t: "warn", h: esc(v.n) + " هبطت هبوطاً حادّاً",
          b: "من <b>" + fmt(prev) + "</b> إلى <b>" + fmt(invValAt(v, k))
             + "</b>. راجع إن كان الرقم قيمة المحفظة أم مبلغ الإيداع." });
    });
    return out;
  }
  function alertPanel(k){
    var L = alertList(k);
    if(!L.length)
      return '<div class="flag ok">لا شيء يحتاج انتباهك — دخلك موزَّع وبنودك داخل خططها.</div>';
    return '<div class="sec"><h2>يحتاج انتباهك</h2><span class="hint">'
      + L.length + '</span></div><div class="card">'
      + L.map(function(x){
          return '<div class="alrt"><span class="ad" style="background:var(--' + x.t
            + '-soft);color:var(--' + x.t + ')">' + x.i + '</span>'
            + '<span class="at"><b>' + x.h + '</b><s>' + x.b + '</s></span></div>';
        }).join("") + '</div>';
  }
  /* أكثر البنود صرفاً هذا الشهر — لتسمية شريط الصرف */
  function topCat(mk){
    var A = actuals(mk), best = null, bv = 0;
    visibleCats().forEach(function(c){
      var v = A.by[c.k] || 0;
      if(v > bv){ bv = v; best = c; }
    });
    return best ? best.n : "—";
  }
  function stat(lab, val, sub, color){
    return '<div class="stat"><div class="lab">' + lab + '</div>'
      + '<div class="v" style="color:' + (color || "var(--ink)") + '">' + val + '</div>'
      + (sub ? '<div class="s">' + sub + '</div>' : '') + '</div>';
  }
  function doneBanner(){
    var d = freshDone();
    if(!d.length) return "";
    return d.map(function(g){
      var freed = num(g.m);
      return '<div class="flag ok">🎉 <b>' + esc(g.n) + '</b> اكتمل — وصلت إلى ' + fmt(goalTarget(g)) + ' ريال.'
        + (freed > 0
            ? '<br>لم يعد يحتاج الـ <b>' + fmt(freed) + '</b> ريال الشهرية. إنهاؤه يعيدها إلى خطتك '
              + 'لتوزّعها على هدف آخر أو على الاستثمار. مدخراتك تبقى كما هي — لا يُحذف منها شيء.'
            : '<br>مدخراته تبقى كما هي — الإنهاء يخرجه من قائمة الأهداف النشطة فقط.')
        + '<div class="acts">'
        + '<button class="act solid" data-arch="' + g.id + '">تم — أنهِ الهدف</button>'
        + '<button class="act" data-raise="' + g.id + '">بل ارفع المستهدف</button>'
        + '</div></div>';
    }).join("");
  }

  /* ═══ ١ · اللوحة ═══ */
  /* آخر الأشهر التي فيها حركة أو دخل مسجَّل */
  function recentMonths(n){
    var now = todayKey();
    return Object.keys(state.months).sort().filter(function(k){
      return k <= now && monthLive(k);
    }).slice(-(n || 6));
  }
  function viewDash(){
    /* تُقطَّع الأقسام إلى أجزاء مسمّاة، وتُجمَع في الترتيب المطلوب عند
       الإرجاع — فالترتيب قرارٌ في سطر واحد لا في مواضع الشيفرة. */
    var PART = {}, _cut = 0;
    function cut(nm){ PART[nm] = h.slice(_cut); _cut = h.length; }
    var k = ui.month, a = actuals(k), inc = income(k);
    var al = allocated(), un = inc - al;
    var spent = a.sum;
    var pct = inc > 0 ? Math.min(1, spent / inc) : 0;
    var h = "";

    var segs = state.cats.map(function(c){
      var v = a.by[c.k] || 0;
      return v ? '<i style="width:' + (a.sum ? v / a.sum * pct * 100 : 0) + '%;background:' + c.c + '"></i>' : "";
    }).join("");

    /* شريط الصرف: يبقى لأنه يُظهر نصيب كل بند — بلا الرقم الضخم */
    h += '<div class="card spendbar"><div class="bar">' + segs + '</div>'
      + '<div class="foot"><span>' + (inc > 0 ? Math.round(spent / inc * 100) + '٪ من دخلك صُرف' : "—")
      + '</span><span>كل لون بند — أعرضها <b>' + esc(topCat(k)) + '</b></span></div></div>';

    cut("spend");

    h += wizard();
    h += wizFixed();
    h += doneBanner();
    cut("act");

    /* ── المؤشرات: كل رقم ومقارنته ── */
    var pk = shift(k, -1), pInc = income(pk), pSpent = actuals(pk).sum;
    var nw = assetTotal() - liabTotal(k);
    h += '<div class="kpis">'
      + kpi("◈", "accent", "دخل الشهر", fmt(inc),
            deltaTxt(inc, pInc, false),
            incObj(k).own ? "مخصص لهذا الشهر" : "من الافتراضي")
      + kpi("↓", "warn", "صُرف", fmt(spent),
            deltaTxt(spent, pSpent, true), "")
      + kpi("◇", "ok", "المتبقي", fmt(inc - spent), "",
            inc > 0 ? Math.round((inc - spent) / inc * 100) + "٪ من دخلك" : "")
      + kpi("▲", "gold", "صافي ثروتك", fmt(nw), "",
            "أصول " + fmt(assetTotal()) + " − التزامات " + fmt(liabTotal(k)))
      + '</div>';
    cut("kpi");

    h += alertPanel(k);
    cut("alert");

    var ag = activeGoals();
    if(ag.length){
      h += '<div class="sec"><h2>أهدافك</h2><span class="hint">المدَّخر من المستهدف</span></div><div class="card">';
      h += ag.map(function(g){
        var tg0 = goalTarget(g), p = tg0 ? Math.min(1, goalSaved(g) / tg0) : 0;
        var e = goalEta(g);
        var sub = e.done ? "✓ مكتمل — بانتظار قرارك" :
          (e.months == null ? "لم تخصّص مبلغاً شهرياً" : "يكتمل تقريباً " + e.when + " · " + fmt(g.m) + " شهرياً");
        return '<div class="row"><span class="ic" style="background:' + g.c + '22;color:' + g.c + '">' + g.e + '</span>'
          + '<span><span class="nm">' + esc(g.n) + '</span><span class="sub">' + esc(sub) + '</span>'
          + '<span class="track"><i style="width:' + (p*100) + '%;background:'
          + (e.done ? "var(--ok)" : g.c) + '"></i></span></span>'
          + '<span class="rt"><span class="a" style="color:' + (e.done ? "var(--ok)" : "var(--ink)") + '">'
          + Math.round(p*100) + '٪</span>'
          + '<span class="b">' + fmt(goalSaved(g)) + (tg0 ? ' / ' + fmt(tg0) : '') + '</span></span></div>';
      }).join("") + '</div>';
    }
    cut("goals");

    var arch = state.goals.filter(function(g){ return g.arch; });
    if(arch.length){
      h += '<div class="sec"><h2>أهداف محقَّقة</h2><span class="hint">' + arch.length + '</span></div><div class="card">';
      h += arch.map(function(g){
        return '<div class="row"><span class="ic" style="background:var(--ok-soft);color:var(--ok)">✓</span>'
          + '<span><span class="nm">' + esc(g.n) + '</span>'
          + '<span class="sub">تحقّق بمبلغ ' + fmt(goalSaved(g)) + ' ريال</span></span>'
          + '<span class="rt"><span class="a" style="color:var(--ok)">100٪</span></span></div>';
      }).join("") + '</div>';
    }

    cut("arch");

    var hasA = accts().length;
    var wealth = hasA ? netWorth(k) : (savedTotal() + investVal());
    var LBk = hasA ? liabTotal(k) : 0;
    var profit = investVal() - investIn();
    var dP = distPlanned(), dM = distMoved(k);
    h += '<div class="sec"><h2>وضعك المالي</h2></div><div class="grid nospan">'
      /* صافي ثروتك مؤشّرٌ في الترويسة — لا يُعاد هنا إلا حين لا حسابات
         لك، فيكون معناه «مجموع ما تملك» لا صافي الأصول. */
      + (hasA ? "" : stat("مجموع ما تملك", fmt(wealth),
             "مدخرات الأهداف + قيمة الاستثمار",
             wealth < 0 ? "var(--warn)" : "var(--ok)"))
      + (dP > 0 ? stat("توزيع هذا الشهر", fmt(dM) + " / " + fmt(dP),
             dM >= dP ? "نُفِّذ بالكامل" : "متبقٍ " + fmt(dP - dM) + " لم تُحوَّل بعد",
             dM >= dP ? "var(--ok)" : "var(--gold)") : "")
      + stat("قيمة استثمارك", fmt(investVal()),
             investIn() ? (profit >= 0 ? "ربح " : "خسارة ") + fmt(Math.abs(profit)) + " من " + fmt(investIn())
                        : "لم تبدأ بعد", "var(--ok)")
      + '</div>';

    cut("net");

    var RC = reconcile(k);
    if(RC && Math.abs(RC.gap) >= 1){
      h += '<div class="flag ' + (RC.gap < 0 ? "bad" : "hint") + '">'
        + (RC.gap < 0
            ? 'رصيدك نقص <b>' + fmt(Math.abs(RC.gap)) + '</b> ريال أكثر مما تفسّره خطتك — مصروف لم تسجّله.'
            : 'رصيدك زاد <b>' + fmt(RC.gap) + '</b> ريال فوق المتوقَّع — دخل لم تسجّله.')
        + '<div class="acts"><button class="act" data-tab="accts">افتح التسوية</button></div></div>';
    }

    cut("recon");

    /* ── كل ما تملك ── */
    if(accts().length){
      var AS2 = assetTotal(), LB2 = liabTotal(k), NW2 = AS2 - LB2;
      var opsA = opsAssets(), gA = 0, iA = 0;
      state.goals.forEach(function(g){ gA += linkedSum("g:" + g.id); });
      state.invest.forEach(function(v){ iA += linkedSum("i:" + v.id); });
      h += '<div class="sec"><h2>كل ما تملك</h2>'
        + '<span class="hint">' + accts().length + ' حساباً في ' + banks().length + ' جهة</span></div>'
        + '<div class="card">'
        + '<div class="own"><span class="ol"><span class="od" style="background:var(--ink-3)"></span>'
        + '<span><span class="on">تشغيلي</span><span class="os">منه تصرف يومياً</span></span></span>'
        + '<span class="ov">' + fmt(opsA) + '</span></div>'
        + '<div class="own"><span class="ol"><span class="od" style="background:var(--ok)"></span>'
        + '<span><span class="on">مدّخر لأهدافك</span><span class="os">'
        + activeGoals().length + ' هدفاً نشطاً</span></span></span>'
        + '<span class="ov" style="color:var(--ok)">' + fmt(gA) + '</span></div>'
        + '<div class="own"><span class="ol"><span class="od" style="background:var(--ok-2)"></span>'
        + '<span><span class="on">في محافظ الاستثمار</span><span class="os">'
        + state.invest.length + ' جهة</span></span></span>'
        + '<span class="ov" style="color:var(--ok)">' + fmt(iA) + '</span></div>'
        + (LB2 ? '<div class="own"><span class="ol"><span class="od" style="background:var(--warn)"></span>'
            + '<span><span class="on">ما عليك</span><span class="os">أقساط والتزامات</span></span></span>'
            + '<span class="ov neg">−' + fmt(LB2) + '</span></div>' : "")
        + '<div class="own tot"><span class="ol"><span class="od" style="background:var(--ink)"></span>'
        + '<span><span class="on">صافي ثروتك</span></span></span>'
        + '<span class="ov' + (NW2 < 0 ? " neg" : "") + '">' + fmt(NW2) + '</span></div>'
        + '</div>';
    }

    cut("own");

    /* ── نتائج الأشهر ── */
    var RM = recentMonths(6);
    if(RM.length){
      var mx2 = 1;
      var rows2 = RM.map(function(mk2){
        var i2 = income(mk2), e2 = actuals(mk2).sum;
        mx2 = Math.max(mx2, i2, e2);
        return { k: mk2, inc: i2, exp: e2, net: i2 - e2 };
      });
      h += '<div class="sec"><h2>نتائج أشهرك</h2>'
        + '<span class="hint">آخر ' + arMonths(rows2.length) + '</span></div><div class="card">'
        + '<div class="ylegend"><span><i style="background:var(--ok)"></i>الدخل</span>'
        + '<span><i style="background:var(--warn)"></i>المصروف</span></div>';
      h += rows2.map(function(r){
        return '<div class="mstrip' + (r.k === k ? " now" : "") + '">'
          + '<span class="mm">' + esc(mName(r.k).replace(" ", "\u00a0")) + '</span>'
          + '<span class="mb">'
          + '<span class="mbar"><i style="width:' + (r.inc / mx2 * 100) + '%;background:var(--ok)"></i></span>'
          + '<span class="mbar"><i style="width:' + (r.exp / mx2 * 100) + '%;background:var(--warn)"></i></span>'
          + '</span>'
          + '<span class="mv2" style="color:' + (r.net < 0 ? "var(--warn)" : "var(--ok)") + '">'
          + (r.net >= 0 ? "+" : "−") + fmt(Math.abs(r.net))
          + '<s>' + fmt(r.inc) + ' / ' + fmt(r.exp) + '</s></span></div>';
      }).join("");
      var tI = 0, tE = 0;
      rows2.forEach(function(r){ tI += r.inc; tE += r.exp; });
      h += '<div class="mstrip" style="background:var(--card-2);border-bottom:0">'
        + '<span class="mm">المجموع</span>'
        + '<span style="font-size:11.5px;color:var(--ink-3)">دخل ' + fmt(tI) + ' · مصروف ' + fmt(tE) + '</span>'
        + '<span class="mv2" style="color:' + (tI - tE < 0 ? "var(--warn)" : "var(--ok)") + '">'
        + (tI - tE >= 0 ? "+" : "−") + fmt(Math.abs(tI - tE)) + '</span></div>';
      h += '</div>';
      h += '<div class="acts"><button class="act" data-tab="year">'
        + 'افتح السنة كاملة</button></div>';
    }

    cut("months");

    /* ── طريقك في الاستثمار ── */
    if(state.invest.length || invCat()){
      var iv = investVal(), ii = investIn(), ipr = iv - ii;
      var im2 = invMonthly(), icap2 = invCat() ? catCap(invCat(), k) : 0;
      h += '<div class="sec"><h2>طريقك في الاستثمار</h2>'
        + '<span class="hint">' + state.invest.length + ' جهة</span></div>'
        + '<div class="card"><div class="invpath">'
        + '<div class="ip"><span>قيمة محافظك اليوم</span><b>' + fmt(iv) + '</b></div>'
        + '<div class="ip"><span>ما ساهمت به إجمالاً</span><b>' + fmt(ii) + '</b></div>'
        + '<div class="ip"><span>' + (ipr >= 0 ? "ربح" : "خسارة") + '</span>'
        + '<b class="' + (ipr >= 0 ? "up" : "dn") + '">' + (ipr >= 0 ? "+" : "−") + fmt(Math.abs(ipr))
        + (ii ? " · " + (ipr / ii * 100).toFixed(1) + "٪" : "") + '</b></div>'
        + '<div class="ip"><span>مساهمتك الشهرية</span><b>' + fmt(im2)
        + (icap2 ? ' <span style="color:var(--ink-3);font-weight:400">من سقف ' + fmt(icap2) + '</span>' : "")
        + '</b></div>'
        + (im2 > 0
            ? '<div class="ip"><span>بهذا المعدل بعد سنة</span><b>' + fmt(iv + im2 * 12) + '</b></div>'
            : '<div class="ip"><span>لم تبدأ بعد</span><b>—</b></div>')
        + '</div>'
        + (im2 > 0
            ? '<div class="hintnote" data-note="n13dadb0" style="margin:0 15px 15px">الرقم أعلاه مساهماتك فقط — '
              + 'بلا افتراض أي عائد. العائد الحقيقي يظهر حين تحدّث قيمة محافظك شهرياً.</div>'
            : "")
        + '</div>';
    }

    cut("inv");

    /* ── أظرف البنود: الحساب الوهمي لكل بند ── */
    var ENV = envelopes(k);
    if(ENV.length){
      var tAv = 0, tSp = 0, tCr = 0;
      ENV.forEach(function(x){ tAv += x.avail; tSp += x.spent; tCr += x.carry; });
      h += '<div class="sec"><h2>حسابات بنودك</h2>'
        + '<span class="hint">رصيد كل بند الآن</span></div><div class="card">';
      /* المكشوفة أولاً — الأشدّ كشفاً فالأقلّ — ثم الأكبر رصيداً */
      var ENVtop = ENV.slice().sort(function(p, q){
        if((p.left < 0) !== (q.left < 0)) return p.left < 0 ? -1 : 1;
        return p.left < 0 ? p.left - q.left : q.left - p.left;
      }).slice(0, 6);
      h += ENVtop.map(function(x){
        var l = x.left;
        return '<div class="env" data-carry="' + x.c.k + '">'
          + '<span class="ei" style="background:' + x.c.c + '22;color:' + x.c.c + '">' + x.c.e + '</span>'
          + '<span><span class="en">' + esc(x.c.n)
          + (x.carry ? ' <span class="carry' + (x.carry < 0 ? " neg" : "") + '">'
              + (x.carry > 0 ? "سابق +" : "سابق −") + fmt(Math.abs(x.carry)) + '</span>' : "")
          + '</span>'
          + '<span class="es">دخل ' + fmt(catPlan(x.c, k)) + ' − صُرف ' + fmt(x.spent) + '</span>'
          + '<span class="track"><i style="width:'
          + (x.avail > 0 ? Math.min(100, x.spent / x.avail * 100) : (x.spent ? 100 : 0))
          + '%;background:' + (x.spent > x.avail ? "var(--warn)" : x.c.c) + '"></i></span></span>'
          + '<span class="ev ' + (l > 0 ? "pos" : (l < 0 ? "neg" : "")) + '">' + fmt(l) + '</span>'
          + '</div>';
      }).join("");
      h += '<div class="env" style="cursor:default">'
        + '<span class="ei" style="background:var(--card-2)">Σ</span>'
        + '<span><span class="en">مجموع الأرصدة'
        + (ENV.length > ENVtop.length
            ? ' <span class="carry">و' + arBand(ENV.length - ENVtop.length) + ' لم تظهر</span>' : "")
        + '</span>'
        + '<span class="es">متاح ' + fmt(tAv) + ' · صُرف ' + fmt(tSp)
        + (tCr ? ' · منه سابق ' + fmt(tCr) : "") + '</span></span>'
        + '<span class="ev ' + (tAv - tSp >= 0 ? "pos" : "neg") + '">' + fmt(tAv - tSp) + '</span></div>';
      h += '</div>';
      h += '<div class="hintnote" data-note="nf2eb3bc">كل بند حساب مستقل: يدخله مبلغ خطته كل شهر، ويخرج منه ما تصرفه، '
        + 'والباقي يبقى فيه. اضغط أي بند لترى كشف حسابه.'
        + '<div class="acts"><button class="act" data-tab="env">افتح حسابات البنود</button></div></div>';
    }

    cut("env");

    var rows = visibleCats().filter(function(c){ return (a.by[c.k]||0) > 0 || effPlan(c, k) > 0; })
      .sort(function(x,y){ return (a.by[y.k]||0) - (a.by[x.k]||0); }).slice(0,6);
    if(rows.length){
      h += '<div class="sec"><h2>المصروف مقابل الخطة</h2><span class="hint">أعلى البنود</span></div><div class="card">';
      h += rows.map(function(c){
        var v = a.by[c.k] || 0, p = effPlan(c, k);
        var w = p ? Math.min(1, v / p) : (v ? 1 : 0);
        var over = p && v > p, near = p && !over && v / p >= nearRatio();
        return '<div class="row"><span class="ic" style="background:' + c.c + '22;color:' + c.c + '">' + c.e + '</span>'
          + '<span><span class="nm">' + esc(c.n) + '</span>'
          + '<span class="sub">' + (p ? "المخطط " + fmt(p) : "بلا خطة")
          + (over ? " · تجاوزت" : (near ? " · اقتربت" : "")) + '</span>'
          + '<span class="track"><i style="width:' + (w*100) + '%;background:'
          + (over ? "var(--warn)" : (near ? "var(--gold)" : c.c)) + '"></i></span></span>'
          + '<span class="rt"><span class="a" style="color:'
          + (over ? "var(--warn)" : (near ? "var(--gold)" : "var(--ink)")) + '">'
          + fmt(v) + '</span><span class="b">' + (p ? Math.round(v/p*100) + '٪' : "—") + '</span></span></div>';
      }).join("") + '</div>';
    }
    cut("plan");

    /* ── التحليل (المرحلة ٥) ── */
    h += viewTrends(k);
    cut("trend");

    /* ══ الترتيب بالأهمية ══
       ما يُطلب منك فعله · أرقامك · ما يحتاج انتباهك · أين ذهب المال ·
       ثم هل أنت على خطتك · ثم أرصدتك وأهدافك · ثم الصورة الأوسع ·
       والأرشيف أخيراً. */
    return ["act","kpi","spend","recon","alert","plan","env",
            "goals","net","own","inv","months","trend","arch"]
      .map(function(nm){ return PART[nm] || ""; }).join("");
  }

  function viewTrends(k){
    var h = "", ct = clsTotals(k);
    if(ct.sum > 0){
      h += '<div class="sec"><h2>تصنيف مصروفك</h2><span class="hint">من الفعلي هذا الشهر</span></div>'
        + '<div class="card p"><div class="clsbar">'
        + CLASSES.map(function(y){
            return ct[y.k] ? '<i style="width:' + (ct[y.k]/ct.sum*100) + '%;background:' + y.c + '"></i>' : "";
          }).join("")
        + '</div><div class="clsleg">'
        + CLASSES.map(function(y){
            return '<span><span class="d" style="background:' + y.c + '"></span>' + y.n + ' '
              + fmt(ct[y.k]) + ' · ' + Math.round(ct[y.k]/ct.sum*100) + '٪</span>';
          }).join("")
        + '</div></div>';
    }

    var prev = prevDataMonth(k);
    if(prev){
      var a1 = actuals(k), a0 = actuals(prev), rows = [];
      state.cats.forEach(function(c){
        var v1 = a1.by[c.k] || 0, v0 = a0.by[c.k] || 0;
        if(v1 || v0) rows.push({ c: c, d: v1 - v0, v1: v1, v0: v0 });
      });
      rows.sort(function(x, y){ return Math.abs(y.d) - Math.abs(x.d); });
      rows = rows.slice(0, 6).filter(function(r){ return r.d !== 0; });
      if(rows.length){
        h += '<div class="sec"><h2>مقابل ' + esc(mName(prev)) + '</h2>'
          + '<span class="hint">أكبر التغيّرات</span></div><div class="card">';
        h += rows.map(function(r){
          return '<div class="cmp"><span class="cn">' + esc(r.c.e + " " + r.c.n) + '</span>'
            + '<span class="cv">' + fmt(r.v0) + ' ← ' + fmt(r.v1) + '</span>'
            + '<span class="cd ' + (r.d > 0 ? "up" : "dn") + '">'
            + (r.d > 0 ? "▲ +" : "▼ ") + fmt(r.d) + '</span></div>';
        }).join("") + '</div>';
      }
    }
    return h;
  }

  /* ═══ ٢ · الخطة ═══ */
  /* مسار الخطة — أربع مراحل، كل واحدة تُغلق برقم «يبقى بعدها» */
  function planSteps(mk){
    var L = layerSums(mk), left = L.inc, cur = ui.planLayer;
    var out = LAYERS.map(function(x, i){
      var amt, rest, sub;
      if(x.k === "inc"){
        amt = L.inc; rest = L.inc;
        sub = "الراتب والدخل الإضافي";
      } else {
        amt = L[x.k]; left -= amt; rest = left;
        sub = x.k === "duty" ? "ثابت وأقساط وموسمي"
            : x.k === "save" ? "أهداف واستثمار"
            : "البنود المرنة";
      }
      /* العلامة للختام وحده: الخطة أُغلقت أم لا — لا على كل مرحلة */
      var shut = x.k === "flex" && Math.abs(rest) < 1;
      var bad  = rest < 0;
      return '<button class="pstep l-' + x.k + (cur === x.k ? " on" : "")
        + (bad ? " bad" : (shut ? " shut" : "")) + '" data-player="' + x.k + '">'
        + '<s class="sn"><i>' + (i + 1) + '</i>' + x.n + (shut ? ' ✓' : "") + '</s>'
        + '<b>' + (x.k === "inc" ? "" : "−") + fmt(amt) + '</b>'
        + '<em>' + (x.k === "flex"
            ? (Math.abs(rest) < 1 ? "موزّع بالكامل"
               : rest > 0 ? "بقي " + fmt(rest) + " بلا وجهة"
                          : "تجاوزت بـ " + fmt(-rest))
            : "يبقى " + fmt(rest)) + '</em>'
        + '<i class="ss">' + esc(sub) + '</i></button>';
    }).join("");
    return '<div class="card psteps nospan">' + out + '</div>';
  }

  /* ── توزيع المتبقّي ──
     bumpTo يضيف مبلغاً إلى وجهة واحدة · spreadOver يوزّع بالتناسب.
     الوجهة نصّ: "c:<مفتاح>" لبند مصروف · "g:<معرّف>" لهدف. */
  /* خطة واحدة لكل الشهور: تُكتب التعديلات في الأساسية لا في الشهر.
     والماضي يبقى محفوظاً في شهره — كتابة رقم اليوم في خطة الأساس تعيد
     كتابة تاريخٍ لم يحدث هكذا، فتفسد تقاريرك. */
  function onePlan(){ return state.onePlan !== false; }
  function planOwn(mk){
    if(onePlan() && !isPast(mk)) return false;
    return hasOvr(mk) || isPast(mk);
  }
  /* كم شهراً يخالف العامّ؟ */
  function ownMonths(){
    var out = [];
    for(var mk in state.months){
      var m = state.months[mk], what = [];
      if(m.inc) what.push("دخل");
      if(m.plan && Object.keys(m.plan).length) what.push("خطة");
      if(m.gm && Object.keys(m.gm).length) what.push("ادخار");
      if(what.length) out.push({ k: mk, w: what });
    }
    out.sort(function(a, b){ return a.k < b.k ? -1 : 1; });
    return out;
  }
  function bumpTo(dest, add, mk){
    add = Math.round(num(add));
    if(!dest || !add) return false;
    mk = mk || ui.month;
    var own = planOwn(mk);
    if(dest.charAt(0) === "c"){
      var ck = dest.slice(2), c = catOf(ck);
      if(!c) return false;
      var cur = own ? rawP(c, mk, ck) : num(c.p);
      var nv = Math.max(subsSum(c, mk), cur + add);
      if(own) setP(mk, ck, nv); else c.p = nv;
      return true;
    }
    var g = null;
    state.goals.forEach(function(x){ if("g:" + x.id === dest) g = x; });
    if(!g) return false;
    var cg = goalMonthly(g, mk), ng = Math.max(0, cg + add);
    if(own){ var m = month(mk); if(!m.gm) m.gm = {}; m.gm[g.id] = ng; }
    else g.m = ng;
    return true;
  }
  /* التوزيع بالتناسب — والكسر للأكبر نصيباً فلا يضيع ريال */
  function spreadOver(list, total, mk){
    total = Math.round(num(total));
    if(!list.length || total <= 0) return 0;
    var base = list.map(function(x){ return Math.max(0, x.w); });
    var sum = 0; base.forEach(function(v){ sum += v; });
    var share = base.map(function(v){
      return sum > 0 ? Math.floor(total * v / sum) : Math.floor(total / list.length);
    });
    var got = 0; share.forEach(function(v){ got += v; });
    var rest = total - got;
    if(rest > 0){
      var bi = 0;
      base.forEach(function(v, i){ if(v > base[bi]) bi = i; });
      share[bi] += rest;
    }
    var done = 0;
    list.forEach(function(x, i){ if(share[i] && bumpTo(x.d, share[i], mk)) done += share[i]; });
    return done;
  }
  function flexTargets(mk){
    var out = [];
    visibleCats().forEach(function(c){
      if(layerOf(c, mk) !== "flex") return;
      if((c.subs || []).length) return;      /* ذو فروع يُوزّع من داخله */
      out.push({ d: "c:" + c.k, n: c.n, w: catPlan(c, mk) });
    });
    return out;
  }
  function goalTargets(mk){
    return activeGoals().map(function(g){
      return { d: "g:" + g.id, n: g.n, w: goalMonthly(g, mk) || 1 };
    });
  }
  function allocDlg(){
    var mk = ui.month, un = income(mk) - allocated();
    if(un <= 0){ toast("لا مبلغ بلا وجهة"); return; }
    var FT = flexTargets(mk), GT = goalTargets(mk);
    var opts = [];
    FT.forEach(function(x){ opts.push({ v: x.d, n: x.n + " · الآن " + fmt(x.w) }); });
    GT.forEach(function(x){ opts.push({ v: x.d, n: x.n + " · هدف · الآن " + fmt(x.w) }); });
    ask({ title: "وزّع " + fmt(un) + " " + cur(),
      msg: "هذا ما لم تُعطِه وجهة بعد في <b>" + esc(mName(mk)) + "</b>.",
      fields: [
        { label: "إلى أين", type: "select", value: opts.length ? opts[0].v : "",
          options: opts },
        { label: "كم", type: "number", value: un }
      ],
      html: function(){
        return dgroup("أو وزّعه دفعة واحدة",
          (FT.length ? '<button class="mini" data-spread="flex">بالتناسب على البنود المرنة</button>' : "")
        + (GT.length ? '<button class="mini" data-spread="goals">بالتناسب على أهدافك</button>' : ""));
      },
      ok: "أضِف",
      onOk: function(v){
        if(bumpTo(v[0], v[1], mk)){ toast("وُزّع " + fmt(num(v[1]))); save(); }
      } });
  }

  /* ── ابْنِ خطتي ── */
  function buildRows(mk){
    var out = [];
    visibleCats().forEach(function(c){
      if(layerOf(c, mk) !== "flex") return;
      if((c.subs || []).length) return;
      var sug = catAvg(c.k, 3);
      if(!sug) return;
      out.push({ k: c.k, n: c.n, e: c.e, c: c.c, now: catPlan(c, mk), sug: sug });
    });
    return out;
  }
  function buildPlanDlg(){
    var mk = ui.month, R = buildRows(mk);
    if(!R.length){
      toast("لا تاريخ صرف كافٍ بعد — سجّل شهراً أو اثنين");
      return;
    }
    var L = layerSums(mk), curFlex = 0, newFlex = 0;
    R.forEach(function(x){ curFlex += x.now; newFlex += x.sug; });
    /* المرن الذي لا مقترح له يبقى كما هو */
    var rest = L.flex - curFlex;
    var after = L.duty + L.save + newFlex + rest;
    var gap = L.inc - after;
    ask({ title: "ابْنِ خطتي من صرفي الفعلي",
      msg: "المقترح متوسط صرفك في آخر ثلاثة أشهر. "
         + "الثابت والأقساط والادخار لا تُمسّ — ليست محلّ تخمين.",
      fields: [],
      html: function(){
        return '<div class="blist">' + R.map(function(x){
          var d = x.sug - x.now;
          return '<div class="brow"><span class="bi" style="background:' + x.c + '22;color:' + x.c + '">'
            + x.e + '</span><span class="bn">' + esc(x.n) + '</span>'
            + '<span class="bv dim">' + fmt(x.now) + '</span>'
            + '<span class="ba">←</span>'
            + '<span class="bv">' + fmt(x.sug) + '</span>'
            + '<span class="bd ' + (d > 0 ? "up" : (d < 0 ? "dn" : "")) + '">'
            + (d > 0 ? "+" : (d < 0 ? "−" : "")) + fmt(Math.abs(d)) + '</span></div>';
        }).join("")
        + '<div class="brow tot"><span class="bi" style="background:var(--card-2)">Σ</span>'
        + '<span class="bn">المرن بعد البناء</span>'
        + '<span class="bv dim">' + fmt(curFlex) + '</span><span class="ba">←</span>'
        + '<span class="bv">' + fmt(newFlex) + '</span><span class="bd"></span></div>'
        + '</div>'
        + '<div class="bsum ' + (gap < 0 ? "bad" : (gap > 0 ? "warn" : "ok")) + '">'
        + 'المخصّص بعد البناء <b>' + fmt(after) + '</b> من دخل <b>' + fmt(L.inc) + '</b> — '
        + (gap === 0 ? "يطابق دخلك تماماً."
           : gap > 0 ? "يبقى <b>" + fmt(gap) + "</b> بلا وجهة توزّعه بعدها."
           : "يتجاوز دخلك بـ <b>" + fmt(-gap) + "</b> — صرفك الفعلي أعلى ممّا يحتمل دخلك.")
        + '</div>';
      },
      ok: "اعتمد المقترح",
      onOk: function(){
        var own = planOwn(mk), n = 0;
        R.forEach(function(x){
          var c = catOf(x.k); if(!c) return;
          if(own) setP(mk, x.k, x.sug); else c.p = x.sug;
          n++;
        });
        toast("بُنيت خطة " + n + " بنداً من صرفك الفعلي");
        save();
      } });
  }

  /* ── قواعدك النسبية ──
     تُولد فارغة عمداً: النظام لا يقترح نسبة، بل يقيس على ما تكتبه.
     t: "L:duty|save|flex" لمرحلة · "C:<مفتاح>" لبند
     op: "min" لا يقلّ عن · "max" لا يتجاوز — pct من دخل الشهر. */
  function rules(){ if(!state.rules) state.rules = []; return state.rules; }
  function ruleName(r){
    if(r.t.charAt(0) === "L"){
      var kk = r.t.slice(2), nm = "";
      LAYERS.forEach(function(x){ if(x.k === kk) nm = x.n; });
      return nm || kk;
    }
    var c = catOf(r.t.slice(2));
    return c ? c.n : "بند محذوف";
  }
  function ruleValue(r, mk){
    if(r.t.charAt(0) === "L"){ var L = layerSums(mk); return num(L[r.t.slice(2)]); }
    var c = catOf(r.t.slice(2));
    return c ? catPlan(c, mk) : 0;
  }
  /* الحكم: { r, val, pct, cap, gap } — gap موجب يعني خالفت */
  function ruleCheck(r, mk){
    var inc = income(mk);
    if(!inc) return null;
    var val = ruleValue(r, mk), pct = val / inc * 100;
    var cap = Math.round(inc * num(r.pct) / 100);
    var gap = r.op === "max" ? val - cap : cap - val;
    return { r: r, val: val, pct: pct, cap: cap, gap: Math.round(gap) };
  }
  function ruleBreaks(mk){
    var out = [];
    rules().forEach(function(r){
      var v = ruleCheck(r, mk);
      if(v && v.gap > 0) out.push(v);
    });
    return out;
  }
  function ruleOfCat(ck){
    var found = null;
    rules().forEach(function(r){ if(r.t === "C:" + ck) found = r; });
    return found;
  }
  function ruleLine(v){
    var r = v.r;
    return esc(ruleName(r)) + " " + (r.op === "max" ? "تجاوز" : "دون")
      + " حدّك: <b>" + fmt(v.val) + "</b> من <b>" + fmt(v.cap) + "</b> ("
      + Math.round(v.pct) + "٪ من " + r.pct + "٪)";
  }
  function addRuleDlg(){
    var opts = [];
    LAYERS.forEach(function(x){
      if(x.k === "inc") return;
      opts.push({ v: "L:" + x.k, n: "مرحلة · " + x.n });
    });
    visibleCats().forEach(function(c){ opts.push({ v: "C:" + c.k, n: "بند · " + c.n }); });
    ask({ title: "قاعدة جديدة",
      msg: "تُقاس من دخل الشهر. النظام لا يقترح رقماً — اكتب حدّك أنت.",
      fields: [
        { label: "على ماذا", type: "select", value: opts.length ? opts[0].v : "", options: opts },
        { label: "الشرط", type: "select", value: "max",
          options: [{ v: "max", n: "لا يتجاوز" }, { v: "min", n: "لا يقلّ عن" }] },
        { label: "النسبة من الدخل ٪", type: "number", value: "" }
      ],
      ok: "أضِف القاعدة",
      onOk: function(v){
        var p = num(v[2]);
        if(!v[0] || p <= 0 || p > 100){ toast("اكتب نسبة بين ١ و١٠٠"); return; }
        rules().push({ id: "r" + Date.now().toString(36), t: v[0], op: v[1], pct: p });
        toast("أُضيفت القاعدة");
        save();
      } });
  }
  function rulesCard(){
    var R = rules(), mk = ui.month;
    var h = '<div class="sec"><h2>قواعدك النسبية</h2>'
      + '<span class="hint">' + (R.length ? R.length + " قاعدة" : "لا قواعد بعد") + '</span></div>'
      + '<div class="card">';
    if(!R.length){
      h += '<div class="empty"><b>لم تضع قاعدة بعد</b>'
        + 'القاعدة حدٌّ تكتبه أنت بالنسبة المئوية من دخلك — مثل «الادخار لا يقلّ '
        + 'عن ٢٠٪» أو «المطاعم لا تتجاوز ١٠٪». النظام لا يقترح رقماً، بل يقيس عليه '
        + 'ويحذّرك حين تخالفه.</div>';
    } else {
      h += R.map(function(r){
        var v = ruleCheck(r, mk), br = v && v.gap > 0;
        return '<div class="rrow' + (br ? " bad" : "") + '">'
          + '<span class="rn"><b>' + esc(ruleName(r)) + '</b>'
          + '<s>' + (r.op === "max" ? "لا يتجاوز" : "لا يقلّ عن") + " " + r.pct + '٪ من الدخل'
          + (v ? " · الآن " + Math.round(v.pct) + "٪" : "") + '</s></span>'
          + '<span class="rv">' + (v ? fmt(v.val) + " / " + fmt(v.cap) : "—") + '</span>'
          + '<button class="del" data-rmrule="' + r.id + '" title="احذف">×</button></div>';
      }).join("");
    }
    h += '</div>';
    h += '<div class="acts"><button class="addbtn sm" data-addrule="1">+ أضف قاعدة</button></div>';
    return h;
  }

  /* ── ماذا لو تغيّر دخلي ──
     الالتزامات والادخار لا تتغيّر — التزامٌ وقرار. والمرن وحده يتمدّد
     أو ينكمش بالنسبة، فهو الوحيد الذي تملك خفضه فعلاً. */
  function whatIfRows(mk){
    var out = [];
    visibleCats().forEach(function(c){
      if(layerOf(c, mk) !== "flex") return;
      if((c.subs || []).length) return;
      out.push({ k: c.k, n: c.n, e: c.e, c: c.c, now: catPlan(c, mk) });
    });
    return out;
  }
  function whatIfDlg(){
    var mk = ui.month, cur = income(mk), L = layerSums(mk);
    var R = whatIfRows(mk), base = 0;
    R.forEach(function(x){ base += x.now; });
    ask({ title: "ماذا لو تغيّر دخلي",
      msg: "جرّب دخلاً آخر وانظر أثره قبل أن تلتزم به. "
         + "الالتزامات والادخار لا تتغيّر — المرن وحده يتمدّد أو ينكمش.",
      live: true,
      fields: [{ label: "الدخل المفترض", type: "number", value: cur }],
      html: function(v){
        var inc2 = num(v && v[0]);
        if(inc2 <= 0) return '<div class="wsum bad">اكتب دخلاً أكبر من صفر.</div>';
        var room = inc2 - L.duty - L.save;
        if(room < 0){
          return '<div class="wsum bad">بدخل <b>' + fmt(inc2) + '</b> لا يكفيك شيء للمعيشة: '
            + 'التزاماتك <b>' + fmt(L.duty) + '</b> وادخارك <b>' + fmt(L.save) + '</b> '
            + 'يتجاوزان الدخل بـ <b>' + fmt(-room) + '</b>. '
            + 'خفّض الادخار أو أنهِ قسطاً قبل أن تفكّر في المرن.</div>';
        }
        var f = base > 0 ? room / base : 0;
        var pctTxt2 = Math.round((f - 1) * 100);
        var head = '<div class="wsum ' + (inc2 >= cur ? "ok" : "bad") + '">'
          + 'يبقى للمعيشة <b>' + fmt(room) + '</b> بدل <b>' + fmt(base) + '</b> — '
          + (base > 0
              ? 'كل بند مرن ' + (pctTxt2 >= 0 ? "يتّسع" : "ينكمش") + ' بـ <b>'
                + Math.abs(pctTxt2) + '٪</b>.'
              : 'لا بنود مرنة لتوزيعه عليها.')
          + '</div>';
        return head + '<div class="blist">' + R.map(function(x){
          var nv = Math.round(x.now * f), d = nv - x.now;
          return '<div class="brow"><span class="bi" style="background:' + x.c + '22;color:' + x.c + '">'
            + x.e + '</span><span class="bn">' + esc(x.n) + '</span>'
            + '<span class="bv dim">' + fmt(x.now) + '</span><span class="ba">←</span>'
            + '<span class="bv">' + fmt(nv) + '</span>'
            + '<span class="bd ' + (d > 0 ? "dn" : (d < 0 ? "up" : "")) + '">'
            + (d > 0 ? "+" : (d < 0 ? "−" : "")) + fmt(Math.abs(d)) + '</span></div>';
        }).join("") + '</div>';
      },
      ok: "طبّقه على " + mName(mk),
      onOk: function(v){
        var inc2 = num(v[0]);
        if(inc2 <= 0){ toast("اكتب دخلاً أكبر من صفر"); return; }
        var room = inc2 - L.duty - L.save;
        if(room < 0){ toast("الدخل لا يكفي التزاماتك وادخارك — لم يُطبَّق"); return; }
        var f = base > 0 ? room / base : 0;
        var m = month(mk), o = incObj(mk);
        m.inc = { salary: inc2 - o.extra, extra: o.extra };
        if(m.inc.salary < 0){ m.inc = { salary: inc2, extra: 0 }; }
        var own = planOwn(mk);
        R.forEach(function(x){
          var c = catOf(x.k); if(!c) return;
          var nv = Math.max(subsSum(c, mk), Math.round(x.now * f));
          if(own) setP(mk, x.k, nv); else c.p = nv;
        });
        toast("طُبِّق سيناريو دخل " + fmt(inc2));
        save();
      } });
  }

  /* ── مصنِّف البنود ──
     يُقترح من الاسم أولاً لأنه أدقّ من النوع: «صدقات» ثابتٌ لكنه التزام،
     و«اشتراكات» ثابتٌ لكنه كمالي. فإن لم يُعرف الاسم رجعنا إلى النوع. */
  var CLS_HINTS = [
    { c: "need", w: ["بقال", "سوبر", "تموين", "فاتور", "كهرب", "ماء", "جوال", "إنترنت",
                     "اتصال", "إيجار", "سكن", "بنزين", "وقود", "مواصل", "نقل",
                     "صحة", "علاج", "دواء", "طب", "تعليم", "مدرس", "جامع", "رسوم"] },
    { c: "want", w: ["مطعم", "مطاعم", "قهوة", "كافي", "شخصي", "ترفيه", "لعب", "هداي",
                     "عائل", "اشتراك", "سفر", "رحل", "ملابس", "تسوق", "حلوي", "دخان"] },
    { c: "duty", w: ["قسط", "أقساط", "دين", "قرض", "تمويل", "صدق", "زكا", "وقف",
                     "استثمار", "ادخار", "تأمين", "ضريب"] }
  ];
  function clsSuggest(c){
    if(c.cls) return c.cls;                       /* ما صنّفتَه لا يُمسّ */
    if(invCat() && c.k === INVK) return "duty";
    var n = String(c.n || "");
    for(var i = 0; i < CLS_HINTS.length; i++){
      var h = CLS_HINTS[i];
      for(var j = 0; j < h.w.length; j++){
        if(n.indexOf(h.w[j]) >= 0) return h.c;
      }
    }
    var t = typeOf(c);
    if(t === "inst") return "duty";
    if(t === "fix") return "need";
    return "want";
  }
  function clsCount(){
    var n = 0;
    visibleCats().forEach(function(c){ if(!c.cls) n++; });
    return n;
  }
  var clsDraft = null;
  function classifyDlg(){
    var CS = visibleCats();
    if(!CS.length){ toast("لا بنود بعد"); return; }
    clsDraft = {};
    CS.forEach(function(c){ clsDraft[c.k] = clsSuggest(c); });
    ask({ title: "صنّف بنودك",
      msg: "الاقتراح مُعبّأ من اسم كل بند ونوعه — بدّل ما تخالفني فيه بضغطة، "
         + "ثم اعتمد. بلا هذا لا يستطيع التقرير أن يقول كم من راتبك ذهب "
         + "لما لا غنى عنه.",
      fields: [],
      live: false,
      html: function(){
        var pick = clsDraft || {};
        return '<div class="clist">' + CS.map(function(c){
          return '<div class="crow"><span class="ci" style="background:' + c.c
            + '22;color:' + c.c + '">' + c.e + '</span>'
            + '<span class="cn">' + esc(c.n)
            + '<s>' + fmt(catPlan(c, ui.month)) + ' شهرياً</s></span>'
            + '<span class="cb">' + CLASSES.map(function(y){
                return '<button class="chip sm' + (pick[c.k] === y.k ? " on" : "")
                  + '" data-clsset="' + c.k + '|' + y.k + '"'
                  + (pick[c.k] === y.k ? ' style="border-color:' + y.c
                      + ';color:' + y.c
                      + ';background:color-mix(in srgb,' + y.c + ' 13%,transparent)"' : "")
                  + '>' + y.n + '</button>';
              }).join("") + '</span></div>';
        }).join("") + '</div>';
      },
      ok: "اعتمد التصنيف",
      onOk: function(){
        var n = 0;
        visibleCats().forEach(function(c){
          if(clsDraft && clsDraft[c.k] && c.cls !== clsDraft[c.k]){ c.cls = clsDraft[c.k]; n++; }
          else if(clsDraft && clsDraft[c.k]) c.cls = clsDraft[c.k];
        });
        clsDraft = null;
        toast(n ? "صُنّف " + n + " بنداً" : "لا تغيير");
        save();
      },
      onCancel: function(){ clsDraft = null; } });
  }

  /* ═══ التنويهات التي تُغلق ═══
     الشرح يُقرأ مرة. المفتاح بصمةُ نصّه، فإن تغيّر النصّ عاد الشرح
     ليُقرأ — القاعدة الأولى تتحقّق بلا رقم نسخةٍ يُنسى رفعه.
     ولا يُغلق إلا الشرح والحاشية: اللافتة وحالة الفراغ وشريط القفل
     تصف حالةً الآن، وإخفاؤها إخفاء حقيقة. */
  var NOTES = {};
  function seenMap(){ if(!state.seen) state.seen = {}; return state.seen; }
  function applyNotes(){
    var tab = ui.tab || "dash", S = seenMap();
    Array.prototype.slice.call(document.querySelectorAll("[data-note]")).forEach(function(el){
      var k = el.getAttribute("data-note");
      NOTES[k] = tab;
      if(S[k]){ if(el.parentNode) el.parentNode.removeChild(el); return; }
      if(el.querySelector(".nx")) return;
      var b = document.createElement("button");
      b.className = "nx";
      b.setAttribute("data-seen", k);
      b.setAttribute("title", "\u0641\u0647\u0645\u062a \u2014 \u0644\u0627 \u062a\u064f\u0638\u0647\u0650\u0631\u0647 \u062b\u0627\u0646\u064a\u0629");
      b.textContent = "\u2715";
      el.insertBefore(b, el.firstChild);
      el.classList.add("dsm");
    });
  }
  function hiddenNotes(tab){
    var n = 0, S = seenMap();
    for(var k in S){ if(S[k] && (!tab || NOTES[k] === tab)) n++; }
    return n;
  }
  function hiddenHere(){
    var n = 0, S = seenMap(), tab = ui.tab || "dash";
    for(var k in NOTES){ if(NOTES[k] === tab && S[k]) n++; }
    return n;
  }

  /* ═══ التقارير ═══ */
  /* الأشهر التي فيها حركة فعلاً، منتهيةً بالشهر المعروض */
  function repMonths(){
    var out = [], k = ui.month, n = num(ui.repN) || 6;
    for(var i = 0; i < 36 && out.length < n; i++){
      var mk = shift(k, -i);
      var m = state.months[mk];
      if(m && m.items && m.items.length) out.push(mk);
      if(mk < "2000-01") break;
    }
    return out.reverse();
  }
  /* الطبقة الفعلية لبند من صرفه — لا من خطته */
  function repTotals(MS){
    var T = { inc: 0, spent: 0, duty: 0, flex: 0, saveMoved: 0, savePlan: 0,
              byCat: {}, months: MS.length };
    MS.forEach(function(mk){
      T.inc += income(mk);
      var a = actuals(mk);
      T.spent += a.sum;
      state.cats.forEach(function(c){
        var v = a.by[c.k] || 0;
        if(!v) return;
        T.byCat[c.k] = (T.byCat[c.k] || 0) + v;
        if(invCat() && c.k === INVK) return;      /* الاستثمار يُعدّ ادخاراً */
        if(layerOf(c, mk) === "duty") T.duty += v; else T.flex += v;
      });
      T.savePlan += planGoals() + planInv();
      var d = state.months[mk] && state.months[mk].dist;
      if(d) for(var key in d){
        if(key.charAt(0) === "g" || key.charAt(0) === "i") T.saveMoved += num(d[key]);
      }
    });
    return T;
  }
  /* دقّة الخطة: لكل بند، انحرافه عن خطته شهراً بشهر */
  function repAccuracy(MS){
    var out = [];
    visibleCats().forEach(function(c){
      /* مال الاستثمار توزيعٌ لا مصروف — مقارنته بخطته هنا تقارن صفراً
         بألف، ومكانه محور الادخار. */
      if(invCat() && c.k === INVK) return;
      var n = 0, sumPlan = 0, sumAct = 0, absDev = 0, over = 0, under = 0;
      MS.forEach(function(mk){
        var p = catPlan(c, mk), v = actuals(mk).by[c.k] || 0;
        if(!p && !v) return;
        n++; sumPlan += p; sumAct += v;
        absDev += Math.abs(v - p);
        if(v > p) over++; else if(v < p) under++;
      });
      if(!n || sumPlan <= 0) return;      /* لا خطة تُقاس عليها */
      out.push({ c: c, n: n, plan: sumPlan, act: sumAct,
                 dev: absDev / sumPlan, bias: (sumAct - sumPlan) / sumPlan,
                 over: over, under: under });
    });
    out.sort(function(a, b){ return b.dev - a.dev; });
    return out;
  }
  function repBar(pct, color){
    return '<span class="rbar"><i style="width:' + Math.max(0, Math.min(100, pct))
      + '%;background:' + color + '"></i></span>';
  }
  function viewRep(){
    var MS = repMonths(), h = "";
    var PICKS = [3, 6, 12];
    h += '<div class="card repbar nospan"><span class="rl">الفترة</span>'
      + PICKS.map(function(n){
          return '<button class="chip sm' + (num(ui.repN) === n ? " on" : "")
            + '" data-repn="' + n + '">آخر ' + arMonths(n) + '</button>';
        }).join("")
      + '<span class="rh">' + (MS.length
          ? esc(mName(MS[0])) + " ← " + esc(mName(MS[MS.length - 1])) + " · "
            + arMonths(MS.length) + " فيها حركة"
          : "لا أشهر فيها حركة بعد") + '</span></div>';

    if(!MS.length){
      h += '<div class="card"><div class="empty"><b>لا بيانات للتقرير</b>'
        + 'سجّل مصروف شهر واحد على الأقل، ثم عد إلى هنا.</div></div>';
      return h;
    }

    var T = repTotals(MS), left = T.inc - T.spent;
    var per = function(v){ return T.inc > 0 ? Math.round(v / T.inc * 100) : 0; };

    /* ── مؤشّرات الفترة ── */
    h += '<div class="kpis">'
      + kpi("◈", "accent", "دخلك في الفترة", fmt(T.inc), "",
            fmt(Math.round(T.inc / MS.length)) + " شهرياً في المتوسط")
      + kpi("↓", "warn", "ما صرفته", fmt(T.spent), "",
            per(T.spent) + "٪ من دخلك · " + fmt(Math.round(T.spent / MS.length)) + " شهرياً")
      + kpi("▲", "ok", "ما ادّخرته فعلاً", fmt(T.saveMoved), "",
            per(T.saveMoved) + "٪ من دخلك")
      + kpi(left < 0 ? "!" : "◇", left < 0 ? "warn" : "gold",
            left < 0 ? "صرفت فوق دخلك" : "لم يُصرف", fmt(Math.abs(left)), "",
            left < 0 ? "الفرق من رصيد سابق" : per(left) + "٪ بقي في حسابك")
      + '</div>';

    /* ── ١ · مسار الريال ── */
    var FLOW = [
      { n: "التزامات ثابتة وأقساط", v: T.duty, c: "var(--warn)",
        s: "فواتير وأقساط وما لا يتفاوض" },
      { n: "معيشة مرنة", v: T.flex, c: "var(--ink-2)", s: "ما تملك خفضه" },
      { n: "ادخار وصل فعلاً", v: T.saveMoved, c: "var(--ok)", s: "أهداف واستثمار" },
      { n: left >= 0 ? "بقي بلا صرف" : "صُرف من رصيد سابق", v: Math.abs(left),
        c: "var(--line-2)", s: left >= 0 ? "لم يخرج من حسابك" : "أنفقت فوق دخل الفترة" }
    ];
    h += '<div class="sec"><h2>مسار الريال</h2>'
      + '<span class="hint">من ' + fmt(T.inc) + ' إلى أين انتهت</span></div><div class="card">';
    h += '<div class="flowbar">' + FLOW.map(function(x){
      return x.v > 0 ? '<i style="flex:' + x.v + ';background:' + x.c + '" title="'
        + esc(x.n) + '"></i>' : "";
    }).join("") + '</div>';
    h += FLOW.map(function(x){
      return '<div class="frow"><span class="fd" style="background:' + x.c + '"></span>'
        + '<span class="fn"><b>' + esc(x.n) + '</b><s>' + esc(x.s) + '</s></span>'
        + '<span class="fv">' + fmt(x.v) + '<s>' + per(x.v) + '٪</s></span></div>';
    }).join("") + '</div>';

    /* ── البنود التي تلتهم أكبر نصيب ── */
    var TOP = [];
    for(var ck in T.byCat){
      var c2 = catOf(ck);
      if(c2) TOP.push({ c: c2, v: T.byCat[ck] });
    }
    TOP.sort(function(a, b){ return b.v - a.v; });
    var mx = TOP.length ? TOP[0].v : 1;
    h += '<div class="sec"><h2>أين يذهب راتبك</h2>'
      + '<span class="hint">' + TOP.length + ' بنداً · مرتّبة بالنصيب</span></div><div class="card">';
    h += TOP.map(function(x){
      var cl = clsOf(x.c), CO = null;
      CLASSES.forEach(function(y){ if(y.k === cl) CO = y; });
      return '<div class="trow"><span class="ti" style="background:' + x.c.c
        + '22;color:' + x.c.c + '">' + x.c.e + '</span>'
        + '<span class="tn"><b>' + esc(x.c.n) + '</b>'
        + (CO ? '<span class="tc" style="color:' + CO.c
            + ';background:color-mix(in srgb,' + CO.c + ' 13%,transparent)">'

        + repBar(x.v / mx * 100, x.c.c) + '</span>'

    /* ── التصنيف: احتياج · كمالي · التزام ── */
    /* الشارة والملخّص يقرآن clsOf نفسه — وإلا تناقض رقمان في شاشة واحدة.
       و«غير مؤكَّد» يعدّ ما يقوم على افتراض لم تؤكّده، لا ما لا تصنيف له. */
    var CT = {}, unsure = 0;

    h += '<div class="flowbar">' + CLASSES.map(function(y){
      return CT[y.k] > 0 ? '<i style="flex:' + CT[y.k] + ';background:' + y.c + '"></i>' : "";
    }).join("") + '</div>';
    h += CLASSES.map(function(y){
      return '<div class="frow"><span class="fd" style="background:' + y.c + '"></span>'
        + '<span class="fn"><b>' + esc(y.n) + '</b></span>'
        + '<span class="fv">' + fmt(CT[y.k] || 0) + '<s>' + per(CT[y.k] || 0) + '٪ من دخلك</s></span></div>';
    }).join("") + '</div>';

    /* ── ٢ · دقّة خطتك ── */
    var AC = repAccuracy(MS);
    h += '<div class="sec"><h2>دقّة خطتك</h2>'
      + '<span class="hint">الخطة مقابل الواقع في ' + arMonths(MS.length) + '</span></div>'
      + '<div class="card">';
    if(!AC.length){
      h += '<div class="empty">لا خطة سابقة تُقارن بها بعد.</div>';
    } else {
      h += AC.map(function(x){
        var b = Math.round(x.bias * 100), d = Math.round(x.dev * 100);
        var verdict = Math.abs(b) < 8 ? "تقديرك دقيق"
          : (b > 0 ? "تصرف فوق خطتك دائماً" : "تبالغ في تقديره");
        return '<div class="arow"><span class="ai" style="background:' + x.c.c
          + '22;color:' + x.c.c + '">' + x.c.e + '</span>'
          + '<span class="an"><b>' + esc(x.c.n) + '</b>'

          + '<s>خطة ' + fmt(x.plan) + ' · فعلي ' + fmt(x.act) + '</s></span></div>';
      }).join("");
      var worst = AC[0];
      h += '<div class="yhint" data-note="ne45cdcf" style="border-bottom:0"><b>الأبعد عن خطته:</b> '
        + esc(worst.c.n) + ' — ينحرف ' + Math.round(worst.dev * 100)
        + '٪ عن المخطط في المتوسط. البند الذي يتذبذب هكذا لا يُخطَّط له برقم '
        + 'ثابت؛ ارفع خطته إلى متوسط صرفك الفعلي، أو قسّمه فروعاً.</div>';
    }
    h += '</div>';

    /* ── ٣ · ادخارك الحقيقي والتسريب ── */
    h += '<div class="sec"><h2>ادخارك الحقيقي</h2>'
      + '<span class="hint">المخطط مقابل ما وصل</span></div><div class="card">';
    h += MS.map(function(mk){
      var d = state.months[mk] && state.months[mk].dist, mv = 0;
      if(d) for(var key in d){
        if(key.charAt(0) === "g" || key.charAt(0) === "i") mv += num(d[key]);
      }
      var inc = income(mk), rate = inc > 0 ? Math.round(mv / inc * 100) : 0;
      return '<div class="srow"><span class="sm">' + esc(mName(mk)) + '</span>'
        + repBar(rate * 3, mv > 0 ? "var(--ok)" : "var(--line-2)")
        + '<span class="sv">' + fmt(mv) + '<s>' + rate + '٪ من ' + fmt(inc) + '</s></span></div>';
    }).join("");
    var rateAll = T.inc > 0 ? Math.round(T.saveMoved / T.inc * 100) : 0;
    h += '<div class="srow tot"><span class="sm">المتوسط</span>'
      + repBar(rateAll * 3, "var(--ok)")
      + '<span class="sv">' + fmt(Math.round(T.saveMoved / MS.length))
      + '<s>' + rateAll + '٪ من دخلك</s></span></div></div>';

    /* التسريب */

    MS.forEach(function(mk){
      var R = reconcile(mk);
      if(R && Math.abs(R.gap) >= 1){ LEAK.push({ k: mk, g: R.gap }); leakSum += R.gap; }
    });
    h += '<div class="sec"><h2>الفرق غير المفسَّر</h2>'
      + '<span class="hint">' + (LEAK.length ? LEAK.length + " شهراً" : "لا فروق") + '</span></div>'
      + '<div class="card">';
    if(!LEAK.length){
      h += '<div class="empty"><b>لا فرق غير مفسَّر</b>'
        + 'إمّا أن أرصدتك تطابق خطتك في كل شهر، أو أنك لم تحفظ لقطات أرصدة '
        + 'لهذه الأشهر — والتسوية تحتاج لقطة أول الشهر وآخره.</div>';
    } else {
      h += LEAK.map(function(x){
        return '<div class="srow"><span class="sm">' + esc(mName(x.k)) + '</span>'
          + '<span class="sn2">' + (x.g < 0 ? "نقص رصيدك أكثر مما تفسّره خطتك"
                                            : "زاد رصيدك فوق المتوقَّع") + '</span>'
          + '<span class="sv ' + (x.g < 0 ? "neg" : "") + '">'
          + (x.g > 0 ? "+" : "−") + fmt(Math.abs(x.g)) + '</span></div>';
      }).join("");
      h += '<div class="yhint" data-note="n7c3c42b" style="border-bottom:0">مجموع الفروق <b>'
        + (leakSum >= 0 ? "+" : "−") + fmt(Math.abs(leakSum)) + '</b> ريال على '
        + arMonths(MS.length) + '. الفرق السالب مصروف لم تسجّله، والموجب دخل لم تسجّله '
        + '— كلاهما يُصلَح من تبويب الحسابات.</div>';
    }
    h += '</div>';
    return h;
  }

    h += '<div class="card">';

          + '<span class="qv' + (left > 0 ? "" : " dim") + '">' + fmt(left) + '</span></div>';

      h += '<div class="qtab foot"><span class="qn">'

        + '<span class="qv">' + fmt(IT - IP) + '</span></div></div>';
      h += '<div class="hintnote" data-note="ne55eff0">الإيداع يُسجَّل هنا، و<b>قيمة</b> المحفظة تُحدَّث من تبويب '
        + 'الاستثمار عند إقفال الشهر — فالإيداع ما دفعتَه، والقيمة ما صار إليه.'
        + '<div class="acts"><button class="act" data-tab="inv">افتح الاستثمار</button></div></div>';
    }

    h += '<div class="hintnote" data-note="nd24b159">عمود <b>الخطة</b> يُحرَّر هنا كما يُحرَّر في شاشة الخطة — '
      + 'التعديل يخصّ هذا الشهر إن كانت له خطة خاصة، وإلا فخطتك الأساسية.<br>'
      + 'وعمود <b>صُرف</b> إجمالي ما صرفته في البند هذا الشهر. ما سجّلته عمليةً بعملية يبقى '
      + 'كما هو، والفرق وحده يُضاف كعملية «إدخال سريع»، والبنود ذات الحساب المخصَّص '
      + 'يُخصم منها تلقائياً.</div>';
    return h;
  }

  /* ═══ ٣ · المصروف ═══ */
  function viewSpend(){
    var k = ui.month, m = month(k), a = actuals(k);
    var h = "";

    var pSubs = picked && picked.subs ? picked.subs : [];

    h += '<div class="modesw">'

      h += '<div class="flag ok">آخر عملية حُفظت في <b>' + esc(mName(ui.jumpTo))

    h += '<div class="card p"><h3 style="font-size:14px;font-weight:600;color:var(--ink-2);margin-bottom:11px">أضف مصروفاً</h3>'

      + '<button id="go" class="go">إضافة</button></div>'

          return '<button class="chip' + (ui.cat === c.k ? " on" : "") + '" data-pick="' + c.k + '">'
            + '<span class="dot" style="background:' + c.c + '"></span>' + esc(c.n) + '</button>';
        }).join("") + '</div>';

    if(pSubs.length){
      h += '<div class="subpick"><div class="lab">أي بند فرعي داخل ' + esc(picked.n) + '؟</div><div class="chips">'

        + pSubs.map(function(x){
            return '<button class="chip sm' + (ui.sub === x.id ? " on" : "") + '" data-picksub="' + x.id + '">'

    }

    if(trackSrc() && accts().length){
      var cA = ui.cat ? catOf(ui.cat).acct : "";
      var defA = (cA && acctOf(cA)) ? cA : (ui.spendAcct || state.salaryAcct || "");
      h += '<div class="srcpick"><div class="lab">من أي حساب دُفع؟ <span style="color:var(--ink-3)">'
        + (cA && acctOf(cA) ? "— حساب «" + esc(catOf(ui.cat).n) + "» المخصَّص" : "— يُخصم منه تلقائياً")
        + '</span></div>'
        + '<select class="sel" id="srcacct">'
        + acctPickOptions().map(function(o){
            return '<option value="' + esc(o.v) + '"' + (o.v === defA ? " selected" : "") + '>'
              + esc(o.n) + '</option>';
          }).join("")
        + '</select></div>';
    }
    h += '<input id="note" class="note" placeholder="ملاحظة (اختياري)"></div>';

    var pend = autoPending(k);
    if(pend.length){
      var pt2 = 0; pend.forEach(function(x){ pt2 += x.a; });
      h += '<div class="autobar">⟳ <span><b>' + pend.length + '</b> بنداً ثابتاً لم يُسجَّل بعد ('
        + fmt(pt2) + ' ريال)</span>'

    var maxV = 0; visibleCats().forEach(function(c){ maxV = Math.max(maxV, a.by[c.k]||0, effPlan(c, k)); });
    h += '<div class="sec"><h2>الفعلي مقابل المخطط</h2><span class="hint">اضغط البند لترى عملياته</span></div><div class="card">';
    h += visibleCats().map(function(c){
      var v = a.by[c.k]||0, cry = carryOf(c, k), p = catPlan(c, k) + cry;
      var open = !!ui.open[c.k], subs = c.subs || [];
      var ratio = p ? v / p : 0;
      var over = p && v > p, near = p && !over && ratio >= nearRatio();
      var col = over ? "var(--warn)" : (near ? "var(--gold)" : c.c);
      var s = '<div class="row tap' + (v ? "" : " zero") + '" data-open="' + c.k + '">'
        + '<span class="ic" style="background:' + c.c + '22;color:' + c.c + '">' + c.e + '</span>'
        + '<span><span class="nm">' + esc(c.n) + (subs.length ? "" : typePill(c, k))
        + '<span class="chev">' + (open ? "▾" : "▸") + '</span></span>'
        + '<span class="sub">من أصل ' + fmt(p)
        + (cry ? ' <span class="carry' + (cry < 0 ? " neg" : "") + '">مرحّل ' + fmt(cry) + '</span>' : "")
        + (over ? " · تجاوزت بـ " + fmt(v-p) : (near ? " · اقتربت من الحد" : "")) + '</span>'
        + '<span class="track"><i style="width:' + (maxV ? Math.min(100, v/maxV*100) : 0) + '%;background:'
        + col + '"></i></span></span>'
        + '<span class="rt"><span class="a" style="color:'
        + (over ? "var(--warn)" : (near ? "var(--gold)" : "var(--ink)")) + '">' + fmt(v) + '</span>'
        + '<span class="b">' + (p ? Math.round(ratio*100) + '٪' : "—") + '</span></span></div>';
      if(open){
        s += '<div class="subs">';
        if(subs.length){
          s += subs.map(function(x){
            var sv = a.bySub[x.id] || 0, sp = linePlan(x, k, lineKey(c.k, x.id));
            return '<div class="subrow"><span class="tick" style="background:' + c.c + ';opacity:.3"></span>'
              + '<span class="sn">' + esc(x.n) + '</span>'
              + '<span class="sv" style="color:' + (sp && sv > sp ? "var(--warn)" : "var(--ink-3)") + '">'
              + fmt(sv) + ' / ' + fmt(sp) + '</span>'
              + '<span style="width:28px"></span></div>';
          }).join("");
        }
        var sp2 = sparkline(c.k);
        if(sp2) s += '<div class="subrow" style="display:block;padding-top:11px;padding-bottom:13px">'
          + '<div class="sn" style="color:var(--ink-3);font-size:12px;margin-bottom:2px">اتجاه آخر '
          + catHistory(c.k, 6).length + ' أشهر</div>' + sp2 + '</div>';
        var ops = m.items.filter(function(it){ return it.c === c.k; }).slice().reverse();
        if(ops.length){
          s += ops.map(function(it){
            var sx = it.s ? subOf(c, it.s) : null;
            return '<div class="item tap" data-edit="' + it.id + '">'
              + '<span class="d" style="background:' + c.c + '"></span>'
              + '<span class="t"><b>' + (sx ? esc(sx.n) : esc(c.n)) + '</b>'
              + (it.auto ? '<span class="au">تلقائي</span>' : "")
              + '<s>' + esc(it.t || it.d) + '</s></span>'
              + '<span class="a">' + fmt(it.a) + '</span>'
              + '<button class="del" data-del="' + it.id + '">×</button></div>';
          }).join("");
        } else {
          s += '<div class="empty" style="padding:14px">لا عمليات في هذا البند هذا الشهر</div>';
        }
        s += '</div>';
      }
      return s;
    }).join("") + '</div>';

    h += '<div class="sec"><h2>العمليات</h2><span class="hint">' + m.items.length + ' هذا الشهر</span></div><div class="card">';
    if(!m.items.length){
      h += '<div class="empty"><b>لا يوجد شيء بعد</b>اكتب المبلغ فوق واختر التصنيف.<br>واضغط أي عملية لتعديلها.</div>';
    } else {
      h += m.items.slice().reverse().map(function(it){
        var c = catOf(it.c), sx = it.s ? subOf(c, it.s) : null;
        return '<div class="item tap" data-edit="' + it.id + '">'
          + '<span class="d" style="background:' + c.c + '"></span>'
          + '<span class="t"><b>' + esc(c.n) + (sx ? ' · ' + esc(sx.n) : "") + '</b>'
          + (it.auto ? '<span class="au">تلقائي</span>' : "")
          + '<s>' + esc(it.t || it.d) + '</s></span>'
          + '<span class="a">' + fmt(it.a) + '</span>'
          + '<button class="del" data-del="' + it.id + '">×</button></div>';
      }).join("");
    }
    h += '</div>';

    var keys = Object.keys(state.months).filter(function(x){ return actuals(x).sum > 0; }).sort().slice(-6);
    if(keys.length > 1){
      var mx = Math.max.apply(null, keys.map(function(x){ return actuals(x).sum; }));
      h += '<div class="sec"><h2>الأشهر السابقة</h2></div><div class="card" style="padding:6px 15px">'
        + keys.reverse().map(function(x){
            var s2 = actuals(x).sum;
            return '<div class="row" style="grid-template-columns:62px minmax(0,1fr) 76px;padding:9px 0">'
              + '<span class="mono" style="font-size:12.5px;color:var(--ink-3)">' + x + '</span>'
              + '<span class="track" style="margin:0"><i style="width:' + (s2/mx*100) + '%;background:'
              + (x === k ? "var(--accent)" : "var(--line-2)") + '"></i></span>'
              + '<span class="rt"><span class="a" style="font-size:13.5px">' + fmt(s2) + '</span></span></div>';
          }).join("") + '</div>';
    }
    return h;
  }

  /* ═══ ٤ · الاستثمار ═══ */
  function viewInv(){
    var auto = state.invest.filter(function(v){ return v.kind === "auto"; });
    var self = state.invest.filter(function(v){ return v.kind === "self"; });
    var sum = function(arr, f){ var s=0; arr.forEach(function(x){ s += num(x[f]); }); return s; };
    var sumVal = function(arr){ var s=0; arr.forEach(function(x){ s += invVal(x); }); return s; };
    var h = "";
    var PART = {}, _cut = 0;
    function cut(nm){ PART[nm] = h.slice(_cut); _cut = h.length; }

    var RR = investReturn(), GG = invGain(ui.month);   /* خمسة مؤشّرات: صفٌّ واحد */
    var dm = distMap(ui.month), putI = 0;
    for(var ky in dm){ if(ky.charAt(0) === "i") putI += num(dm[ky]); }
    var unfunded = Math.max(0, planInv() - putI);
    h += '<div class="kpis k5">'
      + kpi("◺", "accent", "قيمة محافظك", fmt(investVal()), "",
            "ساهمت بـ " + fmt(investIn()) + " · " + fmt(planInv()) + " شهرياً · "
            + state.invest.length + " جهة")
      + kpi("%", RR.n && RR.r < 0 ? "warn" : "ok", "أداء محافظك",
            RR.n ? (RR.r >= 0 ? "+" : "−") + pctTxt(Math.abs(RR.r)) : "—", "",
            RR.n ? "خلال " + arMonths(RR.n) : "لا لقطات بعد")
      + kpi(GG >= 0 ? "↑" : "↓", GG >= 0 ? "ok" : "warn", "ربح " + esc(mName(ui.month)),
            (GG > 0 ? "+" : GG < 0 ? "−" : "") + fmt(Math.abs(GG)), "",
            "القيمة − السابقة − ما أودعت")
      + kpi("Σ", investIn() && investVal() >= investIn() ? "ok" : "warn", "على مساهماتك",
            investIn() ? pctTxt((investVal() - investIn()) / investIn()) : "—", "",
            "قيمتها اليوم مقابل ما دفعت")
      + kpi(unfunded ? "◔" : "✓", unfunded ? "gold" : "ok",
            unfunded ? "لم يُموَّل" : "مُموَّل بالكامل",
            unfunded ? fmt(unfunded) : fmt(putI), "",
            unfunded ? "خطة الشهر لم تُنفَّذ بعد" : "خطة الشهر نُفّذت")
      + '</div>';

    cut("kpi");

    /* التصنيف ملخّصٌ يسبق التفصيل — وكان أسفل الصفحة بعد زرّ الإضافة */
    h += '<div class="sec"><h2>نوعا استثمارك</h2>'
      + '<span class="hint">آليّ يُدار عنك · ذاتيّ تديره</span></div>'
      + '<div class="grid nospan">'
      + stat("آليّ", fmt(sumVal(auto)),
             fmt(sum(auto,"m")) + " شهرياً · " + auto.length + " جهة", "var(--ok-2)")
      + stat("ذاتيّ", fmt(sumVal(self)),
             fmt(sum(self,"m")) + " شهرياً · " + self.length + " جهة", "var(--ink-2)")
      + '</div>';

    cut("split");

    h += '<div class="hintnote" data-note="n497ed1e"><b>جهة الاستثمار</b> ليست حساباً — هي التطبيق أو الشركة '
      + '(أبيان، ملاءة، الراجحي المالية) وما تخطّط أن تساهم به فيها شهرياً.<br>'
      + '<b>الحساب</b> هو الوعاء الذي يحمل المال فعلاً. كل جهة لها حساب واحد أو أكثر من نوع «محفظة»، '
      + 'وقيمة الجهة = مجموع أرصدة حساباتها. تجدها كلها في تبويب «الحسابات» وتدخل في صافي ثروتك.</div>'
      + '<div class="hintnote" data-note="n7ef773c">القاعدة: أكمل صندوق الطوارئ أولاً، ولا تضع مال هدف قريب المدى (كالزواج) في محفظة متقلبة. '
      + 'الاستثمار يضاعف رأس مال قائماً — لا يبنيه.</div>';

    cut("edu");

    var IC = invCat();
    if(IC){
      var icap = catCap(IC, ui.month), iused = invMonthly(), iover = Math.max(0, iused - icap);
      h += '<div class="sec"><h2>سقف الاستثمار الشهري</h2>'
        + '<span class="hint">من بند «استثمار» في الخطة</span></div><div class="card">'
        + '<div class="capline" style="border-bottom:0"><span>موزّع على المحافظ <b>' + fmt(iused)
        + '</b> من <b>' + fmt(icap) + '</b></span>'
        + '<span class="fill"><i style="width:' + (icap ? Math.min(100, iused / icap * 100) : 100)
        + '%;background:' + (iover ? "var(--warn)" : "var(--ok-2)") + '"></i></span>'
        + (iover ? '<span class="capwarn">تجاوزت بـ ' + fmt(iover) + '</span>'
                 : '<span>متبقٍ <b>' + fmt(Math.max(0, icap - iused)) + '</b></span>') + '</div>'
        + '<div class="arow" style="padding:0 15px 12px"><span class="al">السقف</span>'
        + '<input class="ni s" type="number" inputmode="numeric" data-plan="' + INVK + '" value="'
        + rawP(IC, ui.month, INVK) + '">'
        + '<span class="ahint" style="padding:0">هذا كل ما تسمح لنفسك باستثماره شهرياً — '
        + 'مجموع المحافظ لا يتجاوزه.</span></div></div>';
    }
    cut("cap");

    h += '<div class="sec"><h2>محافظك</h2><span class="hint">حدّث القيمة شهرياً</span></div>';
    h += state.invest.map(function(v){
      var pr = invVal(v) - num(v["in"]);
      var ret = num(v["in"]) ? pr / num(v["in"]) : 0;
      var RV = invReturn(v);
      var many = invAccts(v).length > 1, open = !!ui.openInv[v.id], a1 = invAccts(v)[0];
      /* المعروض دائماً: الاسم · الأداء · حساب الحفظ · إقفال الشهر · السجلّ
         وخلف «تعديل»: المبالغ والربط والحذف — لا يُعدَّل شيء بالخطأ. */
      /* لم تبدأ بعد: لا قيمة ولا إيداع ولا خطة — صفٌّ يكفيها */
      if(!invVal(v) && !num(v["in"]) && !num(v.m) && !open){
        return '<div class="card invcard idle"><div class="ihead">'
          + '<span class="ic" style="background:var(--card-2);color:var(--ink-3)">'
          + (v.kind === "auto" ? "🤖" : "📊") + '</span>'
          + '<span class="it"><b>' + esc(v.n) + '</b><s>لم تبدأ بعد — لا قيمة ولا إيداع</s></span>'
          + '<button class="mini" data-invedit="' + v.id + '">افتحها</button>'
          + '</div></div>';
      }
      return '<div class="card invcard"><div class="ihead">'
        + '<span class="ic" style="background:var(--ok-soft);color:var(--ok)">'
        + (v.kind==="auto" ? "🤖" : "📊") + '</span>'
        + '<span class="it"><b>' + esc(v.n) + '</b><s>'
        + (RV.n ? "أداء " + (RV.r>=0?"+":"−") + pctTxt(Math.abs(RV.r))
                  + " خلال " + arMonths(RV.n) : "لم تُقفل شهراً بعد")
        + '</s></span>'
        + '<button class="mini' + (open ? " on" : "") + '" data-invedit="' + v.id + '">'
        + (open ? "تمّ" : "تعديل") + '</button></div>'
        /* ثلاثة أرقام: الأسئلة التي تفتح البطاقة لأجلها */
        + '<div class="ires">'
        + '<span class="rq"><s>قيمتها اليوم</s><b>' + fmt(invVal(v)) + '</b></span>'
        + '<span class="rq"><s>ما ساهمتَ به</s><b class="dim">' + fmt(num(v["in"])) + '</b></span>'
        + '<span class="rq"><s>الربح</s><b class="' + (pr >= 0 ? "up" : "dn") + '">'
        + (num(v["in"]) ? (pr>=0?"+":"−") + fmt(Math.abs(pr)) : "—") + '</b>'
        + (num(v["in"]) ? '<em>' + pctTxt(ret) + '</em>' : "") + '</span>'
        + '</div>'
        + invSpark(v)
        + '<div class="ibody">'
        + invClose(v, ui.month)
        + invHist(v)
        + (open
            ? '<div class="iedit"><div class="lab">حساب الحفظ</div>'
              + (many
                  ? acctSelect("data-isel", v.id, "i:" + v.id)
                    + linkedChips("i:" + v.id, "inv", "data-iunlink")
                  : acctSelectOne("data-ipick", v.id, "i:" + v.id))
              + '<div class="lab" style="margin-top:12px">إعدادات الجهة</div><div class="fields">'
              + '<div class="f"><label>شهرياً</label><input class="ni" type="number" inputmode="numeric" data-inv="' + v.id + '|m" value="' + num(v.m) + '"></div>'
              + '<div class="f"><label>إجمالي ما ساهمت</label><input class="ni w" type="number" inputmode="numeric" data-inv="' + v.id + '|in" value="' + num(v["in"]) + '"></div>'
              + (invFromAccts(v) ? ""
                  : '<div class="f"><label>القيمة الحالية</label>'
                    + '<input class="ni w" type="number" inputmode="numeric" data-inv="' + v.id + '|val" value="' + num(v.val) + '"></div>')
              + '</div>'
              + '<div class="abtns">'
              + '<button class="mini" data-kind="' + v.id + '">' + (v.kind==="auto" ? "🤖 آلي" : "📊 ذاتي") + '</button>'
              + '<button class="mini" data-addwallet="' + v.id + '">+ محفظة أخرى</button>'
              + '<button class="mini bad" data-delinv="' + v.id + '" style="margin-inline-start:auto">احذف الجهة</button>'
              + '</div></div>'
            : "")
        + '</div></div>';
    }).join("");
    h += '<button class="addbtn" data-addinv="1">+ أضف جهة استثمار</button>';
    h += '<div class="hintnote spanall" data-note="n80324d6">«تعديل» يفتح إعدادات الجهة — المبالغ والربط والحذف. '
      + 'وحقل الإقفال يبقى مفتوحاً دائماً لأنه عمل كل شهر.</div>';
    cut("port");

    /* الأرقام · السقف · المحافظ · تصنيفها · ثم الشرح */
    /* الملخّصان (النوعان والسقف) قبل التفصيل (المحافظ)، والشرح أخيراً */
    return ["kpi","split","cap","port","edu"]
      .map(function(nm){ return PART[nm] || ""; }).join("");
  }

  /* ═══ ٥ · الحسابات المصرفية ═══ */
  /* ── المرحلة ٤: صفّ الحساب (مُعاد استعماله في كل القوائم) ── */
  function acctRow(a){

            + '<div class="arow"><span class="al">الغرض</span><div class="chips">'
            + '<button class="chip sm' + (a.link === "ops" && !catOfAcct(a) ? " on" : "")
            + '" data-alink="' + a.id + '|ops">تشغيلي</button>'

              }).join("")
            + state.goals.map(function(g){
                return '<button class="chip sm' + (a.link === "g:" + g.id ? " on" : "") + '" data-alink="'
                  + a.id + '|g:' + g.id + '">' + g.e + ' ' + esc(g.n) + '</button>';
              }).join("")
            + state.invest.map(function(v){
                return '<button class="chip sm' + (a.link === "i:" + v.id ? " on" : "") + '" data-alink="'
                  + a.id + '|i:' + v.id + '">' + (v.kind === "auto" ? "🤖" : "📊") + ' ' + esc(v.n) + '</button>';

            + '</div></div>'
            + '<div class="ahint">«تشغيلي» = مال المصروف اليومي بلا تخصيص. '
            + 'واختيار <b>بند</b> يجعل هذا الحساب وعاءه: يُموَّل بمبلغ خطته أول الشهر ويُخصم منه صرفه — '
            + 'والمال يبقى مالك التشغيلي. أمّا <b>الهدف</b> أو <b>المحفظة</b> فيغيّران ملكية المال نفسه: '
            + 'يصير رصيد هذا الحساب هو مُدَّخر ذلك الهدف أو قيمة تلك المحفظة.</div>')
            + '<div class="arow"><span class="al">النوع</span><div class="chips">'

            + '<button class="out" data-mv="' + a.id + '|out">− سحب</button>'
            + '<button class="tr" data-tr="' + a.id + '">↔ تحويل</button></div>'

  /* هل تفسّر حركاتُ الحساب رصيدَه؟ */
  function balanceProof(a){
    var gap = ledgerGap(a), n = logRows(a).length;
    if(!n && !num(a.open)) return "";
    return '<div class="proof' + (gap ? " bad" : "") + '">'
      + '<span class="pk">' + (gap ? "فجوة" : "متّزن") + '</span>'
      + '<span class="pt">افتتاحي <b>' + fmt(openBal(a)) + '</b>'
      + ' ' + (ledgerSum(a) < 0 ? "−" : "+") + ' حركات <b>' + fmt(Math.abs(ledgerSum(a))) + '</b>'
      + ' = <b>' + fmt(ledgerBal(a)) + '</b>'
      + (gap ? ' · الرصيد <b>' + fmt(a.bal) + '</b> — فرق <b class="g">' + fmt(gap) + '</b>' : "")
      + '</span></div>';
  }

  /* الجهة الاستثمارية التي يحملها هذا الحساب — إن كان وحده يحملها */
  function invOfAcct(a){
    var k = String(a.link || "");
    if(k.charAt(0) !== "i") return null;
    var id = k.slice(2), out = null;
    state.invest.forEach(function(v){ if(v.id === id) out = v; });
    if(!out || invAccts(out).length !== 1) return null;   /* عدة محافظ: لا نسب الربح لواحدة */
    return out;
  }
  /* صفوف السجلّ = الحركات المخزَّنة + الأرباح المشتقّة من اللقطات.
     الربح ليس حركة نقدية، فلا يُخزَّن ولا يُحرّك رصيداً — يُحسب لحظة العرض. */
  function logRows(a){
    var L = acctLog(a).slice();
    var v = invOfAcct(a);
    if(v) invMonthsOf(v).forEach(function(mk){
      var g = invGainOf(v, mk);
      if(!g) return;
      L.push({ id: "d" + mk, a: Math.abs(g), kind: g > 0 ? "gain" : "loss",
               t: "إقفال " + mName(mk), d: mk + "-28" });
    });
    return L;
  }

  /* ══ الميزان: هل يفسّر الدفترُ الرصيدَ؟ ══
     إشارة كل قيد من نوعه — تصلح للأصل وللالتزام معاً، لأن رصيد
     الالتزام يحمل «ما عليك» فيزيده الاقتراض ويُنقصه السداد. */
  function entryDelta(x){
    var k = x.kind, v = num(x.a);
    return (k === "in" || k === "gain" || k === "borrow" || k === "adjup") ? v : -v;
  }
  function ledgerSum(a){
    var t = 0;
    logRows(a).forEach(function(x){ t += entryDelta(x); });
    return t;
  }
  function openBal(a){ return num(a.open); }
  function ledgerBal(a){ return Math.round(openBal(a) + ledgerSum(a)); }
  function ledgerGap(a){ return Math.round(num(a.bal) - ledgerBal(a)); }
  /* يُختم الرصيد الافتتاحي مرة واحدة لكل حساب: الدفتر يتّزن من يومه */
  function stampOpen(a){
    if(a.open === undefined) a.open = Math.round(num(a.bal) - ledgerSum(a));
    return a;
  }
  /* قيد تسوية: التغيير اليدوي صار حركة لها سبب */
  function adjustBal(a, to, note){
    var d = Math.round(num(to) - num(a.bal));
    if(!d) return false;
    acctLog(a).push({ id: uid(), a: Math.abs(d), kind: d > 0 ? "adjup" : "adjdn",
                      t: note || "تسوية يدوية", d: new Date().toISOString().slice(0, 10) });
    a.bal = num(to);
    stampSnap(a);
    return true;
  }

  /* سجلّ حركة الحساب — أحدث أولاً */
  function logPanel(a){
    var L = logRows(a);
    if(!L.length)
      return '<div class="ahint" style="padding:8px 0 0">لا حركات مسجّلة على هذا الحساب بعد.</div>';
    L.sort(function(x, y){ return String(y.d || "").localeCompare(String(x.d || "")); });
    var open = !!ui.openLog[a.id], show = open ? L : L.slice(0, 5);
    return '<div class="lgw"><div class="lab">الحركة</div>'
      + show.map(function(x){
          var K = lkind(x.kind);
          return '<div class="lg"><span class="lk ' + K.c + '">' + K.n + '</span>'
            + '<span class="lt">' + esc(x.t || K.d) + '</span>'
            + '<span class="ld">' + esc(String(x.d || "").slice(0, 10)) + '</span>'
            + '<span class="la ' + K.c + '">' + K.s + fmt(num(x.a)) + '</span></div>';
        }).join("")
      + (L.length > 5
          ? '<button class="mini" data-openlog="' + a.id + '" style="margin-top:8px">'
            + (open ? "اعرض الأحدث فقط" : "كل الحركات (" + L.length + ")") + '</button>'
          : "")
      + '</div>';
  }

  /* شروط الالتزام + تقدّمه */
  function debtContract(a){
    var left = debtLeft(a), princ = debtPrinc(a), paid = debtPaid(a);
    var n = debtMonthsLeft(a), end = debtEnd(a);
    return '<div class="arow"><span class="al">الدائن</span>'
