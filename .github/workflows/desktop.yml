# يبني تطبيق سطح المكتب لويندوز وماك عند كل وسم، ثم يرفعهما معاً.
#
# ولماذا هنا لا على جهاز التطوير: نسخة الماك تحتاج macOS لبنائها
# (hdiutil وcodesign)، ولا ماك عندنا. وGitHub يوفّر أجهزة macOS
# مجّاناً للمستودعات العامّة — فيصير بناء الماك حقيقياً لا تخميناً.
#
# ولماذا البناءُ منفصلٌ عن الرفع: جُرِّب أن تنشر الوظيفتان في الإصدار
# نفسه معاً، فمسحت آخِرتُهما مرفقات الأولى — اختفت ملفّات الماك
# وlatest-mac.yml وبقي سجلّها يقول «رُفعت». فصار البناء يُخرج أثراً،
# ووظيفةٌ واحدة في النهاية هي التي تلمس الإصدار.

name: تطبيق سطح المكتب

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: ويندوز
          - os: macos-latest
            name: ماك
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # النسخة المضمَّنة تُنسخ من التطبيق المبنيّ لا تُحفظ مكرّرة في
      # المستودع — فلا تتخلّف عنه إن نُسي تحديثها.
      # وسمٌ ينتهي بـ-beta يبني تطبيق التجارب وحده، وما سواه يبني
      # الأصل وحده. فلا يصل الأصلَ بناءٌ لم يُطلب.
      - name: تحديد القناة
        id: ch
        shell: bash
        run: |
          # التجارب لها ملفُّ إعدادٍ خالص، والأصلُ إعدادُه داخلَ package.json
          # تحت مفتاح build — فيُترك بلا --config ليقرأه البنّاءُ بنفسه.
          # ولو مُرِّر package.json إعداداً لرُفض: فيه scripts وdependencies
          # وليست من إعداد البنّاء.
          if [[ "${GITHUB_REF}" == *-beta ]]; then
            echo "conf=--config package.beta.json" >> "$GITHUB_OUTPUT"
            echo "src=beta/index.html"             >> "$GITHUB_OUTPUT"
            echo "name=التجارب"                    >> "$GITHUB_OUTPUT"
          else
            echo "conf="            >> "$GITHUB_OUTPUT"
            echo "src=index.html"   >> "$GITHUB_OUTPUT"
            echo "name=الأصل"        >> "$GITHUB_OUTPUT"
          fi
          echo "القناة: $(cat "$GITHUB_OUTPUT")"

      # النسخة المضمَّنة تُنسخ من التطبيق المبنيّ لا تُحفظ مكرّرة في
      # المستودع — فلا تتخلّف عنه إن نُسي تحديثها. ومن قناتها هي.
      - name: تجهيز النسخة الاحتياطية للعمل بلا إنترنت
        shell: bash
        run: |
          mkdir -p desktop/offline
          cp "${{ steps.ch.outputs.src }}" desktop/offline/index.html
          cp icon-192.png icon-512.png manifest.webmanifest desktop/offline/ || true
          ls -l desktop/offline

      - name: تثبيت الحزم
        working-directory: desktop
        run: npm ci

      - name: البناء — بلا نشر
        working-directory: desktop
        env:
          # بلا شهادة توقيع — وإلا فشل البناء بحثاً عن هويّة غير موجودة
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ steps.ch.outputs.conf }} --publish never

      - name: رفع الأثر
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            desktop/out/*.exe
            desktop/out/*.dmg
            desktop/out/*.zip
            desktop/out/latest*.yml
            desktop/out/*.blockmap
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    name: الإصدار
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: ما جُمع
        run: ls -lh dist

      # مسودّة: تُراجَع ملاحظاتها ثم تُنشر بيد صاحبها
      - name: إرفاقها بالإصدار
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --draft --title "$TAG" --notes "تُكتب الملاحظات قبل النشر."
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/*
